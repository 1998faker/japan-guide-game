<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本旅行日语闯关</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#16213a;--sub:#5b667d;--line:#d5dbe4;--ok:#0d7a57;--okbg:#dff3ea;--ng:#c0392b;--ngbg:#fbe4e0;--ac:#16213a;--acink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#18203a;--ink:#e8ecf5;--sub:#9aa5bf;--line:#2c3656;--ok:#4fd1a1;--okbg:#12392e;--ng:#ff8a7a;--ngbg:#4a2420;--ac:#e8ecf5;--acink:#0f1524}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#18203a;--ink:#e8ecf5;--sub:#9aa5bf;--line:#2c3656;--ok:#4fd1a1;--okbg:#12392e;--ng:#ff8a7a;--ngbg:#4a2420;--ac:#e8ecf5;--acink:#0f1524}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Kaku Gothic New","Hiragino Sans","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;font-weight:900;margin:8px 0 4px;letter-spacing:.02em}
.lead{color:var(--sub);margin:0 0 20px}
.grid{display:grid;gap:10px}
.scene{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer}
.scene:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.badge{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:23px;border:4px solid var(--c)}
.scene b{display:block;font-size:17px}.scene small{color:var(--sub)}
.all{background:var(--ac);color:var(--acink);border-color:var(--ac);justify-content:center;font-weight:700;font-size:17px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:14px;margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;border:2px solid var(--c);margin-bottom:10px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.q p{margin:0 0 8px}
.jp{font-size:22px;font-weight:700;line-height:1.5;border-left:5px solid var(--c);padding:6px 0 6px 12px;margin:10px 0 4px}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin-bottom:14px;background:var(--card);border:1px solid var(--line)}
.fb b{display:block;margin-bottom:2px}.fb.ok b{color:var(--ok)}.fb.ng b{color:var(--ng)}
.btn{background:var(--ac);color:var(--acink);border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:700;width:100%;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);margin-top:10px}
.score{font-size:56px;font-weight:900;margin:10px 0 0}
.wrong li{margin:6px 0}
.wrong .j{font-weight:700}
.spkbtn{background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font:inherit;font-size:14px;cursor:pointer;margin-top:8px}
.spk{background:none;border:0;padding:0;font:inherit;color:var(--ok);cursor:pointer;text-decoration:underline dotted}

/* 场景对话体验：独立于原题库 */
.demo-entry{background:#dcebe2;color:#173f35;border:1px solid #bdcfc2;border-radius:20px;padding:24px;margin:22px 0 24px}.demo-entry h2{font-size:28px;line-height:1.3;margin:10px 0}.demo-entry p{font-size:15px;line-height:1.8;margin:8px 0 12px}.demo-entry .btn{background:#173f35;color:white}.demo-entry small{display:block;text-align:center;margin-top:12px;color:#395e50}.demo-eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em}.demo-types{font-size:13px;margin:18px 0}.demo-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:18px;gap:12px}.demo-top .spkbtn{margin:0}.demo-kind{font-size:13px;font-weight:700;color:var(--ok);letter-spacing:.06em;margin:20px 0 10px}.demo-title{font-size:26px;margin-bottom:18px}.demo-context{white-space:normal;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;font-size:18px;line-height:1.9;margin-bottom:16px}.demo-audio,.demo-speak{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}.demo-audio p{color:var(--sub);font-size:14px}.demo-audio small{display:block;color:var(--sub);font-size:12px;margin-top:16px}.demo-audio details p{font-size:19px;color:var(--ink)}summary{cursor:pointer;padding:8px 0;font-size:14px}.demo-note{font-size:14px;color:var(--sub);line-height:1.9;background:var(--bg);padding:14px;border-radius:12px;margin:18px 0}.demo-emoji{font-size:36px;padding:8px}.demo-scene{padding:18px 14px;border-radius:16px}.demo-answer{background:var(--card);padding:20px;border:1px solid var(--line);border-radius:16px;margin-bottom:18px}.demo-jp{font-size:24px;font-weight:700;line-height:1.7;margin:12px 0}.demo-speak{text-align:center}.demo-voice{font-size:64px;line-height:1.1;color:var(--ok)}.demo-speak p{color:var(--sub)}.demo-self-label{margin:20px 0 10px}.demo-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.demo-metrics div{padding:22px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center}.demo-metrics strong{display:block;font-size:28px;color:var(--ok)}.demo-metrics span{font-size:13px;color:var(--sub)}.demo-review{margin-bottom:20px}.demo-review>div{padding:18px 0;border-bottom:1px solid var(--line)}.demo-review p{font-size:18px;font-weight:700;margin:6px 0}.demo-review small{display:block;color:var(--sub)}.demo-review-kind{font-size:12px;color:var(--ok)}.demo-summary-title{font-size:18px;margin-top:24px}button:disabled{opacity:.85}button,summary{-webkit-tap-highlight-color:transparent}button:focus-visible,summary:focus-visible{outline:3px solid var(--ok);outline-offset:3px}#demo-feedback{scroll-margin-top:16px}

.quiz-home{margin:0 0 14px}.quiz-nav{display:flex;gap:8px;flex-wrap:wrap}

.full-explanation{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 18px 18px;margin:14px 0;overflow-wrap:anywhere}
.explain-example{padding:14px;background:var(--bg);border-radius:12px}.explain-example p{margin:0 0 6px;font-size:19px;line-height:1.7;font-weight:700}.explain-example .explain-zh{font-size:14px;font-weight:400;color:var(--sub)}.explain-source{font-size:12px;margin-top:14px}.explain-source a{color:var(--ok)}.full-explanation .spkbtn{font-size:13px}

.full-explanation{padding:20px 18px}.explain-story p{font-size:16px;line-height:1.95;margin:0;color:var(--ink)}.explain-phrases{display:grid;gap:12px;margin-top:18px}.explain-example{padding:14px 16px;border-left:3px solid var(--line);border-radius:4px 12px 12px 4px}.example-situation{font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--sub);margin-bottom:8px}.explain-example p[lang]{font-size:18px;font-weight:650;line-height:1.75}.explain-example .spkbtn{border:0;padding:3px 0;margin-top:5px;color:var(--ok);font-size:12px;background:transparent}.explain-example .explain-zh{line-height:1.75}.explain-source{margin-top:18px}

.learn-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 22px}.learn-nav button,.learn-tabs button{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 4px;border-radius:10px;font:inherit;font-size:13px;cursor:pointer}.learn-nav small{font-size:11px;color:var(--sub)}.learn-warning{padding:12px;background:var(--ngbg);color:var(--ink);border-radius:10px;font-size:13px}.learn-warning[hidden]{display:none}.learn-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:20px 0}.learn-panel h2{font-size:18px;margin:0 0 12px}.learn-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}.learn-heading h2{margin:0}.learn-heading .spkbtn{margin-top:0}.learn-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.learn-metrics>div{padding:16px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}.learn-metrics strong{display:block;font-size:27px;color:var(--ok)}.learn-metrics strong small{font-size:13px;color:var(--sub);font-weight:400}.learn-metrics span{font-size:12px;color:var(--sub)}.learn-small{font-size:12px;color:var(--sub);line-height:1.8}.learn-question-tools{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0}.learn-question-tools span{font-size:12px;color:var(--sub)}.learn-question-tools .spkbtn{margin-top:0}.learn-favorite.is-saved{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.learn-record-note{font-size:13px;color:var(--ok);margin:12px 0}.learn-list-card{padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow-wrap:anywhere}.learn-list-card h2{font-size:20px;line-height:1.7;margin:10px 0}.learn-list-card>p{font-size:14px;margin:6px 0}.learn-list-actions{display:flex;gap:8px;flex-wrap:wrap}.learn-list-card .full-explanation{padding:16px 0;border:0;margin:0}.learn-pagination{display:flex;align-items:center;justify-content:center;gap:16px;font-size:13px}.learn-tabs{display:flex;gap:8px;margin:16px 0}.learn-tabs button{flex:1}.learn-tabs button[aria-pressed="true"]{background:var(--ac);color:var(--acink);border-color:var(--ac)}.learn-empty{padding:32px 18px;text-align:center;color:var(--sub);border:1px dashed var(--line);border-radius:14px;margin:18px 0}.learn-scene-progress{padding:16px 0;border-bottom:1px solid var(--line)}.learn-scene-progress:last-child{border-bottom:0}.learn-scene-progress small{color:var(--sub)}.learn-scene-progress .bar{margin:6px 0 8px}.learn-scene-progress .learn-heading{font-size:14px;margin-bottom:6px}
.ramen-reading{font-size:13px!important;font-weight:400!important;color:var(--sub)!important;line-height:1.85!important;margin:8px 0!important}.opt ruby{ruby-position:over}.opt rt{font-size:10px;line-height:1}.opt:has(ruby){line-height:2.2}
</style>
</head>
<body>
<main id="app"></main>
<script>
var S=[
{id:"food",n:"饮食词库",e:"🍣",c:"#e0a100",d:"寿司、烤肉、面饭、小吃、甜点、调味(222题,随机出)"},
{id:"ramenv",n:"拉面专题",e:"🍥",c:"#a8541f",d:"汤底、配料、点单要求、券売機(82题,随机出)"},
{id:"washoku",n:"日料专题",e:"🍱",c:"#3d6b5e",d:"怀石流程、烹饪方式、清酒与器皿(60题,随机出)"},
{id:"izakaya",n:"居酒屋",e:"🍶",c:"#d9822b",d:"点酒、烤串、下酒菜、结账、常用对话(132题)"},
{id:"ramen",n:"拉面店・餐厅",e:"🍜",c:"#c0392b",d:"买餐券、加面、点餐要求"},
{id:"conv",n:"便利店・超市",e:"🏪",c:"#0d9c6b",d:"加热、袋子、打折"},
{id:"train",n:"电车・车站",e:"🚃",c:"#2b6fd9",d:"快速、换乘、延误广播"},
{id:"drug",n:"药妆店・免税",e:"💊",c:"#8e44ad",d:"免税手续、药品用法"},
{id:"hotel",n:"酒店",e:"🏨",c:"#1b8fa6",d:"入住、寄存行李、早餐"},
{id:"shop",n:"逛街购物",e:"🛍️",c:"#d6457c",d:"试穿、库存、含税价"},
{id:"help",n:"问路・应急",e:"🆘",c:"#6b7a1f",d:"厕所、丢东西、封路"}
];
/* t:r=看懂日语选中文  t:s=会说,选正确的日语 */
var Q=[
{s:"izakaya",t:"r",q:"菜单上这道是什么?",j:"〆のお茶漬け",o:["最后收尾吃的茶泡饭","今日推荐的生鱼片","招牌甜点","配啤酒的炸物"],a:0,e:"〆(しめ)是“收尾”的意思,居酒屋喝完酒最后来一碗茶泡饭(お茶漬け)是经典吃法。"},
{s:"izakaya",t:"r",q:"我们没点菜,店员却端来一小碟菜,小票上写着这个。这是什么?",j:"お通し 450円(税別)",o:["店员送的免费小菜","入座后提供、通常收费的小菜，即使没单点也可能上桌","必须加点的套餐","儿童餐"],a:1,e:"お通し是居酒屋的入座小菜,基本等于座位费,几乎所有居酒屋都有,不是被坑。有些店可以事先问“お通しはありますか”。"},
{s:"izakaya",t:"s",q:"我想再来一杯生啤,怎么跟店员说?",o:["すみません、生ビールをもう一杯ください。","すみません、生ビールをもう一回食べたいです。","生ビールはどこにありますか。","生ビールを返してください。"],a:0,e:"もう一杯(再来一杯)+ください是最自然的点单说法。"},
{s:"izakaya",t:"r",q:"这个畅饮套餐是怎么算的?",j:"飲み放題 90分(L.O. 60分)",o:["能喝90分钟,最后点单在60分钟时","要喝满90分钟才能走","只能喝60分钟","90分钟后自动续杯"],a:0,e:"飲み放題=畅饮;L.O.(ラストオーダー)=最后点单时间。到点后不能再点,但可以喝到90分钟结束。"},

{s:"ramen",t:"r",q:"店门口有台机器,旁边贴着这句话,什么意思?",j:"先に券売機で食券をお買い求めください。",o:["请先坐下再点餐","请先在售票机上买餐券","请先付现金给店员","请先排队领号码牌"],a:1,e:"券売機(けんばいき)是餐券机,买好把食券交给店员即可。很多拉面店只收现金,要备好零钱。"},
{s:"ramen",t:"r",q:"店员问我这句话,他想问什么?",j:"麺の硬さはどうされますか?(かため/ふつう/やわらかめ)",o:["要不要加面","面要多硬:偏硬、普通还是偏软","要不要加辣","要大碗还是小碗"],a:1,e:"かため=偏硬,ふつう=普通,やわらかめ=偏软。同类的还有“味の濃さ(咸淡)”“脂の量(油量)”。"},
{s:"ramen",t:"s",q:"我对葱过敏,想让厨房不要放葱,怎么说比较好?",o:["ねぎ抜きでお願いできますか。","ねぎを全部食べたいです。","ねぎはいくらですか。","ねぎをもっと入れてください。"],a:0,e:"〜抜き=去掉某样东西。严重过敏时可以补一句“アレルギーがあります”。"},
{s:"ramen",t:"r",q:"菜单上这个是什么?",j:"替え玉 150円",o:["多一份叉烧","加一份面(汤喝剩了续面)","换一个碗","外带汤底"],a:1,e:"替え玉(かえだま)是九州豚骨拉面常见的续面,面吃完汤还有就加。"},

{s:"conv",t:"r",q:"收银员问我这句话,要回答什么?",j:"温めますか?",o:["要打包吗","要加热吗(微波炉)","要加筷子吗","要会员卡吗"],a:1,e:"便当、饭团、炸鸡都会问。要说“お願いします”,不要说“大丈夫です”(会被理解成不用)。"},
{s:"conv",t:"r",q:"收银员说这句话,什么意思?",j:"袋はご利用ですか?",o:["要不要袋子(需另收费)","请出示购物袋","要不要收据","要不要免税"],a:0,e:"日本购物袋要收费(约3~5日元)。不要的话说“袋は大丈夫です”。"},
{s:"conv",t:"r",q:"晚上超市熟食上贴了这个,是什么意思?",j:"20%引きシール",o:["20%的折扣贴纸","新品标识","限量款","即将过期不能吃"],a:0,e:"值引き/割引き都是打折。傍晚(约19点后)超市会给便当、熟食贴折扣贴纸。"},
{s:"conv",t:"s",q:"我已经自带了购物袋,想告诉收银员不需要袋子,怎么说?",o:["袋は大丈夫です。","袋をください、全部。","袋はどこですか。","袋を捨ててもいいですか。"],a:0,e:"大丈夫です在这里是“不用了,没问题”的意思,是店里最常用的拒绝方式。"},

{s:"train",t:"r",q:"站台电子屏上写着这两个词,有什么区别?",j:"快速 / 各駅停車",o:["快速跳过部分站,各驿停车每站都停","快速是新干线,各驿是地铁","快速要另外买票","没有区别"],a:0,e:"如果目的地是小站,要坐“各駅停車”,或者在大站换乘。快速不需要额外车票(特急才要)。"},
{s:"train",t:"r",q:"站内广播说了这句话,发生了什么?",j:"人身事故の影響で、運転を見合わせております。",o:["因为有人身事故,电车暂停运行","因为大雪,电车减速","因为检修,电车改道","电车正点出发"],a:0,e:"人身事故指有人员伤亡的事故(多为跳轨),会长时间停运。运転見合わせ=暂停运行,可考虑改乘其他线路。"},
{s:"train",t:"s",q:"我不确定这趟车是不是去新宿,怎么问车站工作人员?",o:["この電車は新宿に行きますか。","この電車を新宿にしてください。","新宿は何時に食べますか。","電車を新宿から買いたいです。"],a:0,e:"〜に行きますか是最基础的问法;也可以问“新宿に止まりますか”(会停新宿吗)。"},
{s:"train",t:"r",q:"检票口旁边的人让我看这个牌子,什么意思?",j:"乗り換えはこちら",o:["出口在这边","换乘请走这边","寄存柜在这边","厕所在这边"],a:1,e:"乗り換え=换乘,出口是“出口”,改札=检票口。"},

{s:"drug",t:"r",q:"免税柜台的店员这样说,我要做什么?",j:"パスポートをご提示ください。",o:["请出示护照","请出示信用卡","请填写住址","请把商品放回去"],a:0,e:"免税必须出示护照原件。一般要求同一天同一家店购买满5,000日元以上(税前)。"},
{s:"drug",t:"r",q:"价格牌上有这个标记,说明了什么?",j:"税込 1,100円",o:["含税价1,100日元","未含税价1,100日元","会员价1,100日元","每个1,100日元"],a:0,e:"税込(ぜいこみ)=含税;税別/税抜(ぜいぬき)=未含税,还要再加10%。"},

var seen=new Set();
function begin(l){st={list:l,i:0,score:0,wrong:[],ans:false};show()}
function full(id){return id==="all"?Q.concat(GF,GR,GW,GI,GH):id==="food"?GF:id==="ramenv"?GR:id==="washoku"?GW:id==="izakaya"?Q.filter(function(q){return q.s===id}).concat(GI,GH):Q.filter(function(q){return q.s===id})}
function pickNew(id,n){
  var un=full(id).filter(function(q){return !seen.has(q)});
  if(id==="all"){
    var a=shuf(un.filter(function(q){return q.d})),b=shuf(un.filter(function(q){return !q.d}));
    var l=a.slice(0,4).concat(b.slice(0,n-Math.min(4,a.length)));
    if(l.length<n)l=l.concat(a.slice(4)).slice(0,n);
    return shuf(l);
  }
  return shuf(un).slice(0,n);
}
function start(id){
  var l=pickNew(id,10);
  if(l.length<10){var rest=shuf(full(id).filter(function(q){return seen.has(q)}));l=l.concat(rest.slice(0,10-l.length))}
  begin(shuf(l));
}

function pick(k){
  if(st.ans)return;st.ans=true;
  var q=st.list[st.i],good=k===q.a;seen.add(q);
  if(good)st.score++;else st.wrong.push(q);
  app.querySelectorAll(".opt").forEach(function(b){
    b.disabled=true;var v=+b.dataset.k;
    if(v===q.a)b.classList.add("ok");else if(v===k)b.classList.add("ng");
  });
  var last=st.i===st.list.length-1;
  var h='<div class="fb '+(good?"ok":"ng")+'"><b>'+(good?"答对了":"答错了")+'</b><p>'+esc(q.t==='r'?q.j:q.o[q.a])+'</p><button class="spkbtn" data-a="1">🔊 听读音</button></div>'+extra(q)+'<button class="btn" id="nx">'+(last?"查看结果":"下一题")+'</button>';

function say(t){

  var i=t.lastIndexOf('(');
  if(i>0&&t.slice(-1)===')'){var r=t.slice(i+1,-1),ok=r.length>0;for(var c=0;c<r.length;c++){var n=r.charCodeAt(c);if(n<0x3040||n>0x30FF)ok=false}if(ok)t=r}
  t=t.split('〜').join('').split('〇〇').join('なになに');

}

var WORD_EXPLANATIONS={"鮪": {"what": "金枪鱼，寿司菜单里常再区分瘦肉、中腹和大腹。", "why": "寿司店按部位提供不同口感的金枪鱼；只看「鮪」还不能判断是不是肥腹肉。", "examples": [["まぐろの赤身をお願いします。", "请来一份金枪鱼赤身。", "想吃瘦肉"], ["まぐろを二貫お願いします。", "请来两贯金枪鱼寿司。", "点寿司"], ["赤身と中トロは、どう違いますか？", "赤身和中腹有什么区别？", "比较部位"]]}, "大トロ": {"what": "金枪鱼腹部脂肪较丰富的部位，中文常叫大腹。", "why": "店里会把它与赤身、中トロ分开标价，让客人选择不同肥瘦程度。", "examples": [["大トロをお願いします。", "请来一份金枪鱼大腹。"]]}, "中トロ": {"what": "金枪鱼脂肪含量介于赤身和大腹之间的部位。", "why": "它既有瘦肉也有油脂，是寿司菜单用来区分部位的名称。", "examples": [["中トロをお願いします。", "请来一份金枪鱼中腹。"]]}, "鮭": {"what": "鲑鱼，中文菜单常称三文鱼；这个字读「さけ」。", "why": "饭团、烤鱼和套餐都可能出现「鮭」；寿司菜单也常写「サーモン」，具体做法看菜名。", "examples": [["鮭をお願いします。", "请来一份三文鱼。"]]}, "鯛": {"what": "鲷鱼，日料菜单常见的白身鱼。", "why": "它可以做寿司、刺身或烤鱼；这个词说的是鱼种，不是固定烹饪方法。", "examples": [["鯛をお願いします。", "请来一份鲷鱼。"]]}, "鰤": {"what": "鰤鱼，肉质带油脂的鱼类。", "why": "会出现在刺身、寿司和照烧鱼菜单；看「刺身」「照り焼き」可判断做法。", "examples": [["鰤をお願いします。", "请来一份鰤鱼。"]]}, "鯵": {"what": "竹荚鱼，是一种食用鱼。", "why": "既能做刺身和寿司，也会做炸鱼；菜单上的「アジフライ」就是炸竹荚鱼。", "examples": [["鯵をお願いします。", "请来一份竹荚鱼。"]]}, "鯖": {"what": "青花鱼，也叫鲭鱼。", "why": "菜单可能写盐烤或醋渍；「しめ鯖」是醋渍青花鱼，不是笼统的生鱼片。", "examples": [["鯖をお願いします。", "请来一份青花鱼。"]]}, "鰹": {"what": "鲣鱼，是一种食用鱼，也用来制作鲣鱼干。", "why": "在菜品栏常见「かつおのたたき」，鱼表面炙烤后切片；与调味用的鲣鱼片不同。", "examples": [["鰹をお願いします。", "请来一份鲣鱼。"]]}, "鰻": {"what": "鳗鱼，菜单中常以烤制后淋酱的形式出现。", "why": "饭店会把烤鳗鱼搭配米饭，做成うな丼或うな重。", "examples": [["鰻をお願いします。", "请来一份鳗鱼。"]]}, "穴子": {"what": "日料里的星鳗一类食用海鱼，中文菜单常写海鳗。", "why": "寿司店常提供煮穴子，也可能做天妇罗；它与「うなぎ」是不同食材。", "examples": [["穴子をお願いします。", "请来一份海鳗。"]]}, "海老": {"what": "虾的统称，没有单凭这个词指定品种。", "why": "寿司、天妇罗和炸虾都用得到，具体是否生食要看完整菜名。", "examples": [["海老をお願いします。", "请来一份虾。"]]}, "甘海老": {"what": "甜虾，是寿司和刺身中常见的虾类食材。", "why": "菜单会把它与普通「海老」分别列出，方便客人辨认食材。", "examples": [["甘海老をお願いします。", "请来一份甜虾。"]]}, "帆立": {"what": "扇贝，菜单可能使用贝柱或整只扇贝。", "why": "寿司、刺身、黄油烤贝都可能用到它，点单时可确认做法。", "examples": [["この帆立は、焼いたものですか？", "这个扇贝是烤的吗？", "问做法"], ["帆立のバター焼きをお願いします。", "请来一份黄油烤扇贝。", "点一道菜"], ["帆立の刺身はありますか？", "有扇贝刺身吗？", "想吃刺身"]], "text": "帆立（ほたて）就是扇贝。寿司上常见的是贝柱，也有带壳烤的做法。在居酒屋看到它，可以看看菜单写的是刺身还是黄油烤；不确定就直接问店员。"}, "雲丹": {"what": "海胆；食用的是壳内可食用的部分，菜单也常写「うに」。", "why": "寿司店会把它放在军舰卷上，也可作为海鲜盖饭的配料。", "examples": [["雲丹をお願いします。", "请来一份海胆。"]]}, "いくら": {"what": "经过处理或调味的鲑鱼卵，外观是橙红色小颗粒。", "why": "颗粒状食材便于放在军舰寿司或盖饭上，是海鲜菜单中的常见配料。", "examples": [["いくらをお願いします。", "请来一份鲑鱼子。"]]}, "蛸": {"what": "章鱼；这个词本身不表示生的或熟的。", "why": "寿司、刺身、拌菜都可能用章鱼，不能只凭「蛸」判断做法。", "examples": [["蛸をお願いします。", "请来一份章鱼。"]]}, "烏賊": {"what": "鱿鱼、乌贼一类食材的日语统称「いか」。", "why": "可做寿司、刺身、烤物或炸物，因此不同菜单栏都可能出现。", "examples": [["烏賊をお願いします。", "请来一份乌贼。"]]}, "蟹": {"what": "螃蟹的统称，菜单还可能进一步写品种。", "why": "海鲜店会用蟹肉做寿司，也可能整只蒸煮；点单应看份量和做法。", "examples": [["蟹をお願いします。", "请来一份螃蟹。"]]}, "納豆巻き": {"what": "用海苔和寿司饭卷起纳豆的细卷。", "why": "寿司不全是海鲜；这是一种以发酵大豆为馅的卷寿司。", "examples": [["納豆巻きをお願いします。", "请来一份纳豆卷。"]]}, "牛タン": {"what": "牛的舌头，烤肉菜单中按部位列出的食材。", "why": "切片后适合烤制，店里常与其他牛肉部位分开点单。", "examples": [["牛タンを一人前お願いします。", "请来一人份牛舌。", "点一人份"], ["塩でお願いします。", "麻烦做成盐味。", "选盐味"]]}, "カルビ": {"what": "烤肉菜单里常指牛肋腹附近、油脂较多的肉，具体部位依店家而异。", "why": "菜单用它与ロース、ハラミ等区分，帮助客人选择口感。", "examples": [["カルビをお願いします。", "请来一份牛五花。"]]}, "ロース": {"what": "靠近背部的肉类部位名称；牛、猪都可能使用这个词。", "why": "烤肉店用它区分部位，若菜单未写动物种类，可以再问。", "examples": [["このロースは牛肉ですか？", "这个里脊是牛肉吗？"]]}, "ハラミ": {"what": "横膈膜肉，烤肉菜单上常指牛横膈膜。", "why": "虽然看起来像普通瘦肉，店里仍会按独立部位出售。", "examples": [["ハラミをお願いします。", "请来一份横膈膜肉。"]]}, "ホルモン": {"what": "烤肉或炖菜里的内脏类食材统称，不是某一个固定部位。", "why": "店里可能混合或分开供应不同内脏，不熟悉时适合先问是什么部位。", "examples": [["このホルモンは何の部位ですか？", "这份内脏是什么部位？", "不熟悉部位"], ["牛ですか、豚ですか？", "是牛的还是猪的？", "确认是哪种肉"]]}, "豚バラ": {"what": "猪腹部的五花肉，肥瘦层次相间。", "why": "既适合烤串，也可用于炒菜和炖菜；烤串栏看到它就是猪肉类选择。", "examples": [["豚バラをお願いします。", "请来一份猪五花。"]]}, "鶏もも": {"what": "鸡腿肉，不是只指带骨的整只鸡腿。", "why": "烤鸡串和炸鸡常使用切块的鸡腿肉，所以菜单会标出这一部位。", "examples": [["鶏ももをお願いします。", "请来一份鸡腿肉。"]]}, "鶏むね": {"what": "鸡胸肉，位于鸡的胸部。", "why": "店里用它区分鸡腿等部位，方便客人按肉质偏好点单。", "examples": [["鶏むねをお願いします。", "请来一份鸡胸肉。"]]}, "手羽先": {"what": "鸡翅尖一侧的部位，菜单上常以带骨鸡翅菜肴出现。", "why": "烤物和炸物栏都可能有它，不一定是串起来的鸡肉。", "examples": [["手羽先をお願いします。", "请来一份鸡翅。"]]}, "つくね": {"what": "把肉剁碎、调味后成形的肉丸；烤鸡店里通常是鸡肉丸。", "why": "它常被串起来烤，与整块鸡肉串形成不同口感。", "examples": [["つくねをお願いします。", "请来一份鸡肉丸串。"]]}, "ねぎま": {"what": "在烤鸡串语境中，通常是鸡肉与葱段交替穿成的串。", "why": "这是按食材组合命名的烤串，点单后店员还可能问盐味或酱味。", "examples": [["ねぎまをお願いします。", "请来一份葱段鸡肉串。"]]}, "砂肝": {"what": "鸡的肌胃，也就是鸡胗。", "why": "它是烤鸡店按部位出售的食材，特点是较有嚼劲。", "examples": [["砂肝をお願いします。", "请来一份鸡胗。"]]}, "霜降り": {"what": "肉中分布着细密脂肪纹路的状态，中文常叫雪花肉。", "why": "这个词用于描述肉质，不是一个单独部位；菜单还会配上具体肉名。", "examples": [["霜降りのお肉はありますか？", "有雪花肉吗？"]]}, "和牛": {"what": "日本特定牛品种及相应杂交范围的牛肉名称，不等于所有日本产牛肉。", "why": "烤肉店用它说明牛肉类别，具体部位和等级通常另行标注。", "examples": [["和牛はどの部位がありますか？", "和牛有哪些部位可以选？"]]}, "醤油": {"what": "酱油；在拉面口味栏中指以酱油调味的口味。", "why": "它标示调味方向，不代表所有酱油拉面的汤底都一样。", "examples": [["醤油ラーメンをお願いします。", "请来一份酱油拉面。"]]}, "味噌": {"what": "由发酵原料制成的味噌；在拉面栏中表示味噌调味。", "why": "拉面店用它区别酱油、盐味等口味，味噌也可用于汤和其他菜。", "examples": [["味噌ラーメンをお願いします。", "请来一份味噌拉面。"]]}, "塩": {"what": "盐；菜单上常表示以盐调味的口味。", "why": "烤串会与「タレ」酱味对照，拉面也会用「塩」标示口味。", "examples": [["塩でお願いします。", "麻烦做成盐味。", "烤串选口味"], ["塩は少なめにできますか？", "可以少放点盐吗？", "想少放盐"], ["塩ラーメンをお願いします。", "请来一份盐味拉面。", "在拉面店点餐"]], "text": "「塩（しお）」是盐。烤串店问「塩とタレ、どちらにしますか？」时，是让你选盐味还是酱汁味；回答「塩でお願いします」就行。在拉面店看到「塩ラーメン」，则是在说盐味拉面。"}, "豚骨": {"what": "猪骨；「豚骨ラーメン」指使用猪骨熬汤的拉面。", "why": "这是汤底原料的说明，可以再与酱油等调味结合。", "examples": [["豚骨ラーメンをお願いします。", "请来一份猪骨拉面。"]]}, "つけ麺": {"what": "面和蘸汁分开盛放，夹起面蘸汁吃的面食。", "why": "它和直接泡在汤里的拉面吃法不同；用餐后有的店提供稀释蘸汁的汤。", "examples": [["つけ麺をお願いします。", "请来一份蘸面。", "点一份"], ["スープ割りをお願いします。", "麻烦加汤稀释蘸汁。", "吃完想喝汤"]]}, "担々麺": {"what": "带芝麻、辣味等调味的担担面，配料和辣度因店而异。", "why": "拉面店把它作为一种口味列出，不能只看名字推定辣度。", "examples": [["担々麺をお願いします。", "请来一份担担面。"]]}, "うどん": {"what": "乌冬面，通常是较粗的日本小麦面条。", "why": "菜单会再写热汤、冷面或配料，单说乌冬没有指定吃法。", "examples": [["うどんをお願いします。", "请来一份乌冬面。"]]}, "そば": {"what": "荞麦面，配方中也可能含小麦粉。", "why": "荞麦面店常分冷吃和热吃；「ざるそば」和「かけそば」是不同菜单项。", "examples": [["そばをお願いします。", "请来一份荞麦面。"]]}, "焼きそば": {"what": "日式炒面，名字虽带「そば」，通常不是荞麦面。", "why": "铁板店和小吃摊把它作为炒制的主食出售。", "examples": [["焼きそばをお願いします。", "请来一份炒面。"]]}, "チャーシュー": {"what": "日式叉烧，拉面里常见的调味猪肉。", "why": "可作为默认配料，也可能在加料栏单独收费。", "examples": [["チャーシューを追加できますか？", "能加一份叉烧吗？"]]}, "味玉": {"what": "经过调味入味的鸡蛋，常见于拉面中；熟度依店家而异。", "why": "菜单用它说明蛋类配料，喜欢的话可询问能否加一颗。", "examples": [["味玉を一つ追加してください。", "请加一颗味玉。"]]}, "メンマ": {"what": "经处理和调味的笋类配料。", "why": "它经常放在拉面里，主要用来增加口感，也可能单独作为小菜。", "examples": [["メンマ抜きにできますか？", "能不放笋干吗？"]]}, "大盛り": {"what": "在通常份量上加大的份量。", "why": "面饭店用它区分大小份，是否加价需要看店铺标示。", "examples": [["大盛りでお願いします。", "麻烦来大份。", "要大份"], ["大盛りはいくら追加ですか？", "加大份要多付多少钱？", "先问加价"], ["やっぱり普通でお願いします。", "还是麻烦来普通份吧。", "改回普通份"]], "text": "觉得普通份不够吃，可以选「大盛り（おおもり）」——也就是加大份。这个词说的是份量，不是味道浓一点。是否加价、要加多少，点之前问清楚就好。"}, "牛丼": {"what": "把调味牛肉等配料盖在米饭上的盖饭。", "why": "快餐店把主菜和饭合成一碗，点单时常再选择大小份。", "examples": [["牛丼をお願いします。", "请来一份牛肉盖饭。"]]}, "親子丼": {"what": "通常由鸡肉和鸡蛋一起做成的盖饭。", "why": "「親子」在这里对应鸡和蛋，是菜名，不是亲子套餐。", "examples": [["親子丼をお願いします。", "请来一份鸡肉鸡蛋盖饭。"]]}, "カツ丼": {"what": "通常把炸猪排搭配鸡蛋等放在饭上的盖饭，也有其他做法。", "why": "「カツ」提示炸排类主料，「丼」提示盖饭形式。", "examples": [["カツ丼をお願いします。", "请来一份炸猪排盖饭。"]]}, "天丼": {"what": "把天妇罗放在米饭上、配酱汁的盖饭。", "why": "与单点天妇罗不同，它已经包含米饭，适合当一餐主食。", "examples": [["天丼をお願いします。", "请来一份天妇罗盖饭。"]]}, "海鮮丼": {"what": "用多种海鲜搭配米饭的盖饭。", "why": "店里用它集合当日海鲜，具体配料应看菜单或询问。", "examples": [["海鮮丼をお願いします。", "请来一份海鲜盖饭。"]]}, "うな重": {"what": "用重箱盛装的鳗鱼饭。", "why": "「重」说明盛装形式，和碗装的「うな丼」名称不同。", "examples": [["うな重をお願いします。", "请来一份鳗鱼饭。"]]}, "オムライス": {"what": "用蛋包裹或覆盖炒饭的蛋包饭。", "why": "它属于常见日式洋食，酱汁和蛋的做法各店不同。", "examples": [["オムライスをお願いします。", "请来一份蛋包饭。"]]}, "定食": {"what": "主菜搭配米饭、汤等组成的套餐。", "why": "它与单点主菜不同，点之前可确认包含哪些内容。", "examples": [["この定食には何がつきますか？", "这个套餐附带什么？", "问套餐内容"], ["ご飯、少なめでお願いします。", "麻烦米饭少一点。", "调整米饭"], ["ご飯のおかわりはできますか？", "可以续饭吗？", "想续饭"]], "text": "「定食（ていしょく）」是一套搭配好的饭，通常有主菜、米饭和汤等。比起单点一道菜，它更像完整的一餐。饭量能否调整、能否续饭，各家店不同，可以顺口问一下。"}, "おにぎり": {"what": "把米饭捏成形状的饭团，可能有馅料或海苔。", "why": "便利店和餐厅都把它作为方便食用的主食，菜单通常再写口味。", "examples": [["おにぎりをお願いします。", "请来一份饭团。"]]}, "唐揚げ": {"what": "食材调味、裹粉后炸制的做法；居酒屋单写此词时常指炸鸡。", "why": "适合分着吃，常出现在小菜栏，也能搭配米饭成为定食。", "examples": [["唐揚げを一つお願いします。", "请来一份炸鸡。", "点一份"], ["これ、何個入りですか？", "这一份有几块？", "问份量"], ["すみません、唐揚げ、まだですか？", "不好意思，炸鸡还没好吗？", "等了很久"]], "text": "居酒屋菜单上单写「唐揚げ（からあげ）」时，常指炸鸡块。不过这个词本身是一种炸制做法，也可以用在其他食材上。多人分着吃时，可以先问一份有几块。"}, "天ぷら": {"what": "食材裹薄面糊后炸成的天妇罗。", "why": "虾、鱼和蔬菜都可以做天妇罗，所以还要看具体食材。", "examples": [["天ぷらをお願いします。", "请来一份天妇罗。"]]}, "とんかつ": {"what": "猪肉裹面包糠后炸成的猪排。", "why": "它可以单点，也可以配成定食，和天妇罗的裹衣不同。", "examples": [["とんかつをお願いします。", "请来一份炸猪排。"]]}, "串カツ": {"what": "把食材穿串、裹衣后炸成的炸串。", "why": "与直接烤制的串烧不同，这个名称说明用油炸的做法。", "examples": [["串カツをお願いします。", "请来一份炸串。"]]}, "たこ焼き": {"what": "面糊内放章鱼等配料，烤成球状的章鱼烧。", "why": "小吃店和部分居酒屋会供应，它不是整只烤章鱼。", "examples": [["たこ焼きをお願いします。", "请来一份章鱼烧。"]]}, "お好み焼き": {"what": "以面糊、卷心菜和其他配料在铁板上煎制的料理。", "why": "常用于朋友聚餐和分食，配料及地域做法会有差异。", "examples": [["お好み焼きをお願いします。", "请来一份大阪烧。"]]}, "餃子": {"what": "饺子；日式餐厅中常见的是煎饺。", "why": "拉面店把它作为配菜或套餐搭配，若想要水饺需另看菜单。", "examples": [["餃子をお願いします。", "请来一份煎饺。"]]}, "枝豆": {"what": "未完全成熟时采收的青大豆，常带荚煮熟。", "why": "居酒屋常把它作为容易分享的下酒小菜；吃豆粒，豆荚不食用。", "examples": [["枝豆をお願いします。", "请来一份毛豆。"]]}, "冷奴": {"what": "冷着食用、配葱姜等调味的豆腐料理。", "why": "这是一道凉小菜，适合与烤串、炸物等热菜搭配。", "examples": [["冷奴をお願いします。", "请来一份冷豆腐。"]]}, "焼き鳥": {"what": "日式烤鸡肉串，也常泛指烤鸡店的串烧菜单。", "why": "同一店铺还可能供应内脏或蔬菜串，需要继续看具体品项。", "examples": [["焼き鳥の盛り合わせをお願いします。", "请来一份烤鸡串拼盘。", "想尝几种"], ["塩でお願いします。", "麻烦做成盐味。", "选盐味"], ["一本から注文できますか？", "可以从一串开始点吗？", "确认数量"]], "text": "「焼き鳥（やきとり）」是日式烤鸡串。菜单常按部位分开写：鸡腿、鸡皮、鸡心等都能单独点。店员还可能问要「塩」盐味还是「タレ」酱汁味。不知道怎么选，先点拼盘也可以。"}, "出汁巻き玉子": {"what": "把高汤加入蛋液，再卷成形的蛋卷。", "why": "居酒屋把它作为蛋料理供应，与单纯强调甜味的蛋烧不完全相同。", "examples": [["出汁巻き玉子をお願いします。", "请来一份高汤蛋卷。"]]}, "揚げ出し豆腐": {"what": "豆腐裹薄粉炸制后，搭配汤汁的料理。", "why": "它兼有炸制外层和软豆腐口感，是居酒屋常见的温热小菜。", "examples": [["揚げ出し豆腐をお願いします。", "请来一份炸豆腐。"]]}, "もつ鍋": {"what": "以牛或猪的内脏为主要食材、搭配蔬菜的锅物。", "why": "多人可以一起煮着吃，点单时常按人数份量确认。", "examples": [["もつ鍋をお願いします。", "请来一份内脏锅。"]]}, "しゃぶしゃぶ": {"what": "把薄肉片等在热汤中涮熟，再蘸汁吃的锅物。", "why": "菜单通常提供肉类选择和套餐，是需要自己涮煮的用餐形式。", "examples": [["しゃぶしゃぶをお願いします。", "请来一份涮涮锅。"]]}, "すき焼き": {"what": "用甜咸调味汁烹煮牛肉、蔬菜等的寿喜烧。", "why": "它与涮锅的汤汁和吃法不同，因此会被单独列为锅物种类。", "examples": [["すき焼きをお願いします。", "请来一份寿喜烧。"]]}, "刺身盛り合わせ": {"what": "把几种刺身组合在一起的拼盘。", "why": "适合想尝不同海鲜的人，点单时可问几人份及包含哪些鱼。", "examples": [["刺身盛り合わせをお願いします。", "请来一份刺身拼盘。"]]}, "抹茶": {"what": "研磨成细粉的茶，在饮品或甜点中使用。", "why": "菜单可能是茶本身，也可能是抹茶拿铁、冰淇淋等，要看完整名称。", "examples": [["抹茶をお願いします。", "请来一份抹茶。"]]}, "ほうじ茶": {"what": "经过焙炒、带烘焙香的日本茶。", "why": "它既可作为饮品，也用于甜点风味，与抹茶不是同一种加工方式。", "examples": [["ほうじ茶をお願いします。", "请来一份焙茶。"]]}, "ウーロン茶": {"what": "乌龙茶，餐厅里常见的无酒精饮品。", "why": "不喝酒时可以单点；它与加烧酒的「ウーロンハイ」不同。", "examples": [["ウーロン茶を一つお願いします。", "请来一杯乌龙茶。", "不想喝酒时"], ["氷なしでお願いします。", "麻烦不要加冰。", "不想加冰"], ["温かいウーロン茶はありますか？", "有热乌龙茶吗？", "想喝热的"]]}, "大福": {"what": "以软糯外皮包住馅料的日式点心，常见红豆馅。", "why": "甜品店可能再标草莓等口味，「大福」说的是点心类型。", "examples": [["大福をお願いします。", "请来一份大福。"]]}, "どら焼き": {"what": "用两片类似小松饼的外皮夹馅的铜锣烧。", "why": "通常出现在日式点心店或甜点菜单，常见夹红豆馅。", "examples": [["どら焼きをお願いします。", "请来一份铜锣烧。"]]}, "たい焼き": {"what": "烤成鲷鱼形状、里面有馅的点心。", "why": "名字和外形像鱼，但并不表示含有鲷鱼肉。", "examples": [["たい焼きをお願いします。", "请来一份鲷鱼烧。"]]}, "みたらし団子": {"what": "表面淋甜咸酱汁的串团子。", "why": "团子有多种口味，「みたらし」标示这种酱汁口味。", "examples": [["みたらし団子をお願いします。", "请来一份御手洗团子。"]]}, "かき氷": {"what": "把冰刨碎后加糖浆等配料的刨冰。", "why": "甜品店用不同糖浆和配料区分口味，点单时常需选择。", "examples": [["かき氷をお願いします。", "请来一份刨冰。"]]}, "ソフトクリーム": {"what": "从机器挤出、质地柔软的冰淇淋。", "why": "常装在蛋筒或杯里，菜单可能需要同时选择口味与容器。", "examples": [["ソフトクリームをお願いします。", "请来一份软冰淇淋。"]]}, "プリン": {"what": "日式菜单里常指布丁，常见蛋奶和焦糖风味。", "why": "它属于甜点，不是饮品，餐后可以单点。", "examples": [["プリンをお願いします。", "请来一份布丁。"]]}, "日本酒": {"what": "以米、米曲和水等酿造的清酒。", "why": "居酒屋酒单会按品牌、风格或温度区分，点单时可说明偏好。", "examples": [["おすすめの日本酒はありますか？", "有推荐的日本酒吗？", "请店员推荐"], ["辛口のものがいいです。", "我想要偏干、不甜的。", "说明口味"], ["冷酒を一合お願いします。", "请来一合冰镇日本酒。", "指定温度和数量"]], "source": ["日本酒温度参考：神奈川县酒造组合", "https://www.kanagawa-jizake.or.jp/guide/"], "text": "日本酒是以米、米曲和水等酿造的清酒。酒单上名字很多，不必全看懂，可以先请店员推荐，再说自己想要偏干还是偏甜、热的还是冰的。想喝冰镇的可说「冷酒」；「冷や」在清酒语境通常指常温。"}, "焼酎": {"what": "日本的一类蒸馏酒，可用薯、麦等不同原料制作。", "why": "居酒屋常同时提供加冰、兑水、兑热水等喝法，需要分别选择。", "examples": [["麦焼酎を水割りでお願いします。", "请来一杯兑水的麦烧酒。"]]}, "ハイボール": {"what": "居酒屋里通常指威士忌加苏打水的饮品。", "why": "它属于含酒精饮品，和普通苏打水不是同一项。", "examples": [["ハイボールを一つお願いします。", "请来一杯威士忌苏打。", "点一杯"], ["薄めにできますか？", "可以调淡一点吗？", "想调淡一点"], ["同じものをもう一杯お願いします。", "麻烦再来一杯一样的。", "再点一样的"]]}, "梅酒": {"what": "以梅子浸渍制作的酒类饮品。", "why": "点单时店员可能继续问加冰还是兑苏打水等喝法。", "examples": [["梅酒をロックでお願いします。", "梅酒请加冰。", "加冰喝"], ["梅酒をソーダ割りでお願いします。", "梅酒请兑苏打水。", "兑苏打喝"]]}, "生ビール": {"what": "生啤酒，日常点单常简称「生（なま）」。", "why": "居酒屋会按杯型或容量供应，所以可补充中杯、大杯或数量。", "examples": [["とりあえず、生を二つお願いします。", "先来两杯生啤。", "先点饮料"], ["生、もう一杯お願いします。", "麻烦再来一杯生啤。", "再来一杯"], ["小さいサイズはありますか？", "有小杯的吗？", "选小杯"]], "text": "居酒屋里的「生ビール」就是生啤，点单时常简称「生（なま）」。刚坐下想先喝点东西，可以说「とりあえず、生を二つ」。想再来一杯，就加上「もう一杯」。"}, "大根おろし": {"what": "把白萝卜磨成的萝卜泥。", "why": "常作为烤鱼、炸物等的配菜或调味搭配，不是整块萝卜。", "examples": [["大根おろしをお願いします。", "请来一份萝卜泥。"]]}, "わさび": {"what": "山葵调味料，中文菜单常称日式芥末。", "why": "寿司和刺身常搭配它；不想放时可在点单时提出。", "examples": [["わさび抜きでお願いします。", "麻烦不要放山葵。", "不要山葵"], ["わさびは少なめでお願いします。", "麻烦少放一点山葵。", "想少放一点"], ["わさびは別にしてください。", "山葵请分开放。", "想自己加"]], "text": "「わさび」是寿司和刺身旁常见的山葵调味料，中文菜单也常叫日式芥末。不想放可以说「わさび抜き」，只想少一点就说「少なめ」。希望自己决定用量，也可以让店员分开放。"}, "生姜": {"what": "姜，可以切丝、磨泥或腌制后使用。", "why": "菜单或配料说明出现它，是在说明增香食材，具体形式由菜品决定。", "examples": [["生姜は入っていますか？", "里面有姜吗？"]]}, "山椒": {"what": "山椒植物的果实等制成的香辛料。", "why": "鳗鱼等料理旁可能放有山椒粉，用来增添香气与麻感。", "examples": [["山椒は別にできますか？", "山椒可以分开放吗？"]]}, "ポン酢": {"what": "在餐桌调味语境中常指带柑橘酸味的调味汁，常与酱油搭配。", "why": "涮锅、豆腐等可能用它作蘸汁，与芝麻酱是不同选择。", "examples": [["ポン酢をもらえますか？", "能给我一点柑橘调味汁吗？"]]}, "柚子": {"what": "一种具有明显香气的柑橘类水果。", "why": "日料用果皮或果汁为汤、酱汁和饮品增香，不一定是整颗水果上桌。", "examples": [["これ、柚子が入っていますか？", "这个里面有柚子吗？"]]}, "七味": {"what": "由辣椒等多种香辛料混合的调味粉。", "why": "乌冬、荞麦面或烤串旁可能放有它，按喜好少量添加。", "examples": [["七味はありますか？", "有七味粉吗？"]]}, "梅干し": {"what": "盐渍等加工制成的梅子，通常有酸咸风味。", "why": "常放进饭团、茶泡饭或作为配菜，不是甜味梅干零食的同义词。", "examples": [["梅干しのおにぎりをお願いします。", "请来一个梅子饭团。"]]}, "納豆": {"what": "发酵大豆，常带黏丝和特有气味。", "why": "既可配米饭，也会做成卷寿司；菜单出现时说明用到了这种发酵食材。", "examples": [["納豆をお願いします。", "请来一份纳豆。"]]}, "豆腐": {"what": "豆浆凝固后制成的豆腐。", "why": "日料会冷食、炖煮或油炸，具体做法要看「冷奴」「揚げ出し」等完整菜名。", "examples": [["この料理には豆腐が入っていますか？", "这道菜里有豆腐吗？"]]}, "昆布": {"what": "可食用的海藻，常用来熬高汤或加工成配菜。", "why": "它能出现在汤底、饭团馅和小菜里，不能一律理解成干海带直接吃。", "examples": [["このだしは昆布ですか？", "这个高汤是用昆布做的吗？"]]}, "海苔": {"what": "紫菜类海藻加工成的食材，常见薄片状。", "why": "寿司用它包裹，拉面也用它作配料；「海苔増し」表示增加海苔。", "examples": [["海苔を追加できますか？", "能加一份海苔吗？"]]}, "味噌汁": {"what": "用高汤、味噌和配料做成的汤。", "why": "定食常附带它，若想再来一碗应先确认是否能续、是否收费。", "examples": [["味噌汁をお願いします。", "请来一份味噌汤。"]]}, "漬物": {"what": "用盐、糠、醋等方式腌制的菜类统称。", "why": "常作为米饭旁的小菜出现，不专指某一种腌黄瓜或萝卜。", "examples": [["漬物をお願いします。", "请来一份腌菜。"]]}, "食べ放題": {"what": "在规定条件内可以多次取餐或点餐的畅吃形式。", "why": "店里用它说明套餐规则，需要留意时间、菜品范围和追加费用。", "examples": [["食べ放題は何分ですか？", "畅吃限时多少分钟？", "问套餐时长"], ["このメニューも食べ放題に入っていますか？", "这道菜也在畅吃范围内吗？", "确认可点范围"]]}, "お会計": {"what": "结账、买单时使用的说法。", "why": "吃完后要通知店员准备账单；它和点餐用的「注文」不同。", "examples": [["すみません、お会計お願いします。", "不好意思，麻烦买单。", "准备买单"], ["別々に払えますか？", "可以分开付款吗？", "想分开付"], ["カードは使えますか？", "可以刷卡吗？", "确认付款方式"]], "text": "吃完想买单，叫住店员说「お会計お願いします」就很自然。「お会計」是结账，别和点菜用的「注文」混淆。如果想各付各的，或想刷卡，可以接着把需求说清楚。"}, "相席": {"what": "让不同组客人共用一张桌子的拼桌安排。", "why": "店里座位紧张时可能询问是否接受，不表示你必须和陌生人一起点菜。", "examples": [["相席でも大丈夫です。", "可以拼桌。"]]}, "持ち帰り": {"what": "把食物带离店铺的外带。", "why": "店员需要确认包装和用餐方式，通常会与「店内」堂食区分。", "examples": [["持ち帰りでお願いします。", "麻烦打包带走。", "点单时说外带"], ["これ、持ち帰りできますか？", "这个能外带吗？", "先问能否外带"], ["残った分を持ち帰れますか？", "剩下的可以打包带走吗？", "饭后问能否打包"]], "text": "「持ち帰り（もちかえり）」就是外带，也会看到「テイクアウト」。点单时说「持ち帰りでお願いします」即可。已经上桌、吃剩的菜能不能打包，则要另外询问店员。"}, "取り皿": {"what": "把共享菜分到自己面前用的小碟子。", "why": "居酒屋大盘菜常供多人分食，需要分餐碟，而不是再点一份菜。", "examples": [["取り皿を二枚お願いします。", "麻烦给两个分餐碟。", "分着吃一道菜"], ["取り皿をもう一枚もらえますか？", "能再给我一个分餐碟吗？", "再要一个"]], "text": "几个人分着吃一盘菜时，各自面前的小碟子就叫「取り皿（とりざら）」。不够用就向店员要，盘子用「枚（まい）」计数，两只说「二枚（にまい）」。"}, "おしぼり": {"what": "用来擦手的湿毛巾或湿巾。", "why": "餐厅会在用餐前提供，若没有拿到可以向店员要。", "examples": [["すみません、おしぼりをもらえますか？", "不好意思，能给我一条湿毛巾吗？", "还没拿到"], ["おしぼりをもう一つお願いします。", "麻烦再给一条湿毛巾。", "想再要一条"]]}, "割り箸": {"what": "使用前通常需要掰开的筷子，常为一次性筷子。", "why": "外带或用餐时可用来询问餐具，不是要点一道菜。", "examples": [["割り箸をつけてもらえますか？", "能附上一双一次性筷子吗？"]]}, "予約": {"what": "提前预约座位、时间或服务。", "why": "餐厅需要按人数和时间安排座位，预约时还应说明具体日期。", "examples": [["明日の七時に、二人で予約できますか？", "能预约明天七点两位吗？", "提前订位"], ["七時に予約した田中です。", "我是预约了七点的田中。", "到店报预约"], ["予約してないんですが、二人入れますか？", "我们没预约，两个人能坐吗？", "没有预约"]], "text": "「予約（よやく）」是预约。订餐厅时，把日期、时间和人数一起说出来更方便。到了店里，再报预约时间和姓名；如果没有预约，也可以问现在能不能坐。"}, "禁煙席": {"what": "不允许吸烟的座位。", "why": "不同店铺的吸烟规定不同；这个词用于说明座位需求。", "examples": [["禁煙席でお願いします。", "麻烦安排禁烟座位。", "选择座位"], ["ここは禁煙ですか？", "这里禁烟吗？", "不确定店内规则"]]}, "アレルギー": {"what": "过敏。食物过敏时要明确告诉店员是哪种食材。", "why": "店员需要了解食材限制；“不喜欢”和“过敏”含义不同，不能互相替代。", "examples": [["卵アレルギーがあります。", "我对鸡蛋过敏。", "明确告知"], ["この料理に卵は入っていますか？", "这道菜里有鸡蛋吗？", "确认食材"], ["厨房に確認してもらえますか？", "能帮我向厨房确认一下吗？", "请店员核实"]]}, "家系": {"what": "以横滨家系风格命名的拉面，典型搭配为猪骨酱油汤。", "why": "店铺用它标明风格，有的店还会询问面硬度、味道浓淡和油量。", "examples": [["家系ラーメンは初めてなんですが、おすすめはありますか？", "我第一次吃家系拉面，有推荐的吗？"]]}, "二郎系": {"what": "受拉面二郎风格影响的一类拉面，常见较大份量与蒜等配料。", "why": "不同店的点法与份量不同，不熟悉时可以先问普通份有多大。", "examples": [["普通のサイズで、麺はどのくらいありますか？", "普通份大概有多少面？"]]}, "煮干し": {"what": "经过煮制、干燥的小鱼干。", "why": "拉面店用它熬汤，菜单写这个词是在强调汤底原料。", "examples": [["煮干しのラーメンをお願いします。", "请来一份小鱼干汤底的拉面。"]]}, "鶏白湯": {"what": "以鸡为主要原料熬成的乳白浓汤。", "why": "拉面菜单用它区别猪骨或清汤；「白湯」说的是汤的状态，不是白开水。", "examples": [["鶏白湯ラーメンをお願いします。", "请来一份鸡白汤拉面。"]]}, "魚介": {"what": "鱼、贝等水产食材的统称。", "why": "拉面里的「魚介」通常说明汤底或风味使用了海鲜类原料。", "examples": [["このスープは魚介系ですか？", "这个汤是海鲜类汤底吗？"]]}, "背脂": {"what": "猪背部的脂肪。", "why": "拉面里可作为增加油脂口感的配料，有的店允许调整用量。", "examples": [["背脂を少なめにできますか？", "能少放些猪背脂吗？"]]}, "台湾まぜそば": {"what": "一种常配肉末、葱蒜等的日式拌面。", "why": "名字带台湾，但点到的是拌面类别，通常要把面和配料拌匀再吃。", "examples": [["台湾まぜそばをお願いします。", "请来一份台湾拌面(无汤)。"]]}, "油そば": {"what": "用酱汁、油和配料拌着吃、没有普通拉面汤量的面食。", "why": "菜单将它与汤面区分，名字不是单纯“油很多的荞麦面”。", "examples": [["油そばをお願いします。", "请来一份油拌面。"]]}, "汁なし担々麺": {"what": "没有普通汤面那样汤量的担担拌面。", "why": "「汁なし」明确提示拌面形式，点单时仍可询问辣度。", "examples": [["汁なし担々麺をお願いします。", "请来一份无汤担担面。"]]}, "辛味噌": {"what": "带辣味的味噌调味料或口味。", "why": "拉面店用它说明汤味或配料有辣味，具体辣度要另问。", "examples": [["辛味噌は別にできますか？", "辣味噌能分开放吗？"]]}, "白湯": {"what": "拉面语境读「ぱいたん」，指乳白、浑浊的汤底。", "why": "用来区别清汤，可以是鸡或猪骨等原料；不要与读「さゆ」的白开水混淆。", "examples": [["これは白湯スープですか？", "这是白汤吗？"]]}, "清湯": {"what": "拉面语境读「ちんたん」，指相对清澈的汤底。", "why": "它与白湯是汤的类别差异，并不直接说明盐味还是酱油味。", "examples": [["清湯のラーメンはありますか？", "有清汤拉面吗？"]]}, "煮卵": {"what": "煮制、常经过调味的鸡蛋。", "why": "拉面店把它作为配料出售，具体是否溏心以店家做法为准。", "examples": [["煮卵を一つ追加してください。", "请加一颗卤蛋。"]]}, "海苔増し": {"what": "在原份量上增加海苔。", "why": "「増し」是加量的点单词，可能需要加钱，并不等于更换整碗面。", "examples": [["海苔増しでお願いします。", "麻烦多加海苔。"]]}, "青ねぎ": {"what": "主要使用绿色部分的葱。", "why": "拉面常用它作配料，若不想加可在下单时提出。", "examples": [["青ねぎ抜きでお願いします。", "麻烦不要放青葱。"]]}, "白ねぎ": {"what": "长葱的白色部分。", "why": "拉面店可能把它切丝或切段使用，与青葱的名称有所区分。", "examples": [["白ねぎを多めにできますか？", "能多放些白葱吗？"]]}, "もやし": {"what": "豆芽，日式拉面常见配料。", "why": "可以增加蔬菜份量和口感，有的店能调整用量。", "examples": [["もやしを少なめにできますか？", "能少放些豆芽吗？"]]}, "コーン": {"what": "玉米粒。", "why": "有些拉面用它作配料，特别是与黄油等搭配的口味。", "examples": [["コーンを追加してください。", "请加一份玉米粒。"]]}, "バター": {"what": "黄油。", "why": "拉面或料理用它增添乳香；菜单出现时表示含有这种配料。", "examples": [["バターを追加できますか？", "能加一份黄油吗？"]]}, "ニンニク": {"what": "蒜。", "why": "部分拉面店会问是否加入，不需要时可回答「なしで」。", "examples": [["ニンニクなしでお願いします。", "麻烦不要放蒜。", "不要蒜"], ["ニンニクは少なめでお願いします。", "麻烦少放一点蒜。", "少放一些"], ["これ、ニンニク入ってますか？", "这个里面有蒜吗？", "先确认配料"]]}, "刻みニンニク": {"what": "切碎的蒜末。", "why": "这个词说明蒜的处理形式，与整瓣蒜或蒜油不同。", "examples": [["刻みニンニクを少しください。", "请给我一点蒜末。"]]}, "辛子高菜": {"what": "以高菜等制作的辣味腌菜。", "why": "一些拉面店把它作配菜或调味配料，添加前可先确认辣度。", "examples": [["この高菜は辛いですか？", "这个高菜辣吗？"]]}, "紅生姜": {"what": "红色的腌姜，常切成细丝。", "why": "拉面、牛丼或炒面旁可能出现，用来增加酸味与香气。", "examples": [["紅生姜抜きでお願いします。", "麻烦不要放红姜丝。"]]}, "白ごま": {"what": "白芝麻。", "why": "可撒在面、饭或小菜上，菜单中是配料说明。", "examples": [["白ごまは入っていますか？", "里面有白芝麻吗？"]]}, "豚バラチャーシュー": {"what": "用猪五花肉制作的日式叉烧。", "why": "它比只写「チャーシュー」多说明了肉的部位，方便按肥瘦偏好选择。", "examples": [["豚バラチャーシューを追加できますか？", "能加一份五花叉烧吗？"]]}, "肩ロース": {"what": "靠近肩背的肉类部位；这里指用来制作叉烧的肩里脊。", "why": "拉面店可能列出不同叉烧部位，客人可以比较选择。", "examples": [["このチャーシューは肩ロースですか？", "这个叉烧是肩里脊做的吗？"]]}, "トッピング": {"what": "在基础菜品上另加的配料。", "why": "拉面菜单把蛋、肉、海苔等加料单独列出来，常需额外付费。", "examples": [["トッピングは何がありますか？", "有哪些配料可以加？"]]}, "追加": {"what": "在已有点单上再增加。", "why": "服务员会用它描述加菜、加面或加料，而不是重新取消原订单。", "examples": [["追加で餃子をお願いします。", "麻烦再加一份饺子。"]]}, "麺かため": {"what": "要求面条煮得偏硬一些。", "why": "允许调面硬度的店会在点单时确认，需在烹煮前提出。", "examples": [["麺はかためでお願いします。", "麻烦面条煮硬一点。", "偏硬"], ["麺は普通でお願いします。", "面条普通硬度就好。", "普通硬度"], ["麺はやわらかめでお願いします。", "麻烦面条煮软一点。", "偏软"]]}, "薄め": {"what": "味道偏淡一点；拉面里常说调味淡一些。", "why": "它是浓淡要求，不是小份或少面，要和份量区分。", "examples": [["味は薄めでお願いします。", "麻烦味道淡一点。"]]}, "濃いめ": {"what": "味道偏浓一点。", "why": "拉面店可用它记录口味要求，不等于增加面量。", "examples": [["味は濃いめでお願いします。", "麻烦味道浓一点。"]]}, "油少なめ": {"what": "要求油放少一些。", "why": "支持口味调整的店可据此处理，是否能完全不放需另问。", "examples": [["油少なめでお願いします。", "麻烦少油。"]]}, "油多め": {"what": "要求油放多一些。", "why": "它调整的是油量，不是汤量或面量。", "examples": [["油多めでお願いします。", "麻烦多放一点油。"]]}, "替え玉無料": {"what": "追加一份面免费，但次数与条件以店铺说明为准。", "why": "菜单用它吸引想续面的人；通常不是整碗面连汤一起重做。", "examples": [["替え玉は何回まで無料ですか？", "可以免费加几次面？"]]}, "小ライス": {"what": "一小碗米饭。", "why": "拉面店会把它作为主食配搭单列，份量比普通ライス小。", "examples": [["小ライスをお願いします。", "请来一份小碗米饭。"]]}, "半チャーハン": {"what": "小份或半份炒饭。", "why": "常搭配拉面做套餐，让客人能同时吃面和饭。", "examples": [["半チャーハンをお願いします。", "请来一份半份炒饭。"]]}, "餃子セット": {"what": "包含饺子的组合套餐。", "why": "它说明有套餐搭配，具体是否含饭、面要看菜单内容。", "examples": [["餃子セットをお願いします。", "请来一份饺子套餐。"]]}, "食券": {"what": "购买餐食后获得的餐券或订单凭证。", "why": "先付款的餐厅会用它把所点菜品传给店员或厨房。", "examples": [["食券はどこで買えますか？", "哪里可以买餐券？", "问购买位置"], ["食券はどこに出せばいいですか？", "餐券应该交到哪里？", "不知道交给谁"]]}, "券売機": {"what": "卖票的机器；餐厅里通常用来买餐券。", "why": "客人先选菜付款，再按店里流程领取或递交餐券。", "examples": [["券売機はどこですか？", "餐券机在哪里？", "寻找机器"], ["すみません、使い方を教えてもらえますか？", "不好意思，能教我怎么用吗？", "不会操作"], ["この券売機はカードが使えますか？", "这台机器可以刷卡吗？", "确认能否刷卡"]]}, "現金のみ": {"what": "只接受现金付款。", "why": "店里用这个标识说明支付方式，不能当成“现金有优惠”。", "examples": [["支払いは現金だけですか？", "只能用现金付款吗？"]]}, "カウンター席": {"what": "面对吧台或厨房的一排座位。", "why": "拉面店、居酒屋常这样安排座位，与独立餐桌不同。", "examples": [["カウンター席で大丈夫です。", "吧台座位可以。"]]}, "焼き物": {"what": "用烤制方式制作的菜品类别。", "why": "日料菜单按烹饪法分栏时会出现，栏内可能是鱼、肉或蔬菜。", "examples": [["おすすめの焼き物は何ですか？", "有什么推荐的烤物？"]]}, "揚げ物": {"what": "油炸菜品的总称。", "why": "菜单以它统称天妇罗、炸鸡等，不是某一道固定菜。", "examples": [["揚げ物は何がありますか？", "有哪些炸物？"]]}, "煮物": {"what": "把食材放在汤汁或调味液中煮制的菜品。", "why": "日料用它区分烤、炸、蒸等做法，食材可以多样。", "examples": [["今日の煮物は何ですか？", "今天的炖菜是什么？"]]}, "蒸し物": {"what": "用蒸汽加热制作的菜品。", "why": "套餐或菜单中它标示烹饪方式，不是具体某种蒸鱼。", "examples": [["この蒸し物には何が入っていますか？", "这道蒸菜里面有什么？"]]}, "和え物": {"what": "把食材与调味料拌合的菜品。", "why": "日料小菜栏常见；它不一定是完全未经加热的生菜。", "examples": [["この和え物は何で味付けしていますか？", "这道拌菜用什么调味？"]]}, "酢の物": {"what": "以醋味调味汁拌制的菜品。", "why": "可以作为套餐中的小菜，主要帮助你识别酸味调味方向。", "examples": [["酢の物を一つお願いします。", "请来一份醋拌菜。"]]}, "刺身": {"what": "切片后供食用的生鲜食材，常见为鱼贝类生鱼片。", "why": "海鲜店和居酒屋会单点或拼盘供应，具体鱼种要看标注。", "examples": [["刺身の盛り合わせをお願いします。", "请来一份刺身拼盘。", "点拼盘"], ["これは何の魚ですか？", "这是什么鱼？", "不认识鱼种"], ["今日のおすすめの刺身は何ですか？", "今天有什么推荐的刺身？", "问当日推荐"]]}, "汁物": {"what": "汤类料理的总称。", "why": "套餐流程用它说明这一道是汤，而非固定某一种味噌汤。", "examples": [["このセットに汁物はつきますか？", "这个套餐附带汤吗？"]]}, "鍋物": {"what": "在锅中烹煮并食用的料理总称。", "why": "菜单用它归类火锅、寿喜烧等，需要再看汤底和食材。", "examples": [["鍋物は二人前からですか？", "锅物是两人份起点吗？"]]}, "茶碗蒸し": {"what": "用高汤与蛋液蒸成、常有配料的咸味蛋羹。", "why": "它常作为套餐的一道菜，名字虽有茶碗，却不是茶饮。", "examples": [["茶碗蒸しをお願いします。", "请来一份蒸蛋羹。"]]}, "先付": {"what": "一餐或套餐开始时上的前菜、小菜。", "why": "日料菜单用它标示上菜顺序；不应只凭这个词推断另收座位费。", "examples": [["この先付は何ですか？", "这道前菜是什么？"]], "source": ["献立名称参考：日本食育综合研究所", "https://www.educe-shokuiku.jp/news/shokuiku/nihonryouri/"]}, "八寸": {"what": "日料中的一组小菜，常体现季节食材和搭配。", "why": "它是套餐流程或料理组合的名称，不表示一定有八道菜。", "examples": [["この八寸には何が入っていますか？", "这份季节小菜里有什么？"]], "source": ["献立名称参考：日本食育综合研究所", "https://www.educe-shokuiku.jp/news/shokuiku/nihonryouri/"]}, "お椀": {"what": "原意是碗，在日料献立中常指碗盛的汤料理。", "why": "店员报菜名时用容器代指这一道汤，不是在销售空碗。", "examples": [["このお椀には何が入っていますか？", "这道汤里有什么？"]]}, "造り": {"what": "日料菜单里的刺身类料理，也常写「お造り」。", "why": "套餐会把刺身这一道称为造り，不是“制作过程”的意思。", "examples": [["お造りの盛り合わせをお願いします。", "请来一份刺身拼盘。"]], "source": ["献立名称参考：日本食育综合研究所", "https://www.educe-shokuiku.jp/news/shokuiku/nihonryouri/"]}, "強肴": {"what": "套餐中另外添上的一道料理，内容由店家安排。", "why": "它是献立名称，不等于客人主动加点或一定另收费。", "examples": [["今日の強肴は何ですか？", "今天的强肴是什么菜？"]]}, "止め椀": {"what": "接近一餐结束、通常随饭上的汤，常见味噌汤。", "why": "它标示套餐后段的汤，与前面上的椀物位置不同。", "examples": [["止め椀は味噌汁ですか？", "收尾的汤是味噌汤吗？"]]}, "水菓子": {"what": "传统日料献立中通常指水果。", "why": "一般出现在餐后阶段，不能按字面理解成水做的糖果。", "examples": [["今日の水菓子は何ですか？", "今天的餐后水果是什么？"]], "source": ["献立名称参考：日本食育综合研究所", "https://www.educe-shokuiku.jp/news/shokuiku/nihonryouri/"]}, "懐石": {"what": "源于茶事餐食的日式料理形式，现代餐厅用法可能更广。", "why": "菜单用它说明一套按顺序供应的料理，具体内容和道数应确认。", "examples": [["懐石のコースを予約したいです。", "我想预约怀石套餐。"]]}, "会席": {"what": "以宴饮场合发展出的日式多道菜料理。", "why": "常用于聚餐套餐；与「懐石」同音，但历史含义不同。", "examples": [["会席のコースは何品ですか？", "会席套餐有几道菜？"]]}, "御膳": {"what": "正式用餐的称呼，现代菜单中常指摆在托盘等上的套餐。", "why": "点一份通常会有多种搭配，是否一次上齐和具体内容依店家而定。", "examples": [["この御膳には何がつきますか？", "这份御膳套餐附带什么？"]]}, "徳利": {"what": "装日本酒等用的酒壶。", "why": "点温酒时可能用它盛装，它说的是器皿，不是酒的品牌。", "examples": [["徳利で一合お願いします。", "请用酒壶来一合酒。"]]}, "お猪口": {"what": "饮用日本酒的小酒杯。", "why": "多人分饮一壶酒时可能需要多要几个，并不是多点几份酒。", "examples": [["お猪口をもう一つください。", "请再给一个小酒杯。"]]}, "熱燗": {"what": "把日本酒加热后的喝法。", "why": "店员用它确认饮用温度，与冰镇的冷酒不同。", "examples": [["日本酒を熱燗でお願いします。", "麻烦把日本酒温热后上。"]], "source": ["日本酒温度参考：神奈川县酒造组合", "https://www.kanagawa-jizake.or.jp/guide/"]}, "冷酒": {"what": "冷却、冰镇后饮用的日本酒。", "why": "想喝冰的可以用这个词；「冷や」在清酒语境通常指常温，要区分。", "examples": [["冷酒を一合お願いします。", "请来一合冰镇日本酒。"]], "source": ["日本酒温度参考：神奈川县酒造组合", "https://www.kanagawa-jizake.or.jp/guide/"]}, "純米": {"what": "纯米酒类别，以米、米曲和水为原料，不添加酿造酒精。", "why": "酒单用它说明酿造类别，并不直接等于一定甜、一定干或最高级。", "examples": [["おすすめの純米酒はありますか？", "有推荐的纯米酒吗？"]]}, "吟醸": {"what": "采用吟酿工艺的一类日本酒名称。", "why": "酒单用它区别酒的类别与风格；香气和口味还需看具体酒款。", "examples": [["吟醸酒はありますか？", "有吟酿酒吗？"]]}, "辛口": {"what": "清酒里通常指偏干、不甜的口感描述。", "why": "在咖喱里可能指辣，酒单里的含义不能直接套用到食物。", "examples": [["辛口の日本酒をお願いします。", "请来偏干的日本酒。"]]}, "甘口": {"what": "清酒里通常表示偏甜的口感。", "why": "用于按喜好挑酒，与「辛口」形成对照，但实际味道仍因酒款而异。", "examples": [["甘口のお酒はありますか？", "有偏甜的酒吗？"]]}, "箸置き": {"what": "搁放筷子前端的小器具，即筷架。", "why": "日式餐桌用它让筷子不直接接触桌面，不是可食用的配菜。", "examples": [["箸置きをもらえますか？", "能给我一个筷架吗？"]]}, "湯呑み": {"what": "喝茶用的杯子，通常没有把手。", "why": "需要茶杯时会用到这个词，它不是茶本身的名称。", "examples": [["湯呑みをもう一つください。", "请再给一个茶杯。"]]}, "個室": {"what": "与其他客人座位分隔开的包间，具体私密程度依店铺而异。", "why": "居酒屋用它区分座位类型，想要安静聚餐时可以询问是否有空位。", "examples": [["個室はありますか？", "有包间吗？", "先问有没有"], ["今、個室は空いてますか？", "现在有空包间吗？", "问是否空着"], ["四人で、個室を予約できますか？", "四个人可以预约包间吗？", "预订时提要求"]], "text": "「個室（こしつ）」就是包间。想和朋友坐得独立一点，可以先问店里有没有；有包间不代表现在有空位，所以还可以接着问「空いてますか？」。"}, "座敷": {"what": "铺榻榻米等、需要坐在地面附近的日式座席。", "why": "和桌椅席坐法不同，入座前店员可能会询问是否接受。", "examples": [["座敷でも大丈夫です。", "日式座敷也可以。"]]}, "掘りごたつ": {"what": "桌下留有凹槽、可以把脚放下去的日式座位。", "why": "外观看似座敷，但不一定需要盘腿坐，店里会单独标明。", "examples": [["掘りごたつの席はありますか？", "有能把脚放下去的日式座位吗？"]]}, "テーブル席": {"what": "使用餐桌和椅子的桌席。", "why": "店员用它与吧台席、座敷等区分，便于安排座位。", "examples": [["テーブル席でお願いします。", "麻烦安排桌席。", "说明座位需求"], ["テーブル席に移れますか？", "可以换到桌席吗？", "问能否换座"]]}, "席料": {"what": "使用座位收取的费用，指收费项目，不是端上桌的小菜。", "why": "有些居酒屋会在餐饮费之外收取席料。「お通し」则指入座小菜；小菜收费与席料如何安排因店而异，不能把两个词当作同义词。", "examples": [["席料はかかりますか？", "要收座位费吗？", "入座前确认"], ["席料は一人いくらですか？", "座位费每人多少钱？", "问金额"], ["これは席料ですか？", "这一项是座位费吗？", "核对账单"]], "text": "「席料（せきりょう）」就是使用座位收取的费用。有些居酒屋会把它另列在账单上。它和「お通し」不是同一个词：前者是费用，后者是入座后提供的小菜。是否都收、怎样计算，要看店铺的说明。"}, "お通し": {"what": "入座后提供、通常收费的小菜，指的是一道食物，不是“座位费”的日语名称。", "why": "一些居酒屋会在客人入座后提供这种小菜，并按店铺规则收费。它在收费安排上可能与座位有关，但词义仍是小菜；「席料」才是使用座位收取的费用。是否另收或合并计费，应看店铺说明。", "examples": [["このお通しは何ですか？", "这份入座小菜是什么？", "不知道端来的是什么"], ["お通しはいくらですか？", "入座小菜多少钱？", "先问费用"], ["お通しはなしにできますか？", "可以不要入座小菜吗？", "询问能否不要"]], "text": "刚坐下，还没点菜，店员就端来一小碟——这往往就是「お通し」。它通常会收费，但这个词指的是小菜本身；账单上的座位费叫「席料」。小菜和座位费如何收费，各家店不一样，不清楚时可以先问。"}, "予約席": {"what": "已经为预约客人保留的座位。", "why": "桌上的标牌用于提示该座位已有安排，不宜直接入座。", "examples": [["ここは予約席ですか？", "这里是预约席吗？"]]}, "注文": {"what": "点单、订购；在餐厅就是告诉店员想吃喝什么。", "why": "入座后叫店员过来点菜会用这个词，与结账不同。", "examples": [["すみません、注文いいですか？", "不好意思，可以点菜吗？", "叫店员点菜"], ["もう少し待ってもらえますか？", "能再等我们一下吗？", "还没选好"], ["追加で唐揚げをお願いします。", "麻烦再加一份炸鸡。", "再加一道"]], "text": "「注文（ちゅうもん）」就是点单。看好菜单后，先用「すみません」叫店员，再说「注文いいですか？」就可以了。还没决定好时，也可以请对方再等一下。"}, "おすすめ": {"what": "店家或对方推荐的选择。", "why": "不熟悉菜单时，可让店员根据当日食材或人气介绍菜品。", "examples": [["おすすめは何ですか？", "有什么推荐的吗？", "不知道点什么"], ["この辺りの名物はありますか？", "有这一带的特色菜吗？", "想吃当地菜"], ["じゃあ、それをお願いします。", "那就来这个吧。", "选好后下单"]], "text": "菜单看得眼花，不知道选什么，就问「おすすめは何ですか？」。「おすすめ」是推荐的东西，可以是菜，也可以是酒。听完介绍，想选那一道，接一句「じゃあ、それをお願いします」就能下单。"}, "人気メニュー": {"what": "比较受欢迎的菜品或饮品。", "why": "店家用它帮助客人选菜，不代表所有人都会喜欢同一口味。", "examples": [["人気のメニューはどれですか？", "哪道菜比较受欢迎？"]]}, "季節限定": {"what": "只在特定季节供应的品项。", "why": "食材和菜单会随季节变化，不代表全年都能点到。", "examples": [["季節限定のメニューはありますか？", "有季节限定的菜吗？"]]}, "ラストオーダー": {"what": "最后接受点单的时间。", "why": "店里需为厨房收尾留出时间，所以通常与正式打烊时间有区别。", "examples": [["ラストオーダーは何時ですか？", "最后点单是几点？", "提前确认"], ["まだ注文できますか？", "现在还能点单吗？", "快截止时加点"], ["最後に、生をもう一杯お願いします。", "最后麻烦再来一杯生啤。", "最后再点一杯"]], "text": "「ラストオーダー」常缩写成 L.O.，是最后接受点单的时间，并不一定是打烊时间。看到这个提醒，如果还想吃点什么、再来一杯，就要在截止前点好。"}, "コース": {"what": "按安排供应多道菜的套餐。", "why": "聚餐时不用每道单点，但内容、价格及是否含饮料应先确认。", "examples": [["このコースには何がつきますか？", "这个套餐包含什么？", "问包含什么"], ["飲み放題はついていますか？", "包含畅饮吗？", "确认是否含畅饮"], ["二人でも注文できますか？", "两个人也可以点吗？", "确认人数限制"]]}, "宴会": {"what": "多人聚餐、宴饮的场合。", "why": "居酒屋会提供适合团体的座位或套餐，预约通常需报人数和时间。", "examples": [["十人で宴会の予約をしたいです。", "我想预约十人的聚餐。"]]}, "飲み放題": {"what": "规定条件和时间内可以多次点饮品的畅饮方案。", "why": "不是所有酒款一定包含在内，菜单范围与最后点单时间要看套餐说明。", "examples": [["飲み放題のメニューを見せてもらえますか？", "能给我看看畅饮菜单吗？", "先看可选饮品"], ["飲み放題は何分ですか？", "畅饮限时多少分钟？", "确认时间"], ["生ビールも入っていますか？", "也包含生啤吗？", "问是否包含"]], "text": "「飲み放題（のみほうだい）」就是在规定时间和范围内畅饮。不过并非酒单上每一款都包含在内，先看看畅饮菜单，再确认时长和最后点单时间就好。"}, "サービス料": {"what": "店家另列的服务费。", "why": "它与消费税、客人自愿给的小费是不同概念，费用是否收取看店铺规定。", "examples": [["サービス料は別ですか？", "服务费另算吗？"]]}, "一人前": {"what": "按一人份标准准备的份量。", "why": "烤肉、锅物等常这样标份量，不表示一份只能由一个人吃。", "examples": [["一人前でお願いします。", "麻烦来一人份。", "点一份"], ["これ、何人前ですか？", "这道菜是几人份？", "问够几个人吃"]], "text": "「一人前（いちにんまえ）」是一人份，是店家用来标示份量的说法。它并不表示只能一个人吃。大家一起点菜时，问一句「これ、何人前ですか？」会更容易把握数量。"}, "追加注文": {"what": "在原来点单之外再加点。", "why": "菜上桌后还想吃喝更多，可以用这个词叫店员处理新需求。", "examples": [["追加注文してもいいですか？", "可以再加点吗？"]]}, "キャンセル": {"what": "取消已经提出的预约或点单等。", "why": "厨房可能已开始制作，所以需要询问能否取消，而不能自行认定成功。", "examples": [["すみません、これをキャンセルできますか？", "不好意思，这个能取消吗？", "请求取消"], ["注文を間違えました。変更できますか？", "我点错了，可以更改吗？", "发现点错了"]]}, "乾杯": {"what": "举杯时说的“干杯”。", "why": "聚餐开始常用来一起举杯，不要求一定把整杯喝完。", "examples": [["乾杯！", "干杯！"]]}, "とりあえず生": {"what": "“先来杯生啤”的口语省略表达。", "why": "居酒屋常先点饮料再慢慢看菜，正式点单可补数量和「お願いします」。", "examples": [["とりあえず、生を二つお願いします。", "先来两杯生啤。"]]}, "中ジョッキ": {"what": "中号啤酒杯，点单时常代指一杯中杯生啤。", "why": "店里会以杯型区分容量，实际毫升数并非各店统一。", "examples": [["生ビールを中ジョッキでお願いします。", "请来一杯中杯生啤。"]]}, "大ジョッキ": {"what": "大号啤酒杯，点单时常代指一杯大杯生啤。", "why": "它与中杯区分份量和价格，具体容量要看店家。", "examples": [["生ビールを大ジョッキでお願いします。", "请来一杯大杯生啤。"]]}, "レモンサワー": {"what": "柠檬风味、通常含酒精的碳酸调酒。", "why": "居酒屋常把它列在サワー类，不是普通柠檬汽水。", "examples": [["レモンサワーをお願いします。", "请来一份柠檬沙瓦。"]]}, "ウーロンハイ": {"what": "以乌龙茶与烧酒等调成的酒精饮品。", "why": "名字虽然有乌龙茶，仍属于酒类；不喝酒应点ウーロン茶。", "examples": [["ウーロンハイをお願いします。", "请来一份乌龙茶烧酒。"]]}, "カシスオレンジ": {"what": "以黑加仑利口酒和橙汁调制的鸡尾酒。", "why": "它是水果风味的酒精饮品，不是单纯橙汁。", "examples": [["カシスオレンジをお願いします。", "请来一份黑加仑橙汁鸡尾酒。"]]}, "ノンアルコール": {"what": "表示无酒精的饮品类别或标识。", "why": "不想饮酒时可据此寻找饮品，具体产品说明以菜单或瓶身为准。", "examples": [["ノンアルコールは何がありますか？", "有哪些无酒精饮品？", "问有哪些选择"], ["これ、アルコールは入っていませんか？", "这个不含酒精吗？", "确认一款饮料"], ["ノンアルコールビールをお願いします。", "请来一杯无酒精啤酒。", "点无酒精啤酒"]], "text": "不想喝酒，可以问「ノンアルコールは何がありますか？」。这个词表示无酒精饮品；看起来像果汁的鸡尾酒也可能含酒精，所以遇到不熟悉的名字，直接确认更清楚。"}, "ロック": {"what": "加冰块、不另兑水等的喝法，常说「オン・ザ・ロック」。", "why": "点烧酒、威士忌或梅酒时，店员可能问你选择哪种喝法。", "examples": [["梅酒をロックでお願いします。", "梅酒请加冰。"]]}, "水割り": {"what": "把酒兑水的喝法。", "why": "与纯加冰或兑苏打不同，点酒时需要说明这项要求。", "examples": [["焼酎を水割りでお願いします。", "烧酒请兑水。"]]}, "お湯割り": {"what": "把酒兑热水的喝法。", "why": "烧酒等可能这样供应，用它表达想要温热的调饮方式。", "examples": [["焼酎をお湯割りでお願いします。", "烧酒请兑热水。"]]}, "ソーダ割り": {"what": "把酒兑苏打水的喝法。", "why": "梅酒、烧酒等都可能提供这种选择，与兑普通水不同。", "examples": [["梅酒をソーダ割りでお願いします。", "梅酒请兑苏打水。"]]}, "ボトルキープ": {"what": "买下一瓶酒后，由店家暂存未喝完部分、以后再饮用的服务。", "why": "部分居酒屋提供这项服务，保管期限和费用应先问清。", "examples": [["ボトルキープはできますか？", "可以寄存酒瓶吗？"]]}, "たこわさ": {"what": "通常用章鱼和山葵风味调味制作的小菜。", "why": "小份、带山葵味，适合作为居酒屋点酒时搭配的小菜。", "examples": [["たこわさをお願いします。", "请来一份芥末章鱼。"]]}, "塩辛": {"what": "用鱼贝肉或内脏等盐渍、熟成制作的咸味食品。", "why": "居酒屋常以小份下酒菜提供；原料不只一种，可询问是哪种塩辛。", "examples": [["これは何の塩辛ですか？", "这是什么原料做的盐渍小菜？"]]}, "ししゃも": {"what": "菜单中的多春鱼一类小鱼，店里也可能使用近似鱼种。", "why": "常整条烤制作为下酒菜，具体品种应看店家标示。", "examples": [["ししゃもをお願いします。", "请来一份多春鱼。"]]}, "ホッケ": {"what": "日本菜单常见的食用鱼，中文常译花鲫鱼。", "why": "居酒屋常供应剖开后的烤鱼「ホッケの開き」，可多人分食。", "examples": [["ホッケの開きをお願いします。", "请来一份剖开烤的花鲫鱼。"]]}, "牛すじ煮込み": {"what": "把牛筋等炖煮成的小菜。", "why": "较适合慢炖的食材被做成温热下酒菜，不是烤牛排。", "examples": [["牛すじ煮込みをお願いします。", "请来一份炖牛筋。"]]}, "厚揚げ": {"what": "外层油炸、内部保留豆腐质地的厚炸豆腐。", "why": "居酒屋可烤制或炖煮后供应，与薄的油豆腐皮不同。", "examples": [["厚揚げをお願いします。", "请来一份厚炸豆腐。"]]}, "肉じゃが": {"what": "以土豆、肉、洋葱等炖煮的家常菜。", "why": "属于日式炖菜，菜单里的肉种可能是牛肉或猪肉。", "examples": [["肉じゃがをお願いします。", "请来一份土豆炖肉。"]]}, "軟骨唐揚げ": {"what": "把软骨裹粉炸成的小菜，常使用鸡软骨。", "why": "它强调脆韧口感，与普通炸鸡肉块是不同菜单项。", "examples": [["軟骨唐揚げをお願いします。", "请来一份炸软骨。"]]}, "フライドポテト": {"what": "炸薯条。", "why": "居酒屋也供应便于分享的常见小吃，不只卖传统日料。", "examples": [["フライドポテトをお願いします。", "请来一份炸薯条。"]]}, "シーザーサラダ": {"what": "凯撒沙拉风格的沙拉，常配相应沙拉酱。", "why": "聚餐点单时可搭配烤物、炸物，具体配料由店铺决定。", "examples": [["シーザーサラダをお願いします。", "请来一份凯撒沙拉。"]]}, "きゅうりの浅漬け": {"what": "经过较短时间腌渍的黄瓜。", "why": "作为清爽的小菜出现，「浅漬け」说明腌渍方式，而非完全生的黄瓜。", "examples": [["きゅうりの浅漬けをお願いします。", "请来一份浅渍黄瓜。"]]}, "ピリ辛": {"what": "带一点刺激感的微辣口味描述。", "why": "它修饰菜品味道，不是一个固定食材；实际辣度仍因店而异。", "examples": [["これ、ピリ辛ですか？", "这个是微辣的吗？"]]}, "焼きおにぎり": {"what": "把饭团表面烤制的烤饭团。", "why": "居酒屋会把它作为主食或收尾食物，调味可因店铺不同。", "examples": [["焼きおにぎりをお願いします。", "请来一份烤饭团。"]]}, "タレ": {"what": "这里指烤串用的调味酱汁。", "why": "店员常问「塩かタレか」，让你在盐味和酱味之间选择。", "examples": [["タレでお願いします。", "麻烦做成酱汁味。", "选酱味"], ["タレは別にできますか？", "酱汁可以分开放吗？", "想另放酱汁"]]}, "皮": {"what": "烤鸡串菜单里通常指鸡皮。", "why": "这是按鸡的部位命名的串，并不是要点一张包装皮。", "examples": [["皮を塩で二本お願いします。", "请来两串盐味鸡皮。"]]}, "レバー": {"what": "肝脏；烤鸡店里通常指鸡肝。", "why": "内脏也可以做串烧，若在其他烤肉店应确认是什么动物的肝。", "examples": [["レバーを一本お願いします。", "请来一串鸡肝。"]], "source": ["烤串部位参考：炭火焼鳥 樫", "https://yakitori-kashi.com/menu/"]}, "ハツ": {"what": "心脏；烤鸡店里通常指鸡心。", "why": "烤串菜单用部位名区分口感，与鸡胸肉或鸡肝不同。", "examples": [["ハツを二本お願いします。", "请来两串鸡心。"]], "source": ["烤串部位参考：炭火焼鳥 樫", "https://yakitori-kashi.com/menu/"]}, "ぼんじり": {"what": "鸡尾部附近的肉。", "why": "脂肪较丰富，烤鸡店会把它作为独立部位串烧出售。", "examples": [["ぼんじりを二本お願いします。", "请来两串鸡尾肉。"]], "source": ["烤串部位参考：炭火焼鳥 樫", "https://yakitori-kashi.com/menu/"]}, "せせり": {"what": "鸡颈部的肉。", "why": "烤鸡店按部位分别出售，看到这个词就知道不是鸡腿或鸡胸。", "examples": [["せせりを塩でお願いします。", "鸡颈肉串请做成盐味。"]], "source": ["烤串部位参考：炭火焼鳥 樫", "https://yakitori-kashi.com/menu/"]}, "ささみ": {"what": "鸡胸内侧的里脊肉。", "why": "烤鸡店会与其他鸡肉部位分开点单，也可能搭配不同调味。", "examples": [["ささみを一本お願いします。", "请来一串鸡里脊。"]]}, "ししとう": {"what": "一种小型青椒，通常辣味不强，但个别可能较辣。", "why": "它可以整只串烤，是烤串菜单中的蔬菜选择。", "examples": [["ししとうを一本お願いします。", "请来一串小青椒。"]]}, "銀杏": {"what": "白果，也就是银杏种子去掉外层和硬壳后用于料理的种仁；不是树叶。", "why": "居酒屋也卖蔬菜和其他食材的串烧，白果可串起来烤成下酒小菜，有些店季节限定供应。", "examples": [["銀杏を一本お願いします。", "请来一串烤银杏。", "在串烧栏点单"], ["銀杏って、どんな食べ物ですか？", "银杏是什么食物？", "不认识这道菜"], ["これは銀杏の串焼きですか？", "这是烤银杏串吗？", "问是不是烤的"]], "source": ["实际菜单：炭火串焼き もん", "https://www.mon2006.com/food"], "text": "銀杏（ぎんなん）是白果，也就是做菜用的银杏种仁。在居酒屋里，它也会像蔬菜一样串起来烤，作为下酒小菜。有些店只在当季供应，所以看到串烧栏里的「銀杏」，通常就是在说烤银杏串。"}, "アスパラ巻き": {"what": "用肉片等包裹芦笋制作的卷，常见培根或猪肉版本。", "why": "烤串店把蔬菜和肉组合起来供应；具体包裹材料应看店里说明。", "examples": [["このアスパラ巻きは豚肉ですか？", "这个芦笋卷外面包的是猪肉吗？"]]}, "〆": {"what": "一餐或一轮饮酒的收尾，读「しめ」。", "why": "居酒屋会在这个栏目列饭、面等食物，不表示店铺已经打烊。", "examples": [["〆に何かおすすめはありますか？", "有什么推荐的收尾主食吗？"]]}, "お茶漬け": {"what": "在米饭上加入茶或高汤等、搭配配料的料理。", "why": "居酒屋常把它作为收尾主食，口味可按梅子、鲑鱼等区分。", "examples": [["〆にお茶漬けをお願いします。", "最后请来一份茶泡饭。", "收尾点主食"], ["お茶漬けは何がありますか？", "茶泡饭有哪些口味？", "问口味"]]}, "雑炊": {"what": "把米饭放进汤中与蛋、蔬菜等煮制的料理。", "why": "锅物吃到最后可用剩余汤底制作，也有单独点的版本。", "examples": [["最後に雑炊はできますか？", "最后可以用汤做杂炊吗？"]]}, "締めのラーメン": {"what": "在饮酒或用餐末尾吃的一份拉面。", "why": "「締め」标明食用阶段，不是另一种固定的拉面汤底。", "examples": [["〆にラーメンをお願いします。", "最后请来一份拉面。"]]}, "アイス": {"what": "餐厅甜点语境中通常是冰淇淋的简称。", "why": "在收尾栏目里说的是甜点；「アイスコーヒー」中的アイス则表示冰的。", "examples": [["アイスをお願いします。", "请来一份冰淇淋。"]]}};
var DIALOGUE_EXPLANATIONS={"izakaya|r|菜单上这道是什么?|〆のお茶漬け": {"what": "「〆」是收尾，「お茶漬け」是用茶或高汤等冲入米饭的料理。", "why": "居酒屋把它列在用餐末尾的主食里，方便喝完酒后再吃一点饭。", "examples": [["〆にお茶漬けをお願いします。", "最后请来一份茶泡饭。"]]}, "izakaya|r|我们没点菜,店员却端来一小碟菜,小票上写着这个。这是什么?|お通し 450円(税別)": {"what": "「お通し」是部分居酒屋入座后供应、通常收费的小菜；题目里的「税別」表示未含税。", "why": "它可能不经单独点菜就上桌，因此看到小票时要理解这是店里的收费项目。", "examples": [["お通しはいくらですか？", "入座小菜多少钱？"]]}, "izakaya|s|我想再来一杯生啤,怎么跟店员说?|": {"what": "「もう一杯」表示再来一杯，「生ビール」是生啤。", "why": "已经点过饮料、现在想续一杯时，直接告诉店员饮品和数量即可。", "examples": [["すみません、生ビールをもう一杯お願いします。", "不好意思，请再来一杯生啤。"]]}, "izakaya|r|这个畅饮套餐是怎么算的?|飲み放題 90分(L.O. 60分)": {"what": "题目里的畅饮时长是90分钟，但L.O.说明最后点单在第60分钟。", "why": "店铺用两个时间区分“还能点”与“还能继续喝”，不能把它们当成同一截止时间。", "examples": [["ラストオーダーは何分前ですか？", "最后点单是在结束前多少分钟？"]]}, "ramen|r|店门口有台机器,旁边贴着这句话,什么意思?|先に券売機で食券をお買い求めください。": {"what": "「先に」是先，「食券」是餐券，这句话要求先去机器买餐券。", "why": "店里用先买券的流程处理付款和点单，未买券直接入座可能还不能下单。", "examples": [["食券はここで買えばいいですか？", "餐券在这里买就可以吗？"]]}, "ramen|r|店员问我这句话,他想问什么?|麺の硬さはどうされますか?(かため/ふつう/やわらかめ)": {"what": "店员在问面条的硬度：かため偏硬、ふつう普通、やわらかめ偏软。", "why": "有些拉面店允许烹煮前选择硬度，所以需要你先表明偏好。", "examples": [["麺はかためでお願いします。", "麻烦面条煮硬一点。"]]}, "ramen|s|我对葱过敏,想让厨房不要放葱,怎么说比较好?|": {"what": "「ねぎ抜き」表示不放葱；它本身没有完整说明过敏情况。", "why": "有过敏需求时要把食材与过敏情况明确说出来，不能只让店员理解成口味喜好。", "examples": [["ねぎアレルギーがあります。ねぎを使わずに作れますか？", "我对葱过敏。可以不用葱来做吗？"]]}, "ramen|r|菜单上这个是什么?|替え玉 150円": {"what": "「替え玉」是追加一份面；题中150円是这家店列出的加面价格。", "why": "拉面吃完、汤还留着时，有些店允许续面，不代表整碗面连汤一起重做。", "examples": [["すみません、替え玉をお願いします。", "不好意思，请加一份面。"]]}, "conv|r|收银员问我这句话,要回答什么?|温めますか?": {"what": "「温めますか？」是在问要不要加热。", "why": "便利店结账时，店员需要确认便当等是否放进微波炉。", "examples": [["はい、お願いします。", "好的，麻烦加热。"]]}, "conv|r|收银员说这句话,什么意思?|袋はご利用ですか?": {"what": "「袋はご利用ですか？」是在问你是否需要购物袋。", "why": "结账时店员要决定是否提供袋子及相应处理，具体收费看店内说明。", "examples": [["袋を一枚お願いします。", "麻烦给一个袋子。"]]}, "conv|r|晚上超市熟食上贴了这个,是什么意思?|20%引きシール": {"what": "「20%引き」表示按原价减去20%，也就是付原价的80%。", "why": "超市用折扣贴纸提示降价出售，不能把减去的比例理解成付款比例。", "examples": [["これは二割引きですか？", "这个是打八折吗？"]]}, "conv|s|我已经自带了购物袋,想告诉收银员不需要袋子,怎么说?|": {"what": "「袋は大丈夫です」在这个场景是婉拒袋子，意思是“不用了”。", "why": "日本店铺里「大丈夫です」可用来拒绝服务，要结合正在谈论的对象理解。", "examples": [["袋は大丈夫です。マイバッグがあります。", "不用袋子，我有自己的购物袋。"]]}, "train|r|站台电子屏上写着这两个词,有什么区别?|快速 / 各駅停車": {"what": "「快速」通常跳过部分车站，「各駅停車」通常每站都停。", "why": "上车前要看停靠站；不同线路的具体运行方式应以站内信息为准。", "examples": [["この電車はこの駅に止まりますか？", "这趟车在这个站停吗？"]]}, "train|r|站内广播说了这句话,发生了什么?|人身事故の影響で、運転を見合わせております。": {"what": "「運転を見合わせております」是暂停运行；题目说原因是人身事故的影响。", "why": "站内广播在告知线路暂时不能正常运行，接下来可能需要查询替代路线。", "examples": [["ほかの路線で行けますか？", "可以坐其他线路过去吗？"]]}, "train|s|我不确定这趟车是不是去新宿,怎么问车站工作人员?|": {"what": "「〜に行きますか」用来确认是否去某个目的地。", "why": "不确定车次方向时，先问清楚再上车，地名可以替换成自己的目的地。", "examples": [["この電車は新宿に行きますか？", "这趟电车去新宿吗？"]]}, "train|r|检票口旁边的人让我看这个牌子,什么意思?|乗り換えはこちら": {"what": "「乗り換え」是换乘，「こちら」是这边。", "why": "车站标牌在指引你转乘其他线路，不是直接指向出站口。", "examples": [["乗り換えはどちらですか？", "换乘走哪边？"]]}, "drug|r|免税柜台的店员这样说,我要做什么?|パスポートをご提示ください。": {"what": "「パスポートをご提示ください」是在请你出示护照。", "why": "免税等柜台办理手续时可能需要确认身份与资格，这是店员对当前步骤的提示。", "examples": [["はい、こちらです。", "好的，在这里。"]]}, "drug|r|价格牌上有这个标记,说明了什么?|税込 1,100円": {"what": "「税込」表示已包含税；题目中的金额是1,100日元。", "why": "价格牌用它帮助客人识别显示的金额是否含税，和「税別」不同。", "examples": [["これは税込みの値段ですか？", "这个是含税价吗？"]]}, "drug|s|我想买防晒霜,问店员在哪里,怎么说?|": {"what": "「日焼け止め」是防晒产品，「どこにありますか」用来问位置。", "why": "药妆店商品很多，用商品名加这个句型就能让店员指路。", "examples": [["日焼け止めはどこにありますか？", "防晒产品在哪里？"]]}, "drug|r|药盒上写着这个,怎么吃?|1日3回 食後に1錠": {"what": "题面这行文字的字面意思是每天3次、饭后各1片。「錠」是片剂的量词。", "why": "这是练习读懂标签用语的示例；实际使用应以具体药品说明及药师指示为准。", "examples": [["飲み方を教えてください。", "请告诉我服用方法。"]]}, "hotel|r|我们到早了,前台这样说,意思是?|チェックインは15時からとなっております。": {"what": "「15時から」表示从15点开始，店员在说明办理入住的起始时间。", "why": "早到并不表示马上能进房，通常需要先确认酒店如何安排。", "examples": [["チェックインまで荷物を預かってもらえますか？", "办理入住前能帮我寄存行李吗？"]]}, "hotel|s|我们还没到入住时间,想先把行李寄存在前台,怎么说?|": {"what": "「預かってもらえますか」是请求对方帮忙保管。", "why": "房间还没准备好或退房后还要外出时，可询问酒店是否能寄存行李。", "examples": [["荷物を預かってもらえますか？", "能帮我寄存行李吗？"]]}, "hotel|r|早餐券上写着这个,最晚几点能进场?|朝食 6:30〜10:00(最終入場 9:30)": {"what": "「最終入場」是最晚进入餐厅的时间；题目为9:30，10:00是早餐结束。", "why": "酒店把入场截止和用餐结束分开标示，以便安排服务。", "examples": [["朝食は九時半までに入ればいいですか？", "早餐在九点半之前进去就可以吗？"]]}, "hotel|s|房间里没有吹风机,想跟前台要一个,怎么说?|": {"what": "「ドライヤー」是吹风机，「貸していただけますか」是礼貌地请求借用。", "why": "房内没找到用品时，应先向前台确认是否可以借到。", "examples": [["すみません、ドライヤーはありますか？", "不好意思，有吹风机吗？"]]}, "shop|s|我想试穿这件衣服,怎么问店员?|": {"what": "「試着」是试穿，「〜てもいいですか」是在征求许可。", "why": "服装店可能有试衣间和试穿规则，所以先问店员更清楚。", "examples": [["これ、試着してもいいですか？", "这件可以试穿吗？"]]}, "shop|r|我想要M码,店员说了这句话,什么意思?|在庫を確認いたしますので、少々お待ちください。": {"what": "「在庫を確認」是查库存，「少々お待ちください」是请稍等。", "why": "店员可能需要去库房查找，并没有直接表示售罄。", "examples": [["はい、お願いします。", "好的，麻烦您了。"]]}, "shop|s|我喜欢这个款式,想问有没有别的颜色,怎么说?|": {"what": "「色違い」指同款的不同颜色。", "why": "喜欢款式但想换颜色时用它提问，不是在要求店员重新染色。", "examples": [["これ、色違いはありますか？", "这个同款有其他颜色吗？"]]}, "shop|r|收银员递来一张小票和一个东西,说了这句话。他想说什么?|こちら、免税のお手続きはあちらのカウンターです。": {"what": "「免税のお手続き」是办理免税手续，「あちらのカウンター」是那边的柜台。", "why": "有些商店把结账与办理相关手续分开，需要按店员指引前往指定柜台。", "examples": [["免税カウンターはどこですか？", "免税柜台在哪里？"]]}, "help|s|我想找厕所,怎么问路人?|": {"what": "「お手洗い」是厕所的礼貌说法，「どこですか」询问地点。", "why": "在店里或公共场所找厕所时，可用这个简短句型问路。", "examples": [["すみません、お手洗いはどこですか？", "不好意思，厕所在哪里？"]]}, "help|s|我的钱包丢了,想问警察局在哪里,怎么说?|": {"what": "「財布をなくしました」是钱包丢了，「交番」是街边派出所。", "why": "说明丢了什么，再问求助地点，能让对方理解你当前的需求。", "examples": [["財布をなくしました。交番はどこですか？", "我的钱包丢了。派出所在哪里？"]]}, "help|r|路口立着这个牌子,是什么意思?|通行止め(工事中)": {"what": "「通行止め」是禁止通行，「工事中」是正在施工。", "why": "路牌提示此路不能继续通过，需要找可通行的路线。", "examples": [["迂回路はどちらですか？", "绕行路线在哪边？"]]}, "help|r|便利店门口有人走过来问我这句话,他想问什么?|日本語は大丈夫ですか?": {"what": "「日本語は大丈夫ですか？」在这里是在确认你能否用日语沟通。", "why": "对方要决定怎样解释或帮助你，不是在问身体是否舒服。", "examples": [["少しだけ分かります。ゆっくりお願いします。", "我只懂一点，请说慢一点。"]]}, "izakaya|s|店员问“几位?”,我们一共三个人,怎么回答?|": {"what": "问「何名様ですか」是在问人数，三个人回答「三人です」。", "why": "店员根据人数安排座位，因此要回答人数而不是东西数量或楼层。", "examples": [["三人です。", "我们三位。"]]}, "izakaya|s|想叫店员过来点菜,怎么说?|": {"what": "「注文お願いします」是请店员来点单。", "why": "坐下看好菜单后，用「すみません」引起注意，再说明要点菜。", "examples": [["すみません、注文お願いします。", "不好意思，我想点菜。"]]}, "izakaya|r|店员说了这句话,是什么意思?|ラストオーダーは23時になります。": {"what": "「ラストオーダーは23時」表示最后点单在23点。", "why": "最后点单与离店时间不是同一概念，想加点要在截止前提出。", "examples": [["その前に、もう一品注文できますか？", "在那之前，可以再点一道菜吗？"]]}, "izakaya|r|小票上有这一项,是什么?|サービス料 10%": {"what": "「サービス料10%」是另列的10%服务费，不是同名的消费税。", "why": "账单把不同收费项目分开写，客人可据此询问费用构成。", "examples": [["サービス料は別ですか？", "服务费另算吗？"]]}, "izakaya|s|我想问能不能不要入座小菜,哪句话比较自然?|": {"what": "「なしにできますか」是在询问能否去掉某项内容。", "why": "有些居酒屋的入座小菜和收费规则不能取消，因此需先问，不能默认可以免除。", "examples": [["お通しはなしにできますか？", "可以不要入座小菜吗？"]]}, "izakaya|r|入座后店员问了这句话,他想问什么?|お飲み物は何になさいますか。": {"what": "「お飲み物は何になさいますか」是礼貌地问你想喝什么。", "why": "居酒屋入座后常先确认饮品，你可以直接说饮料名称和数量。", "examples": [["ウーロン茶を一つお願いします。", "请来一杯乌龙茶。"]]}};

操作时确认"], ["使い方を教えてもらえますか？", "能教我怎么用吗？", "请求帮助"]]}}, {"s": "ramen", "t": "s", "q": "你只有一张一万日元纸币，想先确认餐券机能不能用。", "o": ["一万円札(いちまんえんさつ)は使(つか)えますか？", "一万円札(いちまんえんさつ)に両替(りょうがえ)できますか？", "一万円分(いちまんえんぶん)の食券(しょっけん)を買(か)えますか？"], "a": 0, "e": "机器接受哪些纸币因店而异。「一万円札は使えますか？」就是直接问一万日元纸币能否使用；如果不能，再询问是否能换零钱。", "d": ["这句是想把钱换成一万日元纸币，方向相反。", "这句是问能否购买价值一万日元的餐券。"], "explain": {"text": "机器接受哪些纸币因店而异。「一万円札は使えますか？」就是直接问一万日元纸币能否使用；如果不能，再询问是否能换零钱。", "examples": [["一万円札は使えますか？", "能用一万日元纸币吗？", "先确认"], ["両替してもらえますか？", "能帮我换零钱吗？", "机器不收大额纸币时"]]}}, {"s": "ramen", "t": "s", "q": "你想要清淡一点的拉面，希望店员推荐，不是要求眼前这碗少放油。", "o": ["あっさりしたラーメンはどれですか？", "油(あぶら)を少(すく)なめにできますか？", "麺(めん)を少(すく)なめにできますか？"], "a": 0, "e": "「あっさりした」说整体口感清爽、清淡。「油少なめ」只是少油的要求，两者不完全相同。选菜单时，问哪一款更清淡比较明确。", "d": ["这是调整油量，并不是请店员推荐一款清淡的拉面。", "这是减少面量，不是改变口味。"], "explain": {"text": "「あっさりした」说整体口感清爽、清淡。「油少なめ」只是少油的要求，两者不完全相同。选菜单时，问哪一款更清淡比较明确。", "examples": [["あっさりしたものがいいです。", "我想吃清淡一点的。", "说明偏好"], ["こってりしたものはどれですか？", "哪一款比较浓厚？", "想吃浓厚口味时"]]}}, {"s": "ramen", "t": "s", "q": "这家店允许调整味道浓淡。你想让汤的调味淡一点。", "o": ["味(あじ)は薄(うす)めでお願(ねが)いします。", "味(あじ)は濃(こ)いめでお願(ねが)いします。", "麺(めん)は少(すく)なめでお願(ねが)いします。"], "a": 0, "e": "点单时说「味は薄めでお願いします」是在调整调味浓淡，不是让店员减少汤量。能否调整要看店铺；不确定可先问「薄めにできますか？」。", "d": ["「濃いめ」是更浓，与要求相反。", "「麺少なめ」是减少面量。"], "explain": {"text": "点单时说「味は薄めでお願いします」是在调整调味浓淡，不是让店员减少汤量。能否调整要看店铺；不确定可先问「薄めにできますか？」。", "examples": [["味は薄めでお願いします。", "麻烦味道淡一点。", "店员正在询问口味"], ["味を薄めにできますか？", "可以做淡一点吗？", "先问是否能调整"]]}}, {"s": "ramen", "t": "s", "q": "这家店可以调整油量。你想少放油，但不要求完全去掉油。", "o": ["油(あぶら)少(すく)なめでお願(ねが)いします。", "油(あぶら)多(おお)めでお願(ねが)いします。", "スープ少(すく)なめでお願(ねが)いします。"], "a": 0, "e": "「少なめ」是比通常少一点，并不是完全没有。想完全不放要另问是否能做到，不能用「少なめ」代替「なし」。", "d": ["「多め」是多一些。", "这句减少的是汤量，不是油量。"], "explain": {"text": "「少なめ」是比通常少一点，并不是完全没有。想完全不放要另问是否能做到，不能用「少なめ」代替「なし」。", "examples": [["油少なめでお願いします。", "麻烦少油。", "点单时调整"], ["油なしにもできますか？", "也可以完全不放油吗？", "想进一步确认"]]}}, {"s": "ramen", "t": "s", "q": "你想在拉面里加一颗味玉。", "o": ["味玉(あじたま)を一(ひと)つ追加(ついか)してください。", "味玉(あじたま)を抜(ぬ)いてください。", "味玉(あじたま)は別皿(べつざら)にしてください。"], "a": 0, "e": "「追加」是另加。味玉通常是单列的配料，能否直接向店员追加、还是需要另买餐券，按店铺流程来。", "d": ["「抜いて」是不放，与加一颗相反。", "「別皿」是另外装盘，没有表达增加数量。"], "explain": {"text": "「追加」是另加。味玉通常是单列的配料，能否直接向店员追加、还是需要另买餐券，按店铺流程来。", "examples": [["味玉を一つ追加できますか？", "可以加一颗味玉吗？", "先询问能否加料"], ["追加の食券は必要ですか？", "需要另买加料餐券吗？", "确认付款流程"]]}}, {"s": "ramen", "t": "s", "q": "你不喜欢葱，想在下单时请求不放葱。这次只是口味偏好。", "o": ["ねぎ抜(ぬ)きでお願(ねが)いします。", "ねぎ多(おお)めでお願(ねが)いします。", "ねぎは別皿(べつざら)でお願(ねが)いします。"], "a": 0, "e": "「ねぎ抜き」是不放葱；「別皿」则是葱仍然要，只不过另外装。若是过敏而非口味偏好，需要明确说过敏，并让店员确认能否处理。", "d": ["「多め」是多放。", "「別皿」只改变盛放方式，仍会提供葱。"], "explain": {"text": "「ねぎ抜き」是不放葱；「別皿」则是葱仍然要，只不过另外装。若是过敏而非口味偏好，需要明确说过敏，并让店员确认能否处理。", "examples": [["ねぎ抜きにできますか？", "可以不放葱吗？", "先询问"], ["ねぎは少なめでお願いします。", "麻烦少放一点葱。", "可以接受少量时"]]}}, {"s": "ramen", "t": "s", "q": "你想点普通份拉面，但把面量减一点，不是换成偏软的面。", "o": ["麺(めん)を少(すく)なめにできますか？", "麺(めん)をやわらかめにできますか？", "麺(めん)を大盛(おおも)りにできますか？"], "a": 0, "e": "「麺少なめ」是减少面量，「やわらかめ」是煮软一点。份量和硬度是两个不同要求；少面是否减价要另问，不能默认会便宜。", "d": ["这句改变的是硬度，不是数量。", "「大盛り」是加大份。"], "explain": {"text": "「麺少なめ」是减少面量，「やわらかめ」是煮软一点。份量和硬度是两个不同要求；少面是否减价要另问，不能默认会便宜。", "examples": [["麺を少なめにできますか？", "面可以少一点吗？", "调整面量"], ["半分くらいにできますか？", "可以减到大约一半吗？", "说明想要的份量"]]}}, {"s": "ramen", "t": "s", "q": "你吃完蘸面，觉得剩下的蘸汁太浓，想问能不能加汤稀释来喝。", "o": ["スープ割(わ)りはできますか？", "替(か)え玉(だま)はできますか？", "スープを濃(こ)くできますか？"], "a": 0, "e": "在蘸面店，「スープ割り」是用高汤等稀释剩余蘸汁，方便饮用。并不是所有店都提供，先问一句很自然；它和加一份面的「替え玉」不同。", "d": ["「替え玉」是续面。", "这句要求汤更浓，方向相反。"], "explain": {"text": "在蘸面店，「スープ割り」是用高汤等稀释剩余蘸汁，方便饮用。并不是所有店都提供，先问一句很自然；它和加一份面的「替え玉」不同。", "examples": [["スープ割りをお願いします。", "麻烦加汤稀释蘸汁。", "确认店里提供之后"], ["割りスープはどこですか？", "稀释用的汤在哪里？", "店里是自助添加时"]]}}, {"s": "ramen", "t": "s", "q": "吃完准备离开，你想自然地向店员道谢。", "o": ["ごちそうさまでした。", "いただきます。", "お待(ま)たせしました。"], "a": 0, "e": "离店时说「ごちそうさまでした」是常见的用餐结束致谢。喜欢这碗面，也可以再说一句「おいしかったです」。这不代替结账，付款流程仍按店里安排。", "d": ["「いただきます」通常在开始吃之前说。", "「お待たせしました」是“让您久等了”，多由提供服务的人说。"], "explain": {"text": "离店时说「ごちそうさまでした」是常见的用餐结束致谢。喜欢这碗面，也可以再说一句「おいしかったです」。这不代替结账，付款流程仍按店里安排。", "examples": [["ごちそうさまでした。", "谢谢款待。", "吃完离开时"], ["おいしかったです。ごちそうさまでした。", "很好吃，谢谢款待。", "想表达喜欢时"]] 算してください。", "余额不足，需要补足车费。", "也可能听到对方这样说"]], "source": ["交通卡余额不足时的处理参考：JR东日本", "https://jreastfaq.jreast.co.jp/faq/show/1057?category_id=28&site_domain=default"]}}, {"uid": "series-v1:train:insufficient:s", "s": "train", "t": "s", "q": "你出不了站，想请站员帮忙确认，怎么说？", "o": ["すみません、改札(かいさつ)を出られません。", "乗り過ごしてしまいました。どうすればいいですか？", "渋谷(しぶや)へ行くのはこちらで合っていますか？"], "a": 0, "e": "「残高」是卡里剩余金额，「精算」是结清应付车费。余额不足只是闸机不开的一种原因，先请站员检查，不要直接跟在别人后面出站。按指引充值或补足差额即可。", "d": ["这句话是“我坐过站了，该怎么办？”。", "这句话是“去涩谷走这边对吗？”。"], "explain": {"text": "「残高」是卡里剩余金额，「精算」是结清应付车费。余额不足只是闸机不开的一种原因，先请站员检查，不要直接跟在别人后面出站。按指引充值或补足差额即可。", "examples": [["すみません、改札を出られません。", "不好意思，我出不了检票口。", "你可以这样说"], ["残高が足りないので、精算してください。", "余额不足，需要补足车费。", "也可能听到对方这样说"]], "source": ["交通卡余额不足时的处理参考：JR东日本", "https://jreastfaq.jreast.co.jp/faq/show/1057?category_id=28&site_domain=default"]}}, {"uid": "series-v1:train:wrong-ticket:r", "s": "train", "t": "r", "q": "你发现买到的车票目的地不对，柜台人员答复。 对方说了下面这句话，是什么意思？", "j": "使う前でしたら、変更(へんこう)できるか確認(かくにん)します。", "o": ["如果还没使用，我帮您确认能否更改。", "这趟车到本站就终到。", "这趟快速列车不在那个站停。"], "a": 0, "e": "「買い間違えました」说明买错。能否更改取决于车票种类和使用状态，所以先把票给工作人员看，不能把对方“确认一下”当成已经办好。", "d": ["这个选项对应另一种意思；本题说的是“如果还没使用，我帮您确认能否更改。”。", "这个选项对应另一种意思；本题说的是“如果还没使用，我帮您确认能否更改。”。"], "explain": {"text": "「買い間違えました」说明买错。能否更改取决于车票种类和使用状态，所以先把票给工作人员看，不能把对方“确认一下”当成已经办好。", "examples": [["切符を買い間違えました。変更できますか？", "我买错车票了，可以更改吗？", "你可以这样说"], ["使う前でしたら、変更できるか確認します。", "如果还没使用，我帮您确认能否更改。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:train:wrong-ticket:s", "s": "train", "t": "s", "q": "你买错了纸质车票，想请柜台查看能否更改，怎么说？", "o": ["切符(きっぷ)を買い間違えました。変更(へんこう)できますか？", "ここで降りないといけませんか？", "この電車(でんしゃ)は、この駅に止まりますか？"], "a": 0, "e": "「買い間違えました」说明买错。能否更改取决于车票种类和使用状态，所以先把票给工作人员看，不能把对方“确认一下”当成已经办好。", "d": ["这句话是“必须在这里下车吗？”。", "这句话是“这趟车在这个站停吗？”。"], "explain": {"text": "「買い間違えました」说明买错。能否更改取决于车票种类和使用状态，所以先把票给工作人员看，不能把对方“确认一下”当成已经办好。", "examples": [["切符を買い間違えました。変更できますか？", "我买错车票了，可以更改吗？", "你可以这样说"], ["使う前でしたら、変更できるか確認します。", "如果还没使用，我帮您确认能否更改。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:train:reserved:r", "s": "train", "t": "r", "q": "你在列车上找座位，工作人员看票后说。 对方说了下面这句话，是什么意思？", "j": "こちらは指定席(していせき)です。お持ちの切符(きっぷ)をご確認(かくにん)ください。", "o": ["这里是指定席，请确认你持有的车票。", "电梯在站台尽头。", "请在下一站换乘。"], "a": 0, "e": "「指定席」表示按票面安排座位，不能因为看着空就直接坐。自由席和指定席的安排因列车不同，先看票面或请工作人员确认。", "d": ["这个选项对应另一种意思；本题说的是“这里是指定席，请确认你持有的车票。”。", "这个选项对应另一种意思；本题说的是“这里是指定席，请确认你持有的车票。”。"], "explain": {"text": "「指定席」表示按票面安排座位，不能因为看着空就直接坐。自由席和指定席的安排因列车不同，先看票面或请工作人员确认。", "examples": [["この切符は指定席ですか？", "这张票是指定席吗？", "你可以这样说"], ["こちらは指定席です。お持ちの切符をご確認ください。", "这里是指定席，请确认你持有的车票。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:train:reserved:s", "s": "train", "t": "s", "q": "你不知道这张票是不是有指定座位，怎么问？", "o": ["この切符(きっぷ)は指定席(していせき)ですか？", "エレベーターはどこですか？", "乗り換え(のりかえ)なしで行けますか？"], "a": 0, "e": "「指定席」表示按票面安排座位，不能因为看着空就直接坐。自由席和指定席的安排因列车不同，先看票面或请工作人员确认。", "d": ["这句话是“电梯在哪里？”。", "这句话是“不用换乘能到吗？”。"], "explain": {"text": "「指定席」表示按票面安排座位，不能因为看着空就直接坐。自由席和指定席的安排因列车不同，先看票面或请工作人员确认。", "examples": [["この切符は指定席ですか？", "这张票是指定席吗？", "你可以这样说"], ["こちらは指定席です。お持ちの切符をご確認ください。", "这里是指定席，请确认你持有的车票。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:train:car-position:r", "s": "train", "t": "r", "q": "你准备坐指定席列车，站员解释票面信息。 对方说了下面这句话，是什么意思？", "j": "五号車(ごごうしゃ)は、もう少し前です。", "o": ["5号车厢还要往前一点。", "大的寄存柜现在都在使用中。", "这次换乘请先出一次检票口。"], "a": 0, "e": "「号車」是车厢编号，不是站台编号。候车时可以对照地面或上方的车厢位置标识。题里的五号车只是练习例子，实际按自己的车票寻找。", "d": ["这个选项对应另一种意思；本题说的是“5号车厢还要往前一点。”。", "这个选项对应另一种意思；本题说的是“5号车厢还要往前一点。”。"], "explain": {"text": "「号車」是车厢编号，不是站台编号。候车时可以对照地面或上方的车厢位置标识。题里的五号车只是练习例子，实际按自己的车票寻找。", "examples": [["五号車はどの辺りですか？", "5号车厢大概在什么位置？", "你可以这样说"], ["五号車は、もう少し前です。", "5号车厢还要往前一点。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:train:car-position:s", "s": "train", "t": "s", "q": "你看见票上车厢号，但不知道在哪里排队，怎么问？", "o": ["五号車(ごごうしゃ)はどの辺りですか？", "ほかに荷物(にもつ)を預けられる場所(ばしょ)はありますか？", "乗り換え(のりかえ)るとき、改札(かいさつ)を出ますか？"], "a": 0, "e": "「号車」是车厢编号，不是站台编号。候车时可以对照地面或上方的车厢位置标识。题里的五号车只是练习例子，实际按自己的车票寻找。", "d": ["这句话是“还有其他可以寄存行李的地方吗？”。", "这句话是“换乘时需要出检票口吗？”。"], "explain": {"text": "「号車」是车厢编号，不是站台编号。候车时可以对照地面或上方的车厢位置标识。题里的五号车只是练习例子，实际按自己的车票寻找。", "examples": [["五号車はどの辺りですか？", "5号车厢大概 样说"]]}}, {"uid": "series-v1:help:walking-time:r", "s": "help", "t": "r", "q": "你询问目的地远不远，路人估算。 对方说了下面这句话，是什么意思？", "j": "歩いて十分(じゅっぷん)くらいです。", "o": ["走路大约十分钟。", "公共厕所在这个公园里面。", "您最后一次使用是在什么地方？"], "a": 0, "e": "「歩いて」是步行，「くらい」表示大约。路人的估计不是保证到达时间，自己的速度、路口等待和找路都可能影响实际用时。", "d": ["这个选项对应另一种意思；本题说的是“走路大约十分钟。”。", "这个选项对应另一种意思；本题说的是“走路大约十分钟。”。"], "explain": {"text": "「歩いて」是步行，「くらい」表示大约。路人的估计不是保证到达时间，自己的速度、路口等待和找路都可能影响实际用时。", "examples": [["ここから歩いてどのくらいですか？", "从这里走过去大概要多久？", "你可以这样说"], ["歩いて十分くらいです。", "走路大约十分钟。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:walking-time:s", "s": "help", "t": "s", "q": "你想知道从这里步行到那里要多久，怎么问？", "o": ["ここから歩いてどのくらいですか？", "この近くに公衆トイレ(こうしゅうトイレ)はありますか？", "携帯電話(けいたいでんわ)が見当たりません。"], "a": 0, "e": "「歩いて」是步行，「くらい」表示大约。路人的估计不是保证到达时间，自己的速度、路口等待和找路都可能影响实际用时。", "d": ["这句话是“这附近有公共厕所吗？”。", "这句话是“我找不到手机了。”。"], "explain": {"text": "「歩いて」是步行，「くらい」表示大约。路人的估计不是保证到达时间，自己的速度、路口等待和找路都可能影响实际用时。", "examples": [["ここから歩いてどのくらいですか？", "从这里走过去大概要多久？", "你可以这样说"], ["歩いて十分くらいです。", "走路大约十分钟。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:landmark:r", "s": "help", "t": "r", "q": "你找不到建筑入口，路人给你一个明显参照。 对方说了下面这句话，是什么意思？", "j": "郵便局(ゆうびんきょく)の向かい側(むかいがわ)です。", "o": ["在邮局对面。", "转过这个街角就有便利店。", "请告诉我颜色、形状等特征。"], "a": 0, "e": "「向かい側」是对面，「目印」是用来辨认位置的标志。店名、便利店或明显建筑都可以当参照，不一定非得是著名景点。", "d": ["这个选项对应另一种意思；本题说的是“在邮局对面。”。", "这个选项对应另一种意思；本题说的是“在邮局对面。”。"], "explain": {"text": "「向かい側」是对面，「目印」是用来辨认位置的标志。店名、便利店或明显建筑都可以当参照，不一定非得是著名景点。", "examples": [["何か目印はありますか？", "有什么明显的地标吗？", "你可以这样说"], ["郵便局の向かい側です。", "在邮局对面。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:landmark:s", "s": "help", "t": "s", "q": "你不熟悉街道，想问附近有没有容易认的标志，怎么说？", "o": ["何か目印(めじるし)はありますか？", "この辺りにコンビニはありますか？", "黒い財布(さいふ)の落とし物(おとしもの)は届いていませんか？"], "a": 0, "e": "「向かい側」是对面，「目印」是用来辨认位置的标志。店名、便利店或明显建筑都可以当参照，不一定非得是著名景点。", "d": ["这句话是“这一带有便利店吗？”。", "这句话是“有没有人送来一个黑色钱包？”。"], "explain": {"text": "「向かい側」是对面，「目印」是用来辨认位置的标志。店名、便利店或明显建筑都可以当参照，不一定非得是著名景点。", "examples": [["何か目印はありますか？", "有什么明显的地标吗？", "你可以这样说"], ["郵便局の向かい側です。", "在邮局对面。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:cross-street:r", "s": "help", "t": "r", "q": "你准备过马路，路人说明去对面的方式。 对方说了下面这句话，是什么意思？", "j": "あちらの横断歩道(おうだんほどう)を渡ってください。", "o": ["请从那边的人行横道过马路。", "旅游咨询处在车站前面。", "出租车乘车点在那边。"], "a": 0, "e": "「渡る」是横过道路、桥等。对面虽然看起来很近，也可能需要走到指定的人行横道；听清可通行的位置再走。", "d": ["这个选项对应另一种意思；本题说的是“请从那边的人行横道过马路。”。", "这个选项对应另一种意思；本题说的是“请从那边的人行横道过马路。”。"], "explain": {"text": "「渡る」是横过道路、桥等。对面虽然看起来很近，也可能需要走到指定的人行横道；听清可通行的位置再走。", "examples": [["向こう側へはどこから渡れますか？", "从哪里可以过到对面？", "你可以这样说"], ["あちらの横断歩道を渡ってください。", "请从那边的人行横道过马路。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:cross-street:s", "s": "help", "t": "s", "q": "你不确定哪里能走到对面，怎么问？", "o": ["向こう側(むこうがわ)へはどこから渡れますか？", "この辺りの地図(ちず)はもらえますか？", "タクシー乗り場(のりば)はどこですか？"], "a": 0, "e": "「渡る」是横过道路、桥等。对面虽然看起来很近，也可能需要走到指定的人行横道；听清可通行的位置再走。", "d": ["这句话是“可以给我一张这一带的地图吗？”。", "这句话是“出租车乘车点在哪里？”。"], "explain": {"text": "「渡る」是横过道路、桥等。对面虽然看起来很近，也可能需要走到指定的人行横道；听清可通行的位置再走。", "examples": [["向こう側へはどこから渡れますか？", "从哪里可以过到对面？", "你可以这样说"], ["あちらの横断歩道を渡ってください。", "请从那边的人行横道过马路。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:entrance:r", "s": "help", "t": "r", "q": "你到了建筑旁边却没找到门，工作人员说。 对方说了下面这句话，是什么意思？", "j": "入口(いりぐち)は建物(たてもの)の裏側(うらがわ)です。", "o": ["入口在建筑背面。", "要不要我再慢慢说明一遍？", "需要我叫救护车吗？"], "a": 0, "e": "「裏側」是背面，与面向道路的一侧可能不同。地图显示到了目的地，并不代表站在能进去的门口，问入口比只问“这是什么地方”更有用。", "d": ["这个选项对应另一种意思；本题说的是“入口在建筑背面。”。", "这个选项对应另一种意思；本题说的是“入口在建筑背面。”。"], "explain": {"text": "「裏側」是背面，与面向道路的一侧可能不同。地图显示到了目的地，并不代表站在能进去的门口，问入口比只问“这是什么地方”更有用。", "examples": [["この建物の入口はどこですか？", "这栋楼的入口在哪里？", "你可以这样说"], ["入口は建物の裏側です。", "入口在建筑背面。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:entrance:s", "s": "help", "t": "s", "q": "你已经到达建筑附近，想问入口在哪里，怎么说？", "o": ["この建物(たてもの)の入口(いりぐち)はどこですか？", "すみません、もう一度ゆっくりお願いします。", "連れ(つれ)が倒れました。救急車(きゅうきゅうしゃ)を呼んでください。"], "a": 0, "e": "「裏側」是背面，与面向道路的一侧可能不同。地图显示到了目的地，并不代表站在能进去的门口，问入口比只问“这是什么地方”更有用。", "d": ["这句话是“不好意思，请再慢一点说一遍。”。", "这句话是“我的同伴倒下了，请叫救护车。”。"], "explain": {"text": "「裏側」是背面，与面向道路的一侧可能不同。地图显示到了目的地，并不代表站在能进去的门口，问入口比只问“这是什么地方”更有用。", "examples": [["この建物の入口はどこですか？", "这栋楼的入口在哪里？", "你可以这样说"], ["入口は建物の裏側です。", "入口在建筑背面。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:blocked:r", "s": "help", "t": "r", "q": "你看到围挡，工作人员说明路线情况。 对方说了下面这句话，是什么意思？", "j": "この先は通れません。反対側からお回りください。", "o": ["前面不能通行，请从另一侧绕过去。", "要不要我写在纸上？", "沿这条路一直往前走。"], "a": 0, "e": "「回る」在这里是绕路，不是原地转圈。「通れません」表示不能通过，先找可走的路线，不必继续沿原导航路线硬走。", "d": ["这个选项对应另一种意思；本题说的是“前面不能通行，请从另一侧绕过去。”。", "这个选项对应另一种意思；本题说的是“前面不能通行，请从另一侧绕过去。”。"], "explain": {"text": "「回る」在这里是绕路，不是原地转圈。「通れません」表示不能通过，先找可走的路线，不必继续沿原导航路线硬走。", "examples": [["どちらから回ればいいですか？", "应该从哪边绕过去？", "你可以这样说"], ["この先は通れません。反対側からお回りください。", "前面不能通行，请从另一侧绕过去。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:blocked:s", "s": "help", "t": "s", "q": "你被围挡挡住，想问怎么绕到目的地，怎么说？", "o": ["どちらから回ればいいですか？", "住所(じゅうしょ)を書いてもらえますか？", "この道をまっすぐですか？"], "a": 0, "e": "「回る」在这里是绕路，不是原地转圈。「通れません」表示不能通过，先找可走的路线，不必继续沿原导航路线硬走。", "d": ["这句话是“能把地址写给我吗？”。", "这句话是“是沿这条路直走吗？”。"], "explain": {"text": "「回る」在这里是绕路，不是原地转圈。「通れません」表示不能通过，先找可走的路线，不必继续沿原导航路线硬走。", "examples": [["どちらから回ればいいですか？", "应该从哪边绕过去？", "你可以这样说"], ["この先は通れません。反対側からお回りください。", "前面不能通行，请从另一侧绕过去。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:elevator:r", "s": "help", "t": "r", "q": "你推着行李箱找入口，工作人员指路。 对方说了下面这句话，是什么意思？", "j": "段差のない入口(いりぐち)は、あちらにあります。", "o": ["没有台阶的入口在那边。", "能在地图上给我看一下想去的地方吗？", "在第二个红绿灯处右转。"], "a": 0, "e": "「段差」是高低差、台阶。表达“不走楼梯”的需求，比只问最近的路更准确；对方可能会指向电梯、坡道或另一个入口。", "d": ["这个选项对应另一种意思；本题说的是“没有台阶的入口在那边。”。", "这个选项对应另一种意思；本题说的是“没有台阶的入口在那边。”。"], "explain": {"text": "「段差」是高低差、台阶。表达“不走楼梯”的需求，比只问最近的路更准确；对方可能会指向电梯、坡道或另一个入口。", "examples": [["階段を使わずに行けますか？", "可以不走楼梯过去吗？", "你可以这样说"], ["段差のない入口は、あちらにあります。", "没有台阶的入口在那边。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:elevator:s", "s": "help", "t": "s", "q": "你需要避免上下台阶，怎么询问路线？", "o": ["階段(かいだん)を使わずに行けますか？", "今いる場所(ばしょ)を、この地図(ちず)で教えてもらえますか？", "二つ目(ふたつめ)の信号(しんごう)を右ですね？"], "a": 0, "e": "「段差」是高低差、台阶。表达“不走楼梯”的需求，比只问最近的路更准确；对方可能会指向电梯、坡道或另一个入口。", "d": ["这句话是“能在这张地图上告诉我现在的位置吗？”。", "这句话是“第二个红绿灯右转，对吗？”。"], "explain": {"text": "「段差」是高低差、台阶。表达“不走楼梯”的需求，比只问最近的路更准确；对方可能会指向电梯、坡道或另一个入口。", "examples": [["階段を使わずに行けますか？", "可以不走楼梯过去吗？", "你可以这样说"], ["段差のない入口は、あちらにあります。", "没有台阶的入口在那边。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:public-toilet:r", "s": "help", "t": "r", "q": "你问公共厕所，工作人员给出位置。 对方说了下面这句话，是什么意思？", "j": "公衆トイレ(こうしゅうトイレ)は、この公園(こうえん)の中にあります。", "o": ["公共厕所在这个公园里面。", "您最后一次使用是在什么地方？", "走路大约十分钟。"], "a": 0, "e": "「公衆トイレ」是公共厕所，与店铺是否允许借用厕所是两回事。问到位置后也要留意现场开放时间和指示。", "d": ["这个选项对应另一种意思；本题说的是“公共厕所在这个公园里面。”。", "这个选项对应另一种意思；本题说的是“公共厕所在这个公园里面。”。"], "explain": {"text": "「公衆トイレ」是公共厕所，与店铺是否允许借用厕所是两回事。问到位置后也要留意现场开放时间和指示。", "examples": [["この近くに公衆トイレはありますか？", "这附近有公共厕所吗？", "你可以这样说"], ["公衆トイレは、この公園の中にあります。", "公共厕所在这个公园里面。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:public-toilet:s", "s": "help", "t": "s", "q": "你不想借用店内厕所，想找附近的公共厕所，怎么问？", "o": ["この近くに公衆トイレ(こうしゅうトイレ)はありますか？", "携帯電話(けいたいでんわ)が見当たりません。", "ここから歩いてどのくらいですか？"], "a": 0, "e": "「公衆トイレ」是公共厕所，与店铺是否允许借用厕所是两回事。问到位置后也要留意现场开放时间和指示。", "d": ["这句话是“我找不到手机了。”。", "这句话是“从这里走过去大概要多久？”。"], "explain": {"text": "「公衆トイレ」是公共厕所，与店铺是否允许借用厕所是两回事。问到位置后也要留意现场开放时间和指示。", "examples": [["この近くに公衆トイレはありますか？", "这附近有公共厕所吗？", "你可以这样说"], ["公衆トイレは、この公園の中にあります。", "公共厕所在这个公园里面。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:nearby-store:r", "s": "help", "t": "r", "q": "你想买水，路人说明附近便利店的位置。 对方说了下面这句话，是什么意思？", "j": "この角を曲がると、コンビニがあります。", "o": ["转过这个街角就有便利店。", "请告诉我颜色、形状等特征。", "在邮局对面。"], "a": 0, "e": "「この辺り」是这一带、附近，「角を曲がる」是转过街角。对方不一定知道距离最近的是哪家，但通常能告诉你附近哪里有。", "d": ["这个选项对应另一种意思；本题说的是“转过这个街角就有便利店。”。", "这个选项对应另一种意思；本题说的是“转过这个街角就有便利店。”。"], "explain": {"text": "「この辺り」是这一带、附近，「角を曲がる」是转过街角。对方不一定知道距离最近的是哪家，但通常能告诉你附近哪里有。", "examples": [["この辺りにコンビニはありますか？", "这一带有便利店吗？", "你可以这样说"], ["この角を曲がると、コンビニがあります。", "转过这个街角就有便利店。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:nearby-store:s", "s": "help", "t": "s", "q": "你想找最近的便利店，怎么问？", "o": ["この辺りにコンビニはありますか？", "黒い財布(さいふ)の落とし物(おとしもの)は届いていませんか？", "何か目印(めじるし)はありますか？"], "a": 0, "e": "「この辺り」是这一带、附近，「角を曲がる」是转过街角。对方不一定知道距离最近的是哪家，但通常能告诉你附近哪里有。", "d": ["这句话是“有没有人送来一个黑色钱包？”。", "这句话是“有什么明显的地标吗？”。"], "explain": {"text": "「この辺り」是这一带、附近，「角を曲がる」是转过街角。对方不一定知道距离最近的是哪家，但通常能告诉你附近哪里有。", "examples": [["この辺りにコンビニはありますか？", "这一带有便利店吗？", "你可以这样说"], ["この角を曲がると、コンビニがあります。", "转过这个街角就有便利店。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:information:r", "s": "help", "t": "r", "q": "你在观光地点找人咨询，工作人员介绍服务。 对方说了下面这句话，是什么意思？", "j": "観光案内所(かんこうあんないじょ)は駅前にあります。", "o": ["旅游咨询处在车站前面。", "出租车乘车点在那边。", "请从那边的人行横道过马路。"], "a": 0, "e": "「観光案内所」是旅游咨询处，可能提供地图或路线信息。想要纸地图时说「もらえますか」，不是要求对方把手机借给你。", "d": ["这个选项对应另一种意思；本题说的是“旅游咨询处在车站前面。”。", "这个选项对应另一种意思；本题说的是“旅游咨询处在车站前面。”。"], "explain": {"text": "「観光案内所」是旅游咨询处，可能提供地图或路线信息。想要纸地图时说「もらえますか」，不是要求对方把手机借给你。", "examples": [["この辺りの地図はもらえますか？", "可以给我一张这一带的地图吗？", "你可以这样说"], ["観光案内所は駅前にあります。", "旅游咨询处在车站前面。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:information:s", "s": "help", "t": "s", "q": "你想拿一张纸地图，怎么问有没有？", "o": ["この辺りの地図(ちず)はもらえますか？", "タクシー乗り場(のりば)はどこですか？", "向こう側(むこうがわ)へはどこから渡れますか？"], "a": 0, "e": "「観光案内所」是旅游咨询处，可能提供地图或路线信息。想要纸地图时说「もらえますか」，不是要求对方把手机借给你。", "d": ["这句话是“出租车乘车点在哪里？”。", "这句话是“从哪里可以过到对面？”。"], "explain": {"text": "「観光案内所」是旅游咨询处，可能提供地图或路线信息。想要纸地图时说「もらえますか」，不是要求对方把手机借给你。", "examples": [["この辺りの地図はもらえますか？", "可以给我一张这一带的地图吗？", "你可以这样说"], ["観光案内所は駅前にあります。", "旅游咨询处在车站前面。", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:repeat:r", "s": "help", "t": "r", "q": "你没听清，工作人员主动确认你的需要。 对方说了下面这句话，是什么意思？", "j": "もう一度、ゆっくり説明(せつめい)しましょうか？", "o": ["要不要我再慢慢说明一遍？", "需要我叫救护车吗？", "入口在建筑背面。"], "a": 0, "e": "「もう一度」是再一次，「ゆっくり」是慢一点。这句比只说“听不懂”更具体，对方能知道你需要放慢并重复。", "d": ["这个选项对应另一种意思；本题说的是“要不要我再慢慢说明一遍？”。", "这个选项对应另一种意思；本题说的是“要不要我再慢慢说明一遍？”。"], "explain": {"text": "「もう一度」是再一次，「ゆっくり」是慢一点。这句比只说“听不懂”更具体，对方能知道你需要放慢并重复。", "examples": [["すみません、もう一度ゆっくりお願いします。", "不好意思，请再慢一点说一遍。", "你可以这样说"], ["もう一度、ゆっくり説明しましょうか？", "要不要我再慢慢说明一遍？", "也可能听到对方这样说"]]}}, {"uid": "series-v1:help:repeat:s", "s": "help", "t": "s", "q": "你觉得对方说得太快，怎么礼貌请求重复？", "o": ["すみません、もう一度ゆっくりお願いします。", "連れ(つれ)が倒れました。救急車(きゅうきゅうしゃ)を呼んでください。", "この建物(たてもの)の入口(いりぐち)はどこですか？"], "a": 0, "e": "「もう一度」是再一次，「ゆっくり」是慢一点。这句比只说“听不懂”更具体，对方能知道你需要放慢并重复。", "d": ["这句话是“我的同伴倒下了，请叫救护车。”。", "这句话是“这栋楼的入口在哪里？”。"], "expl ": "s", "q": "你在收银台旁看到蒸包柜，想买一个肉包。", "o": ["肉まん(にくまん)、一つ(ひとつ)ください。", "唐揚げ(からあげ)はありますか？", "大根(だいこん)と卵(たまご)を一つ(ひとつ)ずつお願いします(おねがいします)。"], "a": 0, "e": "「肉まん」指肉馅蒸包，有些商品叫「豚まん（ぶたまん）」。向店员报商品名和数量即可，不需要说得很长。", "d": ["这句是在说：“有日式炸鸡块吗？”", "这句是在说：“请给我一块萝卜和一个鸡蛋。”"], "explain": {"text": "「肉まん」指肉馅蒸包，有些商品叫「豚まん（ぶたまん）」。向店员报商品名和数量即可，不需要说得很长。", "examples": [["肉まん(にくまん)、一つ(ひとつ)ください。", "请给我一个肉包。", "现场会用到"], ["肉まん(にくまん)を二つ(ふたつ)お願いします(おねがいします)。", "请给我两个肉包。", "还可以这样说"], ["肉まん(にくまん)、まだありますか？", "肉包还有吗？", "确认有货"]]}}, {"uid": "conv-products-v1:anman", "s": "conv", "t": "r", "q": "你问柜台蒸包的馅，店员这样说。这句话是什么意思？", "o": ["这是豆沙包。", "这是辣味的。", "这是金枪鱼蛋黄酱口味。"], "a": 0, "e": "「あんまん」是甜馅包，通常是豆沙，和肉まん不同。「中華まん（ちゅうかまん）」是这类蒸包的总称。", "d": ["这与原句意思不同；原句是“这是豆沙包。”。", "这与原句意思不同；原句是“这是豆沙包。”。"], "explain": {"text": "「あんまん」是甜馅包，通常是豆沙，和肉まん不同。「中華まん（ちゅうかまん）」是这类蒸包的总称。", "examples": [["こちらはあんまんです。", "这是豆沙包。", "现场会用到"], ["肉まん(にくまん)はありますか？", "有肉包吗？", "还可以这样说"]]}, "j": "こちらはあんまんです。"}, {"uid": "conv-products-v1:pizzaman", "s": "conv", "t": "s", "q": "你看见标着ピザまん的蒸包，想买一个。", "o": ["ピザまんを一つ(ひとつ)お願いします(おねがいします)。", "フランクフルトを一本(いっぽん)お願いします(おねがいします)。", "プリンはどこですか？"], "a": 0, "e": "ピザまん是披萨风味蒸包，不是一块烤披萨。具体馅料看商品说明，不能仅凭名称判断全部配料。", "d": ["这句是在说：“请给我一根烤肠。”", "这句是在说：“布丁在哪里？”"], "explain": {"text": "ピザまん是披萨风味蒸包，不是一块烤披萨。具体馅料看商品说明，不能仅凭名称判断全部配料。", "examples": [["ピザまんを一つ(ひとつ)お願いします(おねがいします)。", "请给我一个披萨包。", "现场会用到"], ["これはピザまんですか？", "这是披萨包吗？", "还可以这样说"]]}}, {"uid": "conv-products-v1:warmingbun", "s": "conv", "t": "r", "q": "你想买肉包，店员说明现在的状态。这句话是什么意思？", "o": ["还没蒸好，请稍等。", "不好意思，现在卖完了。", "这是辣味的。"], "a": 0, "e": "「蒸し上がる」是蒸好。柜里看得到商品也不一定能立刻购买，可以问要等多久，再决定是否等。", "d": ["这与原句意思不同；原句是“还没蒸好，请稍等。”。", "这与原句意思不同；原句是“还没蒸好，请稍等。”。"], "explain": {"text": "「蒸し上がる」是蒸好。柜里看得到商品也不一定能立刻购买，可以问要等多久，再决定是否等。", "examples": [["まだ蒸し(むし)上がっていないので、少々(しょうしょう)お待ち(まち)ください。", "还没蒸好，请稍等。", "现场会用到"], ["あと何分(なんぷん)くらいですか？", "还要大概几分钟？", "还可以这样说"]]}, "j": "まだ蒸し(むし)上がっていないので、少々(しょうしょう)お待ち(まち)ください。"}, {"uid": "conv-products-v1:famichiki", "s": "conv", "t": "s", "q": "你在全家，想点一块柜台里的ファミチキ。", "o": ["ファミチキを一 らになさいますか？", "您要热的还是冰的？", "现场会用到"], ["アイスでお願いします(おねがいします)。", "请给我冰的。", "还可以这样说"]]}, "j": "ホットとアイス、どちらになさいますか？"}, {"uid": "conv-products-v1:size", "s": "conv", "t": "r", "q": "你说要拿铁，店员询问杯型。这句话是什么意思？", "o": ["您要什么尺寸？", "结账后先打开杯盖，再把杯子放进机器。", "请用这台机器接饮品。"], "a": 0, "e": "「サイズ」是尺寸。可以照菜单说Mサイズ，也可以指着杯型；不要把尺寸字母与热饮冷饮混淆。", "d": ["这与原句意思不同；原句是“您要什么尺寸？”。", "这与原句意思不同；原句是“您要什么尺寸？”。"], "explain": {"text": "「サイズ」是尺寸。可以照菜单说Mサイズ，也可以指着杯型；不要把尺寸字母与热饮冷饮混淆。", "examples": [["サイズはいかがなさいますか？", "您要什么尺寸？", "现场会用到"], ["M(エム)サイズでお願いします(おねがいします)。", "请给我M号。", "还可以这样说"]]}, "j": "サイズはいかがなさいますか？"}, {"uid": "conv-products-v1:machine", "s": "conv", "t": "r", "q": "付款后店员把杯子交给你并说明。这句话是什么意思？", "o": ["请用这台机器接饮品。", "请扫描条形码。", "结账后先打开杯盖，再把杯子放进机器。"], "a": 0, "e": "「マシン」指机器，「入れる」在这里是把饮品注入杯中。按购买的饮品、冷热和尺寸操作，不熟悉时可以求助。", "d": ["这与原句意思不同；原句是“请用这台机器接饮品。”。", "这与原句意思不同；原句是“请用这台机器接饮品。”。"], "explain": {"text": "「マシン」指机器，「入れる」在这里是把饮品注入杯中。按购买的饮品、冷热和尺寸操作，不熟悉时可以求助。", "examples": [["こちらのマシンでお入れ(いれ)ください。", "请用这台机器接饮品。", "现场会用到"], ["使い方(つかいかた)を教えて(おしえて)もらえますか？", "可以教我怎么用吗？", "还可以这样说"]], "source": ["全家：咖啡购买与制作说明", "https://www.family.co.jp/campaign/spot/famimacafe_make.html"]}, "j": "こちらのマシンでお入れ(いれ)ください。"}, {"uid": "conv-products-v1:button", "s": "conv", "t": "s", "q": "你已买好咖啡，但看不懂机器按钮。", "o": ["どのボタンを押せば(おせば)いいですか？", "ホットコーヒーのS(エス)を一つ(ひとつ)お願いします(おねがいします)。", "ふたはどこですか？"], "a": 0, "e": "「押す」是按按钮。可以出示杯子或小票，让店员知道买的是哪种饮品和尺寸，再询问。", "d": ["这句是在说：“请给我一杯S号热咖啡。”", "这句是在说：“杯盖在哪里？”"], "explain": {"text": "「押す」是按按钮。可以出示杯子或小票，让店员知道买的是哪种饮品和尺寸，再询问。", "examples": [["どのボタンを押せば(おせば)いいですか？", "应该按哪个按钮？", "现场会用到"], ["このカップで合って(あって)いますか？", "用这个杯子对吗？", "还可以这样说"]]}}, {"uid": "conv-products-v1:lid", "s": "conv", "t": "s", "q": "接好咖啡后，你找不到杯盖。", "o": ["ふたはどこですか？", "アイスコーヒーのカップはどこですか？", "ガムシロップはありますか？"], "a": 0, "e": "「ふた」是盖子，ストロー是吸管。杯盖、搅拌棒等通常放在设备附近，但具体位置可以直接问店员。", "d": ["这句是在说：“冰咖啡杯在哪里？”", "这句是在说：“有液体糖浆吗？”"], "explain": {"text": "「ふた」是盖子，ストロー是吸管。杯盖、搅拌棒等通常放在设备附近，但具体位置可以直接问店员。", "examples": [["ふたはどこですか？", "杯盖在哪里？", "现场会用到"], ["ストローはありますか？", "有吸管吗？", "还可以这样说"
