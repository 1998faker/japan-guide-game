璃上映着一张张低头看手机的脸。"}],"effects":{"encounter":"train!"}},{"id":"tr-ads","lines":[{"who":"中吊り広告","jp":"外国人スタッフ大募集！時給1,050円〜　※日本語ネイティブレベル必須","text":"「外国员工大募集！时薪1,050日元起　※日语须达到母语水平」\n要母语水平的日语，却只给最低工资。"},{"who":"中吊り広告","jp":"この人を探しています","text":"旁边一张寻人启事被挤到了角落：「寻找此人」。\n照片印得很模糊，是一位穿灰色西装的老人。联系电话的区号，是一个你没听说过的地方。"}]},{"id":"tr-monitor","gate":{"when":{"flag":"sawMonitor"},"node":"tr-monitor-done"},"who":"ドア上のモニター","text":"门上方的屏幕滚动显示着停靠站：「天空橋 → 京急蒲田 → 品川」。\n可在「京急蒲田」和「品川」之间，多出来一格。那一格的站名，是一片沙沙作响的雪花。","sfx":"glitch","effects":{"glitch":"static"},"choices":[{"text":"盯着那片雪花看（接触异常）","next":"tr-monitor-stare"},{"text":"移开视线","effects":{"flag":"sawMonitor"}}]},{"id":"tr-monitor-stare","text":"雪花慢慢凝成了几个平假名：「かえらず」。\n——「回不去」。\n下一秒，屏幕恢复了正常。你的心跳得很快。","sfx":"heartbeat","effects":{"sanRule":"prologueAnomaly","flag":["sawMonitor","sawKaerazu"]}},{"id":"tr-monitor-done","who":"ドア上のモニター","text":"「天空橋 → 京急蒲田 → 品川」。现在看起来一切正常。"},{"id":"tr-passenger","gate":{"when":{"flag":"passengerDone"},"node":"tr-passenger-done"},"text":"你旁边的人一直在看你。","effects":{"flag":"passengerDone","encounter":"train!"}},{"id":"tr-passenger-done","text":"旁边的人戴上耳机，闭上了眼睛。"},{"id":"tr-oldman","gate":{"when":{"flag":"metOldman"},"node":"tr-oldman-2"},"lines":["车门边站着一位老人，穿着一件过时的灰色西装，手里攥着一张折了很多次的纸。\n满车的人，没有一个靠近他——他身边空出了一圈。",{"who":"穿旧西装的老人","text":"他看见你在看他，礼貌地点了点头，开口问道："}],"next":"tr-oldman-q"},{"id":"tr-oldman-q","type":"listen","who":"穿旧西装的老人","jp":"すみません。品川の海岸通りへは、どう行けばいいでしょうか。","question":"老人在问什么？","options":["去品川的「海岸通」该怎么走","品川站还有几站","能不能给他让个座"],"answer":0,"zh":"「不好意思，请问去品川的『海岸通』该怎么走？」","explain":"「〜へは、どう行けばいいでしょうか」= 去～该怎么走？（很客气的问法）。「海岸通り」= 海岸大街。","hint":"「海岸通り」「どう行けば」","failText":"老人有点失望地点点头，转过身去，看着窗外的隧道。","effects":{"flag":"metOldman","time":2},"next":"tr-oldman-2"},{"id":"tr-oldman-2","gate":{"when":{"clue":"oldStreet"},"node":"tr-oldman-gone"},"text":"你打开手机地图，搜索「品川　海岸通り」。\n——没有结果。只有一条「旧海岸通り」，在很远的浜松町。","choices":[{"text":"「すみません、地図にないです」（抱歉，地图上找不到）","next":"tr-oldman-3"},{"text":"「わかりません」（我不知道）","next":"tr-oldman-3"}]},{"id":"tr-oldman-3","who":"穿旧西装的老人","jp":"おかしいな……。五十年前は、確かにあったんですがね。みんな、そこで待っているはずなんです。","text":"「奇怪啊……五十年前，确实是有的。大家应该都在那里等我。」\n他把那张纸仔细折好，放回西装内袋。","effects":{"clue":"oldStreet","flag":"oldmanGone","time":3},"sfx":"clue","next":"tr-oldman-4"},{"id":"tr-oldman-4","when":{"clue":"oldNote"},"text":"那张纸是黄色的。\n——和你在机场长椅上捡到的那张，一模一样。"},{"id":"tr-oldman-gone","text":"老人已经不在那里了。"},{"id":"tr-seat","text":"老人刚才站的地方空着。\n没有人看见他在哪一站下的车——电车一直没有停过。"},{"id":"tr-ride","gate":{"when":{"flag":"routeLocal"},"node":"tr-ride-local"},"text":"电车在隧道里加速。车厢里的灯闪了一下，又闪了一下。","effects":{"time":12},"next":"tr-halt"},{"id":"tr-ride-local","text":"电车停了一站又一站。车厢里的灯闪了一下，又闪了一下。","effects":{"time":22},"next":"tr-halt"},{"id":"tr-halt","who":"車内放送","jp":"……次は、かえらず。かえらず。お降りのお客様は、お急ぎください。","text":"电车停在一个你没听说过的车站。站台很暗，没有站名牌。\n车门打开了。冷风灌进来，带着一股潮湿的海水味。\n车厢里的人都低着头，好像什么都没发生。","sfx":"glitch","effects":{"glitch":"static"},"choices":[{"text":"（想起机场掲示板的第④条）待在车里，绝对不下车","when":{"flag":"ruleStation"},"next":"tr-halt-stay"},{"text":"下车看看","next":"tr-halt-off"},{"text":"待在车里","when":{"notFlag":"ruleStation"},"next":"tr-halt-stay"},{"text":"问旁边的乘客：「ここはどこですか」（这是哪里？）","when":{"notFlag":"askedHalt"},"effects":{"flag":"askedHalt"},"next":"tr-halt-ask"}]},{"id":"tr-halt-ask","who":"旁边的乘客","jp":"……降りないほうがいいですよ。","text":"他没有抬头，只用很轻的声音说：「最好别下车。」\n你瞥了一眼他的手机屏幕——上面是一片雪花。","effects":{"sanRule":"prologueAnomaly"},"sfx":"heartbeat","choices":[{"text":"待在车里","next":"tr-halt-stay"},{"text":"还是下车看看","next":"tr-halt-off"}]},{"id":"tr-halt-off","text":"你拖着行李箱，迈出了车门。","effects":{"fatal":"kaerazu"}},{"id":"tr-halt-stay","lines":["你死死抓着吊环。车门在你面前慢慢关上。\n站台上的灯熄灭之前，你好像看见长椅上坐着几个人——都朝着车门的方向，像是在等谁。",{"who":"車内放送","jp":"次は、{dest}。{dest}です。お出口は右側です。","text":"电车重新开动。广播恢复了正常：「下一站，{dest}。出口在右侧。」"}],"effects":{"sanRule":"prologueAnomaly","flag":"survivedHalt","time":4},"next":"tr-arrive"},{"id":"tr-arrive","text":"{dest}到了。你拖着行李箱下了车，回头看了一眼——\n门上方的屏幕上，那一站的位置只显示着两个字：「通過」（通过）。","effects":{"flag":"trainDone","arrive":true,"time":4}},{"id":"sx-enter","gate":{"when":{"flag":"byBus"},"node":"sx-enter-car"},"lines":[{"who":"{time} · 品川駅 高輪口","text":"雨下大了。站前的大楼还亮着灯，可一拐进小路，四周就暗了下来。\n手机只剩 8% 的电，地图转了两圈就不动了。\n你只知道邮件上的那一行：「しながわ　ミナトヤホテル」。"},{"who":"目标","text":"在雨里找到「ミナトヤホテル」。\n可以去交番问路，或者对照电线杆上的住址牌。每走一个地方都要花时间；没带伞会淋雨（HP 减少）。"}]},{"id":"sx-enter-car","lines":[{"who":"{time} · 品川駅前","text":"深夜巴士把你放在品川站前。司机说那条小路车开不进去。\n「北品川二丁目なら、あっちのほうですよ」（北品川二丁目的话，在那边）——他朝雨里随手一指。"},{"who":"目标","text":"在雨里找到「ミナトヤホテル」。前台 24 点关门——现在是 {time}。"}],"effects":{"flag":"streetTip"}},{"id":"sx-koban","type":"hub","who":"交番の警察","text":"交番里，一位年轻的警察正在写报告。他抬起头，先看了看你的脸，又看了看你的行李箱。","choices":[{"text":"「ミナトヤホテルはどこですか」（港屋酒店在哪里？）","when":{"notFlag":"knowsHotel"},"next":"sx-koban-q"},{"text":"「ありがとうございました」（谢谢）","when":{"flag":"askedKoban"},"end":true}],"backText":"离开交番"},{"id":"sx-koban-q","type":"listen","who":"交番の警察","jp":"ミナトヤホテルですか。この道をまっすぐ行って、二つ目の角を左です。……失礼ですが、パスポートを拝見できますか。","question":"警察说了什么？","options":["沿这条路直走，第二个路口左转。……能看一下你的护照吗？","沿这条路直走，第一个路口右转。……酒店已经关门了。","最好坐出租车去。……要帮你叫车吗？"],"answer":0,"zh":"「港屋酒店啊。沿这条路直走，第二个路口左转。……不好意思，能看一下您的护照吗？」","explain":"「まっすぐ」= 直走；「二つ目の角」= 第二个路口；「左」= 左。「拝見できますか」= 能让我看一下吗？——很客气，但并不是在征求你的同意。","hint":"「まっすぐ」「二つ目の角を左」","effects":{"flag":["knowsHotel","askedKoban"],"time":6},"failNext":"sx-koban-fail","next":"sx-koban-after"},{"id":"sx-koban-fail","text":"警察叹了口气，在便条纸上画了一张简单的地图——画完以后，要你出示护照。","effects":{"flag":["knowsHotel","askedKoban"],"time":6},"next":"sx-koban-after"},{"id":"sx-koban-after","who":"交番の警察","jp":"お気をつけて。","text":"你把护照递过去。他对着你的脸看了很久，又在本子上抄下了号码。\n「路上小心。」他说。你不知道他指的是雨，还是别的什么。","effects":{"time":8,"stress":2}},{"id":"sx-konbini","type":"hub","who":"便利店店员（グエン）","text":"「いらっしゃいませ」\n便利店里很暖和。收银台后面的店员，胸牌上写着「グエン」——和你一样，是从别的国家来的人。","choices":[{"text":"买一把透明雨伞（¥550）","when":{"notItem":"umbrella"},"need":{"cashMin":550},"needText":"钱不够","effects":{"cash":-550,"item":{"umbrella":1},"time":3}},{"text":"买饭团和热茶（¥320，HP +8）","need":{"cashMin":320},"needText":"钱不够","effects":{"cash":-320,"hp":8,"time":5}},{"text":"「ミナトヤホテルはどっちですか」（港屋酒店往哪边走？）","when":{"notFlag":"konbiniWarn"},"next":"sx-konbini-way"}],"backText":"离开"},{"id":"sx-konbini-way","who":"便利店店员（グエン）","jp":"ミナトヤホテル……ああ、北品川二丁目のほうですね。","text":"「港屋酒店……啊，在北品川二丁目那边。」\n他看了看门口，压低声音，换成了一半英语一半日语：\n「那家酒店……我朋友在那里打过工。他说，晚上，不要接房间的电话。」\n他在收据背面画了一张小地图，推给你。","effects":{"flag":["knowsHotel","konbiniWarn"],"time":6,"stress":-2}},{"id":"sx-plaque","gate":{"when":{"flag":"streetTruth"},"node":"sx-plaque-done"},"lines":["一块旧东海道的说明牌：「北品川・品川宿」。\n说明文字下面，印着一张明治时代的地图。那时候，这条街的东边就是海——地图上沿着海岸，画着一条路："],"next":"sx-plaque-q"},{"id":"sx-plaque-q","type":"listen","who":"案内板の地図","jp":"海岸通り（埋め立てにより消滅。現在の第一京浜付近）","question":"地图上那条「海岸通」后来怎么了？","options":["因为填海造地，消失了","改名叫品川站前大道","现在是一条商店街"],"answer":0,"zh":"「海岸通（因填海造地而消失。大约在现在的第一京滨国道附近）」","explain":"「埋め立て」= 填海造地；「消滅」= 消失；「現在の〜付近」= 现在的～附近。","hint":"「埋め立て」「消滅」","effects":{"flag":"streetTruth","time":3},"next":"sx-plaque-after"},{"id":"sx-plaque-after","when":{"flag":"metOldman"},"text":"电车上的老人要去的那条路——五十年前，就已经被填掉了。\n可他说，大家都在那里等他。"},{"id":"sx-plaque-done","text":"说明牌：海岸通，因填海造地而消失。"},{"id":"sx-pole","lines":[{"who":"電柱の住所表示","jp":"北品川一丁目","text":"电线杆上钉着一块蓝色的住址牌：「北品川一丁目」。"}],"next":"sx-pole-note"},{"id":"sx-pole-note","when":{"flag":"noteRead"},"else":"sx-pole-no","text":"你掏出机场长椅上捡到的那张纸条：「しながわく　にちょうめ」——「にちょうめ」就是「二丁目」。\n住址牌上写着「一丁目」，箭头指着南边：再过一个街区，就是二丁目。","effects":{"flag":"knowsHotel"}},{"id":"sx-pole-no","text":"一丁目……酒店在几丁目？往哪个方向？雨水顺着住址牌往下流，没有别的线索。"},{"id":"sx-alley","who":"暗い路地","jp":"この先行き止まり。夜間の立ち入りはご遠慮ください。","text":"两栋楼之间的窄巷，没有路灯。巷口立着一块牌子：「前方是死路。夜间请勿进入。」\n巷子深处，好像有人在哼一首很老的歌。","choices":[{"text":"走进去看看（危险，SAN 会下降）","next":"sx-alley-in"},{"text":"离开","end":true}]},{"id":"sx-alley-in","text":"你往里走了十几步。歌声停了。\n地上有一张被雨泡烂的传单：「海岸通り商店会　夏祭り」——海岸通商店会　夏日祭。\n巷子的尽头，看起来比刚才更远了。\n\n回头的时候，你看见巷口对面亮着一块招牌：「ミナトヤホテル」。","sfx":"heartbeat","effects":{"sanRule":"prologueDanger","time":8,"flag":["knowsHotel","alleyIn"]},"choices":[{"text":"继续往里走（你知道这样不对）","next":"sx-alley-deep"},{"text":"转身离开","end":true}]},{"id":"sx-alley-deep","text":"那首歌又响起来了。就在前面，转过这个弯就是。","effects":{"fatal":"alley"}},{"id":"sx-hotel","text":"一栋六层的老商务酒店。招牌上的「ミナトヤホテル」坏了一个字的灯，变成了「ミナト　ホテル」。\n自动门打开，一股消毒水的味道扑面而来。","effects":{"goto":"hotel","time":2},"sfx":"door"},{"id":"wr-enter","lines":[{"who":"{time} · {dest}駅","text":"{dest}站。雨还在下。站前有一家亮着灯的商务酒店。\n你又看了一眼邮件：「しながわ　ミナトヤホテル」。\n……应该就是这里吧？"},{"who":"目标","text":"去站前的酒店办理入住。"}],"effects":{"encounter":"street"}},{"id":"wr-hotel","lines":["自动门打开。前台的男员工抬起头，看了看你，又看了看你手机上的预订邮件。"],"next":"wr-hotel-q"},{"id":"wr-hotel-q","type":"listen","who":"站前酒店的前台","jp":"ミナトヤホテル様、ですか？　当館はホテル{dest}でございます。ミナトヤホテルさんは、品川のほうですね。","question":"前台说什么？","options":["这里不是港屋酒店。港屋酒店在品川那边","港屋酒店今天已经满房了","港屋酒店就在这栋楼的楼上"],"answer":0,"zh":"「您是要找港屋酒店吗？本店是{dest}酒店。港屋酒店的话，在品川那边。」\n——邮件上的「しながわ」，写成汉字是「品川」。","explain":"「当館」= 本馆、本酒店；「〜のほう」= ～那边。「しながわ」= 品川。","hint":"「当館は」「品川のほう」","failText":"你没完全听懂。不过他摇头的样子已经说明了一切：这里不是你订的酒店。","effects":{"flag":"knowsShinagawa","time":5},"failNext":"wr-after","next":"wr-after"},{"id":"wr-after","text":"你走回雨里。走错了一站，时间又过去了不少。现在是 {time}。","call":"guess","callText":"再选一次 / 打车"},{"id":"ht-enter","gate":{"when":{"after":"frontClose"},"node":"ht-late"},"lines":[{"who":"{time} · ミナトヤホテル品川","text":"大厅很小，灯光发黄。前台后面站着一位年轻的女员工，名牌上写着「佐藤」。\n她正在打电话，看见你进来，马上挂断了。"},{"who":"目标","text":"去前台办理入住。"}],"effects":{"encounter":"hotel"}},{"id":"ht-late","lines":[{"who":"{time} · ミナトヤホテル品川","text":"大厅只开着一半的灯。前台没有人。柜台上立着一块牌子："},{"who":"フロントの札","jp":"本日のチェックイン受付は24時で終了いたしました。御用の方はベルを鳴らしてください。","text":"「今日的入住手续已于24点截止。有事请按铃。」\n你来晚了。"}],"effects":{"flag":"lateArrival"}},{"id":"ht-front","gate":{"when":{"flag":"lateArrival"},"node":"ht-late-front"},"else":"ht-front-in","when":{"notFlag":"checkedIn"},"who":"佐藤 美穂（前台）","jp":"いらっしゃいませ。チェックインでございますか。","text":"「欢迎光临。是办理入住吗？」","next":"ht-checkin-q"},{"id":"ht-checkin-q","type":"listen","must":"checkin","who":"佐藤 美穂（前台）","jp":"ご予約のお名前と、パスポートをお願いいたします。","question":"佐藤要你提供什么？","options":["预订时的姓名和护照","信用卡和电话号码","退房时间和早餐券","房间号和退房时间"],"answer":0,"zh":"「请出示预订人的姓名和护照。」","explain":"「ご予約のお名前」= 预订人的姓名；「〜をお願いいたします」= 请给我～（很郑重的说法）。","hint":"「お名前」「パスポート」","effects":{"flag":"checkedIn","item":{"roomKey":1},"time":8},"failNext":"ht-checkin-again","next":"ht-checkin-2"},{"id":"ht-checkin-again","who":"佐藤 美穂（前台）","jp":"お名前と……パスポート、です。","text":"（她把手掌朝上，指了指你手里的护照。）","next":"ht-checkin-q"},{"id":"ht-checkin-2","lines":[{"who":"佐藤 美穂（前台）","jp":"206号室でございます。チェックアウトは11時です。","text":"「您的房间是206号。退房时间是11点。」"},{"who":"佐藤 美穂（前台）","jp":"お隣の207号室は空室ですので、夜は静かだと思います。","text":"她把房卡递给你，然后像是想起什么似的，补了一句：\n「隔壁的207号室是空房，晚上应该很安静。」"},"说完，她说要去后面拿早餐券，走进了前台后面的办公室。\n柜台上，住客登记簿摊开着。"],"effects":{"flag":"deskAway"}},{"id":"ht-front-in","gate":{"when":{"flag":"deskAway"},"node":"ht-front-away"},"type":"hub","who":"佐藤 美穂（前台）","text":"佐藤站在前台后面，把早餐券推给你。","choices":[{"text":"「朝ごはんは何時からですか」（早餐几点开始？）","next":"ht-sato-breakfast","once":true},{"text":"「207号室は、本当に空室ですか」（207真的是空房吗？）","next":"ht-sato-207","once":true}],"backText":"（结束对话）"},{"id":"ht-sato-breakfast","who":"佐藤 美穂（前台）","jp":"朝食は6時半から9時半まで、二階でございます。","text":"「早餐从6点半到9点半，在二楼。」"},{"id":"ht-sato-207","who":"佐藤 美穂（前台）","jp":"……はい。空室でございます。","text":"「……是的。是空房。」\n她回答得太快了。说完，她低头去整理一叠已经很整齐的单据。","effects":{"flag":"askedSato207"}},{"id":"ht-front-away","text":"前台没有人。办公室的门半开着，里面传来压低的说话声。","choices":[{"text":"按柜台上的铃","effects":{"clearFlag":"deskAway"},"next":"ht-front-back"},{"text":"先等一等"}]},{"id":"ht-front-back","who":"佐藤 美穂（前台）","jp":"お待たせいたしました。こちら、朝食券でございます。","text":"「让您久等了。这是早餐券。」\n佐藤从办公室快步走出来。她的脸色有点白。"},{"id":"ht-office","gate":{"when":{"clue":"overheard"},"node":"ht-office-done"},"when":{"flag":"deskAway"},"else":"ht-office-closed","text":"办公室的门没有关严。里面有两个人在说话。","next":"ht-office-route"},{"id":"ht-office-route","gate":{"when":{"flag":"lateArrival"},"node":"ht-office-late"},"text":"一个是佐藤，另一个是男人的声音，低沉而急促：","next":"ht-office-q"},{"id":"ht-office-q","type":"listen","who":"办公室里的男人","jp":"二〇七のお客様のことは、絶対に口外しないように。記録はこちらで直しておく。","question":"男人在说什么？","options":["207客人的事绝对不准对外说，记录我们来改","207的客人投诉了，赶快把记录处理好","207今晚有新客人入住，记录要准备好"],"answer":0,"zh":"「207客人的事，绝对不要对外说。记录我们这边会改好。」\n佐藤小声说了一句什么，你只听见「……まだ……」（ learFlag":"deskAway"}},{"id":"ht-elevator-no","text":"没有房卡，电梯按钮按不亮。"},{"id":"ht-late-front","when":{"notFlag":"checkedIn"},"else":"ht-late-front-done","text":"你按了铃。过了很久，一个穿保安制服的老人从后门走出来，手里拿着手电筒。","next":"ht-late-who"},{"id":"ht-late-who","who":"小林 辰夫（夜班保安）","jp":"……こんな時間に？　予約は？","text":"「……这个时间？有预约吗？」","next":"ht-late-q"},{"id":"ht-late-q","type":"listen","must":"checkin","who":"小林 辰夫（夜班保安）","jp":"お名前は。……パスポート、ありますか。","question":"保安问你要什么？","options":["名字和护照","房费和押金","你从哪里来","预订确认邮件和电话号码"],"answer":0,"zh":"「名字是？……护照，有吗？」","explain":"「お名前は」= 名字是？；「ありますか」= 有吗？","hint":"「お名前」「パスポート」","effects":{"flag":["checkedIn","deskAway"],"item":{"roomKey":1},"time":10},"failNext":"ht-late-again","next":"ht-late-2"},{"id":"ht-late-again","who":"小林 辰夫（夜班保安）","jp":"な・ま・え。パ・ス・ポー・ト。","text":"（他不耐烦地一个字一个字地重复。）","next":"ht-late-q"},{"id":"ht-late-2","who":"小林 辰夫（夜班保安）","jp":"二〇六。……夜中に何か聞こえても、気にしないで寝てください。","text":"「206。……半夜听到什么，别在意，睡你的。」\n他说要去后面找房卡的说明书，留下你一个人在柜台前。办公室里，他的手机震个不停。\n柜台上，住客登记簿摊开着。"},{"id":"ht-late-front-done","text":"保安在办公室里打电话。前台没有人。"},{"id":"rm-enter","lines":[{"who":"{time} · 206号室","text":"房间很小，一张床就占满了一半。空调发出咔哒、咔哒的声音。\n墙的另一边，就是207号室。"},{"who":"目标","text":"累了就休息吧（点「ベッド」）。"}],"sfx":"door"},{"id":"rm-desk","gate":{"when":{"flag":"readCard"},"node":"rm-desk-done"},"lines":["书桌上放着一张「ご案内」卡片，大部分是英日双语：Wi-Fi 密码、早餐时间、紧急出口。\n最后一行只有日文，像是后来用笔补上去的："],"next":"rm-desk-q"},{"id":"rm-desk-q","type":"listen","who":"ご案内カード（手写）","jp":"浴室の水の音が聞こえても、それはお客様のお部屋ではありません。","question":"这行字是什么意思？","options":["就算听到浴室的水声，那也不是您的房间","浴室的水请不要一直开着","浴室的热水要等一会儿才会出来"],"answer":0,"zh":"「就算听到浴室传来水声，那也不是您房间里的声音。」","explain":"「〜ても」= 即使～也；「お客様のお部屋ではありません」= 不是您的房间。","hint":"「水の音」「お部屋ではありません」","effects":{"flag":"readCard","time":2}},{"id":"rm-desk-done","text":"卡片最后一行：就算听到浴室的水声，那也不是您的房间。"},{"id":"rm-window","text":"窗外是一条后巷。雨打在空调外机上。\n隔壁207的窗户和你的只隔一米。那边的窗帘拉着——窗帘后面，亮着一盏很暗的灯。\n空房间，为什么开着灯？","effects":{"flag":"saw207light"}},{"id":"rm-wall","text":"你把耳朵贴在墙上。\n……什么都没有。连空调的声音都听不见。\n过了一会儿，传来很轻很轻的声音——像是一台老收音机，在放一首你没听过的歌。\n你敲 ter","lines":[{"who":"DAY 02 · 08:10 · ミナトヤホテル","text":"你几乎没睡。\n天亮以后，你又打开浴室的门看了一眼——镜子是干净的，一个字也没有。水龙头是干的。"},"下楼的时候，你经过207。\n「起こさないでください」还挂在门把手上。门缝下面，一点光也没有。"],"sfx":"ding","next":"mo-sato"},{"id":"mo-sato","who":"佐藤 美穂（前台）","jp":"おはようございます。昨夜は、よくお休みになれましたか。","text":"「早上好。昨晚休息得好吗？」","choices":[{"text":"「隣の207号室から、夜中に水の音がしました」（隔壁207半夜有水声）","next":"mo-sato-207"},{"text":"「……はい」（……嗯）","next":"mo-sato-fine"}]},{"id":"mo-sato-207","type":"listen","who":"佐藤 美穂（前台）","jp":"207号室は空室ですよ。……古い建物なので、配管の音がよく響くんです。","question":"佐藤说了什么？","options":["207是空房……楼很旧，水管的声音常常传过来","207的客人今天早上已经退房了……","207今天下午会有新客人入住……","207的水管昨天刚修好……"],"answer":0,"zh":"「207是空房哦。……这栋楼很旧了，水管的声音常常会传过来。」","explain":"「空室」= 空房；「古い建物」= 旧楼；「配管」= 水管；「響く」= 回响、传过来。","hint":"「空室」「配管の音」","failText":"她说得很快。你只听懂了「空室」两个字。","effects":{"flag":"askedMorning"},"failNext":"mo-after","next":"mo-after"},{"id":"mo-sato-fine","who":"佐藤 美穂（前台）","jp":"それはよかったです。","text":"「那就好。」\n她的目光在你脸上停了一秒，又落回电脑屏幕上。","next":"mo-after"},{"id":"mo-after","lines":["她的笑容很快，说话也很快。说完，她低头整理一叠已经很整齐的单据——和昨晚一模一样。","森经理从办公室走出来，看见你，礼貌地点了点头。\n他经过前台时，顺手看了一眼墙上的钥匙格。\n207的那一格，是空的。"],"next":"mo-plan"},{"id":"mo-plan","who":"接下来","text":"白天，你得在东京活下去：打工、学日语、坐电车去别的街区。每晚生活费 ¥{living}。\n傍晚以后回到酒店，就能开始调查207——你还要在这里住上几晚。\n\n（之后想回酒店：地图上的「追踪当前主线」，或任务页的「继续主线」。）","choices":[{"text":"🗺 出门，去东京","call":"toTokyo"},{"text":"🏨 留在酒店，等到傍晚就开始调查（用掉今天白天的时间）","call":"toHotel"}]}]}}},"customQuestions":[],"backgrounds":{}};

<script>
/* ==== engine/shared/chapter-check.js ==== */
/* ===================================================================
   第一章（以及以后同类章节）数据检查器：构建时和游戏加载时运行。
   检查：剧情 ID 是否重复/缺失、跳转是否存在、条件与效果是否写错、
         引用的证据/人物/物品/地图是否存在、地图尺寸是否正确。
   =================================================================== */
(function(root){
'use strict';
var COND=['any','all','not','phase','clockMin','clockMax','flag','notFlag','clue','notClue','anyClue','clueCount','clueCountMax','testimony','notTestimony','testimonyCount','trust','trustMax','npcStress','npcStressMax','mem','notMem','item','notItem','npcAt','notNpcAt','visited','notVisited','cashMin','sanMin','sanMax','prologue'];
var EFF=['time','trust','npcStress','mem','flag','clearFlag','item','testimony','clue','log','rule','sanRule','hp','san','cash','stress','glitch','toast','goto'];
var NODE=['sfx','zh','hint','failText','failNext','id','type','who','speaker','sub','npc','jp','text','question','lines','choices','effects','next','end','endText','nextText','gate','goto','else','when','options','answer','explain','accept','wrong','cancel','cancelText','backText','call','callText','onceFlag','after'];
var CHOICE=['text','when','need','needText','once','effects','next','end','call','id'];
var PHASES=['evening','night','late'];
var SOLID='#CSTPVNRBDULKXGOWQrEFAHY';
function L(v){return v==null?[]:Array.isArray(v)?v:[v]}

function check(ch,items,sanRules){
 var errors=[],warnings=[],nodes={},C=ch.chapter||{},MAPS=ch.maps||{},NPCS=ch.npcs||{},EV=ch.evidence||{},SC=ch.scenes||{};
 var itemIds={};(items||[]).forEach(function(i){itemIds[i.id]=1});
 function err(where,msg){errors.push('【'+where+'】'+msg)}
 function warn(where,msg){warnings.push('【'+where+'】'+msg)}
 function npc(where,id){if(!NPCS[id])err(where,'人物「'+id+'」不存在（可用：'+Object.keys(NPCS).join('、')+'）')}
 function evid(where,id,kind){var e=EV[id];if(!e)err(where,'证据/证词「'+id+'」不存在，请检查 evidence.json');else if(kind&&e.kind!==kind)err(where,'「'+id+'」不是'+(kind==='testimony'?'证词':'证据'))}
 function item(where,id){if(!itemIds[id])err(where,'物品「'+id+'」不存在，请先在 data/items.json 里添加')}
 function cond(where,w){
  if(w==null)return;if(typeof w!=='object'||Array.isArray(w)){err(where,'条件必须写成 { } 形式');return}
  Object.keys(w).forEach(function(k){
   if(k.charAt(0)==='_')return;
   if(COND.indexOf(k)<0){err(where,'条件「'+k+'」无法识别。可用：'+COND.join('、'));return}
   var v=w[k];
   if(k==='any'||k==='all'){if(!Array.isArray(v))err(where,k+' 必须是条件列表 [ ]');else v.forEach(function(x){cond(where,x)})}
   if(k==='not')cond(where,v);
   if(k==='phase')L(v).forEach(function(p){if(PHASES.indexOf(p)<0)err(where,'phase 只能是 evening / night / late')});
   if(['clue','notClue','anyClue'].indexOf(k)>=0)L(v).forEach(function(x){evid(where,x,'evidence')});
   if(['testimony','notTestimony'].indexOf(k)>=0)L(v).forEach(function(x){evid(where,x,'testimony')});
   if(['trust','trustMax','npcStress','npcStressMax','mem','notMem','npcAt','notNpcAt'].indexOf(k)>=0){if(typeof v!=='object'||Array.isArray(v))err(where,k+' 要写成 {"人物编号": 值}');else Object.keys(v).forEach(function(id){npc(where,id)})}
   if(k==='item'){if(typeof v!=='object')err(where,'item 要写成 {"物品编号": 数量}');else Object.keys(v).forEach(function(id){item(where,id)})}
   if(k==='notItem')L(v).forEach(function(id){item(where,id)});
   if(['clockMin','clockMax','clueCount','clueCountMax','testimonyCount','cashMin','sanMin','sanMax'].indexOf(k)>=0&&typeof v!=='number')err(where,k+' 必须是数字');
  });
 }
 function eff(where,e){
  if(e==null)return;if(typeof e!=='object'||Array.isArray(e)){err(where,'效果 effects 必须写成 { } 形式');return}
  Object.keys(e).forEach(function(k){
   if(k.charAt(0)==='_')return;
   if(EFF.indexOf(k)<0){err(where,'效果「'+k+'」无法识别。可用：'+EFF.join('、'));return}
   var v=e[k];
   if(['time','hp','san','cash','stress'].indexOf(k)>=0&&typeof v!=='number')err(where,k+' 必须是数字（例如 -5 或 10）');
   if(k==='clue')L(v).forEach(function(x){evid(where,x,'evidence')});
   if(k==='testimony')L(v).forEach(function(x){evid(where,x,'testimony')});
   if(['trust','npcStress','mem'].indexOf(k)>=0){if(typeof v!=='object'||Array.isArray(v))err(where,k+' 要写成 {"人物编号": 值}');else Object.keys(v).forEach(function(id){npc(where,id)})}
   if(k==='item'){if(typeof v!=='object')err(where,'item 要写成 {"物品编号": 数量}');else Object.keys(v).forEach(function(id){item(where,id)})}
   if(k==='sanRule'&&sanRules&&typeof sanRules[v]!=='number')err(where,'sanRule「'+v+'」在 config/game.json 的 sanRules 里找不到');
   if(k==='goto'&&(!v||!MAPS[v.map]))err(where,'goto 的地图「'+(v&&v.map)+'」不存在');
  });
 }
 /* 节点 */
 (ch.nodeFiles||[]).forEach(function(f){
  var list=f.data&&f.data.nodes;if(!Array.isArray(list)){err(f.file,'找不到 "nodes": [ ... ]');return}
  list.forEach(function(n,i){
   if(!n||!n.id){err(f.file,'第'+(i+1)+'段缺少剧情 ID（"id"）');return}
   if(nodes[n.id]){err(f.file,'剧情 ID「'+n.id+'」重复（另一个在 '+nodes[n.id].f+'）');return}
   nodes[n.id]={n:n,f:f.file};
  });
 });
 function ref(where,id,label){if(id&&!nodes[id])err(where,(label||'跳转')+'目标「'+id+'」找不到，请检查剧情 ID')}
 Object.keys(nodes).forEach(function(id){
  var n=nodes[id].n,w=nodes[id].f+' · '+id;
  Object.keys(n).forEach(function(k){if(k.charAt(0)!=='_'&&NODE.indexOf(k)<0)warn(w,'不认识的字段「'+k+'」，会被忽略')});
  ref(w,n.next);ref(w,n.else);ref(w,n.goto);ref(w,n.wrong,'出示错误时的');ref(w,n.cancel);ref(w,n.after);
  if(n.gate){cond(w,n.gate.when);ref(w,n.gate.node,'gate ')}
  cond(w,n.when);eff(w,n.effects);
  if(n.npc)npc(w,n.npc);
  if(n.type&&['hub','jp','present','listen'].indexOf(n.type)<0)err(w,'type 只能是 hub / jp / present / listen');
  ref(w,n.failNext,'没听懂时的');
  if(n.type==='jp'||n.type==='listen'){if(!n.jp)err(w,'日语题 / 听懂判定需要日语原文 jp');if(!Array.isArray(n.options)||n.options.length<2)err(w,'日语题需要至少 2 个选项 options');else if(typeof n.answer!=='number'||!n.options[n.answer])err(w,'日语题的正确答案 answer 必须是选项序号（第一个是 0）')}

   if(k.charAt(0)==='_')return;
   if(WHEN_KEYS.indexOf(k)<0)err(file,where+' 的条件「'+k+'」无法识别。可用的条件：'+WHEN_KEYS.join('、'));
  });
  ['chapter','chapterMin','chapterMax'].forEach(function(k){if(w[k]!=null&&(typeof w[k]!=='number'||w[k]<1||w[k]>maxCh))err(file,where+' 的 '+k+' 必须是 1~'+maxCh+' 之间的数字')});
  ['dayMin','dayMax','sanMin','sanMax','hpMin','cashMin'].forEach(function(k){if(w[k]!=null&&typeof w[k]!=='number')err(file,where+' 的 '+k+' 必须是数字')});
  if(w.phase!=null&&!phaseId(w.phase))err(file,where+' 的 phase 只能写「白天」或「夜晚」');
 }
 function checkEffects(file,where,e){
  if(e==null)return;
  if(typeof e!=='object'||Array.isArray(e)){err(file,where+' 的资源变化 effects 必须写成 { } 形式');return}
  Object.keys(e).forEach(function(k){
   if(k.charAt(0)==='_')return;
   if(EFFECT_KEYS.indexOf(k)<0)err(file,where+' 的资源变化「'+k+'」无法识别。可用的：'+EFFECT_KEYS.join('、'));
  });
  ['hp','san','cash','stress','action'].forEach(function(k){if(e[k]!=null&&typeof e[k]!=='number')err(file,where+' 的 '+k+' 必须是数字（例如 -5 或 10）')});
 }

 /* 1. 收集所有剧情节点 */
 (data.dialogues||[]).concat(data.chapters||[]).forEach(function(f){
  var d=f.data,list=Array.isArray(d)?d:(d&&d.nodes);
  if(!Array.isArray(list)){err(f.file,'找不到对话列表（应为 "nodes": [ ... ]）');return}
  list.forEach(function(n,i){
   var where='第'+(i+1)+'段对话';
   if(!n||typeof n!=='object'){err(f.file,where+' 格式不正确');return}
   if(!n.id||typeof n.id!=='string'){err(f.file,where+' 缺少剧情 ID（"id"）');return}
   where='剧情「'+n.id+'」';
   if(nodes[n.id]){err(f.file,where+' 的 ID 与 '+nodes[n.id].__file+' 重复');return}
   n.__file=f.file;nodes[n.id]=n;
   Object.keys(n).forEach(function(k){if(k.indexOf('__')!==0&&NODE_KEYS.indexOf(k)<0)warn(f.file,where+' 有一个不认识的字段「'+k+'」，会被忽略')});
   if(n.chapter!=null&&(typeof n.chapter!=='number'||n.chapter<1||n.chapter>maxCh))err(f.file,where+' 的 chapter 必须是 1~'+maxCh+' 之间的数字');
   if(!Array.isArray(n.lines)||!n.lines.length)err(f.file,where+' 没有任何台词（"lines"）');
   else n.lines.forEach(function(l,j){if(!l||(typeof l!=='string'&&!l.zh&&!l.jp&&!l.text))err(f.file,where+' 的第'+(j+1)+'句台词是空的')});
   checkWhen(f.file,where,n.when);
   checkEffects(f.file,where,n.effects);
   if(n.background&&bgs&&bgs.indexOf(n.background)<0)warn(f.file,where+' 的背景图「'+n.background+'」没有在 config/assets.json 中登记，将使用默认背景');
   if(n.choices!=null){
    if(!Array.isArray(n.choices)||!n.choices.length)err(f.file,where+' 的选项 choices 必须是至少一个选项的列表');
    else n.choices.forEach(function(c,j){
     if(!c||!c.text)err(f.file,where+' 的第'+(j+1)+'个选项缺少文字（"text"）');
     if(c){checkEffects(f.file,where+' 第'+(j+1)+'个选项',c.effects);checkWhen(f.file,where+' 第'+(j+1)+'个选项',c.when)}
    });
   }
  });
 });
 /* 2. 检查跳转 */
 Object.keys(nodes).forEach(function(id){
  var n=nodes[id];
  if(n.next&&!nodes[n.next])err(n.__file,'剧情「'+id+'」要跳转到「'+n.next+'」，但找不到这个剧情 ID');
  (Array.isArray(n.choices)?n.choices:[]).forEach(function(c,j){if(c&&c.next&&!nodes[c.next])err(n.__file,'剧情「'+id+'」第'+(j+1)+'个选项要跳转到「'+c.next+'」，但找不到这个剧情 ID')});
 });
 /* 3. NPC */
 (data.npcs||[]).forEach(function(f){
  var p=f.data,file=f.file;
  if(!p||typeof p!=='object'){err(file,'NPC 文件格式不正确');return}
  if(!p.id){err(file,'NPC 缺少 ID（"id"）');return}
  if(ids['npc:'+p.id]){err(file,'NPC ID「'+p.id+'」与 '+ids['npc:'+p.id]+' 重复');return}
  ids['npc:'+p.id]=file;
  if(!p.name)err(file,'NPC「'+p.id+'」缺少名字（"name"）');
  ['chapter','chapterMin','chapterMax'].forEach(function(k){if(p[k]!=null&&(typeof p[k]!=='number'||p[k]<1||p[k]>maxCh))err(file,'NPC「'+p.id+'」的 '+k+' 必须是 1~'+maxCh+' 之间的数字')});
  var sch=p.schedule;
  if(!sch||typeof sch!=='object')err(file,'NPC「'+p.id+'」缺少出现时间地点（"schedule"），例如 {"白天":["便利店"],"夜晚":["车站"]}');
  else Object.keys(sch).forEach(function(ph){
   if(ph.charAt(0)==='_')return;
   if(!phaseId(ph))err(file,'NPC「'+p.id+'」的 schedule 里「'+ph+'」不是有效时间，只能写「白天」或「夜晚」');
   asList(sch[ph]).forEach(function(pl){if(PLACE_IDS.indexOf(placeId(pl))<0)err(file,'NPC「'+p.id+'」的地点「'+pl+'」无法识别。可用地点：'+Object.keys(PLACE_ALIASES).join('、'))});
  });
  if(!Array.isArray(p.dialogues)||!p.dialogues.length)err(file,'NPC「'+p.id+'」没有对话列表（"dialogues"）');
  else p.dialogues.forEach(function(d){if(!nodes[d])err(file,'NPC「'+p.id+'」的对话「'+d+'」找不到，请检查 story/dialogues/ 里的剧情 ID')});
  if(p.repeat!=null&&['last','loop','none'].indexOf(p.repeat)<0)err(file,'NPC「'+p.id+'」的 repeat 只能写 last（重复最后一段）/ loop（从头循环）/ none（说完就不再出现）');
  npcs.push(p);
 });
 /* 4. 新章节 */
 (data.chapters||[]).forEach(function(f){
  var c=f.data,file=f.file;
  if(!c||Array.isArray(c)){err(file,'章节文件应写成 { "id":..., "title":..., "start":..., "nodes":[...] }');return}
  if(!c.id)err(file,'章节缺少 ID（"id"）');
  else if(ids['chapter:'+c.id])err(file,'章节 ID「'+c.id+'」重复');
  else ids['chapter:'+c.id]=file;
  if(!c.title)err(file,'章节缺少标题（"title"）');
  if(!c.start||!nodes[c.start])err(file,'章节「'+(c.id||'?')+'」的开始剧情 start「'+(c.start||'')+'」找不到');
  checkWhen(file,'章节「'+(c.id||'?')+'」',c.when);
  chapters.push(c);
 });
 return {errors:errors,warnings:warnings,nodes:nodes,npcs:npcs,chapters:chapters};
}

var api={check:check,placeId:placeId,phaseId:phaseId,asList:asList,PLACE_ALIASES:PLACE_ALIASES};
if(typeof module!=='undefined'&&module.exports)module.exports=api;
else root.StoryCheck=api;
})(typeof window!=='undefined'?window:this);
</script>

function say(t){
  t=t.replace(/[\u3400-\u9fff々]+[（(]([\u3040-\u30ffー]+)[）)]/g,'$1');
  if(!window.speechSynthesis){alert('当前浏览器不支持朗读,请换用 Safari、Chrome 或 Edge');return}
  var i=t.lastIndexOf('(');
  if(i>0&&t.slice(-1)===')'){var r=t.slice(i+1,-1),ok=r.length>0;for(var c=0;c<r.length;c++){var n=r.charCodeAt(c);if(n<0x3040||n>0x30FF)ok=false}if(ok)t=r}
  t=t.split('〜').join('').split('〇〇').join('なになに');
  try{
    var u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=0.85;
    var vs=speechSynthesis.getVoices(),ja=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().replace('_','-').indexOf('ja')===0});
    if(vs.length&&!ja.length&&!say.w){say.w=1;alert('这台设备没有日语语音,请在系统设置里下载日语语音后再试')}
    if(ja.length)u.voice=ja[0];
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}

var CUSTOM_Q=(function(){
 var list=(window.GAME_DATA&&GAME_DATA.customQuestions)||[],ok=[],bad=[];
 var cats=S.map(function(x){return x.id});
 var seen={};
 list.forEach(function(q,n){
  var name='新增题目第'+(n+1)+'题'+(q&&q.uid?'（'+q.uid+'）':'');
  if(!q||typeof q.q!=='string'||!Array.isArray(q.o)||q.o.length<2||typeof q.a!=='number'||!q.o[q.a]){bad.push(name+'：缺少题目 q / 选项 o / 正确答案序号 a，已跳过');return}
  if(cats.indexOf(q.s)<0){bad.push(name+'：场景「'+q.s+'」不存在，已跳过');return}
  if(!q.uid)q.uid=q.s+':'+q.q;
  if(String(q.uid).indexOf('custom:')!==0)q.uid='custom:'+q.uid; // 加前缀，避免与原题库编号冲突
  if(seen[q.uid]){bad.push(name+'：编号 uid 重复，已跳过');return}
  seen[q.uid]=1;
  if(!q.t)q.t=q.j?'r':'s';
  if(!q.e)q.e='';
  if(!q.d)q.d=[]; // 其他选项说明（可省略）
  if(!q.explain){var ex=q.t==='r'?[q.j||'',q.o[q.a],'题目中的日语']:[q.o[q.a],q.q,'可以这样说'];q.explain={text:q.e,examples:[ex]}}
  ok.push(q);
 });
 if(bad.length)(window.__GAME_LOAD_ERRORS=window.__GAME_LOAD_ERRORS||[]).push.apply(window.__GAME_LOAD_ERRORS,bad);
 return ok;
})();

var visitorQuestions=[{"id": "escalator", "prompt": "在大阪搭扶梯时，必须把另一侧让给赶路的人，自己也可以沿空侧走上去。", "answer": 1, "why": "左右站位是常见习惯，不是行走许可。应站稳扶好，按现场安全提示使用扶梯。"}, {"id": "boarding", "prompt": "电车到站后，应先让下车的人通过，再依次上车。", "answer": 0, "why": "先下后上，并从车门两侧排队等候，避免挡住下车通道。"}, {"id": "calls", "prompt": "只要小声说话，就可以在市内电车里一直打电话。", "answer": 1, "why": "市内电车一般要求避免通话；视频通话也一样。可以先发消息，方便时再回拨。"}, {"id": "eating", "prompt": "日本所有列车都一律禁止吃东西，包括长途列车上的便当。", "answer": 1, "why": "要区分拥挤的通勤电车与长途列车。留意车内标识，避免气味、洒漏和占用空间影响别人。"}, {"id": "seats", "prompt": "看起来年轻的人坐在优先席上，就一定没有需要，可以要求他离开。", "answer": 1, "why": "有些需求从外表看不出来，不要仅凭外表判断或质问他人。"}, {"id": "walking", "prompt": "日本所有车站楼梯、扶梯和街道，都统一要求靠左。", "answer": 1, "why": "不同通道可能有不同的箭头和分流方式，现场标识优先。"}, {"id": "smoking", "prompt": "在室外又随身带着烟灰缸，就可以边走边抽烟。", "answer": 1, "why": "室外不等于允许吸烟，携带烟灰缸也不能改变禁烟规定。应寻找指定吸烟区。"}, {"id": "trash", "prompt": "街上找不到垃圾桶时，先把垃圾收好带走，是合适的做法。", "answer": 0, "why": "公共垃圾桶可能较少，之后找到合适的垃圾桶再按分类处理。"}, {"id": "toilets", "prompt": "每一家便利店都必须免费向路人开放厕所。", "answer": 1, "why": "便利店不保证提供或开放厕所。可以先询问，也可查车站、商场或公厕地图。"}, {"id": "flush", "prompt": "日本厕所提供的厕纸通常可冲走，但湿巾和卫生用品不能照样冲进马桶。", "answer": 0, "why": "按照现场标识处理；冲水按钮与智能坐便器的清洗按钮也要分清。"}, {"id": "queue", "prompt": "看到收银柜台暂时没人，就可以绕过统一排队队伍直接付款。", "answer": 1, "why": "先看排队线，可能需要在同一队伍等候空闲柜台。"}, {"id": "photos", "prompt": "只要用的是手机，就不用遵守店铺或场馆的禁止拍摄标识。", "answer": 1, "why": "禁拍要求不会因为使用手机就失效；拍人物也应注意征求同意。"}, {"id": "water", "prompt": "餐厅默认给冰水时，可以礼貌地询问能否提供不加冰的水或热水。", "answer": 0, "why": "说明需求即可，能否提供由店铺实际情况决定。"}, {"id": "seat", "prompt": "餐厅里有一张空桌，就一定可以直接坐过去。", "answer": 1, "why": "空桌可能是预约席或尚未整理好，先等接待安排或确认能否入座。"}, {"id": "bill", "prompt": "日本餐厅的结账流程不同，有些在收银台结账，也有先付款的店。", "answer": 0, "why": "看入口和收银标识，不清楚时直接询问结账方式。"}, {"id": "tip", "prompt": "在一般餐厅或出租车，通常不用在账单之外额外付小费。", "answer": 0, "why": "没有必须付小费的惯例，不代表账单上列明的服务费可以不付。"}, {"id": "otoshi", "prompt": "没主动点的入座小菜，一定是免费赠送的。", "answer": 1, "why": "部分居酒屋的お通し通常收费。可在入座或点单前确认金额和能否不接受。"}, {"id": "takeaway", "prompt": "买了外带食品，就可以在任何商店的座位上吃。", "answer": 1, "why": "外带不代表可使用其他店铺座位。是否能在店内吃，应先确认。"}, {"id": "payment", "prompt": "去日本旅行，只带一种手机支付工具就能保证到处付款。", "answer": 1, "why": "不同店铺的支付范围不同，适量现金与可用银行卡能作为备选。"}, {"id": "mobile", "prompt": "店里有二维码，就表示一定支持微信支付和支付宝。", "answer": 1, "why": "不同支付工具互不等同，看具体标识并在消费前确认。"}, {"id": "tax", "prompt": "看到“税込”表示含税，但仍需要留意是否另有服务费或座位费说明。", "answer": 0, "why": "税与其他收费项目不同，确认最终金额最清楚。"}, {"id": "bags", "prompt": "需要购物袋或餐具时，可以主动向店员说明数量。", "answer": 0, "why": "袋子可能收费，餐具提供方式也因店铺而异，主动确认即可。"}, {"id": "shoes", "prompt": "进入日本任何室内场所，都必须脱鞋。", "answer": 1, "why": "住宅、部分旅馆或榻榻米场所常需要脱鞋，普通商场等并非如此。看门口提示。"}, {"id": "bath", "prompt": "进入公共浴池前，通常应先清洗身体并冲净泡沫。", "answer": 0, "why": "浴池主要用来泡浴，不是洗头搓澡的地方；具体使用规则看设施说明。"}];

/* ===================================================================
   数据驱动剧情引擎（V17）
   负责播放 story/ 文件夹里的 JSON 剧情：
     story/npcs/*.json       剧情 NPC（什么章节、白天/夜晚出现在哪里、说哪几段对话）

   存档里新增的字段：campaign.storyFlags（剧情标记）、campaign.npcTalks（每个 NPC 说到第几段）
   旧存档没有这两个字段时会自动补上，不影响旧进度。
   =================================================================== */
const STORY_DB=(function(){
 const raw=(window.GAME_DATA&&GAME_DATA.story)||{};
 const bgKeys=Object.keys((window.GAME_DATA&&GAME_DATA.backgrounds)||{});
 const result=window.StoryCheck?StoryCheck.check({npcs:raw.npcs||[],dialogues:raw.dialogues||[],chapters:raw.chapters||[],chapterCount:STORY.length,backgrounds:bgKeys}):{errors:['剧情检查器没有加载'],warnings:[],nodes:{},npcs:[],chapters:[]};
 if(result.errors.length){
  (window.__GAME_LOAD_ERRORS=window.__GAME_LOAD_ERRORS||[]).push.apply(window.__GAME_LOAD_ERRORS,result.errors.map(e=>'剧情数据错误：'+e));
  // 有错误的 NPC / 章节不会出现，避免卡关；其余剧情照常运行
 }
 const badFiles=new Set(result.errors.map(e=>(e.match(/^【(.+?)】/)||[])[1]).filter(Boolean));
 return {
  nodes:result.nodes,
  npcs:result.npcs.filter(p=>!badFiles.has(findFile(raw.npcs,p))),
  chapters:result.chapters.filter(c=>!badFiles.has(findFile(raw.chapters,c))),
  errors:result.errors,warnings:result.warnings

})();

function storyWhen(w){

 const ch=currentChapterNo(),flags=campaign.storyFlags,L=StoryCheck.asList;
 if(w.chapter!=null&&ch!==w.chapter)return false;
 if(w.chapterMin!=null&&ch<w.chapterMin)return false;
 if(w.chapterMax!=null&&ch>w.chapterMax)return false;
 if(w.dayMin!=null&&campaign.day<w.dayMin)return false;
 if(w.dayMax!=null&&campaign.day>w.dayMax)return false;
 if(w.phase!=null&&StoryCheck.phaseId(w.phase)!==currentPhase())return false;
 if(L(w.flag).some(f=>!flags[f]))return false;
 if(L(w.notFlag).some(f=>flags[f]))return false;

}

function storyApply(e){
 if(!e||!campaign)return '';storyStateInit();const out=[],L=StoryCheck.asList,P=GAME_CONFIG.player;
 if(e.hp){campaign.hp=Math.max(0,Math.min(P.maxHP,campaign.hp+e.hp));out.push('❤️ HP '+(e.hp>0?'+':'')+e.hp)}
 if(e.cash){campaign.cash=Math.max(0,campaign.cash+e.cash);out.push('💴 '+(e.cash>0?'+':'')+e.cash+'円')}
 if(e.stress){campaign.stress=Math.max(0,Math.min(P.maxStress,campaign.stress+e.stress));out.push('🧠 压力 '+(e.stress>0?'+':'')+e.stress)}
 if(e.action){dayDefaults();campaign.actions=Math.max(0,Math.min(GAME_CONFIG.day.actionsPerDay,campaign.actions+e.action));out.push('⏳ 行动点 '+(e.action>0?'+':'')+e.action)}

 L(e.clue).forEach(c=>{campaign.storyClues??=[];if(!campaign.storyClues.includes(c)){campaign.storyClues.push(c);out.push('🔎 获得线索：'+c)}});

/* ===================================================================
   【V18 基础模块：GameState 游戏状态 · TimeManager 时间 · SaveManager 存档】
   - GameState：所有资源增减都经过这里，自动限制上下限，并通知界面刷新
   - TimeManager：根据「今天已用掉的行动次数」推算现在几点（与实际状态一致）；
                  在酒店调查时改用酒店的夜间时钟
   - SaveManager：导出/导入存档、开新游戏、旧存档迁移
   时间参数在 config/game.json 的 time 部分。
   =================================================================== */
const GS=(function(){
 const listeners=[];
 function emit(){listeners.forEach(fn=>{try{fn()}catch(e){console.error(e)}})}
 function on(fn){listeners.push(fn)}
 /* 资源变化：正数增加、负数减少。SAN 走 sanAdjust（会处理理智归零结局）。返回给玩家看的说明 */
 function change(d,reason){
  if(!campaign||!d)return '';const P=GAME_CONFIG.player,out=[];
  if(d.hp){campaign.hp=Math.max(0,Math.min(P.maxHP,campaign.hp+d.hp));out.push('HP '+(d.hp>0?'+':'')+d.hp)}
  if(d.cash){campaign.cash=Math.max(0,campaign.cash+d.cash);out.push('¥'+(d.cash>0?'+':'')+d.cash.toLocaleString('ja-JP'))}
  if(d.stress){campaign.stress=Math.max(0,Math.min(P.maxStress,campaign.stress+d.stress));out.push('压力 '+(d.stress>0?'+':'')+d.stress)}
  campaignSave();
  if(d.san){sanAdjust(d.san,reason||'');out.push('SAN '+(d.san>0?'+':'')+d.san)}
  return out.join(' · ');
 }
 function dead(){return !!campaign&&(campaign.hp<=0||campaign.san<=0||campaign.cash<=0||campaign.stress>=GAME_CONFIG.player.maxStress)}
 return {on,emit,change,dead};
})();
/* 任何一次存档都会刷新状态栏，保证显示的数值与实际一致 */
const gsSaveBase=campaignSave;
campaignSave=function(){gsSaveBase();GS.emit()};

const TM=(function(){
 const pad=n=>String(n).padStart(2,'0');
 function fmt(min){min=((Math.round(min)%1440)+1440)%1440;return pad(Math.floor(min/60))+':'+pad(min%60)}
 /* 白天时钟：起床时间 + 已用行动 × 每次行动的小时数 */
 function dayClock(){
  if(!campaign)return null;dayDefaults();const T=GAME_CONFIG.time,used=Math.max(0,GAME_CONFIG.day.actionsPerDay-campaign.actions);
  if(campaign.day===1&&!campaign.firstDayComplete)return T.day1ArrivalHour*60+(campaign.firstDayStep||0)*T.day1StepMinutes; // 第一天：落地 → 买票 → 乘车 → 入住
  return T.dayStartHour*60+used*T.hoursPerAction*60;
 }
 let override=null,overrideLabel=null; // 酒店等场景提供自己的时钟（分钟，从 0:00 起算，可超过 24:00）和时段名称
 function setOverride(fn,labelFn){override=fn;overrideLabel=fn?labelFn||null:null}
 function now(){if(override){const v=override();if(v!=null)return v}return dayClock()}
 function label(min){if(override&&overrideLabel){const t=overrideLabel();if(t)return t}if(min==null)return '';const h=Math.floor((min%1440)/60);return h<5?'凌晨':h<11?'早晨':h<16?'白天':h<19?'傍晚':h<22?'夜晚':'深夜'}
 return {fmt,dayClock,now,label,setOverride};
})();

const SM=(function(){
 const KEYS=k=>/^(tokyo-|japan-travel-learning)/.test(k);
 function snapshot(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(KEYS(k))o[k]=localStorage.getItem(k)}return {game:'evil-tokyo',version:GAME_CONFIG.meta.version,saved:new Date().toISOString(),data:o}}
 function exportText(){return JSON.stringify(snapshot())}
 function importText(text){
  let obj;try{obj=JSON.parse(text)}catch(e){return '存档内容不是有效的文字格式，请完整复制。'}
  if(!obj||obj.game!=='evil-tokyo'||!obj.data)return '这不是《极恶东京》的存档。';
  Object.keys(obj.data).forEach(k=>{if(KEYS(k))localStorage.setItem(k,obj.data[k])});
  return '';
 }
 function newGame(){if(window.H18&&H18.active())H18.stop();try{localStorage.removeItem(campaignKey)}catch(e){}campaign=null;setupCampaign()}

 /* ---------- 存档栏位（手动存档 / 读档） ----------
    每个栏位保存一份完整的生存进度（包括第一章调查、背包、剧情标记）。
    日语学习记录是全局的，不跟着栏位走。栏位数量：config/game.json 的 save.slots */
 const SLOT='tokyo-save-slot-';
 function slotCount(){return (GAME_CONFIG.save&&GAME_CONFIG.save.slots)||3}
 function chapterName(c){const i=c.storyIndex||0;if(!c.firstDayComplete)return c.route20&&c.birth!=='narita'?'第一章 · 入境之夜':'第一天';const ch=STORY[i];return ch?String(ch.title).split('｜')[0]:'主线完成'}
 function summary(c){const loc=c.location||(c.firstDayComplete?'shinagawa':c.birth);return {day:c.day,days:c.days,mode:c.mode,chapter:chapterName(c),hp:c.hp,san:c.san,cash:c.cash,place:(byId[loc]&&byId[loc].jp)||'',who:c.gender+' · '+c.origin}}
 function readSlot(n){try{const r=JSON.parse(localStorage.getItem(SLOT+n)||'null');return r&&r.campaign?r:null}catch(e){return null}}
 function slots(){const out=[];for(let i=1;i<=slotCount();i++)out.push(readSlot(i));return out}
 function saveSlot(n,label){
  if(!campaign)return false;if(window.H18&&H18.active())campaignSave();
  const rec={saved:new Date().toISOString(),version:GAME_CONFIG.meta.version,label:label||'',summary:summary(campaign),campaign:JSON.parse(JSON.stringify(campaign))};
  try{localStorage.setItem(SLOT+n,JSON.stringify(rec));return true}catch(e){return false}
 }
 function loadSlot(n){
  const r=readSlot(n);if(!r)return false;
  if(window.H18&&H18.active())H18.stop();if(window.DM)DM.close();
  campaign=JSON.parse(JSON.stringify(r.campaign));campaignSave();
  sanAtmosphere();storyStateInit();dayDefaults();
  if(!campaign.firstDayComplete)firstDayQuest();else tokyoHome();
  return true;
 }
 function deleteSlot(n){try{localStorage.removeItem(SLOT+n)}catch(e){}}
 /* 用同一个角色设定（期限、性别、出身、入境机场）从第一天重新开始 */
 function freshCampaign(form){const mode=durations.find(x=>x.days===form.days)||durations[0];const P=GAME_CONFIG.player;
  return {days:mode.days,gender:form.gender,origin:form.origin,birth:form.birth,mode:mode.difficulty,day:1,hp:P.maxHP,cash:mode.cash,stress:P.startStress,san:P.maxSAN,clears:0,restDay:0,shrineDay:0,npcDay:0,potions:0}}
 function restartSame(){
  if(!campaign){setupCampaign();return}
  if(window.H18&&H18.active())H18.stop();if(window.DM)DM.close();
  campaign=freshCampaign(campaign);campaignSave();sanAtmosphere();
  firstDayQuest();
 }
 return {exportText,importText,newGame,slots,saveSlot,loadSlot,deleteSlot,readSlot,restartSame,slotCount,summary};
})();
/* ==== engine/survival/83-dialogue.js ==== */
/* ===================================================================
   【V18 DialogueManager 对话框 + 剧情脚本播放器】
   DM（对话框）：人物姓名、日语台词（🔊）、逐字显示、选项、键盘 1-9 选择、空格跳过逐字。
   SR（脚本播放器）：读取 JSON 剧情节点，处理出现条件、资源变化、选项、日语题、出示证据、
                    NPC 话题菜单（hub）与返回。具体的条件/效果由调用方（章节）提供。
   剧情内容都在 story/ 文件夹的 JSON 里，这个文件只负责「怎么播放」。
   =================================================================== */
const SETTINGS=(function(){
 const KEY='tokyo-settings-v1',DEF={textSpeed:'normal',anomalies:true,fontSize:'normal'};
 let s=Object.assign({},DEF);try{Object.assign(s,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
 function set(k,v){s[k]=v;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}apply()}
 function apply(){document.body.dataset.fontsize=s.fontSize}
 apply();
 return {get:k=>s[k],set,apply};
})();
const TEXT_SPEED={slow:42,normal:20,fast:7,instant:0};

const DM=(function(){
 let cur=null; // 当前打开的对话 {host,box,timer,full,choices,done}
 function close(){if(cur){clearInterval(cur.timer);if(cur.box&&cur.box.parentNode)cur.box.hidden=true}cur=null}
 function finishTyping(){if(!cur||cur.done)return;clearInterval(cur.timer);cur.textEl.textContent=cur.full;cur.done=true;cur.box.classList.remove('typing');cur.choicesEl.hidden=false;focusFirst()}
 function focusFirst(){const b=cur&&cur.choicesEl.querySelector('button:not([disabled])');if(b)b.focus({preventScroll:true})}
 /* opts: {who, sub, jp, text, choices:[{t,fn,disabled,note}], tone:'ok'|'ng'|'rule'|'', result} */
 function show(host,opts){
  if(!host)return;close();
  (window.__advLog=window.__advLog||[]).push([opts.who||'',opts.jp||'',opts.text||''].join(' '));if(window.__advLog.length>400)window.__advLog.shift(); // 测试用：记录显示过的对话
  const box=host;box.hidden=false;box.classList.add('adv-box');
  const ch=(opts.choices&&opts.choices.length)?opts.choices:[{t:'▶ 继续',fn:opts.next||close}];
  box.className='adv-box'+(opts.tone?' adv-'+opts.tone:'');
  box.classList.toggle('has-portrait',!!opts.portrait);
  box.innerHTML=(opts.portrait?`<div class="adv-top"><img class="adv-portrait" src="${opts.portrait}" alt=""><div class="adv-main">`:'')+(opts.who?`<div class="adv-name"><b>${esc(opts.who)}</b>${opts.sub?`<small>${esc(opts.sub)}</small>`:''}</div>`:'')+
   (opts.jp?`<div class="adv-jp" lang="ja">「${esc(opts.jp)}」<button class="spkbtn adv-say" type="button" aria-label="听读音">🔊</button></div>`:'')+
   `<p class="adv-text"></p>`+(opts.result?`<div class="adv-result">${esc(opts.result)}</div>`:'')+(opts.portrait?'</div></div>':'')+
   `<div class="adv-choices" hidden>${ch.map((c,i)=>`<button type="button" class="adv-choice${c.primary?' primary':''}" data-i="${i}"${c.disabled?' disabled':''}><span class="adv-key">${ch.length>1?i+1:'▶'}</span><span>${esc(c.t.replace(/^▶\s*/,''))}${c.note?`<small>${esc(c.note)}</small>`:''}</span></button>`).join('')}</div>`;
  const textEl=box.querySelector('.adv-text'),choicesEl=box.querySelector('.adv-choices');
  const full=String(opts.text||'');
  cur={host,box,textEl,choicesEl,full,done:false,timer:0,choices:ch};
  const say=box.querySelector('.adv-say');if(say)say.onclick=e=>{e.stopPropagation();if(typeof window.say==='function')window.say(opts.jp)};
  choicesEl.querySelectorAll('.adv-choice').forEach(b=>b.onclick=e=>{e.stopPropagation();const c=ch[+b.dataset.i];if(!c||c.disabled)return;close();if(c.fn)c.fn();});
  textEl.onclick=()=>finishTyping();box.onclick=e=>{if(!cur||cur.done)return;if(e.target.closest('.adv-choice'))return;finishTyping()};
  try{const r=box.getBoundingClientRect();if(r.top<70||r.top>window.innerHeight-160)box.scrollIntoView({block:'nearest'})}catch(e){} // 对话框不在视野里时滚动过去
  const ms=TEXT_SPEED[SETTINGS.get('textSpeed')]??20;
  if(!ms||!full){textEl.textContent=full;cur.done=true;choicesEl.hidden=false;focusFirst();return}
  box.classList.add('typing');let i=0;
  cur.timer=setInterval(()=>{if(!cur||cur.textEl!==textEl){return}i+=Math.max(1,Math.round(16/ms));if(window.AUDIO&&full[i]&&full[i].trim())AUDIO.sfx('type');textEl.textContent=full.slice(0,i);if(i>=full.length)finishTyping()},ms);
 }
 function isOpen(){return !!cur}
 /* 键盘：数字选项、空格/Enter 跳过逐字或选择唯一选项 */
 document.addEventListener('keydown',e=>{
  if(!cur||!document.body.contains(cur.box)||cur.box.hidden)return;
  if(/input|textarea|select/i.test((e.target&&e.target.tagName)||''))return;
  if(e.key===' '||e.key==='Enter'){
   if(!cur.done){e.preventDefault();e.stopImmediatePropagation();finishTyping();return}
   if(document.activeElement&&document.activeElement.classList.contains('adv-choice'))return;
   const btns=cur.choicesEl.querySelectorAll('.adv-choice:not([disabled])');if(btns.length===1){e.preventDefault();e.stopImmediatePropagation();btns[0].click()}return;
  }
  const n=+e.key;if(n>=1&&n<=9){const b=cur.choicesEl.querySelectorAll('.adv-choice')[n-1];if(b&&!b.disabled){e.preventDefault();e.stopImmediatePropagation();if(!cur.done)finishTyping();b.click()}}
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation()}
  if(['w','a','s','d','W','A','S','D'].includes(e.key))e.stopImmediatePropagation();
 },true);
 return {show,close,isOpen,finishTyping,current:()=>cur};
})();

/* ---------- 剧情脚本播放器 ----------
   ctx 由使用方提供：
   nodes        剧情节点表 {id:node}
   host()       对话框所在的元素
   cond(when)   判断条件
   apply(eff)   执行资源变化，返回说明文字
   pick(v)      处理「按时间段不同」的文字 {evening:..,night:..}
   onEnd()      对话结束
   jpPenalty    日语答错扣多少 HP
   evidence()   可出示的证据 [{id,name}]
   call(name)   执行内置动作（例如 decide / journal）
   tauntScene   路人吐槽使用的场景
   listenFailNote(node)  「听懂判定」没听懂时显示的说明（可选）
   showHint(node)        没听懂时是否显示关键词提示（可选，不写就总是显示）
*/
const SR=(function(){
 function run(id,ctx,hub){
  const node=ctx.nodes[id];
  if(!node){finish(ctx,hub);return}
  if(node.gate&&ctx.cond(node.gate.when)){run(node.gate.node,ctx,hub);return}
  if(node.when&&!ctx.cond(node.when)){if(node.else)run(node.else,ctx,hub);else finish(ctx,hub);return}
  if(node.goto){run(node.goto,ctx,hub);return}
  if(ctx.onNode)ctx.onNode(node);
  if(node.sfx&&window.AUDIO)AUDIO.sfx(node.sfx); // 剧情里写 "sfx" 就播放音效
  if(node.type==='hub')hub=node.id;
  if(node.onceFlag&&ctx.cond({flag:node.onceFlag})&&node.after){run(node.after,ctx,hub);return}
  const carry=ctx.carry||'';ctx.carry='';
  const eff=node.effects&&node.type!=='listen'?ctx.apply(node.effects,node):''; // listen 类型只有听懂了才生效
  const result=[carry,eff].filter(Boolean).join(' · ');
  const pages=toPages(node,ctx);
  const showPage=i=>{
   const p=pages[i],last=i===pages.length-1;
   if(!last){DM.show(ctx.host(),Object.assign({},p,{result:i===0?result:'',choices:[{t:'▶ 继续',fn:()=>showPage(i+1)}]}));return}
   if(node.type==='jp'){jp(node,ctx,hub,Object.assign({},p,{result:pages.length===1?result:''}));return}
   if(node.type==='present'){present(node,ctx,hub,p);return}
   if(node.type==='listen'){listen(node,ctx,hub,Object.assign({},p,{result:pages.length===1?result:''}));return}
   DM.show(ctx.host(),Object.assign({},p,{result:pages.length===1?result:'',choices:choicesFor(node,ctx,hub)}));
  };
  showPage(0);
 }
 function toPages(node,ctx){
  const who=ctx.pick(node.who||node.speaker||''),sub=node.sub?ctx.pick(node.sub):(ctx.subFor?ctx.subFor(node):'');
  const pf=w=>ctx.portraitFor?ctx.portraitFor(node,w):'';
  if(node.type==='listen'){const pre=Array.isArray(node.lines)?node.lines.map(l=>typeof l==='string'?{who:'',text:ctx.pick(l)}:{who:ctx.pick(l.who||who),sub:l.who?'':sub,jp:ctx.pick(l.jp||''),text:ctx.pick(l.zh||l.text||''),portrait:pf(ctx.pick(l.who||who))}):[];return pre.concat([{who,sub,jp:ctx.pick(node.jp||''),text:ctx.pick(node.question||'对方说的是什么意思？'),portrait:pf(who)}])}
  if(Array.isArray(node.lines)&&node.lines.length)return node.lines.map(l=>typeof l==='string'?{who:'',text:ctx.pick(l)}:{who:ctx.pick(l.who||who),sub:l.who?'':sub,jp:ctx.pick(l.jp||''),text:ctx.pick(l.zh||l.text||''),portrait:pf(ctx.pick(l.who||who))});
  return [{who,sub,jp:ctx.pick(node.jp||''),text:ctx.pick(node.text||node.question||''),portrait:pf(who)}];
 }
 function onceKey(node,c){return '已选:'+node.id+':'+(c.id||c.text)}
 function choicesFor(node,ctx,hub){
  const list=[];
  (node.choices||[]).forEach(c=>{
   if(c.when&&!ctx.cond(c.when))return;
   if(c.once&&ctx.cond({flag:onceKey(node,c)}))return;
   const ok=(!c.need||ctx.cond(c.need))&&(!ctx.canChoose||ctx.canChoose(c));
   list.push({t:ctx.pick(c.text),disabled:!ok,note:!ok?(c.needText||'条件不足'):'',fn:()=>choose(node,c,ctx,hub)});
  });
  if(node.type==='hub')list.push({t:node.backText||'（结束对话）',fn:()=>finish(ctx,null)});
  if(!list.length){
   if(node.next)list.push({t:node.nextText||'▶ 继续',fn:()=>run(node.next,ctx,hub)});
   else if(node.call)list.push({t:node.callText||'▶ 继续',fn:()=>{finish(ctx,null,true);ctx.call(node.call)}});
   else list.push({t:hub&&!node.end?'▶ 继续':(node.endText||ctx.endText||'▶ 继续'),fn:()=>node.end?finish(ctx,null):finish(ctx,hub)});
  }
  return list;
 }
 function choose(node,c,ctx,hub){
  if(c.once)ctx.apply({flag:onceKey(node,c)},node,true);
  const t=c.effects?ctx.apply(c.effects,node):'';
  const go=()=>{
   if(c.call){finish(ctx,null,true);ctx.call(c.call);return}
   if(c.next){run(c.next,ctx,hub);return}
   if(c.end){finish(ctx,null);return}
   finish(ctx,hub);
  };
  if(t&&!c.next){DM.show(ctx.host(),{who:'',text:t,tone:'result',choices:[{t:'▶ 继续',fn:go}]});return}
  if(t&&c.next)ctx.carry=t;
  go();
 }
 function finish(ctx,hub,silent){
  if(hub&&ctx.nodes[hub]){run(hub,ctx,hub);return}
  DM.close();if(!silent&&ctx.onEnd)ctx.onEnd();
 }
 /* 选项顺序每次打乱（正确答案不会总在第一个） */
 function order(n){const a=[...Array(n).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
 function jp(node,ctx,hub,page){
  const opts=node.options||[];
  DM.show(ctx.host(),Object.assign({},page,{choices:order(opts.length).map(i=>({t:opts[i],fn:()=>{
   const ok=i===node.answer;
   if(ok&&window.NpcTaunts)NpcTaunts.onAnswer(true);if(window.AUDIO)AUDIO.sfx(ok?'ok':'ng');
   let tone='ok',who='✓ 听懂了',text=ctx.pick(node.explain||'');
   if(!ok){const hp=ctx.jpPenalty||GAME_CONFIG.wrongAnswer.chapter1Hp;GS.change({hp:-hp});if(ctx.onHurt)ctx.onHurt(hp);tone='ng';who='✕ 理解有误（HP -'+hp+'，SAN 不变）';text='正确意思：'+opts[node.answer]+'\n'+text}
   const after=()=>{if(GS.dead()){finish(ctx,null);return}if(node.next)run(node.next,ctx,hub);else finish(ctx,hub)};
   DM.show(ctx.host(),{who,text,tone,choices:[{t:'▶ 继续',fn:after}]});
   if(!ok&&window.NpcTaunts){const box=ctx.host();NpcTaunts.handle(false,ctx.tauntScene||'hotel',box,box.querySelector('.adv-text'))}
  }}))}));
 }
 /* 听懂才算数：只显示日语原文，选对意思才记下线索；没听懂扣 HP、线索不记下，之后可以「回想」重来 */
 function listen(node,ctx,hub,page){
  const opts=node.options||[];
  DM.show(ctx.host(),Object.assign({},page,{tone:'listen',choices:order(opts.length).map(i=>({t:opts[i],fn:()=>{
   const ok=i===node.answer;
   if(ok){
    if(window.NpcTaunts)NpcTaunts.onAnswer(true);
    const t=node.effects?ctx.apply(node.effects,node):'';if(ctx.onListen)ctx.onListen(node,true);if(window.AUDIO)AUDIO.sfx('ok');
    const text=[node.zh?ctx.pick(node.zh):'',node.explain?'📖 '+ctx.pick(node.explain):''].filter(Boolean).join('\n\n');
    DM.show(ctx.host(),{who:'✓ 听懂了',text,tone:'ok',result:t,choices:[{t:'▶ 继续',fn:()=>{if(node.next)run(node.next,ctx,hub);else finish(ctx,hub)}}]});
   }else{
    const hp=ctx.jpPenalty||GAME_CONFIG.wrongAnswer.chapter1Hp;GS.change({hp:-hp});if(ctx.onHurt)ctx.onHurt(hp);if(ctx.onListen)ctx.onListen(node,false);if(window.AUDIO)AUDIO.sfx('ng');
    const text=(node.failText?ctx.pick(node.failText)+'\n\n':'')+(node.hint&&(!ctx.showHint||ctx.showHint(node))?'💡 关键词：'+ctx.pick(node.hint)+'\n':'')+(ctx.listenFailNote?ctx.listenFailNote(node):'（你没听懂，这条线索没有记下来。之后可以在调查手帐里「回想」这句话再试一次。）');
    DM.show(ctx.host(),{who:'✕ 没听懂（HP -'+hp+'，SAN 不变）',text,tone:'ng',choices:[{t:'▶ 继续',fn:()=>{if(GS.dead()){finish(ctx,null);return}if(node.failNext)run(node.failNext,ctx,hub);else finish(ctx,hub)}}]});
    if(window.NpcTaunts){const box=ctx.host();NpcTaunts.handle(false,ctx.tauntScene||'hotel',box,box.querySelector('.adv-text'))}
   }
  }}))}));
 }
 function present(node,ctx,hub,page){
  const ev=ctx.evidence();
  const choices=ev.map(e=>({t:'出示：'+e.name,fn:()=>{const ok=(node.accept||[]).includes(e.id);if(ok&&node.next)run(node.next,ctx,hub);else if(!ok&&node.wrong)run(node.wrong,ctx,hub);else finish(ctx,hub)}}));
  choices.push({t:node.cancelText||'暂时不出示',fn:()=>{if(node.cancel)run(node.cancel,ctx,hub);else finish(ctx,hub)}});
  DM.show(ctx.host(),Object.assign({},page,{text:page.text+(ev.length?'':'\n（你手上还没有可以出示的证据。）'),choices,tone:'present'}));
 }
 return {run};
})();

const CH=C1.chapter||{},MAPS=C1.maps||{},NPCS=C1.npcs||{},EVID=C1.evidence||{},SCENES=C1.scenes||{};
const NODES={};(C1.nodes||[]).forEach(n=>NODES[n.id]=n);
const T=32,MW=16,MH=11,CW=T*MW,CHh=T*MH;
const END_CLOCK=720,START_HOUR=18;
const C1CFG=GAME_CONFIG.chapter1||{nights:3,timeScale:1,stuckMinutes:120};
const cost=min=>Math.round((min||0)*(C1CFG.timeScale||1)); // 调查、交谈、移动花费的时间（config 的 chapter1.timeScale 倍）
const PHASES=[{id:'evening',name:'傍晚',from:0},{id:'night',name:'深夜',from:180},{id:'late',name:'凌晨',from:360}];
const SOLID=new Set('#CSTPVNRBDULKXGOWQrEFAHY'.split(''));
const PLAYER_PAL={h:'#3b2f4a',s:'#f0c9a0',b:'#6fc2a6',a:'#f4d38d',p:'#3e5388',k:'#222'};

/* ---------- 状态与存档 ---------- */
let S=null,cv=null,ctx=null,raf=0,last=0,keys=new Set(),player=null,npcState={},tileCache={},ruleTimer=0,mode='pixel',sceneId=null,paused=false;
function H(){
 if(!campaign.hotelCase)campaign.hotelCase={visited:[],evidence:[],talks:{},trust:0,pressure:0,stance:'',ending:'',diary:[],scene:'lobby'};
 const h=campaign.hotelCase;h.visited??=[];h.evidence??=[];h.diary??=[];
 if(!h.v18){h.v18=migrateV15(h.v15);}
 const v=h.v18;
 v.map??='lobby';v.x??=8;v.y??=8;v.dir??='up';v.clock??=0;v.clockDay??=campaign.day;
 v.clues??=[];v.testimony??=[];v.flags??={};v.npc??={};v.intro??=false;v.visited??=[];if(v.intro&&!v.startDay)v.startDay=campaign.day; // 旧存档：从现在开始计算期限
 for(const id of Object.keys(NPCS)){v.npc[id]??={trust:0,stress:0,mem:{}};v.npc[id].mem??={}}
 for(const [k,c] of Object.entries(EVID))if(c.old&&h.evidence.includes(c.old)&&!v.clues.includes(k))v.clues.push(k);
 if(v.clockDay!==campaign.day){v.clockDay=campaign.day;v.clock=0;Object.keys(v.flags).filter(k=>k.startsWith('tonight:')).forEach(k=>delete v.flags[k])}
 if(!MAPS[v.map])v.map='lobby';
 campaign.items??={};
 return h;
}
/* 旧版（v15「最后一位东京访客」）存档迁移：线索、证词、人物关系、钥匙与物品全部保留 */
function migrateV15(o){
 const v={clues:[],testimony:[],flags:{},npc:{},visited:[]};if(!o)return v;
 v.map=MAPS[o.map]?o.map:'lobby';v.x=o.x;v.y=o.y;v.dir=o.dir;v.clock=o.clock;v.clockDay=o.clockDay;v.intro=!!o.intro;
 v.clues=(o.clues||[]).filter(k=>EVID[k]);
 v.testimony=(o.versions||[]).map(id=>'t_'+id).filter(t=>EVID[t]);
 const f=o.flags||{};
 ['storageOpen','tookOriginal','returned','threatened','phoneHanded','tookPhone','copied','knockAnswered'].forEach(k=>{if(f[k])v.flags[k]=true});
 if(f.readRules)v.flags.readRules=true;
 campaign.items??={};
 if(f.room207Key)campaign.items.key207=1;if(f.storageKey)campaign.items.storageKey=1;if(f.coffee>0)campaign.items.coffee=(campaign.items.coffee||0)+f.coffee;
 if(f.tookOriginal&&!f.returned)campaign.items.notebookOriginal=1;if(f.tookPhone)campaign.items.oldPhone=1;
 for(const [id,n] of Object.entries(o.npc||{}))if(NPCS[id])v.npc[id]={trust:n.trust||0,stress:n.stress||0,mem:Object.assign({},n.mem||{})};
 if(v.npc.kobayashi&&v.npc.kobayashi.mem.readRules)v.flags.readRules=true;
 if(o.map==='room207'){v.map='corridor';v.x=5;v.y=6;v.dir='down'} // 207 现在是文字调查场景，旧位置移到门口
 return v;
}
const V=()=>H().v18,F=()=>V().flags,N=id=>V().npc[id];
function clueCount(){return V().clues.length}
function phase(){const c=V().clock;return c>=360?'late':c>=180?'night':'evening'}
function phaseName(){return PHASES.find(p=>p.id===phase()).name}
function clockStr(){return TM.fmt(START_HOUR*60+V().clock)}
function save(){campaignSave()}
function log(t){const h=H();h.diary.push('DAY'+campaign.day+' '+clockStr()+' '+t);h.diary=h.diary.slice(-60);save()}
function item(id){return (campaign.items&&campaign.items[id])||0}
function addItem(id,n){campaign.items??={};campaign.items[id]=Math.max(0,(campaign.items[id]||0)+n);if(!campaign.items[id])delete campaign.items[id]}
function advance(min){if(!min||min<0)return;const v=V();const before=phase();v.clock=Math.min(END_CLOCK,v.clock+min);save();stuckCheck();if(v.clock>=600&&!F()['tonight:dawnWarn']&&v.clock<END_CLOCK){F()['tonight:dawnWarn']=true;toast('🌅 '+clockStr()+' · 天快亮了。'+(isLastNight()?'这是最后一夜——天亮后 207 就会重新开放。':''))}if(phase()!==before){placeNPCs(true);tileCache={};if(window.AUDIO)AUDIO.ambience(ambienceName());toast('⏰ '+clockStr()+' · 进入'+phaseName()+'，人们换了位置。')}if(v.clock>=END_CLOCK)setTimeout(dawn,60)}
function npcAt(id){const st=npcState[id];if(st&&st.on)return st.map;const def=NPCS[id];if(!def)return null;const sc=schedFor(id);return sc?sc.map:null}
function schedFor(id){const def=NPCS[id];let sc=def&&def.schedule&&def.schedule[phase()];if(sc&&sc.when&&!cond(sc.when))sc=null;return sc||null}
function npcName(id){const d=NPCS[id];if(!d)return id;for(const n of (d.names||[]))if(cond(n.when))return n.name;return d.name}
function rel(id){const n=N(id);return '信任 '+'♥'.repeat(n.trust)+'♡'.repeat(5-n.trust)+(n.stress?'　压力 '+'⚡'.repeat(n.stress):'')}

/* ---------- 条件与效果（剧情 JSON 使用的「语言」） ---------- */
const L=v=>v==null?[]:Array.isArray(v)?v:[v];
function cond(w){
 if(!w)return true;const v=V();
 if(w.any&&!w.any.some(cond))return false;
 if(w.all&&!w.all.every(cond))return false;
 if(w.not&&cond(w.not))return false;
 if(w.phase&&!L(w.phase).includes(phase()))return false;
 if(w.clockMin!=null&&v.clock<w.clockMin)return false;
 if(w.clockMax!=null&&v.clock>w.clockMax)return false;
 if(L(w.flag).some(f=>!v.flags[f]))return false;
 if(L(w.notFlag).some(f=>v.flags[f]))return false;
 if(L(w.clue).some(c=>!v.clues.includes(c)))return false;
 if(L(w.notClue).some(c=>v.clues.includes(c)))return false;
 if(w.anyClue&&!L(w.anyClue).some(c=>v.clues.includes(c)))return false;
 if(w.clueCount!=null&&v.clues.length<w.clueCount)return false;
 if(w.clueCountMax!=null&&v.clues.length>w.clueCountMax)return false;
 if(L(w.testimony).some(t=>!v.testimony.includes(t)))return false;
 if(L(w.notTestimony).some(t=>v.testimony.includes(t)))return false;
 if(w.testimonyCount!=null&&v.testimony.length<w.testimonyCount)return false;
 for(const [id,n] of Object.entries(w.trust||{}))if(N(id).trust<n)return false;
 for(const [id,n] of Object.entries(w.trustMax||{}))if(N(id).trust>n)return false;
 for(const [id,n] of Object.entries(w.npcStress||{}))if(N(id).stress<n)return false;
 for(const [id,n] of Object.entries(w.npcStressMax||{}))if(N(id).stress>n)return false;
 for(const [id,k] of Object.entries(w.mem||{}))if(L(k).some(x=>!N(id).mem[x]))return false;
 for(const [id,k] of Object.entries(w.notMem||{}))if(L(k).some(x=>N(id).mem[x]))return false;
 for(const [id,n] of Object.entries(w.item||{}))if(item(id)<n)return false;
 if(L(w.notItem).some(id=>item(id)>0))return false;
 for(const [id,m] of Object.entries(w.npcAt||{}))if(!L(m).includes(npcAt(id)))return false;
 for(const [id,m] of Object.entries(w.notNpcAt||{}))if(L(m).includes(npcAt(id)))return false;
 if(L(w.visited).some(m=>!v.visited.includes(m)))return false;
 if(L(w.notVisited).some(m=>v.visited.includes(m)))return false;
 if(w.cashMin!=null&&campaign.cash<w.cashMin)return false;
 if(w.prologue!=null){const pr=campaign.prologue;if(!pr)return false;if(L(w.prologue).some(k=>!(k==='done'?pr.done:(pr.clues||[]).includes(k)||(pr.flags||{})[k])))return false}
 if(w.sanMin!=null&&campaign.san<w.sanMin)return false;
 if(w.sanMax!=null&&campaign.san>w.sanMax)return false;
 return true;
}
function apply(e,node,silent){
 if(!e)return '';const v=V(),out=[];
 if(e.time)advance(cost(e.time));
 for(const [id,d] of Object.entries(e.trust||{})){const n=N(id);n.trust=Math.max(0,Math.min(5,n.trust+d));if(!silent&&d)out.push(npcName(id)+' 信任'+(d>0?'↑':'↓'))}
 for(const [id,d] of Object.entries(e.npcStress||{})){const n=N(id);n.stress=Math.max(0,Math.min(5,n.stress+d))}
 for(const [id,k] of Object.entries(e.mem||{}))L(k).forEach(x=>N(id).mem[x]=true);
 L(e.flag).forEach(f=>v.flags[f]=true);L(e.clearFlag).forEach(f=>delete v.flags[f]);
 for(const [id,d] of Object.entries(e.item||{})){addItem(id,d);const it=ITEMS.find(x=>x.id===id);if(!silent&&it)out.push((d>0?'获得 ':'失去 ')+it.icon+it.name)}
 L(e.testimony).forEach(t=>{if(!v.testimony.includes(t)&&EVID[t]){v.testimony.push(t);progress();log('证词：'+EVID[t].desc);out.push('🗣 记下证词');if(EVID.versions&&v.testimony.length>=3)gainClue('versions',out)}});
 L(e.clue).forEach(k=>gainClue(k,out));
 if(e.log)log(e.log);
 if(e.rule){campaign.ruleViolations=(campaign.ruleViolations||0)+1}
 const sanRule=e.sanRule?-Math.abs(GAME_CONFIG.sanRules[e.sanRule]||0):0;
 save();
 const res=GS.change({hp:e.hp,san:(e.san||0)+sanRule,cash:e.cash,stress:e.stress},e.rule?'违反了酒店的规则':'');if(res)out.push(res);
 if(e.glitch)L(e.glitch).forEach(g=>UI.glitch(g));
 if(e.toast)toast(e.toast);
 if(e.goto){changeMap(e.goto.map,e.goto.x,e.goto.y,e.goto.dir||'down')}
 refreshHUD();
 if(GS.dead())setTimeout(()=>{stop();survivalStatus()},900);
 return out.join(' · ');
}
function progress(){const v=V();v.lastProgress={day:campaign.day,clock:v.clock}}
function gainClue(k,out){const v=V(),h=H();if(!EVID[k]||EVID[k].kind==='testimony'||v.clues.includes(k))return;v.clues.push(k);progress();if(EVID[k].old&&!h.evidence.includes(EVID[k].old))h.evidence.push(EVID[k].old);log('🔎 获得证据：'+EVID[k].name);if(out)out.push('🔎 新证据：'+EVID[k].name);toast('🔎 新证据：'+EVID[k].name);save()}
function fill(t){if(typeof t!=='string')return t;return t.replace(/\{(\w+)\}/g,(m,k)=>({nightNo:nightNo(),nightsTotal:nightsTotal(),nightsLeft:Math.max(0,nightsTotal()-nightNo()),reopenDay:reopenDay(),clueCount:clueCount(),testimonyCount:V().testimony.length,time:clockStr(),day:campaign.day,phase:phaseName(),cash:campaign.cash})[k]??m)}
function pick(t){if(t&&typeof t==='object'&&!Array.isArray(t)){if(t.truth!=null&&F().truth)return fill(t.truth);return fill(t[phase()]??t.default??'')}return fill(t)}

/* ---------- 对话（使用通用剧情播放器） ---------- */
function host(){return document.getElementById(mode==='scene'?'h18-scene-dlg':'h18-dlg')}
function portraitFor(node,who){if(!who||!window.ART)return '';for(const [id,d] of Object.entries(NPCS)){const pats=d.portraitMatch||[d.name];if(pats.some(p=>who.includes(p))){const n=N(id);return ART.portrait(d.portrait,d.palette,{ghost:!!d.ghost,worried:n.stress>=3,sweat:n.stress>=4})}}return ''}
function scriptCtx(onEnd){return {nodes:NODES,host,cond,apply,pick,portraitFor,jpPenalty:GAME_CONFIG.wrongAnswer.chapter1Hp,tauntScene:'hotel',
 subFor:n=>n.npc?rel(n.npc):'',evidence:()=>V().clues.map(k=>({id:k,name:EVID[k].name})),call:builtin,onEnd:onEnd||endDialog,onListen:(n,ok)=>{if(ok){delete F()['unread:'+n.id];progress()}else F()['unread:'+n.id]=true;save()},onHurt:hp=>toast('❤️ HP -'+hp+'（日语理解错误）')}}
function play(id,onEnd){keys.clear();SR.run(id,scriptCtx(onEnd))}
function endDialog(){DM.close();refreshHUD();if(mode==='scene')renderScene();else if(cv)cv.focus({preventScroll:true});if(S&&V().clock>=END_CLOCK&&!H().ending)setTimeout(dawn,60)}
function builtin(name){({journal,decide,leave:leaveHotel,wait:()=>{advance(30);endDialog()},sleep:sleepUntilDawn,deduce,dawn:()=>dawn(true)}[name]||endDialog)()}
function toast(t){const el=document.getElementById('h18-toast');if(el){el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},3200)}else UI.toast(t)}

/* ---------- NPC 放置与巡逻 ---------- */
function placeNPCs(force){
 for(const id of Object.keys(NPCS)){
  const sc=schedFor(id),prev=npcState[id],ph=phase();
  if(!force&&prev&&prev.phase===ph&&prev.on===!!(sc&&MAPS[sc.map]))continue;
  npcState[id]=sc&&MAPS[sc.map]?{on:true,phase:ph,map:sc.map,x:sc.x,y:sc.y,px:sc.x*T,py:sc.y*T,dir:'down',patrol:sc.patrol||null,pi:0,wait:0,moving:false,fx:sc.x,fy:sc.y,t:0}:{on:false,phase:ph,map:sc?sc.map:null};
 }
}
function blockedFor(map,x,y,ignore){
 const m=MAPS[map];if(x<0||y<0||x>=MW||y>=MH)return true;
 if(SOLID.has(m.rows[y][x]))return true;
 for(const [id,st] of Object.entries(npcState))if(id!==ignore&&st.on&&st.map===map&&((st.x===x&&st.y===y)||(st.moving&&st.fx===x&&st.fy===y)))return true;
 return false;
}
function faceToward(a,b){const dx=b.x-a.x,dy=b.y-a.y;return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}
function stepNPCs(dt){
 if(DM.isOpen())return;
 for(const [id,st] of Object.entries(npcState)){
  if(!st.on)continue;
  if(st.moving){st.t+=dt/260;const k=Math.min(1,st.t);st.px=(st.fx+(st.x-st.fx)*k)*T;st.py=(st.fy+(st.y-st.fy)*k)*T;if(k>=1){st.moving=false;st.fx=st.x;st.fy=st.y}continue}
  if(!st.patrol)continue;
  if(V().map===st.map&&Math.abs(player.x-st.x)+Math.abs(player.y-st.y)<=1){st.dir=faceToward(st,player);st.wait=Math.max(st.wait,600);continue}
  st.wait-=dt;if(st.wait>0)continue;
  const [tx,ty]=st.patrol[st.pi];
  if(st.x===tx&&st.y===ty){st.pi=(st.pi+1)%st.patrol.length;st.wait=900+Math.random()*900;continue}
  const dx=Math.sign(tx-st.x),dy=dx?0:Math.sign(ty-st.y),nx=st.x+dx,ny=st.y+dy;
  const pBlock=V().map===st.map&&((player.x===nx&&player.y===ny)||(player.moving&&player.tx===nx&&player.ty===ny));
  if(pBlock||blockedFor(st.map,nx,ny,id)){st.wait=500;continue}
  st.dir=dx>0?'right':dx<0?'left':dy>0?'down':'up';st.fx=st.x;st.fy=st.y;st.x=nx;st.y=ny;st.moving=true;st.t=0;st.wait=350;
 }
}
/* ---------- 物件与交互 ---------- */
function objectAt(map,x,y){
 const m=MAPS[map],O=m.objects||{};
 for(const o of L(O[x+','+y]))if(cond(o.when))return o;
 const ch=m.rows[y]&&m.rows[y][x],gen=(m.generic||{})[ch];
 if(gen){const no=m.doors&&m.doors[x+','+y]||'',rep=t=>typeof t==='string'?t.split('{door}').join(no):t&&typeof t==='object'?Object.fromEntries(Object.entries(t).map(([k,x])=>[k,rep(x)])):t;return Object.assign({},gen,{label:rep(gen.label||''),text:rep(gen.text),door:no})}
 return null;
}
function anomalyTile(map,x,y){for(const a of (MAPS[map].anomalies||[]))if(a.x===x&&a.y===y&&cond(a.when))return a.tile;return null}
function useObject(o){
 if(o.time)advance(cost(o.time));
 if(o.node){play(o.node);return}
 if(o.text){DM.show(host(),{who:o.label,text:pick(o.text),choices:[{t:'▶ 继续',fn:endDialog}]});return}
}
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function target(){const [dx,dy]=DV[player.dir];return [player.x+dx,player.y+dy]}
function findInteractable(){
 const map=V().map,cands=[target()];for(const d of ['up','down','left','right']){const [dx,dy]=DV[d];cands.push([player.x+dx,player.y+dy])}
 for(const [x,y] of cands){
  for(const [id,st] of Object.entries(npcState))if(st.on&&st.map===map&&st.x===x&&st.y===y)return {kind:'npc',id,label:'与'+npcName(id)+'交谈',x,y};
  const o=objectAt(map,x,y);if(o)return {kind:'obj',o,label:'调查：'+fill(o.label),x,y};
 }
 return null;
}
function interact(){if(DM.isOpen()||!player||player.moving||mode!=='pixel')return;const it=findInteractable();if(!it)return;keys.clear();
 if(it.kind==='npc')talk(it.id);else useObject(it.o)}
function talk(id){const st=npcState[id];if(st&&player){st.dir=faceToward(st,player);player.dir=faceToward(player,st)}advance(cost(NPCS[id].talkTime??10));play(NPCS[id].talk)}

/* ---------- 地图切换、出入口与规则 ---------- */
function exitAt(map,x,y){return (MAPS[map].exits||[]).find(e=>e.x===x&&e.y===y)}
function arrive(){const v=V(),ex=exitAt(v.map,player.x,player.y);if(!ex)return;
 if(ex.leave){keys.clear();DM.show(host(),{who:'离开酒店？',text:'调查进度会自动保存。之后可以从「任务」或东京地图的主线入口回来继续。',choices:[{t:'离开，回到东京地图',fn:leaveHotel},{t:'留下继续调查',fn:()=>{stepBack(ex);endDialog()}}]});return}
 if(ex.scene){stepBack(ex);openScene(ex.scene);return}
 changeMap(ex.to,ex.sx,ex.sy,ex.dir);
}
function stepBack(ex){const b=DV[ex.back||'up'];player.x+=b[0];player.y+=b[1];player.px=player.x*T;player.py=player.y*T;player.tx=player.x;player.ty=player.y;const v=V();v.x=player.x;v.y=player.y;save()}
function changeMap(to,x,y,dir){if(!MAPS[to])return;const v=V(),h=H();v.map=to;v.x=x;v.y=y;v.dir=dir||'down';if(!v.visited.includes(to))v.visited.push(to);if(!h.visited.includes(to))h.visited.push(to);h.scene=to;
 if(player){player.x=x;player.y=y;player.px=x*T;player.py=y*T;player.tx=x;player.ty=y;player.dir=v.dir;player.moving=false}keys.clear();
 advance(cost(5));save();refreshHUD();toast('📍 '+MAPS[to].name);if(window.AUDIO){AUDIO.sfx('door');AUDIO.ambience(ambienceName())}checkRules('enter:'+to);
}
function checkRules(evt){
 for(const r of (CH.rules||[])){
  if(r.trigger!==evt)continue;if(F()['tonight:'+r.id])continue;if(!cond(r.when))continue;
  clearTimeout(ruleTimer);let tries=0;
  const fire=()=>{if(!S||F()['tonight:'+r.id]||!cond(r.when))return;
   if(r.trigger.startsWith('enter:')&&(mode!=='pixel'||V().map!==r.trigger.slice(6)))return;
   if(r.trigger.startsWith('scene:')&&(mode!=='scene'||sceneId!==r.trigger.slice(6)))return;
   if(DM.isOpen()||document.querySelector('.et-modal-back')){if(++tries<40)ruleTimer=setTimeout(fire,900);return} // 正在对话时，等对话结束再发生
   F()['tonight:'+r.id]=true;save();if(r.glitch)UI.glitch(r.glitch);play(r.node)};
  ruleTimer=setTimeout(fire,r.delay||1200);
 }
}
/* ---------- 文字调查场景（例如 207号室） ---------- */
function openScene(id){
 const sc=SCENES[id];if(!sc)return;
 if(sc.lock&&!cond(sc.lock.open)){play(sc.lock.node);return}
 mode='scene';sceneId=id;const v=V();if(!v.visited.includes(id)){v.visited.push(id)}
 if(sc.enterTime)advance(cost(sc.enterTime));save();
 UI.scene('investigate',()=>{start();openScene(id)});
 renderScene();
 if(sc.enterNode&&!F()['seen:'+id]){F()['seen:'+id]=true;save();play(sc.enterNode)}
 checkRules('scene:'+id);
}
function renderScene(){
 const sc=SCENES[sceneId];if(!sc)return;const stage=document.getElementById('h18-stage');if(!stage)return;
 stage.classList.add('h18-scene-mode');

function mustTotal(){return MUSTS.length-(P().mustSkipped||[]).length}

/* ---------- 条件与效果（剧情 JSON 使用的「语言」） ---------- */
function cond(w){
 if(!w)return true;const p=P();
 if(w.any&&!w.any.some(cond))return false;
 if(w.all&&!w.all.every(cond))return false;
 if(w.not&&cond(w.not))return false;
 if(L(w.flag).some(f=>!p.flags[f]))return false;
 if(L(w.notFlag).some(f=>p.flags[f]))return false;
 if(L(w.clue).some(c=>!p.clues.includes(c)))return false;
 if(L(w.notClue).some(c=>p.clues.includes(c)))return false;
 if(w.clueCount!=null&&p.clues.length<w.clueCount)return false;
 for(const [id,n] of Object.entries(w.item||{}))if(item(id)<n)return false;
 if(L(w.notItem).some(id=>item(id)>0))return false;
 if(w.cashMin!=null&&campaign.cash<=price(w.cashMin))return false;
 if(w.after!=null&&p.clock<hm(w.after))return false;
 if(w.before!=null&&p.clock>=hm(w.before))return false;
 if(L(w.visited).some(s=>!p.visited.includes(s)))return false;
 if(L(w.notVisited).some(s=>p.visited.includes(s)))return false;
 if(w.mustCount!=null&&p.musts.length<w.mustCount)return false;
 return true;
}
function advance(min){if(!min||min<0)return;const p=P();p.clock+=Math.round(min*(CFG.timeScale||1));save();hud()}
function gainClue(k,out){const p=P();if(!CL[k]||p.clues.includes(k))return;p.clues.push(k);log('线索 '+CL[k].no+'：'+CL[k].name);if(out)out.push('🔎 线索 '+CL[k].no+'/5：'+CL[k].name);toast('🔎 线索 '+CL[k].no+'/5：'+CL[k].name);if(window.AUDIO)AUDIO.sfx('clue')}
function apply(e,node,silent){
 if(!e)return '';const p=P(),out=[];
 if(e.time)advance(e.time);
 L(e.flag).forEach(f=>p.flags[f]=true);L(e.clearFlag).forEach(f=>delete p.flags[f]);
 for(const [id,d] of Object.entries(e.item||{})){addItem(id,d);const it=ITEMS.find(x=>x.id===id);if(!silent&&it)out.push((d>0?'获得 ':'失去 ')+it.icon+it.name)}
 L(e.clue).forEach(k=>gainClue(k,out));
 let cash=e.cash||0;if(e.pay)cash-=price(e.pay);
 const sanRule=e.sanRule?-Math.abs((GAME_CONFIG.sanRules||{})[e.sanRule]||0):0;
 save();
 const res=GS.change({hp:e.hp,san:(e.san||0)+sanRule,cash,stress:e.stress},sanRule?'接触了不该接触的东西':'');if(res)out.push(res);
 if(e.glitch)L(e.glitch).forEach(g=>UI.glitch(g));
 if(e.toast)toast(fill(e.toast));
 if(e.encounter)L(e.encounter).forEach(x=>queue.push({enc:x}));
 if(e.dest){p.dest=e.dest;p.at=e.dest}
 if(e.arrive)queue.push({arrive:true});
 if(e.goto)queue.push({goto:e.goto});
 if(e.fatal)queue.push({fatal:e.fatal});
 hud();
 return out.join(' · ');
}

 onListen:(n,ok)=>{const p=P();if(ok){p.unread=p.unread.filter(x=>x!==n.id);if(n.must&&!p.musts.includes(n.must)){p.musts.push(n.must);toast('📝 必答题 '+mustLabel())}}else{p.fails??={};p.fails[n.id]=(p.fails[n.id]||0)+1;if(!n.must&&!/^rm-mirror/.test(n.id)&&!p.unread.includes(n.id))p.unread.push(n.id)}save();hud()},

/* 对话结束后依次处理：失败结局 → 路人事件 → 播放下一段 → 切换场景 */
function next(){
 if(!rendered)return;
 if(GS.dead()){queue=[];deathCheck();return}
 const f=queue.find(q=>q.fatal);if(f){queue=[];fatal(f.fatal);return}
 const q=queue.shift();
 if(!q){renderScene();return}
 if(q.enc){if(!encounter(q.enc))next();return}
 if(q.node){play(q.node);return}
 if(q.goto){queue=[];enterScene(q.goto);return}
 if(q.arrive){arrive();return}
 if(q.call){builtin(q.call);return}
 next();
}

/* ---------- 随机路人事件（70% 偏见 / 30% 冷漠；反击 / 无视 / 求助） ---------- */
function encounter(spec){
 const p=P();let e=null;
 if(spec[0]==='#'){e=ENC.find(x=>x.id===spec.slice(1));if(e&&p.enc.includes(e.id))e=null}
 else{
  const force=spec.endsWith('!'),scene=spec.replace('!','');
  if(!force&&(Math.random()>=(CFG.encounterChance??0.35)||p.encCount>=(CFG.maxEncounters??4)))return false;
  const pool=ENC.filter(x=>(x.scenes||[]).includes(scene)&&!p.enc.includes(x.id));if(!pool.length)return false;
  const want=Math.random()<(CFG.prejudiceRatio??0.7)?'prejudice':'cold';let c=pool.filter(x=>x.kind===want);if(!c.length)c=pool;
  e=c[Math.floor(Math.random()*c.length)];
 }
 if(!e)return false;
 p.enc.push(e.id);p.encCount++;save();
 const pf=portraitFor(null,e.who);
 DM.show(host(),{who:e.who,sub:e.kind==='prejudice'?'路人 · 偏见':'路人 · 冷漠',jp:e.jp,text:fill([e.text,e.zh].filter(Boolean).join('\n')),portrait:pf,tone:'rule',choices:[
  {t:'🗣 反击（用日语回应）',fn:()=>fight(e)},
  {t:'🙈 无视',fn:()=>outcome(e,'ignore')},
  {t:'🙋 求助',fn:()=>outcome(e,'help')}]});
 return true;
}
function order(n){const a=[...Array(n).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fight(e){const f=e.fight||[];DM.show(host(),{who:'你想说……',text:'选一句日语回应对方。\n（得体而坚定的话最有用；失礼的话会让事情更糟。）',choices:order(f.length).map(i=>({t:'「'+f[i].jp+'」',fn:()=>outcome(e,f[i].kind,f[i])}))})}
function outcome(e,kind,line){
 const def=(D.encounterDefaults||{})[kind]||{},o=Object.assign({},def,e[kind]||{});
 const r=apply(o.effects||{},null);
 const head={good:'✓ 得体的回应',rude:'✕ 失礼了',wrong:'✕ 日语说错了（HP 减少，SAN 不变）',ignore:'🙈 无视',help:'🙋 求助'}[kind]||'';
 if(window.AUDIO)AUDIO.sfx(kind==='good'?'ok':kind==='wrong'||kind==='rude'?'ng':'page');
 log('路人：'+e.who+' → '+head);
 DM.show(host(),{who:head,text:(line?'你说：「'+line.jp+'」\n（'+line.zh+'）\n\n':'')+fill(o.text||''),result:r,tone:kind==='good'?'ok':kind==='wrong'||kind==='rude'?'ng':'',choices:[{t:'▶ 继续',fn:endDialog}]});
}

 }
