/* ==== ui/styles/60-theme.css ==== */
/* ===================================================================
   V18 统一视觉系统：深色日式都市恐怖 + 复古像素画面 + 现代文字 ADV
   颜色只在这里定义（--et-*），其他样式都引用这些变量。
   这个文件最后加载，会覆盖旧版各画面的配色，让所有画面保持一致。
   =================================================================== */
:root:root{
 --et-bg:#10141C;--et-card:#1C2634;--et-int:#334158;--et-text:#E8EBF0;--et-sub:#8D9BB0;--et-border:#354254;
 --et-danger:#E49A9A;--et-san:#B69CE8;--et-money:#D9BF7D;--et-accent:#D7A879;--et-ok:#9CCDB4;
 --et-card-2:#222e3f;--et-int-hover:#3c4c66;--et-radius:10px;--et-radius-s:7px;
 --et-font:"Hiragino Sans","Hiragino Kaku Gothic ProN","PingFang SC","Noto Sans CJK SC","Noto Sans JP","Microsoft YaHei",system-ui,sans-serif;
 --et-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
 /* 旧版变量映射到新配色（答题、学习等画面会自动跟着变） */
 --bg:var(--et-bg);--card:var(--et-card);--ink:var(--et-text);--sub:var(--et-sub);--line:var(--et-border);
 --ok:var(--et-ok);--okbg:#1d3530;--ng:var(--et-danger);--ngbg:#3a2228;--ac:var(--et-accent);--acink:#10141C;
 color-scheme:dark;
}
html[data-fontsize]{font-size:16px}
body.et{background:var(--et-bg) radial-gradient(ellipse at 50% -20%,#1d2433 0%,transparent 60%) fixed;color:var(--et-text);font-family:var(--et-font);-webkit-tap-highlight-color:transparent}
body[data-fontsize="large"]{font-size:18px}
body[data-fontsize="large"] .adv-text,body[data-fontsize="large"] .story-panel p{font-size:18px}
body.et main#app{max-width:760px;margin:0 auto;padding:calc(84px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}
body.et h1,body.et h2,body.et h3{color:var(--et-text);font-family:var(--et-font);letter-spacing:.02em}
body.et h2{font-size:18px;margin:4px 0 10px}
body.et .rpg-kicker,body.et .story-meta{font-family:var(--et-mono);font-size:11px;letter-spacing:.14em;color:var(--et-accent);text-transform:uppercase}
body.et .rpg-title{color:var(--et-text);text-shadow:none;font-weight:800;letter-spacing:.04em}
body.et .rpg-tiny,body.et .survival-tip,body.et .rpg-footnote,body.et small{color:var(--et-sub)}
body.et a{color:var(--et-accent)}

/* ---------- 顶部状态栏 ---------- */
.et-top{position:fixed;top:0;left:0;right:0;z-index:40;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:rgba(16,20,28,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--et-border);font-size:13px;line-height:1.5}
.et-top .et-row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.et-brand{font-weight:800;letter-spacing:.12em;color:var(--et-text)}
.et-sep{color:var(--et-border)}
.et-day{font-family:var(--et-mono);font-weight:700;color:var(--et-accent)}
.et-time{font-family:var(--et-mono);font-weight:700;color:var(--et-text)}
.et-phase{color:var(--et-sub);font-size:12px}
.et-loc{margin-left:auto;color:var(--et-sub);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.et-res{margin-top:3px!important;font-family:var(--et-mono);font-size:12.5px}
.et-res>span[class^="et-"]:not(.et-sep):not(.et-mini){position:relative;padding-bottom:3px}
.et-res i{position:absolute;left:0;bottom:0;height:2px;width:var(--w);border-radius:2px;background:currentColor;opacity:.7}
.et-hp{color:var(--et-danger)}.et-san{color:var(--et-san)}.et-cash{color:var(--et-money);font-weight:700}
.et-hp b,.et-san b{color:inherit;font-weight:800}
.et-mini{margin-left:auto;color:var(--et-sub);font-family:var(--et-font);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.et-low-hp .et-hp{animation:et-pulse 1.4s ease-in-out infinite}
@keyframes et-pulse{50%{opacity:.45}}
.et-glitch{color:var(--et-san)!important;animation:et-flick .18s steps(2) infinite}
@keyframes et-flick{50%{opacity:.2;transform:translateX(1px)}}
body.et-static .et-top,body.et-static .et-nav{animation:et-static .12s steps(3) infinite}
body.et-static main#app{filter:contrast(1.15) hue-rotate(-12deg)}
@keyframes et-static{0%{transform:translate(0,0);text-shadow:1px 0 #e49a9a,-1px 0 #8fc4ff}50%{transform:translate(-1px,1px);text-shadow:-2px 0 #e49a9a,2px 0 #8fc4ff}100%{transform:translate(1px,0)}}

/* ---------- 底部导航 ---------- */
.et-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px max(8px,calc((100% - 760px)/2)) calc(6px + env(safe-area-inset-bottom));background:rgba(16,20,28,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--et-border)}
.et-nav button{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;border-radius:var(--et-radius-s);color:var(--et-sub);padding:6px 2px;font:inherit;font-size:11.5px;cursor:pointer;min-height:48px;transition:background .15s,color .15s}

 background:var(--et-int);color:var(--et-text);border:1px solid var(--et-border);border-radius:var(--et-radius-s);box-shadow:none;font-family:inherit;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .05s,color .15s}

/* ---------- 第一章：像素探索 + 文字调查 ---------- */
.h18-panel{padding:12px!important}

.pro-fatal h1{color:var(--et-danger)}
.pro-retry{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.pro-finale{position:relative;min-height:calc(100vh - 140px);background:#000;color:var(--et-text);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;text-align:center;border-radius:var(--et-radius);overflow:hidden}
.pro-black{min-height:40vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.pro-line{margin:0;opacity:0;font-size:22px;letter-spacing:.08em;animation:proIn 1.6s ease forwards}
.pro-line.pro-l0{font-size:26px;color:#e8ebf0;text-shadow:0 0 12px rgba(200,220,255,.35);animation-delay:.8s}
.pro-line.pro-l1{font-size:16px;color:var(--et-sub);animation-delay:3s}
.pro-end{opacity:0;animation:proIn 1.4s ease 5.2s forwards;max-width:560px}
.pro-end h1{font-size:24px;margin:6px 0}.pro-end h2{font-size:15px;color:var(--et-sub);font-weight:400;margin:0 0 14px}
.pro-end p{line-height:1.8;text-align:left}
.pro-sum{background:var(--et-card);border:1px solid var(--et-border);border-radius:var(--et-radius-s);padding:10px 14px;margin:14px 0;text-align:left;font-size:13px}
.pro-sum ul{list-style:none;padding:0;margin:8px 0 0}.pro-sum li{color:var(--et-sub);padding:2px 0}.pro-sum li.got{color:var(--et-text)}
@keyframes proIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pro-line,.pro-end{animation-duration:.01s;animation-delay:0s}}
.pro-exit-wrap{display:inline-flex;flex-direction:column;gap:3px}
.pro-need{color:var(--et-money);font-size:12px;line-height:1.4}
body.pro-black-screen{background:#000}
body.pro-black-screen #et-top,body.pro-black-screen #et-nav{opacity:0;pointer-events:none;transition:opacity .6s}
#et-top,#et-nav{transition:opacity .8s}
@media (max-width:480px){.pro-line.pro-l0{font-size:21px}}

"s":"conv","t":"r","q":"你说要拿铁，店员询问杯型。这句话是什么意思？","o":["您要什么尺寸？","结账后先打开杯盖，再把杯子放进机器。","请用这台机器接饮品。"],"a":0,"e":"「サイズ」是尺寸。可以照菜单说Mサイズ，也可以指着杯型；不要把尺寸字母与热饮冷饮混淆。","d":["这与原句意思不同；原句是“您要什么尺寸？”。","这与原句意思不同；原句是“您要什么尺寸？”。"],"explain":{"text":"「サイズ」是尺寸。可以照菜单说Mサイズ，也可以指着杯型；不要把尺寸字母与热饮冷饮混淆。","examples":[["サイズはいかがなさいますか？","您要什么尺寸？","现场会用到"],["M(エム)サイズでお願いします(おねがいします)。","请给我M号。","还可以这样说"]]},"j":"サイズはいかがなさいますか？"},{"uid":"conv-products-v1:machine","s":"conv","t":"r","q":"付款后店员把杯子交给你并说明。这句话是什么意思？","o":["请用这台机器接饮品。","请扫描条形码。","结账后先打开杯盖，再把杯子放进机器。"],"a":0,"e":"「マシン」指机器，「入れる」在这里是把饮品注入杯中。按购买的饮品、冷热和尺寸操作，不熟悉时可以求助。","d":["这与原句意思不同；原句是“请用这台机器接饮品。”。","这与原句意思不同；原句是“请用这台机器接饮品。”。"],"explain":{"text":"「マシン」指机器，「入れる」在这里是把饮品注入杯中。按购买的饮品、冷热和尺寸操作，不熟悉时可以求助。","examples":[["こちらのマシンでお入れ(いれ)ください。","请用这台机器接饮品。","现场会用到"],["使い方(つかいかた)を教えて(おしえて)もらえますか？","可以教我怎么用吗？","还可以这样说"]],"source":["全家：咖啡购买与制作说明","https://www.family.co.jp/campaign/spot/famimacafe_make.html"]},"j":"こちらのマシンでお入れ(いれ)ください。"},{"uid":"conv-products-v1:button","s":"conv","t":"s","q":"你已买好咖啡，但看不懂机器按钮。","o":["どのボタンを押せば(おせば)いいですか？","ホットコーヒーのS(エス)を一つ(ひとつ)お願いします(おねがいします)。","ふたはどこですか？"],"a":0,"e":"「押す」是按按钮。可以出示杯子或小票，让店员知道买的是哪种饮品和尺寸，再询问。","d":["这句是在说：“请给我一杯S号热咖啡。”","这句是在说：“杯盖在哪里？”"],"explain":{"text":"「押す」是按按钮。可以出示杯子或小票，让店员知道买的是哪种饮品和尺寸，再询问。","examples":[["どのボタンを押せば(おせば)いいですか？","应该按哪个按钮？","现场会用到"],["このカップで合って(あって)いますか？","用这个杯子对吗？","还可以这样说"]]}},{"uid":"conv-products-v1:lid","s":"conv","t":"s","q":"接好咖啡后，你找不到杯盖。","o":["ふたはどこですか？","アイスコーヒーのカップはどこですか？","ガムシロップはありますか？"],"a":0,"e":"「ふた」是盖子，ストロー是吸管。杯盖、搅拌棒等通常放在设备附近，但具体位置可以直接问店员。","d":["这句是在说：“冰咖啡杯在哪里？”","这句是在说：“有液体糖浆吗？”"],"explain":{"text":"「ふた」是盖子，ストロー是吸管。杯盖、搅拌棒等通常放在设备附近，但具体位置可以直接问店员。","examples":[["ふたはどこですか？","杯盖在哪里？","现场会用到"],["ストローはありますか？","有吸管吗？","还可以这样说"]]}},{"uid":"conv-products-v1:syrup","s":"conv","t":"s","q":"你想给冰咖啡加甜味，询问糖浆。","o":["ガムシロップはありますか？","アイスカフェラテを一つ(ひとつ)お願いします(おねがいします)。","砂糖(さとう)もミルクもいりません。"],"a":0,"e":"ガムシロップ是饮品用糖浆，常用于冷饮；不是口香糖。砂糖是砂糖，奶精则常标作ミルク或コーヒーフレッシュ。","d":["这句是在说：“请给我一杯冰拿铁。”","这句是在说：“糖和奶都不用。”"]," いします)。","请给我一杯冰红茶。","现场会用到"],["ホットの紅茶(こうちゃ)もありますか？","也有热红茶吗？","还可以这样说"]]}},{"uid":"conv-products-v1:lemontea","s":"conv","t":"s","q":"柜台茶饮菜单有柠檬茶，你想点一杯。","o":["レモンティーを一つ(ひとつ)ください。","すみません、ボタンを押し(おし)間違えました(まちがえました)。","これ、果肉(かにく)は入って(はいって)いますか？"],"a":0,"e":"レモンティー是柠檬茶；ミルクティー是奶茶，ストレートティー是未加奶或柠檬的红茶喝法。甜度仍要看具体商品。","d":["这句是在说：“不好意思，我按错按钮了。”","这句是在说：“这个里面有果肉吗？”"],"explain":{"text":"レモンティー是柠檬茶；ミルクティー是奶茶，ストレートティー是未加奶或柠檬的红茶喝法。甜度仍要看具体商品。","examples":[["レモンティーを一つ(ひとつ)ください。","请给我一杯柠檬茶。","现场会用到"],["これは甘い(あまい)ですか？","这个是甜的吗？","还可以这样说"]]}},{"uid":"conv-products-v1:fruittea","s":"conv","t":"s","q":"你想买现场制作的果茶，先确认这家店有没有。","o":["お店(みせ)で作る(つくる)フルーツティーはありますか？","アイスティーを一つ(ひとつ)お願いします(おねがいします)。","これは自分(じぶん)で作る(つくる)んですか？"],"a":0,"e":"フルーツティー是果茶，也可能是冷藏瓶装或杯装商品。加「お店で作る」可说明你想买现制的；并非每家便利店都卖。","d":["这句是在说：“请给我一杯冰红茶。”","这句是在说：“这个是要自己制作吗？”"],"explain":{"text":"フルーツティー是果茶，也可能是冷藏瓶装或杯装商品。加「お店で作る」可说明你想买现制的；并非每家便利店都卖。","examples":[["お店(みせ)で作る(つくる)フルーツティーはありますか？","有店内现制果茶吗？","现场会用到"],["ペットボトルではなく、その場(ば)で作る(つくる)ものです。","我说的是现场做的，不是瓶装的。","还可以这样说"],["このフルーツティーを一つ(ひとつ)お願いします(おねがいします)。","请给我一杯这个果茶。","看到菜单后点单"]],"source":["全家：果茶商品示例（并非现制流程说明）","https://www.family.co.jp/goods/drink/1750010.html"]}},{"uid":"conv-products-v1:fruitpieces","s":"conv","t":"s","q":"菜单上有一杯果茶，你想确认有没有果肉。","o":["これ、果肉(かにく)は入って(はいって)いますか？","レモンティーを一つ(ひとつ)ください。","シロップなしにできますか？"],"a":0,"e":"「果肉」是水果的果肉；带水果香味不等于一定含果肉。商品名写フルーツティー时，也可以进一步确认。","d":["这句是在说：“请给我一杯柠檬茶。”","这句是在说：“可以不加糖浆吗？”"],"explain":{"text":"「果肉」是水果的果肉；带水果香味不等于一定含果肉。商品名写フルーツティー时，也可以进一步确认。","examples":[["これ、果肉(かにく)は入って(はいって)いますか？","这个里面有果肉吗？","现场会用到"],["何(なん)のフルーツが入って(はいって)いますか？","里面有哪些水果？","还可以这样说"]]}},{"uid":"conv-products-v1:teaprocess","s":"conv","t":"s","q":"你买了一杯柜台果茶，不确定要自己操作还是等店员。","o":["これは自分(じぶん)で作る(つくる)んですか？","お店(みせ)で作る(つくる)フルーツティーはありますか？","スムージーのカップはどこにありますか？"],"a":0,"e":"「自分で」表示自己来。果茶可能由店员制作，也可能需要按店内设备流程操作，不能直接套用咖啡机的做法。","d":["这句是在说：“有店内现制果茶吗？”","这句是在说：“思慕雪的商品杯在哪里？”"],"explain":{"text":"「自分で」表示自己来。果茶可能由店员制作，也可能需要按店内设备流程操作，不能直接套用咖啡机的做法。","examples":[["これは自分(じぶん)で作る(つくる)んですか？","这个是要自己制作吗？","现场会用到"],["どのマシンを使います(つかいます)か？","用哪台机器？","还可以这样说"]]}},{"uid":"conv-products-v1:sweetness","s":"conv","t":"s","q":"你想问果茶能不能不加糖。","o":["シロップなしにできますか？","これ、果肉(かにく)は入って(はいって)いますか？","ホットコーヒーのS(エス)を一つ(ひとつ)お願いします(おねがいします)。"],"a":0,"e":"「なし」是不要、不加。这个句子是在询问能否调整；预先混合或定量制作的饮品可能无法改甜度。","d":["这句是在说：“这个里面有果肉吗？”","这句是在说：“请给我一杯S号热咖啡。”"],"explain":{"text":"「なし」是不要、不加。这个句子是在询问能否调整；预先混合或定量制作的饮品可能无法改甜度。","examples":[["シロップなしにできますか？","可以不加糖浆吗？","现场会用到"],["甘さ(あまさ)は変えられます(かえられます)か？","甜度可以调整吗？","还可以这样说"]]}},{"uid":"conv-products-v1:smoothie","s":"conv","t":"s","q":"这家店有店内制作的思慕雪，你想找商品杯。","o":["スムージーのカップはどこにありますか？","これは自分(じぶん)で作る(つくる)んですか？","アイスコーヒーのカップはどこですか？"],"a":0,"e":"スムージー是搅打成的浓稠果蔬饮品，不是果茶。部分便利店把冷冻原料装在杯里，购买后用专用机器制作。","d":["这句是在说：“这个是要自己制作吗？”","这句是在说：“冰咖啡杯在哪里？”"],"explain":{"text":"スムージー是搅打成的浓稠果蔬饮品，不是果茶。部分便利店把冷冻原料装在杯里，购买后用专用机器制作。","examples":[["スムージーのカップはどこにありますか？","思慕雪的商品杯在哪里？","现场会用到"],["スムージーの作り方(つくりかた)を教えて(おしえて)ください。","请教我怎么制作思慕雪。","还可以这样说"]],"source":["7-Eleven：店内制作思慕雪","https://www.sej.co.jp/products/smoothie/"]}},{"uid":"conv-products-v1:barcode","s":"conv","t":"r","q":"你准备制作饮品，屏幕上显示这条提示。这句话是什么意思？","o":["请扫描条形码。","您要什么尺寸？","您要热的还是冰的？"],"a":0,"e":"バーコード是条形码，読み取る在这里是扫描识别。先按屏幕要求扫描，之后的开盖、放杯步骤也应按设备提示进行。","d":["这与原句意思不同；原句是“请扫描条形码。”。","这与原句意思不同；原句是“请扫描条形码。”。"],"explain":{"text":"バーコード是条形码，読み取る在这里是扫描识别。先按屏幕要求扫描，之后的开盖、放杯步骤也应按设备提示进行。","examples":[["バーコードを読み取って(よみとって)ください。","请扫描条形码。","现场会用到"],["バーコードはここですか？","条形码在这里吗？","还可以这样说"]],"source":["7-Eleven：店内制作思慕雪","https://www.sej.co.jp/products/smoothie/"]},"j":"バーコードを読み取って(よみとって)ください。"}],"quiz/dialogue-explanations":{"izakaya|r|菜单上这道是什么?|〆のお茶漬け":{"what":"「〆」是收尾，「お茶漬け」是用茶或高汤等冲入米饭的料理。","why":"居酒屋把它列在用餐末尾的主食里，方便喝完酒后再吃一点饭。","examples":[["〆にお茶漬けをお願いします。","最后请来一份茶泡饭。"]]},"izakaya|r|我们没点菜,店员却端来一小碟菜,小票上写着这个。这是什么?|お通し 450円(税別)":{"what":"「お通し」是部分居酒屋入座后供应、通常收费的小菜；题目里的「税別」表示未含税。","why":"它可能不经单独点菜就上桌，因此看到小票时要理解这是店里的收费项目。","examples":[["お通しはいくらですか？","入座小菜多少钱？"]]},"izakaya|s|我想再来一杯生啤,怎么跟店员说?|":{"what":"「もう一杯」表示再来一杯，「生ビール」是生啤。","why":"已经点过饮料、现在想续一杯时，直接告诉店员饮品和数量即可。","examples":[["すみません、生ビールをもう一杯お願いします。","不好意思，请再来一杯生啤。"]]},"izakaya|r|这个畅饮套餐是怎么算的?|飲み放題 90分(L.O. 60分)":{"what":"题目里的畅饮时长是90分钟，但L.O.说明最后点单在第60分钟。","why":"店铺用两个时间区分“还能点”与“还能继续喝”，不能把它们当成同一截止时间。","examples":[["ラストオーダーは何分前ですか？","最后点单是在结束前多少分钟？"]]},"ramen|r|店门口有台机器,旁边贴着这句话,什么意思?|先に券売機で食券をお買い求めください。":{"what":"「先に」是先，「食券」是餐券，这句话要求先去机器买餐券。","why":"店里用先买券的流程处理付款和点单，未买券直接入座可能还不能下单。","examples":[["食券はここで買えばいいですか？","餐券在这里买就可以吗？"]]},"ramen|r|店员问我这句话,他想问什么?|麺の硬さはどうされますか?(かため/ふつう/やわらかめ)":{"what":"店员在问面条的硬度：かため偏硬、ふつう普通、やわらかめ偏软。","why":"有些拉面店允许烹煮前选择硬度，所以需要你先表明偏好。","examples":[["麺はかためでお願いします。","麻烦面条煮硬一点。"]]},"ramen|s|我对葱过敏,想让厨房不要放葱,怎么说比较好?|":{"what":"「ねぎ抜き」表示不放葱；它本身没有完整说明过敏情况。","why":"有过敏需求时要把食材与过敏情况明确说出来，不能只让店员理解成口味喜好。","examples":[["ねぎアレルギーがあります。ねぎを使わずに作れますか？","我对葱过敏。可以不用葱来做吗？"]]},"ramen|r|菜单上这个是什么?|替え玉 150円":{"what":"「替え玉」是追加一份面；题中150円是这家店列出的加面价格。","why":"拉面吃完、汤还留着时，有些店允许续面，不代表整碗面连汤一起重做。","examples":[["すみません、替え玉をお願いします。","不好意思，请加一份面。"]]},"conv|r|收银员问我这句话,要回答什么?|温めますか?":{"what":"「温めますか？」是在问要不要加热。","why":"便利店结账时，店员需要确认便当等是否放进微波炉。","examples":[["はい、お願いします。","好的，麻烦加热。"]]},"conv|r|收银员说这句话,什么意思?|袋はご利用ですか?":{"what":"「袋はご利用ですか？」是在问你是否需要购物袋。","why":"结账时店员要决定是否提供袋子及相应处理，具体收费看店内说明。","examples":[["袋を一枚お願いします。","麻烦给一个袋子。"]]},"conv|r|晚上超市熟食上贴了这个,是什么意思?|20%引きシール":{"what":"「20%引き」表示按原价减去20%，也就是付原价的80%。","why":"超市用折扣贴纸提示降价出售，不能把减去的比例理解成付款比例。","examples":[["これは二割引きですか？","这个是打八折吗？"]]},"conv|s|我已经自带了购物袋,想告诉收银员不需要袋子,怎么说?|":{"what":"「袋は大丈夫です」在这个场景是婉拒袋子，意思是“不用了”。","why":"日本店铺里「大丈夫です」可用来拒绝服务，要结合正在谈论的对象理解。","examples":[["袋は大丈夫です。マイバッグがあります。","不用袋子，我有自己的购物袋。"]]},"train|r|站台电子屏上写着这两个词,有什么区别?|快速 / 各駅停車":{"what":"「快速」通常跳过部分车站，「各駅停車」通常每站都停。","why":"上车前要看停靠站；不同线路的具体运行方式应以站内信息为准。","examples":[["この電車はこの駅に止まりますか？","这趟车在这个站停吗？"]]},"train|r|站内广播说了这句话,发生了什么?|人身事故の影響で、運転を見合わせております。":{"what":"「運転を見合わせております」是暂停运行；题目说原因是人身事故的影响。","why":"站内广播在告知线路暂时不能正常运行，接下来可能需要查询替代路线。","examples":[["ほかの路線で行けますか？","可以坐其他线路过去吗？"]]},"train|s|我不确定这趟车是不是去新宿,怎么问车站工作人员?|":{"what":"「〜に行きますか」用来确认是否去某个目的地。","why":"不确定车次方向时，先问清楚再上车，地名可以替换成自己的目的地。","examples":[["この電車は新宿に行きますか？","这趟电车去新宿吗？"]]},"train|r|检票口旁边的人让我看这个牌子,什么意思?|乗り換えはこちら":{"what":"「乗り換え」是换乘，「こちら」是这边。","why":"车站标牌在指引你转乘其他线路，不是直接指向出站口。","examples":[["乗り換えはどちらですか？","换乘走哪边？"]]},"drug|r|免税柜台的店员这样说,我要做什么?|パスポートをご提示ください。":{"what":"「パスポートをご提示ください」是在请你出示护照。","why":"免税等柜台办理手续时可能需要确认身份与资格，这是店员对当前步骤的提示。","examples":[["はい、こちらです。","好的，在这里。"]]},"drug|r|价格牌上有这个标记,说明了什么?|税込 1,100円":{"what":"「税込」表示已包含税；题目中的金额是1,100日元。","why":"价格牌用它帮助客人识别显示的金额是否含税，和「税別」不同。","examples":[["これは税込みの値段ですか？","这个是含税价吗？"]]},"drug|s|我想买防晒霜,问店员在哪里,怎么说?|":{"what":"「日焼け止め」是防晒产品，「どこにありますか」用来问位置。","why":"药妆店商品很多，用商品名加这个句型就能让店员指路。","examples":[["日焼け止めはどこにありますか？","防晒产品在哪里？"]]},"drug|r|药盒上写着这个,怎么吃?|1日3回 食後に1錠":{"what":"题面这行文字的字面意思是每天3次、饭后各1片。「錠」是片剂的量词。","why":"这是练习读懂标签用语的示例；实际使用应以具体药品说明及药师指示为准。","examples":[["飲み方を教えてください。","请告诉我服用方法。"]]},"hotel|r|我们到早了,前台这样说,意思是?|チェックインは15時からとなっております。":{"what":"「15時から」表示从15点开始，店员在说明办理入住的起始时间。","why":"早到并不表示马上能进房，通常需要先确认酒店如何安排。","examples":[["チェックインまで荷物を預かってもらえますか？","办理入住前能帮我寄存行李吗？"]]},"hotel|s|我们还没到入住时间,想先把行李寄存在前台,怎么说?|":{"what":"「預かってもらえますか」是请求对方帮忙保管。","why":"房间还没准备好或退房后还要外出时，可询问酒店是否能寄存行李。","examples":[["荷物を預かってもらえますか？","能帮我寄存行李吗？"]]},"hotel|r|早餐券上写着这个,最晚几点能进场?|朝食 6:30〜10:00(最終入場 9:30)":{"what":"「最終入場」是最晚进入餐厅的时间；题目为9:30，10:00是早餐结束。","why":"酒店把入场截止和用餐结束分开标示，以便安排服务。","examples":[["朝食は九時半までに入ればいいですか？","早餐在九点半之前进去就可以吗？"]]},"hotel|s|房间里没有吹风机,想跟前台要一个,怎么说?|":{"what":"「ドライヤー」是吹风机，「貸していただけますか」是礼貌地请求借用。","why":"房内没找到用品时，应先向前台确认是否可以借到。","examples":[["すみません、ドライヤーはありますか？","不好意思，有吹风机吗？"]]},"shop|s|我想试穿这件衣服,怎么问店员?|":{"what":"「試着」是试穿，「〜てもいいですか」是在征求许可。","why":"服装店可能有试衣间和试穿规则，所以先问店员更清楚。","examples":[["これ、試着してもいいですか？","这件可以试穿吗？"]]},"shop|r|我想要M码,店员说了这句话,什么意思?|在庫を確認いたしますので、少々お待ちください。":{"what":"「在庫を確認」是查库存，「少々お待ちください」是请稍等。","why":"店员可能需要去库房查找，并没有直接表示售罄。","examples":[["はい、お願いします。","好的，麻烦您了。"]]},"shop|s|我喜欢这个款式,想问有没有别的颜色,怎么说?|":{"what":"「色違い」指同款的不同颜色。","why":"喜欢款式但想换颜色时用它提问，不是在要求店员重新染色。","examples":[["これ、色違いはありますか？","这个同款有其他颜色吗？"]]},"shop|r|收银员递来一张小票和一个东西,说了这句话。他想说什么?|こちら、免税のお手続きはあちらのカウンターです。":{"what":"「免税のお手続き」是办理免税手续，「あちらのカウンター」是那边的柜台。","why":"有些商店把结账与办理相关手续分开，需要按店员指引前往指定柜台。","examples":[["免税カウンターはどこですか？","免税柜台在哪里？"]]},"help|s|我想找厕所,怎么问路人?|":{"what":"「お手洗い」是厕所的礼貌说法，「どこですか」询问地点。","why":"在店里或公共场所找厕所时，可用这个简短句型问路。","examples":[["すみません、お手洗いはどこですか？","不好意思，厕所在哪里？"]]},"help|s|我的钱包丢了,想问警察局在哪里,怎么说?|":{"what":"「財布をなくしました」是钱包丢了，「交番」是街边派出所。","why":"说明丢了什么，再问求助地点，能让对方理解你当前的需求。","examples":[["財布をなくしました。交番はどこですか？","我的钱包丢了。派出所在哪里？"]]},"help|r|路口立着这个牌子,是什么意思?|通行止め(工事中)":{"what":"「通行止め」是禁止通行，「工事中」是正在施工。","why":"路牌提示此路不能继续通过，需要找可通行的路线。","examples":[["迂回路はどちらですか？","绕行路线在哪边？"]]},"help|r|便利店门口有人走过来问我这句话,他想问什么?|日本語は大丈夫ですか?":{"what":"「日本語は大丈夫ですか？」在这里是在确认你能否用日语沟通。","why":"对方要决定怎样解释或帮助你，不是在问身体是否舒服。","examples":[["少しだけ分かります。ゆっくりお願いします。","我只懂一点，请说慢一点。"]]},"izakaya|s|店员问“几位?”,我们一共三个人,怎么回答?|":{"what":"问「何名様ですか」是在问人数，三个人回答「三人です」。","why":"店员根据人数安排座位，因此要回答人数而不是东西数量或楼层。","examples":[["三人です。","我们三位。"]]},"izakaya|s|想叫店员过来点菜,怎么说?|":{"what":"「注文お願いします」是请店员来点单。","why":"坐下看好菜单后，用「すみません」引起注意，再说明要点菜。","examples":[["すみません、注文お願いします。","不好意思，我想点菜。"]]},"izakaya|r|店员说了这句话,是什么意思?|ラストオーダーは23時になります。":{"what":"「ラストオーダーは23時」表示最后点单在23点。","why":"最后点单与离店时间不是同一概念，想加点要在截止前提出。","examples":[["その前に、もう一品注文できますか？","在那之前，可以再点一道菜吗？"]]},"izakaya|r|小票上有这一项,是什么?|サービス料 10%":{"what":"「サービス料10%」是另列的10%服务费，不是同名的消费税。","why":"账单把不同收费项目分开写，客人可据此询问费用构成。","examples":[["サービス料は別ですか？","服务费另算吗？"]]},"izakaya|s|我想问能不能不要入座小菜,哪句话比较自然?|":{"what":"「なしにできますか」是在询问能否去掉某项内容。","why":"有些居酒屋的入座小菜和收费规则不能取消，因此需先问，不能默认可以免除。","examples":[["お通しはなしにできますか？","可以不要入座小菜吗？"]]},"izakaya|r|入座后店员问了这句话,他想问什么?|お飲み物は何になさいますか。":{"what":"「お飲み物は何になさいますか」是礼貌地问你想喝什么。","why":"居酒屋入座后常先确认饮品，你可以直接说饮料名称和数量。","examples":[["ウーロン茶を一つお願いします。","请来一杯乌龙茶。"]]}},"quiz/music-1":[{"uid":"music-v1:live-today","s":"music","t":"s","q":"【Jazz Bar】你路过一家爵士酒吧，想知道今晚有没有现场演奏。","o":["今夜(こんや)、生演奏(なまえんそう)はありますか？","ミュージックチャージはいくらですか？","生ビール(なまビール)を一つ(ひとつ)お願いします。"],"a":0,"e":"「生演奏」是现场演奏。有些ジャズバー主要播放唱片，并非每天都有乐手演出，进店前确认很自然。","d":["这句表示：“音乐费多少钱？”。","这句表示：“请给我一杯生啤。”。"],"explain":{"text":"「生演奏」是现场演奏。有些ジャズバー主要播放唱片，并非每天都有乐手演出，进店前确认很自然。","examples":[["今夜(こんや)、生演奏(なまえんそう)はありますか？","今晚有现场演奏吗？","现场常用"],["ライブは何時(なんじ)からですか？","演出几点开始？","还可以这样说"]]}},{"uid":"music-v1:reserve","s":"music","t":"s","q":"【Jazz Bar】你想订今晚两个人的位置。","o":["今夜(こんや)、二人(ふたり)で予約(よやく)できますか？","カウンター席(せき)は空いて(あいて)いますか？","ハイボールを一つ(ひとつ)お願いします。"],"a":0,"e":"先说日期和人数，再确认演出场次、时间和座位。予約是预约，不能只说有两个人就认为订位完成。","d":["这句表示：“吧台有空位吗？”。","这句表示：“请给我一杯Highball。”。"],"explain":{"text":"先说日期和人数，再确认演出场次、时间和座位。予約是预约，不能只说有两个人就认为订位完成。","examples":[["今夜(こんや)、二人(ふたり)で予約(よやく)できますか？","今晚可以订两个人的位置吗？","现场常用"],["七時(しちじ)ごろに伺い(うかがい)たいんですが。","我想七点左右过去。","还可以这样说"]],"source":["Billboard Live：常见问题","https://www.billboard-live.com/qa"]}},{"uid":"music-v1:walkin","s":"music","t":"s","q":"【Jazz Bar】你没有预约，想问现在能否进去听。","o":["予約(よやく)していないんですが、入れます(はいれます)か？","ステージが見える(みえる)席(せき)はありますか？","甘すぎない(あますぎない)カクテルで、おすすめはありますか？"],"a":0,"e":"「〜んですが」自然地引出自己的情况，再请店员判断是否能接待。没有预约不等于一定不能入场。","d":["这句表示：“有能看见舞台的座位吗？”。","这句表示：“有没有推荐的不太甜的鸡尾酒？”。"],"explain":{"text":"「〜んですが」自然地引出自己的情况，再请店员判断是否能接待。没有预约不等于一定不能入场。","examples":[["予約(よやく)していないんですが、入れます(はいれます)か？","我没有预约，现在能进去吗？","现场常用"],["一人(ひとり)です。","我一个人。","还可以这样说"]]}},{"uid":"music-v1:name","s":"music","t":"r","q":"【Jazz Bar】到店后，接待人员问你。","o":["请告诉我预约姓名。","您要加冰，还是纯饮？","还要另外收取座位费。"],"a":0,"e":"店员是在核对订位姓名。按预约时填写的名字回答，必要时出示确认邮件。","d":["原句表达的是“请告诉我预约姓名。”，不是这个意思。","原句表达的是“请告诉我预约姓名。”，不是这个意思。"],"explain":{"text":"店员是在核对订位姓名。按预约时填写的名字回答，必要时出示确认邮件。","examples":[["ご予約(よやく)のお名前(なまえ)をお願いします。","请告诉我预约姓名。","现场常用"],["予約(よやく)したリーです。","我姓李，有预约。","还可以这样说"]]},"j":"ご予約(よやく)のお名前(なまえ)をお願いします。"},{"uid":"music-v1:musiccharge","s":"music","t":"s","q":"【Jazz Bar】菜单上写着ミュージックチャージ，你想问金额。","o":["ミュージックチャージはいくらですか？","ハイボールを一つ(ひとつ)お願いします。","すみません、お水(みず)をお願いします。"],"a":0,"e":"这是与演出相关的费用，不等于饮料价格。有的店另有座位费或服务费，需要看具体说明。","d":["这句表示：“请给我一杯Highball。”。","这句表示：“不好意思，请给我一杯水。”。"],"explain":{"text":"这是与演出相关的费用，不等于饮料价格。有的店另有座位费或服务费，需要看具体说明。","examples":[["ミュージックチャージはいくらですか？","音乐费多少钱？","现场常用"],["飲み物代(のみものだい)は別(べつ)ですか？","饮品费用另算吗？","还可以这样说"]]}},{"uid":"mu ,"这个选项表达的是另一种需求。"],"explain":{"text":"「御堂筋線(みどうすじせん)」是御堂筋线。这是大阪地铁线路名，「御堂筋」读みどうすじ。不要把线路名当成车站名。","examples":[["御堂筋線(みどうすじせん)への乗り換えは、こちらですか？","换乘御堂筋线是这边吗？","现场可以这样说"],["なんばへ行きたいんですが。","我想去难波。","接着还可以问"]]}},{"uid":"tourist-v1:term:7","s":"train","t":"r","q":"你在售票窗口买票，想确认乘车券是否包含在内。下面这句话是在表达什么？","j":"乗車券(じょうしゃけん)も含まれていますか？","o":["也包含乘车券了吗？","自由席在几号车厢？","有能放下行李箱的寄存柜吗？"],"a":0,"e":"乘车券与特急券作用不同，套餐或电子票的包含项目也不同，购票时可以直接确认。","d":["这个选项表达的是另一种需求。","这个选项表达的是另一种需求。"],"explain":{"text":"「乗車券(じょうしゃけん)」是乘车券。乘车券与特急券作用不同，套餐或电子票的包含项目也不同，购票时可以直接确认。","examples":[["乗車券(じょうしゃけん)も含まれていますか？","也包含乘车券了吗？","现场可以这样说"],["このきっぷだけで乗れますか？","只用这张票就能坐吗？","接着还可以问"]]}},{"uid":"tourist-v1:term:8","s":"train","t":"r","q":"你准备乘一趟列车，想问是否还需要特急券。下面这句话是在表达什么？","j":"特急券(とっきゅうけん)も必要ですか？","o":["也需要特急券吗？","这张票可以中途出站吗？","最近的车站是哪里？"],"a":0,"e":"是否需要另外付特急费用要看铁路公司与车次，不能只凭「特急」两个字一概判断。","d":["这个选项表达的是另一种需求。","这个选项表达的是另一种需求。"],"explain":{"text":"「特急券(とっきゅうけん)」是特急券。是否需要另外付特急费用要看铁路公司与车次，不能只凭「特急」两个字一概判断。","examples":[["特急券(とっきゅうけん)も必要ですか？","也需要特急券吗？","现场可以这样说"],["どこで買えますか？","在哪里能买？","接着还可以问"]]}},{"uid":"tourist-v1:term:9","s":"train","t":"r","q":"你想和同伴坐在一起，向窗口问指定席。下面这句话是在表达什么？","j":"指定席(していせき)を二枚お願いします。","o":["请给两张指定席票。","可以不用换乘就到吗？","我在检票口前等。"],"a":0,"e":"指定席通常会指定车次、车厢和座位。买两张不一定自动保证相邻，可以明确提出需求。","d":["这个选项表达的是另一种需求。","这个选项表达的是另一种需求。"],"explain":{"text":"「指定席(していせき)」是指定席。指定席通常会指定车次、车厢和座位。买两张不一定自动保证相邻，可以明确提出需求。","examples":[["指定席(していせき)を二枚お願いします。","请给两张指定席票。","现场可以这样说"],["隣同士の席は空いていますか？","还有挨着的座位吗？","接着还可以问"]]}},{"uid":"tourist-v1:term:10","s":"train","t":"r","q":"你手上是自由席车票，想找对应车厢。下面这句话是在表达什么？","j":"自由席(じゆうせき)は何号車ですか？","o":["自由席在几号车厢？","这里是终点站吗？","从哪个出口出去比较好？"],"a":0,"e":"自由席没有为你指定单独座位，不代表免费，也不保证有座位。是否设自由席要看车次。","d":["这个选项表达的是另一种需求。","这个选项表达的是另一种需求。"],"explain":{"text":"「自由席(じゆうせき)」是自由席。自由席没有为你指定单独座位，不代表免费，也不保证有座位。是否设自由席要看车次。","examples":[["自由席(じゆうせき)は何号車ですか？","自由席在几号车厢？","现场可以这样说"],["ここは自由席ですか？","这里是自由席吗？","接着还可以问"]]}},{"uid":"tourist-v1:term:11","s":"train","t":"r","q":"你想在到达目的地前出站逛一逛，先向站员确认。下面这句话是在表达什么？","j":"このきっぷで途中下車(とちゅうげしゃ)できますか？","o":["这张票可以中途出站吗？","旅游咨询处在哪里？","我在东口。"],"a":0,"e":"这里强调途中离开检票区，和在站内换乘不同。能否中途出站及车票是否继续有效，要看票种。","d":["这个选项表达的是另一种需求。","这个选项表达的是另一种需求。"],"explain":{"text":"「途中下車(とちゅうげしゃ)」是中途出站。这里强调途中离开检票区，和在站内换乘不同。能否中途出站及车票是否继续有效，要看票种。","examples":[["このきっぷで途中下車(とちゅうげしゃ)できますか？","这张票可以中途出站吗？","现场可以这样说"],["一度改札を出ても大丈夫ですか？","中途出一次检票口可以吗？","接着还可以问"]]}},{"uid":"tourist-v1:term:12","s":"train","t":"r","q":"你看见列车直通其他线路，想确认是否不用下车换乘。下面这句话是在表达什么？","j":"乗り換えなしで行けますか？","o":["可以不用换乘就到吗？","有能放下行李箱的寄存柜吗？","往涩谷方向的站台在哪？"],"a":0,"e":"直通运行可能跨越不同线路。它不等于沿途不停，也不能替代确认目的站和车次。","d":["这个选项表达的是另一种需求。","这个选项表达的是另一种需求。"],"explain":{"text":"「直通(ちょくつう)」是直通运行。直通运行可能跨越不同线路。它不等于沿途不停，也不能替代确认目的站和车次。","examples":[["乗り換えなしで行けますか？","可以不用换乘就到吗？","现场可以这样说"],["このまま乗っていて大丈夫ですか？","继续坐在这趟车上就可以吗？","接着还可以问"]]}},{"uid":"tourist-v1:term:13","s":"train","t":"r","q":"车内广播提到终点，你想确认是不是该下车。下面这句话是在表达什么？","j":"ここが終点(しゅうてん)ですか？","o":["这里是终点站吗？","最近的车站是哪里？","山手线的站台在哪里？"],"a":0,"e":"终点是这一趟列车运行结束的车站，不是当天最后一班车；末班车叫終電。","d":["这个选项表达的是另一种需求。","这个选项表达的是另一种需求。"],"explain":{"text":"「終点(しゅうてん)」是终点站。终点是这一趟列车运行结束的车站，不是当天最后一班车；末班车叫終電。","examples":[["ここが終点(しゅうてん)ですか？","这里是终点站吗？","现场可以这样说"],["ここで降りればいいですか？","在这里下车就可以吗？","接着还可以问"]]}},{"uid":"tourist-v1:term:14","s":"train","t":"r","q":"出了车站想拿地图，先问旅游咨询处在哪。下面这句话是在表达什么？","j":"観光案内所(かんこうあんないじょ)はどこですか？","o":["旅游咨询处在哪里？","我在检票口前等。","换乘御堂筋线是这边吗？"],"a":0,"e":"这里可以询问当地观光信息。是否提供某种语言服务或售票，需在现场确认。","d":["这个选项表达的是另一种需求。","这个选项表达的是另一种需求。"],"explain":{"text":"「観光案内所(かんこうあんないじょ)」是旅游咨询处。这里可以询问当地观光信息。是否提供某种语言服务或售票，需在现场确认。","examples":[["観光案内所(かんこうあんないじょ)はどこですか？","旅游咨询处在哪里？","现场可以这样说"],["周辺の地図はありますか？","有周边地图吗？","接着还可以问"]]}},{"uid":"tourist-v1:term:15","s":"train","t":"r","q":"你准备游览景点，想先找大件行李寄存柜。下面这句话是在表达什么？","j":"スーツケースが入るロッカーはありますか？","o":["有能放下行李箱的寄存柜吗？","从哪个出口出去比较好？","也包含乘车券了吗？"],"a":0,"e":"虽然名称含「コイン」，实际付款方式可能是硬币、IC卡或其他方式；还要看柜子大小和使用期限。","d":["这个选项表达的是另一种需求。","这个选项表达的是另一种需求。"],"explain":{"text":"「コインロッカー」是投币式寄存柜。虽然名称含「コイン」，实际付款方式可能是硬币、IC卡或其他方式；还要看柜子大小和使用期限。","examples":[["スーツケースが入るロッカーはありますか？","有能放下行李箱的寄存柜吗？"," かりますか？"],"a":0,"e":"「熊本(くまもと)」是九州・冲绳的城市、站名，中文常写作熊本。熊本站与熊本城不是同一地点；熊本城读「熊本城（くまもとじょう）」。","d":["这句问的是价格。","这句问的是所需时间。"],"explain":{"text":"「熊本(くまもと)」是九州・冲绳的城市、站名，中文常写作熊本。熊本站与熊本城不是同一地点；熊本城读「熊本城（くまもとじょう）」。","examples":[["すみません、熊本(くまもと)へ行きたいんですが。","不好意思，我想去熊本。","说明目的地"],["熊本(くまもと)までは、どう行けばいいですか？","去熊本该怎么走？","请工作人员指路"]]}},{"uid":"tourist-v2:place:57","s":"train","t":"r","q":"你在九州・冲绳旅行，向工作人员询问交通。下面这句话想问什么？","o":["去鹿儿岛中央该怎么走？","到鹿儿岛中央还要多久？","去鹿儿岛中央的车票多少钱？"],"a":0,"e":"「鹿児島中央(かごしまちゅうおう)」是九州・冲绳的站名，中文常写作鹿儿岛中央。不要与「鹿児島（かごしま）」站混淆，「中央」是完整站名的一部分。","d":["「どのくらいかかりますか」才是在问花多久。","「いくらですか」才是在问多少钱。"],"explain":{"text":"「鹿児島中央(かごしまちゅうおう)」是九州・冲绳的站名，中文常写作鹿儿岛中央。不要与「鹿児島（かごしま）」站混淆，「中央」是完整站名的一部分。","examples":[["すみません、鹿児島中央(かごしまちゅうおう)へ行きたいんですが。","不好意思，我想去鹿儿岛中央。","说明目的地"],["鹿児島中央(かごしまちゅうおう)までは、どう行けばいいですか？","去鹿儿岛中央该怎么走？","请工作人员指路"]]},"j":"鹿児島中央(かごしまちゅうおう)までは、どう行けばいいですか？"},{"uid":"tourist-v2:place:58","s":"train","t":"r","q":"你准备前往九州・冲绳的一个地点，同伴向工作人员这样说。他想去哪里？","o":["那霸","熊本","博多"],"a":0,"e":"「那覇(なは)」是九州・冲绳的城市，中文常写作那霸。「那覇」是城市名，找单轨电车时还要输入具体站名，例如那霸机场站，不能只用城市名判断下车处。","d":["句中目的地是「那覇(なは)」，即那霸。","句中目的地是「那覇(なは)」，即那霸。"],"explain":{"text":"「那覇(なは)」是九州・冲绳的城市，中文常写作那霸。「那覇」是城市名，找单轨电车时还要输入具体站名，例如那霸机场站，不能只用城市名判断下车处。","examples":[["すみません、那覇(なは)へ行きたいんですが。","不好意思，我想去那霸。","说明目的地"],["那覇(なは)までは、どう行けばいいですか？","去那霸该怎么走？","请工作人员指路"]]},"j":"すみません、那覇(なは)へ行きたいんですが。"},{"uid":"tourist-v2:place:59","s":"train","t":"s","q":"你想请工作人员告诉你去首里的路线，哪句是在问“该怎么走”？","o":["首里(しゅり)までは、どう行けばいいですか？","首里(しゅり)まで、いくらですか？","首里(しゅり)まで、どのくらいかかりますか？"],"a":0,"e":"「首里(しゅり)」是九州・冲绳的地区、站名，中文常写作首里。「首里」读しゅり。首里城叫「首里城（しゅりじょう）」，车站与城址公园不是同一个位置。","d":["这句问的是价格。","这句问的是所需时间。"],"explain":{"text":"「首里(しゅり)」是九州・冲绳的地区、站名，中文常写作首里。「首里」读しゅり。首里城叫「首里城（しゅりじょう）」，车站与城址公园不是同一个位置。","examples":[["すみません、首里(しゅり)へ行きたいんですが。","不好意思，我想去首里。","说明目的地"],["首里(しゅり)までは、どう行けばいいですか？","去首里该怎么走？","请工作人员指路"]]}}],"quiz/ramen-extra":[{"s":"ramen","t":"r","q":"你走到拉面店门口，看到这条排队提示。应该先做什么？","j":"先に食券を買ってからお並びください。","reading":"さきに しょっけんを かってから おならびください。","o":["先买餐券，再排队","先排队，轮到自己才买餐券","先找座位，吃完再付款"],"a":0,"e":"「〜てから」就是做完前一件事再做后一件事。这里的顺序是先买券，再排队。不同店铺安排可能相反，看到入口提示时别只跟着人群走。","d":["这个选项把先后顺序倒过来了。","题面没有让你先入座，也不是餐后结账。"],"explain":{"text":"「〜てから」就是做完前一件事再做后一件事。这里的顺序是先买券，再排队。不同店铺安排可能相反，看到入口提示时别只跟着人群走。","examples":[["食券を先に買えばいいですか？","我先买餐券就可以吗？","确认流程"],["最後尾はどこですか？","队尾在哪里？","找队尾"]]}},{"s":"ramen","t":"r","q":"门口有等位名单，店员指着纸对你说：","j":"こちらにお名前を書いてお待ちください。","reading":"こちらに おなまえを かいて おまちください。","o":["在这里写姓名，然后等候","把姓名写在餐券上，马上入座","先写想点的菜名，再付款"],"a":0,"e":"店员让你在等位名单上留名字，之后可能按名字叫号。「お名前」是你的姓名，不是菜名。不知道写哪里，可以指着空格确认。","d":["「お待ちください」是请等待，不是马上入座。","「お名前」指人的姓名，菜名一般说「料理名」等。"],"explain":{"text":"店员让你在等位名单上留名字，之后可能按名字叫号。「お名前」是你的姓名，不是菜名。不知道写哪里，可以指着空格确认。","examples":[["名前はここに書けばいいですか？","名字写在这里就可以吗？","确认填写位置"],["どのくらい待ちますか？","大概要等多久？","问等待时间"]]}},{"s":"ramen","t":"r","q":"你先到店，朋友还在路上。店员这样说：","j":"お連れ様がそろってからご案内します。","reading":"おつれさまが そろってから ごあんないします。","o":["等同行的人都到齐后再安排入座","你可以先坐，朋友稍后进来","大家必须分别买不同的套餐"],"a":0,"e":"「お連れ様」是与你一起来的人，「そろってから」是到齐以后。有些店会在人齐后才安排座位；这是这家店当前的要求，不是所有拉面店都一样。","d":["「そろってから」明确要求人到齐后。","这里没有提到买套餐或分开点餐。"],"explain":{"text":"「お連れ様」是与你一起来的人，「そろってから」是到齐以后。有些店会在人齐后才安排座位；这是这家店当前的要求，不是所有拉面店都一样。","examples":[["あと一人、すぐ来ます。","还有一位，马上就到。","说明同行者的情况"]]}},{"s":"ramen","t":"r","q":"入座后你手里拿着餐券，店员伸手说：","j":"食券をお預かりします。","reading":"しょっけんを おあずかりします。","o":["请把餐券交给店员","请把餐券留到离店时再交","店员要退还你的餐券"],"a":0,"e":"店员用「お預かりします」表示要接收你手里的东西。这里是收餐券来确认订单，把券递过去即可，不是再次付款。","d":["店员现在就在接收餐券，不是让你保留到最后。","退还会说「お返しします」等。"],"explain":{"text":"店员用「お預かりします」表示要接收你手里的东西。这里是收餐券来确认订单，把券递过去即可，不是再次付款。","examples":[["はい、お願いします。","好的，麻烦您了。","递交餐券时"]]}},{"s":"ramen","t":"r","q":"店里还有空位，店员对你说：","j":"お好きな席へどうぞ。","reading":"おすきな せきへ どうぞ。","o":["请选择自己喜欢的空位坐","只能坐入口旁边的座位","暂时没有空位，请在外面等"],"a":0,"e":"「お好きな席」是你喜欢的座位，店员是在让你选择可用的空位。看见预约牌或店员另有说明的座位，还是要先确认。","d":["句子没有指定入口旁的位置。","「どうぞ」在这里是在邀请你入座。"],"explain":{"text":"「お好きな席」是你喜欢的座位，店员是在让你选择可用的空位。看见预约牌或店员另有说明的座位，还是要先确认。","examples":[["ここ、座ってもいいですか？","这里可以坐吗？","确认一个座位"]]}},{"s":"ramen","t":"r","q":"你准备找店员要水，桌上的提示写着：","j":"お水はセルフサービスです。","reading":"おみずは セルフサービスです。","o":["水需要自己取","水需要另外购买餐券","水只能在离店时领取"],"a":0,"e":"「セルフサービス」表示自行取用。拉面店可能把水壶放在桌边，也可能设饮水机；找不到时直接问位置即可。","d":["自助取水不等于另收费，题面没有提费用。","这句话没有限制离店时才能取。"],"explain":{"text":"「セルフサービス」表示自行取用。拉面店可能把水壶放在桌边，也可能设饮水机；找不到时直接问位置即可。","examples":[["お水はどこですか？","水在哪里？","找取水位置"],["コップはどこにありますか？","杯子在哪里？","找杯子"]]}},{"s":"ramen","t":"r","q":"店员看到你穿着浅色衣服，问：","j":"紙エプロンはご入用ですか？","reading":"かみエプロンは ごいりようですか。","o":["是否需要纸围裙","是否需要纸袋打包","是否需要纸质收据"],"a":0,"e":"「紙エプロン」是防止汤汁溅到衣服上的一次性纸围裙。「ご入用ですか」是店员礼貌地问你要不要。要的话说「お願いします」就够了。","d":["纸袋是「紙袋」，不是「紙エプロン」。","收据一般说「レシート」或「領収書」。"],"explain":{"text":"「紙エプロン」是防止汤汁溅到衣服上的一次性纸围裙。「ご入用ですか」是店员礼貌地问你要不要。要的话说「お願いします」就够了。","examples":[["はい、お願いします。","好的，麻烦给我一个。","需要时"],["大丈夫です。","不用了，谢谢。","不需要时"]]}},{"s":"ramen","t":"r","q":"你想点招牌拉面，但菜单旁贴着：","j":"本日は売り切れです。","reading":"ほんじつは うりきれです。","o":["今天已经卖完了","今天只接受外带","今天这款免费加面"],"a":0,"e":"「売り切れ」是卖完。「本日は」表示今天，因此下次来不一定没有。想继续选，可以请店员推荐别的。","d":["外带是「持ち帰り」，与卖完不同。","免费加面会写「替え玉無料」等。"],"explain":{"text":"「売り切れ」是卖完。「本日は」表示今天，因此下次来不一定没有。想继续选，可以请店员推荐别的。","examples":[["ほかにおすすめはありますか？","还有别的推荐吗？","换一道菜"]]}},{"s":"ramen","t":"r","q":"这家店允许调整面条硬度。店员问：","j":"麺は、かため・普通・やわらかめ、どうしますか？","reading":"めんは、かため・ふつう・やわらかめ、どうしますか。","o":["问你想要偏硬、普通还是偏软的面","问你要大碗、普通还是小碗","问你要辣、微辣还是不辣"],"a":0,"e":"「かため」「やわらかめ」在这里说面条硬度，和面量、辣度分开。直接回答「普通でお願いします」也很自然，不需要选复杂的点法。","d":["面量会用「大盛り」「並」等表示。","辣度会说「辛さ」，不是面条硬度。"],"explain":{"text":"「かため」「やわらかめ」在这里说面条硬度，和面量、辣度分开。直接回答「普通でお願いします」也很自然，不需要选复杂的点法。","examples":[["普通でお願いします。","普通硬度就好。","没特别偏好"],["かためでお願いします。","麻烦面煮硬一点。","喜欢偏硬"]]}},{"s":"ramen","t":"r","q":"你点了加面，店员先提醒：","j":"替え玉にはスープはつきません。","reading":"かえだまには スープは つきません。","o":["加面不包含新的汤","加面会免费再送一整碗汤","这家店不能加面"],"a":0,"e":"「替え玉」通常是在原来的汤里续面。「スープはつきません」明确表示这份加面不附汤，别把原来的汤先喝完。是否能另加汤要问店员。","d":["「つきません」是否定，表示不附带。","不是不能加面，而是加面不附汤。"],"explain":{"text":"「替え玉」通常是在原来的汤里续面。「スープはつきません」明确表示这份加面不附汤，别把原来的汤先喝完。是否能另加汤要问店员。","examples":[["替え玉を一つお願いします。","请加一份面。","续面时"],["半替え玉はありますか？","有半份加面吗？","只想加一点"]]}},{"s":"ramen","t":"r","q":"你看见桌边写着：","j":"お会計は食後にレジでお願いします。","reading":"おかいけいは しょくごに レジで おねがいします。","o":["吃完后到收银台结账","先在收银台付款再入座","把钱放桌上即可离开"],"a":0,"e":"并不是每家拉面店都用餐券。「食後に」说明饭后付款，「レジで」说明去收银台。按这家店的提示处理就好。","d":["「食後」是饭后，不是饭前。","「レジで」明确指定去收银台。"],"explain":{"text":"并不是每家拉面店都用餐券。「食後に」说明饭后付款，「レジで」说明去收银台。按这家店的提示处理就好。","examples":[["お会計お願いします。","麻烦结账。","到收银台时"],["別々に払えますか？","可以分开付吗？","与朋友各付各的"]]}},{"s":"ramen","t":"r","q":"吃完后，柜台上的提示写着：","j":"食器は返却口へお願いします。","reading":"しょっきは へんきゃくぐちへ おねがいします。","o":["餐具请送到回收口","餐具留在桌上即可","到取餐口领取新的餐具"],"a":0,"e":"「返却口」是归还、回收物品的地方。在这种自助收餐的店，吃完把碗盘送到指定位置；不要把这个要求当成所有拉面店的统一规则。","d":["提示已经要求送到回收口。","领取是「受け取り」，与返却相反。"],"explain":{"text":"「返却口」是归还、回收物品的地方。在这种自助收餐的店，吃完把碗盘送到指定位置；不要把这个要求当成所有拉面店的统一规则。","examples":[["返却口はどこですか？","餐具回收口在哪里？","找回收位置"]]}},{"s":"ramen","t":"s","q":"你和朋友排在店外，想确认这里是不是队尾。","o":["ここが最後尾(さいこうび)ですか？","ここで食券(しょっけん)を買(か)うんですか？","ここで待(ま)ち合(あ)わせしてもいいですか？"],"a":0,"e":"排队时问「ここが最後尾ですか？」就是“这里是队尾吗”。向前面的人轻声问一句即可；它不是在问买券位置。","d":["这句是在问是否在这里买餐券。","这句是在问能否把这里当作碰面地点。"],"explain":{"text":"排队时问「ここが最後尾ですか？」就是“这里是队尾吗”。向前面的人轻声问一句即可；它不是在问买券位置。","examples":[["すみません、ここが最後尾ですか？","不好意思，这里是队尾吗？","确认队尾"]]}},{"s":"ramen","t":"s","q":"店员让你先买餐券，但你不认识机器上的菜单，想请他教你操作。","o":["すみません、使(つか)い方(かた)を教(おし)えてもらえますか？","すみません、席(せき)を替(か)えてもらえますか？","すみません、注文(ちゅうもん)を取(と)り消(け)してもらえますか？"],"a":0,"e":"「使い方」是使用方法。「教えてもらえますか」是自然、礼貌地请对方教你，不需要把机器的正式名称全部说出来，指着机器问也可以。","d":["这句是在请求换座位。","这句是在请求取消订单。"],"explain":{"text":"「使い方」是使用方法。「教えてもらえますか」是自然、礼貌地请对方教你，不需要把机器的正式名称全部说出来，指着机器问也可以。","examples":[["このボタンでいいですか？","按这个按钮就可以吗？","操作时确认"],["使い方を教えてもらえますか？","能教我怎么用吗？","请求帮助"]]}},{"s":"ramen","t":"s","q":"你只有一张一万日元纸币，想先确认餐券机能不能用。","o":["一万円札(いちまんえんさつ)は使(つか)えますか？","一万円札(いちまんえんさつ)に両替(りょうがえ)できますか？","一万円分(いちまんえんぶん)の食券(しょっけん)を買(か)えますか？"],"a":0,"e":"机器接受哪些纸币因店而异。「一万円札は使えますか？」就是直接问一万日元纸币能否使用；如果不能，再询问是否能换零钱。","d":["这句是想把钱换成一万日元纸币，方向相反。","这句是问能否购买价值一万日元的餐券。"],"explain":{"text":"机器接受哪些纸币因店而异。「一万円札は使えますか？」就是直接问一万日元纸币能否使用；如果不能，再询问是否能换零钱。","examples":[["一万円札は使えますか？","能用一万日元纸币吗？","先确认"],["両替してもらえますか？","能帮我换零钱吗？","机器不收大额纸币时"]]}},{"s":"ramen","t":"s","q":"你想要清淡一点的拉面，希望店员推荐，不是要求眼前这碗少放油。","o":["あっさりしたラーメンはどれですか？","油(あぶら)を少(すく)なめにできますか？","麺(めん)を少(すく)なめにできますか？"],"a":0,"e":"「あっさりした」说整体口感清爽、清淡。「油少なめ」只是少油的要求，两者不完全相同。选菜单时，问哪一款更清淡比较明确。","d":["这是调整油量，并不是请店员推荐一款清淡的拉面。","这是减少面量，不是改变口味。"],"explain":{"text":"「あっさりした」说整体口感清爽、清淡。「油少なめ」只是少油的要求，两者不完全相同。选菜单时，问哪一款更清淡比较明确。","examples":[["あっさりしたものがいいです。","我想吃清淡一点的。","说明偏好"],["こってりしたものはどれですか？","哪一款比较浓厚？","想吃浓厚口味时"]]}},{"s":"ramen","t":"s","q":"这家店允许调整味道浓淡。你想让汤的调味淡一点。","o":["味(あじ)は薄(うす)めでお願(ねが)いします。","味(あじ)は濃(こ)いめでお願(ねが)いします。","麺(めん)は少(すく)なめでお願(ねが)いします。"],"a":0,"e":"点单时说「味は薄めでお願いします」是在调整调味浓淡，不是让店员减少汤量。能否调整要看店铺；不确定可先问「薄めにできますか？」。","d":["「濃いめ」是更浓，与要求相反。","「麺少なめ」是减少面量。"],"explain":{"text":"点单时说「味は薄めでお願いします」是在调整调味浓淡，不是让店员减少汤量。能否调整要看店铺；不确定可先问「薄めにできますか？」。","examples":[["味は薄めでお願いします。","麻烦味道淡一点。","店员正在询问口味"],["味を薄めにできますか？","可以做淡一点吗？","先问是否能调整"]]}},{"s":"ramen","t":"s","q":"这家店可以调整油量。你想少放油，但不要求完全去掉油。","o":["油(あぶら)少(すく)なめでお願(ねが)いします。","油(あぶら)多(おお)めでお願(ねが)いします。","スープ少(すく)なめでお願(ねが)いします。"],"a":0,"e":"「少なめ」是比通常少一点，并不是完全没有。想完全不放要另问是否能做到，不能用「少なめ」代替「なし」。","d":["「多め」是多一些。","这句减少的是汤量，不是油量。"],"explain":{"text":"「少なめ」是比通常少一点，并不是完全没有。想完全不放要另问是否能做到，不能用「少なめ」代替「なし」。","examples":[["油少なめでお願いします。","麻烦少油。","点单时调整"],["油なしにもできますか？","也可以完全不放油吗？","想进一步确认"]]}},{"s":"ramen","t":"s","q":"你想在拉面里加一颗味玉。","o":["味玉(あじたま)を一(ひと)つ追加(ついか)してください。","味玉(あじたま)を抜(ぬ)いてください。","味玉(あじたま)は別皿(べつざら)にしてください。"],"a":0,"e":"「追加」是另加。味玉通常是单列的配料，能否直接向店员追加、还是需要另买餐券，按店铺流程来。","d":["「抜いて」是不放，与加一颗相反。","「別皿」是另外装盘，没有表达增加数量。"],"explain":{"text":"「追加」是另加。味玉通常是单列的配料，能否直接向店员追加、还是需要另买餐券，按店铺流程来。","examples":[["味玉を一つ追加できますか？","可以加一颗味玉吗？","先询问能否加料"],["追加の食券は必要ですか？","需要另买加料餐券吗？","确认付款流程"]]}},{"s":"ramen","t":"s","q":"你不喜欢葱，想在下单时请求不放葱。这次只是口味偏好。","o":["ねぎ抜(ぬ)きでお願(ねが)いします。","ねぎ多(おお)めでお願(ねが)いします。","ねぎは別皿(べつざら)でお願(ねが)いします。"],"a":0,"e":"「ねぎ抜き」是不放葱；「別皿」则是葱仍然要，只不过另外装。若是过敏而非口味偏好，需要明确说过敏，并让店员确认能否处理。","d":["「多め」是多放。","「別皿」只改变盛放方式，仍会提供葱。"],"explain":{"text":"「ねぎ抜き」是不放葱；「別皿」则是葱仍然要，只不过另外装。若是过敏而非口味偏好，需要明确说过敏，并让店员确认能否处理。","examples":[["ねぎ抜きにできますか？","可以不放葱吗？","先询问"],["ねぎは少なめでお願いします。","麻烦少放一点葱。","可以接受少量时"]]}},{"s":"ramen","t":"s","q":"你想点普通份拉面，但把面量减一点，不是换成偏软的面。","o":["麺(めん)を少(すく)なめにできますか？","麺(めん)をやわらかめにできますか？","麺(めん)を大盛(おおも)りにできますか？"],"a":0,"e":"「麺少なめ」是减少面量，「やわらかめ」是煮软一点。份量和硬度是两个不同要求；少面是否减价要另问，不能默认会便宜。","d":["这句改变的是硬度，不是数量。","「大盛り」是加大份。"],"explain":{"text":"「麺少なめ」是减少面量，「やわらかめ」是煮软一点。份量和硬度是两个不同要求；少面是否减价要另问，不能默认会便宜。","examples":[["麺を少なめにできますか？","面可以少一点吗？","调整面量"],["半分くらいにできますか？","可以减到大约一半吗？","说明想要的份量"]]}},{"s":"ramen","t":"s","q":"你吃完蘸面，觉得剩下的蘸汁太浓，想问能不能加汤稀释来喝。","o":["スープ割(わ)りはできますか？","替(か)え玉(だま)はできますか？","スープを濃(こ)くできますか？"],"a":0,"e":"在蘸面店，「スープ割り」是用高汤等稀释剩余蘸汁，方便饮用。并不是所有店都提供，先问一句很自然；它和加一份面的「替え玉」不同。","d":["「替え玉」是续面。","这句要求汤更浓，方向相反。"],"explain":{"text":"在蘸面店，「スープ割り」是用高汤等稀释剩余蘸汁，方便饮用。并不是所有店都提供，先问一句很自然；它和加一份面的「替え玉」不同。","examples":[["スープ割りをお願いします。","麻烦加汤稀释蘸汁。","确认店里提供之后"],["割りスープはどこですか？","稀释用的汤在哪里？","店里是自助添加时"]]}},{"s":"ramen","t":"s","q":"吃完准备离开，你想自然地向店员道谢。","o":["ごちそうさまでした。","いただきます。","お待(ま)たせしました。"],"a":0,"e":"离店时说「ごちそうさまでした」是常见的用餐结束致谢。喜欢这碗面，也可以再说一句「おいしかったです」。这不代替结账，付款流程仍按店里安排。","d":["「いただきます」通常在开始吃之前说。","「お待たせしました」是“让您久等了”，多由提供服务的人说。"],"explain":{"text":"离店时说「ごちそうさまでした」是常见的用餐结束致谢。喜欢这碗面，也可以再说一句「おいしかったです」。这不代替结账，付款流程仍按店里安排。","examples":[["ごちそうさまでした。","谢谢款待。","吃完离开时"],["おいしかったです。ごちそうさまでした。","很好吃，谢谢款待。","想表达喜欢时"]]}},{"s":"ramen","t":"s","q":"面已经上桌，但你没拿到喝汤的勺子，想向店员要一个。","o":["すみません、レンゲをもらえますか？","すみません、取(と)り皿(ざら)をもらえますか？","すみません、紙(かみ)エプロンをもらえますか？"],"a":0,"e":"拉面碗旁边那种喝汤的勺子叫「レンゲ」。直接说物品名加「もらえますか」就能礼貌地请求，不用把用途说得很长。","d":["「取り皿」是分餐碟。","「紙エプロン」是一次性纸围裙。"],"explain":{"text":"拉面碗旁边那种喝汤的勺子叫「レンゲ」。直接说物品名加「もらえますか」就能礼貌地请求，不用把用途说得很长。","examples":[["すみません、レンゲをお願いします。","不好意思，麻烦给个汤勺。","需要汤勺"],["お箸ももらえますか？","也能给我一双筷子吗？","还缺筷子时"]]}}],"quiz/series-conv":[{"uid":"series-v1:conv:heat-one:r","s":"conv","t":"r","q":"你买了两份便当，店员确认要加热哪些。 对方说了下面这句话，是什么意思？","j":"こちらのお弁当(べんとう)も温め(あたため)ますか？","o":["这份便当也要加热吗？","您有积分卡吗？","现在有的只有这一款。"],"a":0,"e":"买了几份便当时，店员可能逐个确认。「も」是“也”，「これだけ」是“只有这个”。指着要加热的那份说，会比只回答一个「はい」更清楚。","d":["这个选项对应另一种意思；本题说的是“这份便当也要加热吗？”。","这个选项对应另一种意思；本题说的是“这份便当也要加热吗？”。"],"explain":{"text":"买了几份便当时，店员可能逐个确认。「も」是“也”，「これだけ」是“只有这个”。指着要加热的那份说，会比只回答一个「はい」更清楚。","examples":[["これだけ温めてください。","请只加热这一份。","你可以这样说"],["こちらのお弁当も温めますか？","这份便当也要加热吗？","也可能听到对方这样说"]]}},{"uid":"series-v1:conv:heat-one:s","s":"conv","t":"s","q":"你只想加热其中这一份，指着它该怎么说？","o":["これだけ温め(あたため)てください。","持っていません。","これの大きいサイズはありますか？"],"a":0,"e":"买了几份便当时，店员可能逐个确认。「も」是“也”，「これだけ」是“只有这个”。指着要加热的那份说，会比只回答一个「はい」更清楚。","d":["这句话是“我没有。”。","这句话是“这个有大包装吗？”。"],"explain":{"text":"买了几份便当时，店员可能逐个确认。「も」是“也”，「これだけ」是“只有这个”。指着要加热的那份说，会比只回答一个「はい」更清楚。","examples":[["これだけ温めてください。","请只加热这一份。","你可以这样说"],["こちらのお弁当も温めますか？","这份便当也要加热吗？","也可能听到对方这样说"]]}},{"uid":"series-v1:conv:cutlery:r","s":"conv","t":"r","q":"你买了两份饭，店员在准备餐具。 对方说了下面这句话，是什么意思？","j":"お箸は何膳おつけしますか？","o":["要附几双筷子？","请拿好找零和小票。","折扣会在收银时扣除。"],"a":0,"e":"筷子的量词是「膳」，两双读「にぜん」。便利店也会问需要几个勺子。只要把餐具和数量说清楚即可，不用说成很长的完整句。","d":["这个选项对应另一种意思；本题说的是“要附几双筷子？”。","这个选项对应另一种意思；本题说的是“要附几双筷子？”。"],"explain":{"text":"筷子的量词是「膳」，两双读「にぜん」。便利店也会问需要几个勺子。只要把餐具和数量说清楚即可，不用说成很长的完整句。","examples":[["お箸を二膳お願いします。","麻烦给两双筷子。","你可以这样说"],["お箸は何膳おつけしますか？","要附几双筷子？","也可能听到对方这样说"]]}},{"uid":"series-v1:conv:cutlery:s","s":"conv","t":"s","q":"你和朋友各需要一双筷子，怎么告诉店员？","o":["お箸を二膳お願いします。","お釣り(おつり)はどこから出ますか？","このシールの値段になりますか？"],"a":0,"e":"筷子的量词是「膳」，两双读「にぜん」。便利店也会问需要几个勺子。只要把餐具和数量说清楚即可，不用说成很长的完整句。","d":["这句话是“找零从哪里出来？”。","这句话是“会按这个贴纸上的价格算吗？”。"],"explain":{"text":"筷子的量词是「膳」，两双读「にぜん」。便利店也会问需要几个勺子。只要把餐具和数量说清楚即可，不用说成很长的完整句。","examples":[["お箸を二膳お願いします。","麻烦给两双筷子。","你可以这样说"],["お箸は何膳おつけしますか？","要附几双筷子？","也可能听到对方这样说"]]}},{"uid":"series-v1:conv:spoon:r","s":"conv","t":"r","q":"你买了一杯酸奶，店员问餐具。 对方说了下面这句话，是什么意思？","j":"スプーンはおつけしますか？","o":["需要附勺子吗？","咖啡请使用那边的机器。","这个不是按个卖，而是按重量计价。"],"a":0,"e":"「おつけしますか」在收银场景里是在问是否附带某样东西，不是问把东西粘在哪里。没拿到餐具时，付款后也可以礼貌地向店员询问。","d":["这个选项对应另一种意思；本题说的是“需要附勺子吗？”。","这个选项对应另一种意思；本题说的是“需要附勺子吗？”。"],"explain":{"text":"「おつけしますか」在收银场景里是在问是否附带某样东西，不是问把东西粘在哪里。没拿到餐具时，付款后也可以礼貌地向店员询问。","examples":[["すみません、スプーンを一つもらえますか？","不好意思，能给我一个勺子吗？","你可以这样说"],["スプーンはおつけしますか？","需要附勺子吗？","也可能听到对方这样说"]]}},{"uid":"series-v1:conv:spoon:s","s":"conv","t":"s","q":"你买酸奶忘了拿勺子，想补要一个，怎么说？","o":["すみません、スプーンを一つもらえますか？","このカップはどのボタンですか？","これは一個の値段ですか？"],"a":0,"e":"「おつけしますか」在收银场景里是在问是否附带某样东西，不是问把东西粘在哪里。没拿到餐具时，付款后也可以礼貌地向店员询问。","d":["这句话是“这个杯子对应哪个按钮？”。","这句话是“这是一个的价格吗？”。"],"explain":{"text":"「おつけしますか」在收银场景里是在问是否附带某样东西，不是问把东西粘在哪里。没拿到餐具时，付款后也可以礼貌地向店员询问。","examples":[["すみません、スプーンを一つもらえますか？","不好意思，能给我一个勺子吗？","你可以这样说"],["スプーンはおつけしますか？","需要附勺子吗？","也可能听到对方这样说"]]}},{"uid":"series-v1:conv:bag-separate:r","s":"conv","t":"r","q":"你同时买了热便当和冰淇淋，店员问装袋方式。 对方说了下面这句话，是什么意思？","j":"温かい(あたたかい)ものと冷たい(つめたい)ものは、袋を分けますか？","o":["热的和冷的要分开装袋吗？","热水在收银台旁边。","请扫描商品条形码。"],"a":0,"e":"「分ける」是分开。在这里分的是袋子，不是账单。是否会增加袋子费用以店铺说明为准，如果只想用一个袋子，可以说「一緒で大丈夫です」。","d":["这个选项对应另一种意思；本题说的是“热的和冷的要分开装袋吗？”。","这个选项对应另一种意思；本题说的是“热的和冷的要分开装袋吗？”。"],"explain":{"text":"「分ける」是分开。在这里分的是袋子，不是账单。是否会增加袋子费用以店铺说明为准，如果只想用一个袋子，可以说「一緒で大丈夫です」。","examples":[["袋を分けてもらえますか？","能帮我分开装袋吗？","你可以这样说"],["温かいものと冷たいものは、袋を分けますか？","热的和冷的要分开装袋吗？","也可能听到对方这样说"]]}},{"uid":"series-v1:conv:bag-separate:s","s":"conv","t":"s","q":"你希望热便当和冷饮分开放，怎么说？","o":["袋を分けてもらえますか？","お湯(おゆ)はどこにありますか？","すみません、バーコードが読み取れません。"],"a":0,"e":"「分ける」是分开。在这里分的是袋子，不是账单。是否会增加袋子费用以店铺说明为准，如果只想用一个袋子，可以说「一緒で大丈夫です」。","d":["这句话是“热水在哪里？”。","这句话是“不好意思，条形码扫不出来。”。"],"explain":{"text":"「分ける」是分开。在这里分的是袋子，不是账单。是否会增加袋子费用以店铺说明为准，如果只想用一个袋子，可以说「一緒で大丈夫です」。","examples":[["袋を分けてもらえますか？","能帮我分开装袋吗？","你可以这样说"],["温かいものと冷たいものは、袋を分けますか？","热的和冷的要分开装袋吗？","也可能听到对方这样说"]]}},{"uid":"series-v1:conv:payment-screen:r","s":"conv","t":"r","q":"商品扫完后，店员指着你面前的屏幕。 对方说了下面这句话，是什么意思？","j":"お支払い(しはらい)方法を画面でお選びください。","o":["请在屏幕上选择付款方式。","您是在店里吃吗？","购物篮请放回这里。"],"a":0,"e":"有的收银台由店员扫码、客人自行在机器上付款。「お選びください」是请你选择，先看屏幕，再按所选方式操作，不一定要把现金交给店员。","d":["这个选项对应另一种意思；本题说的是“请在屏幕上选择付款方式。”。","这个选项对应另一种意思；本题说的是“请在屏幕上选择付款方式。”。"],"explain":{"text":"有的收银台由店员扫码、客人自行在机器上付款。「お選びください」是请你选择，先看屏幕，再按所选方式操作，不一定要把现金交给店员。","examples":[["現金もこちらで払うんですか？","现金也是在这里付吗？","你可以这样说"],["お支払い方法を画面でお選びください。","请在屏幕上选择付款方式。","也可能听到对方这样说"]]}},{"uid":"series-v1:conv:payment-screen:s","s":"conv","t":"s","q":"你不确定现金付款是不是也在机器上操作，怎么问？","o":["現金(げんきん)もこちらで払うんですか？","ここで食べてもいいですか？","かごはここに 是在说明叫号方式，拿好号码牌，在指定位置等待就行。不知道等在哪里，直接问「どこで待てばいいですか？」。","examples":[["どこで待てばいいですか？","我应该在哪里等？","你可以这样说"],["番号でお呼びしますので、こちらでお待ちください。","请在这里等，之后会按号码叫你。","也可能听到对方这样说"]]}},{"uid":"series-v1:ramen:wait-number:s","s":"ramen","t":"s","q":"你拿到了号码牌，但不知道到哪里等取餐，怎么问？","o":["どこで待てばいいですか？","ライスは大丈夫(だいじょうぶ)です。","すみません、水をこぼしてしまいました。"],"a":0,"e":"有的店会按号码叫客人取餐或入座。「番号でお呼びします」是在说明叫号方式，拿好号码牌，在指定位置等待就行。不知道等在哪里，直接问「どこで待てばいいですか？」。","d":["这句话是“米饭就不用了。”。","这句话是“不好意思，我把水洒了。”。"],"explain":{"text":"有的店会按号码叫客人取餐或入座。「番号でお呼びします」是在说明叫号方式，拿好号码牌，在指定位置等待就行。不知道等在哪里，直接问「どこで待てばいいですか？」。","examples":[["どこで待てばいいですか？","我应该在哪里等？","你可以这样说"],["番号でお呼びしますので、こちらでお待ちください。","请在这里等，之后会按号码叫你。","也可能听到对方这样说"]]}},{"uid":"series-v1:ramen:order-mistake:r","s":"ramen","t":"r","q":"你发现买错了餐券，刚向店员提出更改。 对方说了下面这句话，是什么意思？","j":"まだ作っていないので、変更(へんこう)できますよ。","o":["还没有开始做，可以更改。","即使普通份，面量也偏多。","需要小票吗？"],"a":0,"e":"「買い間違えた」是买错了。能不能更改取决于店铺和厨房是否已制作，所以先询问，不要直接把新券当作替换成功。这里店员明确表示尚未制作，可以更改。","d":["这个选项对应另一种意思；本题说的是“还没有开始做，可以更改。”。","这个选项对应另一种意思；本题说的是“还没有开始做，可以更改。”。"],"explain":{"text":"「買い間違えた」是买错了。能不能更改取决于店铺和厨房是否已制作，所以先询问，不要直接把新券当作替换成功。这里店员明确表示尚未制作，可以更改。","examples":[["食券を買い間違えたんですが、変更できますか？","我买错餐券了，可以更改吗？","你可以这样说"],["まだ作っていないので、変更できますよ。","还没有开始做，可以更改。","也可能听到对方这样说"]]}},{"uid":"series-v1:ramen:order-mistake:s","s":"ramen","t":"s","q":"刚买完餐券就发现选错了，想先问能不能换，怎么说？","o":["食券(しょっけん)を買い間違えたんですが、変更(へんこう)できますか？","並盛り(なみもり)は麺が何グラムですか？","レシートをお願いします。"],"a":0,"e":"「買い間違えた」是买错了。能不能更改取决于店铺和厨房是否已制作，所以先询问，不要直接把新券当作替换成功。这里店员明确表示尚未制作，可以更改。","d":["这句话是“普通份的面是多少克？”。","这句话是“麻烦给我小票。”。"],"explain":{"text":"「買い間違えた」是买错了。能不能更改取决于店铺和厨房是否已制作，所以先询问，不要直接把新券当作替换成功。这里店员明确表示尚未制作，可以更改。","examples":[["食券を買い間違えたんですが、変更できますか？","我买错餐券了，可以更改吗？","你可以这样说"],["まだ作っていないので、変更できますよ。","还没有开始做，可以更改。","也可能听到对方这样说"]]}},{"uid":"series-v1:ramen:separate-seat:r","s":"ramen","t":"r","q":"你和朋友一起等位，店员说明现在剩余的座位。 对方说了下面这句话，是什么意思？","j":"今は一席(いっせき)ずつしか空いていません。","o":["现在只有分开的单个空位。","这是饺子用的醋。","哪位点的是味噌拉面？"],"a":0,"e":"「一席ずつ」说明空位是分散的，不是两人挨着的座位。「隣同士」就是彼此相邻。愿意等连在一起的座位，可以明确说出来，而不是直接回答不坐。","d":["这个选项对应另一种意思；本题说的是“现在只有分开的单个空位。”。","这个选项对应另一种意思；本题说的是“现在只有分开的单个空位。”。"],"explain":{"text":"「一席ずつ」说明空位是分散的，不是两人挨着的座位。「隣同士」就是彼此相邻。愿意等连在一起的座位，可以明确说出来，而不是直接回答不坐。","examples":[["隣同士で座れるまで待ちます。","我们等到能挨着坐的时候。","你可以这样说"],["今は一席ずつしか空いていません。","现在只有分开的单个空位。","也可能听到对方这样说"]]}},{"uid":"series-v1:ramen:separate-seat:s","s":"ramen","t":"s","q":"你们想坐在一起，也愿意再等一会儿，怎么告诉店员？","o":["隣同士で座れるまで待ちます。","これ、お酢ですか？","はい、私です。"],"a":0,"e":"「一席ずつ」说明空位是分散的，不是两人挨着的座位。「隣同士」就是彼此相邻。愿意等连在一起的座位，可以明确说出来，而不是直接回答不坐。","d":["这句话是“这个是醋吗？”。","这句话是“是我。”。"],"explain":{"text":"「一席ずつ」说明空位是分散的，不是两人挨着的座位。「隣同士」就是彼此相邻。愿意等连在一起的座位，可以明确说出来，而不是直接回答不坐。","examples":[["隣同士で座れるまで待ちます。","我们等到能挨着坐的时候。","你可以这样说"],["今は一席ずつしか空いていません。","现在只有分开的单个空位。","也可能听到对方这样说"]]}},{"uid":"series-v1:ramen:small-rice:r","s":"ramen","t":"r","q":"你点完拉面，店员介绍这家店的午间搭配。 对方说了下面这句话，是什么意思？","j":"ランチタイムは小ライス(こライス)がつきますが、いかがですか？","o":["午餐时段附带小碗米饭，你需要吗？","我马上来擦，先放着就可以。","不好意思，今天汤已经卖完，停止营业了。"],"a":0,"e":"这里的「つきます」是附带，不是让你再点一份主食。店员在询问你是否需要。「大丈夫です」接在这类服务提议后，可以表示“不用了”；如果想要，就说「お願いします」。","d":["这个选项对应另一种意思；本题说的是“午餐时段附带小碗米饭，你需要吗？”。","这个选项对应另一种意思；本题说的是“午餐时段附带小碗米饭，你需要吗？”。"],"explain":{"text":"这里的「つきます」是附带，不是让你再点一份主食。店员在询问你是否需要。「大丈夫です」接在这类服务提议后，可以表示“不用了”；如果想要，就说「お願いします」。","examples":[["ライスは大丈夫です。","米饭就不用了。","你可以这样说"],["ランチタイムは小ライスがつきますが、いかがですか？","午餐时段附带小碗米饭，你需要吗？","也可能听到对方这样说"]]}},{"uid":"series-v1:ramen:small-rice:s","s":"ramen","t":"s","q":"这碗拉面已经够吃，你想婉拒附带的小碗饭，怎么说？","o":["ライスは大丈夫(だいじょうぶ)です。","すみません、水をこぼしてしまいました。","まだ入れますか？"],"a":0,"e":"这里的「つきます」是附带，不是让你再点一份主食。店员在询问你是否需要。「大丈夫です」接在这类服务提议后，可以表示“不用了”；如果想要，就说「お願いします」。","d":["这句话是“不好意思，我把水洒了。”。","这句话是“现在还能进去用餐吗？”。"],"explain":{"text":"这里的「つきます」是附带，不是让你再点一份主食。店员在询问你是否需要。「大丈夫です」接在这类服务提议后，可以表示“不用了”；如果想要，就说「お願いします」。","examples":[["ライスは大丈夫です。","米饭就不用了。","你可以这样说"],["ランチタイムは小ライスがつきますが、いかがですか？","午餐时段附带小碗米饭，你需要吗？","也可能听到对方这样说"]]}},{"uid":"series-v1:ramen:noodle-amount:r","s":"ramen","t":"r","q":"你指着一款拉面询问大小份。 对方说了下面这句话，是什么意思？","j":"並盛り(なみもり)でも麺の量は多めです。","o":["即使普通份，面量也偏多。","需要小票吗？","请在这里等，之后会按号码叫你。"],"a":0,"e":"「並盛り」是普通份，不等于每家店都有一样的重量。如果店员说面量偏多，可 うんですか？","すみません、これはいくらですか？"],"a":0,"e":"试穿后不合适或还没决定，可以直接说「少し考えます」。不用编理由，也不必为了礼貌而说已经决定购买。","d":["这句话是“这个怎么用？”。","这句话是“不好意思，这个多少钱？”。"],"explain":{"text":"试穿后不合适或还没决定，可以直接说「少し考えます」。不用编理由，也不必为了礼貌而说已经决定购买。","examples":[["少し考えます。ありがとうございます。","我再考虑一下，谢谢。","你可以这样说"],["どうぞごゆっくりご検討ください。","请慢慢考虑。","也可能听到对方这样说"]]}}],"quiz/series-train":[{"uid":"series-v1:train:platform:r","s":"train","t":"r","q":"你拿着手机路线给站员看，他告诉你乘车位置。 对方说了下面这句话，是什么意思？","j":"その電車(でんしゃ)は三番線(さんばんせん)から出ます。","o":["那趟车从3号站台发车。","可以在那边的机器充值。","那个方向的末班车已经开走了。"],"a":0,"e":"「番線」是在站内找车时常见的说法。它与车厢编号、出口编号不同。题里的三番线只是这次对话中的站台，实际出行要看当天的显示屏和站员指引。","d":["这个选项对应另一种意思；本题说的是“那趟车从3号站台发车。”。","这个选项对应另一种意思；本题说的是“那趟车从3号站台发车。”。"],"explain":{"text":"「番線」是在站内找车时常见的说法。它与车厢编号、出口编号不同。题里的三番线只是这次对话中的站台，实际出行要看当天的显示屏和站员指引。","examples":[["この電車は何番線ですか？","这趟车在几号站台？","你可以这样说"],["その電車は三番線から出ます。","那趟车从3号站台发车。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:platform:s","s":"train","t":"s","q":"你知道目的地，但不知道去哪个站台，怎么问？","o":["この電車(でんしゃ)は何番線ですか？","ICカードはどこでチャージできますか？","この方面(ほうめん)の終電(しゅうでん)は何時ですか？"],"a":0,"e":"「番線」是在站内找车时常见的说法。它与车厢编号、出口编号不同。题里的三番线只是这次对话中的站台，实际出行要看当天的显示屏和站员指引。","d":["这句话是“交通IC卡在哪里可以充值？”。","这句话是“这个方向的末班车是几点？”。"],"explain":{"text":"「番線」是在站内找车时常见的说法。它与车厢编号、出口编号不同。题里的三番线只是这次对话中的站台，实际出行要看当天的显示屏和站员指引。","examples":[["この電車は何番線ですか？","这趟车在几号站台？","你可以这样说"],["その電車は三番線から出ます。","那趟车从3号站台发车。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:direction:r","s":"train","t":"r","q":"你在站台上确认是不是坐反了方向。 对方说了下面这句话，是什么意思？","j":"こちらは反対方面(はんたいほうめん)です。","o":["这里是相反方向。","余额不足，需要补足车费。","在下一站下车，再乘反方向的车。"],"a":0,"e":"同一条线路往往有两个方向。「反対方面」说明当前这边方向不对，不一定是整条线路错了。问方向时给出目的地，比只问“对不对”更清楚。","d":["这个选项对应另一种意思；本题说的是“这里是相反方向。”。","这个选项对应另一种意思；本题说的是“这里是相反方向。”。"],"explain":{"text":"同一条线路往往有两个方向。「反対方面」说明当前这边方向不对，不一定是整条线路错了。问方向时给出目的地，比只问“对不对”更清楚。","examples":[["渋谷へ行くのはこちらで合っていますか？","去涩谷走这边对吗？","你可以这样说"],["こちらは反対方面です。","这里是相反方向。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:direction:s","s":"train","t":"s","q":"你想去涩谷，想确认是不是这个方向，怎么问？","o":["渋谷(しぶや)へ行くのはこちらで合っていますか？","すみません、改札(かいさつ)を出られません。","乗り過ごしてしまいました。どうすればいいですか？"],"a":0,"e":"同一条线路往往有两个方向。「反対方面」说明当前这边方向不对，不一定是整条线路错了。问方向时给出目的地，比只问“对不对”更清楚。","d":["这句话是“不好意思，我出不了检票口。”。","这句话是“我坐过站了，该怎么办？”。"],"explain":{"text":"同一条线路往往有两个方向。「反対方面」说明当前这边方向不对，不一定是整条线路错了。问方向时给出目的地，比只问“对不对”更清楚。","examples":[["渋谷へ行くのはこちらで合っていますか？","去涩谷走这边对吗？","你可以这样说"],["こちらは反対方面です。","这里是相反方向。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:stops:r","s":"train","t":"r","q":"你指着想下车的小站，站员看完后说。 对方说了下面这句话，是什么意思？","j":"この快速(かいそく)は、その駅には止まりません。","o":["这趟快速列车不在那个站停。","如果还没使用，我帮您确认能否更改。","这趟车到本站就终到。"],"a":0,"e":"到同一方向的车，停靠站也可能不同。「止まりません」明确说不停，不是到站时间较晚。把地图上的站名给站员看，可以避免读错地名。","d":["这个选项对应另一种意思；本题说的是“这趟快速列车不在那个站停。”。","这个选项对应另一种意思；本题说的是“这趟快速列车不在那个站停。”。"],"explain":{"text":"到同一方向的车，停靠站也可能不同。「止まりません」明确说不停，不是到站时间较晚。把地图上的站名给站员看，可以避免读错地名。","examples":[["この電車は、この駅に止まりますか？","这趟车在这个站停吗？","你可以这样说"],["この快速は、その駅には止まりません。","这趟快速列车不在那个站停。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:stops:s","s":"train","t":"s","q":"你不确定列车是否停靠目的地，怎么问？","o":["この電車(でんしゃ)は、この駅に止まりますか？","切符(きっぷ)を買い間違えました。変更(へんこう)できますか？","ここで降りないといけませんか？"],"a":0,"e":"到同一方向的车，停靠站也可能不同。「止まりません」明确说不停，不是到站时间较晚。把地图上的站名给站员看，可以避免读错地名。","d":["这句话是“我买错车票了，可以更改吗？”。","这句话是“必须在这里下车吗？”。"],"explain":{"text":"到同一方向的车，停靠站也可能不同。「止まりません」明确说不停，不是到站时间较晚。把地图上的站名给站员看，可以避免读错地名。","examples":[["この電車は、この駅に止まりますか？","这趟车在这个站停吗？","你可以这样说"],["この快速は、その駅には止まりません。","这趟快速列车不在那个站停。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:transfer-one:r","s":"train","t":"r","q":"你问如何到达目的地，站员说明需要换乘。 对方说了下面这句话，是什么意思？","j":"次の駅で乗り換え(のりかえ)てください。","o":["请在下一站换乘。","这里是指定席，请确认你持有的车票。","电梯在站台尽头。"],"a":0,"e":"「乗り換えなし」是不用换车。听到「次の駅で」时要留意下一站，而不是一直坐到线路终点。实际换到哪条线，可以继续请站员在地图上指出。","d":["这个选项对应另一种意思；本题说的是“请在下一站换乘。”。","这个选项对应另一种意思；本题说的是“请在下一站换乘。”。"],"explain":{"text":"「乗り換えなし」是不用换车。听到「次の駅で」时要留意下一站，而不是一直坐到线路终点。实际换到哪条线，可以继续请站员在地图上指出。","examples":[["乗り換えなしで行けますか？","不用换乘能到吗？","你可以这样说"],["次の駅で乗り換えてください。","请在下一站换乘。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:transfer-one:s","s":"train","t":"s","q":"你想确认是不是不换乘也能直达，怎么问？","o":["乗り換え(のりかえ)なしで行けますか？","この切符(きっぷ)は指定席(していせき)ですか？","エレベーターはどこですか？"],"a":0,"e":"「乗り換えなし」是不用换车。听到「次の駅で」时要留意下一站，而不是一直坐到线路终点。实际换到哪条线，可以继续请站员在地图上指出。","d":["这句话是“这张票是指定席吗？”。","这句话是“电梯在哪里？”。"],"explain":{"text":"「乗り換えなし」是不用换车。听到「次の駅で」时要留意下一站，而不是一直坐到线路终点。实际换到哪条线，可以继续请站员在地图上指出。","examples":[["乗り換えなしで行けますか？","不用换乘能到吗？","你可以这样说"],["次の駅で乗り換えてください。","请在下一站换乘。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:transfer-gates:r","s":"train","t":"r","q":"你沿着换乘指示走，工作人员补充一条路线要求。 对方说了下面这句话，是什么意思？","j":"乗り換え(のりかえ)は、いったん改札(かいさつ)を出てください。","o":["这次换乘请先出一次检票口。","5号车厢还要往前一点。","大的寄存柜现在都在使用中。"],"a":0,"e":"有的换乘在付费区内完成，有的需要经过指定检票口。「いったん」是暂且、先做一次。不要把这句话理解成所有车站换乘都必须出闸，按当前路线确认。","d":["这个选项对应另一种意思；本题说的是“这次换乘请先出一次检票口。”。","这个选项对应另一种意思；本题说的是“这次换乘请先出一次检票口。”。"],"explain":{"text":"有的换乘在付费区内完成，有的需要经过指定检票口。「いったん」是暂且、先做一次。不要把这句话理解成所有车站换乘都必须出闸，按当前路线确认。","examples":[["乗り換えるとき、改札を出ますか？","换乘时需要出检票口吗？","你可以这样说"],["乗り換えは、いったん改札を出てください。","这次换乘请先出一次检票口。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:transfer-gates:s","s":"train","t":"s","q":"你担心换乘时是否要出闸，怎么问？","o":["乗り換え(のりかえ)るとき、改札(かいさつ)を出ますか？","五号車(ごごうしゃ)はどの辺りですか？","ほかに荷物(にもつ)を預けられる場所(ばしょ)はありますか？"],"a":0,"e":"有的换乘在付费区内完成，有的需要经过指定检票口。「いったん」是暂且、先做一次。不要把这句话理解成所有车站换乘都必须出闸，按当前路线确认。","d":["这句话是“5号车厢大概在什么位置？”。","这句话是“还有其他可以寄存行李的地方吗？”。"],"explain":{"text":"有的换乘在付费区内完成，有的需要经过指定检票口。「いったん」是暂且、先做一次。不要把这句话理解成所有车站换乘都必须出闸，按当前路线确认。","examples":[["乗り換えるとき、改札を出ますか？","换乘时需要出检票口吗？","你可以这样说"],["乗り換えは、いったん改札を出てください。","这次换乘请先出一次检票口。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:exit-name:r","s":"train","t":"r","q":"你给站员看酒店位置，他建议一个出口。 对方说了下面这句话，是什么意思？","j":"ホテルへ行くなら、東口(ひがしぐち)が近いです。","o":["去酒店的话，东口比较近。","列车晚点了，请再等一会儿。","遗失物品的询问在这个窗口。"],"a":0,"e":"大站不同出口可能相隔很远。「東口」是出口方向，不是站台。给站员看地址或地图再问，可以减少出错出口后绕路的情况。","d":["这个选项对应另一种意思；本题说的是“去酒店的话，东口比较近。”。","这个选项对应另一种意思；本题说的是“去酒店的话，东口比较近。”。"],"explain":{"text":"大站不同出口可能相隔很远。「東口」是出口方向，不是站台。给站员看地址或地图再问，可以减少出错出口后绕路的情况。","examples":[["この住所へ行くには、どの出口が近いですか？","去这个地址哪个出口比较近？","你可以这样说"],["ホテルへ行くなら、東口が近いです。","去酒店的话，东口比较近。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:exit-name:s","s":"train","t":"s","q":"车站出口很多，你想问去这个地址该从哪边出，怎么说？","o":["この住所(じゅうしょ)へ行くには、どの出口(でぐち)が近いですか？","どのくらい遅れていますか？","電車(でんしゃ)にかばんを忘れたかもしれません。"],"a":0,"e":"大站不同出口可能相隔很远。「東口」是出口方向，不是站台。给站员看地址或地图再问，可以减少出错出口后绕路的情况。","d":["这句话是“大概晚点多久？”。","这句话是“我可能把包忘在电车上了。”。"],"explain":{"text":"大站不同出口可能相隔很远。「東口」是出口方向，不是站台。给站员看地址或地图再问，可以减少出错出口后绕路的情况。","examples":[["この住所へ行くには、どの出口が近いですか？","去这个地址哪个出口比较近？","你可以这样说"],["ホテルへ行くなら、東口が近いです。","去酒店的话，东口比较近。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:charge-location:r","s":"train","t":"r","q":"你问在哪里给交通卡充值，站员指路。 对方说了下面这句话，是什么意思？","j":"チャージはあちらの機械(きかい)でできます。","o":["可以在那边的机器充值。","那个方向的末班车已经开走了。","那趟车从3号站台发车。"],"a":0,"e":"「チャージ」是向卡里充值，不是买一张新车票。支持现金或其他方式的范围因机器而异，先找到对应机器，再按屏幕提示操作。","d":["这个选项对应另一种意思；本题说的是“可以在那边的机器充值。”。","这个选项对应另一种意思；本题说的是“可以在那边的机器充值。”。"],"explain":{"text":"「チャージ」是向卡里充值，不是买一张新车票。支持现金或其他方式的范围因机器而异，先找到对应机器，再按屏幕提示操作。","examples":[["ICカードはどこでチャージできますか？","交通IC卡在哪里可以充值？","你可以这样说"],["チャージはあちらの機械でできます。","可以在那边的机器充值。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:charge-location:s","s":"train","t":"s","q":"你的交通卡快没钱了，想找充值机器，怎么问？","o":["ICカードはどこでチャージできますか？","この方面(ほうめん)の終電(しゅうでん)は何時ですか？","この電車(でんしゃ)は何番線ですか？"],"a":0,"e":"「チャージ」是向卡里充值，不是买一张新车票。支持现金或其他方式的范围因机器而异，先找到对应机器，再按屏幕提示操作。","d":["这句话是“这个方向的末班车是几点？”。","这句话是“这趟车在几号站台？”。"],"explain":{"text":"「チャージ」是向卡里充值，不是买一张新车票。支持现金或其他方式的范围因机器而异，先找到对应机器，再按屏幕提示操作。","examples":[["ICカードはどこでチャージできますか？","交通IC卡在哪里可以充值？","你可以这样说"],["チャージはあちらの機械でできます。","可以在那边的机器充值。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:insufficient:r","s":"train","t":"r","q":"出站时闸机没打开，站员看卡后说明原因。 对方说了下面这句话，是什么意思？","j":"残高(ざんだか)が足りないので、精算(せいさん)してください。","o":["余额不足，需要补足车费。","在下一站下车，再乘反方向的车。","这里是相反方向。"],"a":0,"e":"「残高」是卡里剩余金额，「精算」是结清应付车费。余额不足只是闸机不开的一种原因，先请站员检查，不要直接跟在别人后面出站。按指引充值或补足差额即可。","d":["这个选项对应另一种意思；本题说的是“余额不足，需要补足车费。”。","这个选项对应另一种意思；本题说的是“余额不足，需要补足车费。”。"],"explain":{"text":"「残高」是卡里剩余金额，「精算」是结清应付车费。余额不足只是闸机不开的一种原因，先请站员检查，不要直接跟在别人后面出站。按指引充值或补足差额即可。","examples":[["すみません、改札を出られません。","不好意思，我出不了检票口。","你可以这样说"],["残高が足りないので、精算してください。","余额不足，需要补足车费。","也可能听到对方这样说"]],"source":["交通卡余额不足时的处理参考：JR东日本","https://jreastfaq.jreast.co.jp/faq/show/1057?category_id=28&site_domain=default"]}},{"uid":"series-v1:train:insufficient:s","s":"train","t":"s","q":"你出不了站，想请站员帮忙确认，怎么说？","o":["すみません、改札(かいさつ)を出られません。","乗り過ごしてしまいました。どうすればいいですか？","渋谷(しぶや)へ行くのはこちらで合っていますか？"],"a":0,"e":"「残高」是卡里剩余金额，「精算」是结清应付车费。余额不足只是闸机不开的一种原因，先请站员检查，不要直接跟在别人后面出站。按指引充值或补足差额即可。","d":["这句话是“我坐过站了，该怎么办？”。","这句话是“去涩谷走这边对吗？”。"],"explain":{"text":"「残高」是卡里剩余金额，「精算」是结清应付车费。余额不足只是闸机不开的一种原因，先请站员检查，不要直接跟在别人后面出站。按指引充值或补足差额即可。","examples":[["すみません、改札を出られません。","不好意思，我出不了检票口。","你可以这样说"],["残高が足りないので、精算してください。","余额不足，需要补足车费。","也可能听到对方这样说"]],"source":["交通卡余额不足时的处理参考：JR东日本","https://jreastfaq.jreast.co.jp/faq/show/1057?category_id=28&site_domain=default"]}},{"uid":"series-v1:train:wrong-ticket:r","s":"train","t":"r","q":"你发现买到的车票目的地不对，柜台人员答复。 对方说了下面这句话，是什么意思？","j":"使う前でしたら、変更(へんこう)できるか確認(かくにん)します。","o":["如果还没使用，我帮您确认能否更改。","这趟车到本站就终到。","这趟快速列车不在那个站停。"],"a":0,"e":"「買い間違えました」说明买错。能否更改取决于车票种类和使用状态，所以先把票给工作人员看，不能把对方“确认一下”当成已经办好。","d":["这个选项对应另一种意思；本题说的是“如果还没使用，我帮您确认能否更改。”。","这个选项对应另一种意思；本题说的是“如果还没使用，我帮您确认能否更改。”。"],"explain":{"text":"「買い間違えました」说明买错。能否更改取决于车票种类和使用状态，所以先把票给工作人员看，不能把对方“确认一下”当成已经办好。","examples":[["切符を買い間違えました。変更できますか？","我买错车票了，可以更改吗？","你可以这样说"],["使う前でしたら、変更できるか確認します。","如果还没使用，我帮您确认能否更改。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:wrong-ticket:s","s":"train","t":"s","q":"你买错了纸质车票，想请柜台查看能否更改，怎么说？","o":["切符(きっぷ)を買い間違えました。変更(へんこう)できますか？","ここで降りないといけませんか？","この電車(でんしゃ)は、この駅に止まりますか？"],"a":0,"e":"「買い間違えました」说明买错。能否更改取决于车票种类和使用状态，所以先把票给工作人员看，不能把对方“确认一下”当成已经办好。","d":["这句话是“必须在这里下车吗？”。","这句话是“这趟车在这个站停吗？”。"],"explain":{"text":"「買い間違えました」说明买错。能否更改取决于车票种类和使用状态，所以先把票给工作人员看，不能把对方“确认一下”当成已经办好。","examples":[["切符を買い間違えました。変更できますか？","我买错车票了，可以更改吗？","你可以这样说"],["使う前でしたら、変更できるか確認します。","如果还没使用，我帮您确认能否更改。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:reserved:r","s":"train","t":"r","q":"你在列车上找座位，工作人员看票后说。 对方说了下面这句话，是什么意思？","j":"こちらは指定席(していせき)です。お持ちの切符(きっぷ)をご確認(かくにん)ください。","o":["这里是指定席，请确认你持有的车票。","电梯在站台尽头。","请在下一站换乘。"],"a":0,"e":"「指定席」表示按票面安排座位，不能因为看着空就直接坐。自由席和指定席的安排因列车不同，先看票面或请工作人员确认。","d":["这个选项对应另一种意思；本题说的是“
