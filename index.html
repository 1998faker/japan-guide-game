点了，请再等一会儿。”。","这个选项对应另一种意思；本题说的是“列车晚点了，请再等一会儿。”。"],"explain":{"text":"「遅れております」是晚点，不等于取消。站员也可能暂时无法给出准确时间；先了解情况，再决定是否改用其他线路。","examples":[["どのくらい遅れていますか？","大概晚点多久？","你可以这样说"],["電車が遅れております。到着までしばらくお待ちください。","列车晚点了，请再等一会儿。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:delay:s","s":"train","t":"s","q":"你担心赶不上安排，想问这趟车大约晚多久，怎么说？","o":["どのくらい遅れていますか？","電車(でんしゃ)にかばんを忘れたかもしれません。","この住所(じゅうしょ)へ行くには、どの出口(でぐち)が近いですか？"],"a":0,"e":"「遅れております」是晚点，不等于取消。站员也可能暂时无法给出准确时间；先了解情况，再决定是否改用其他线路。","d":["这句话是“我可能把包忘在电车上了。”。","这句话是“去这个地址哪个出口比较近？”。"],"explain":{"text":"「遅れております」是晚点，不等于取消。站员也可能暂时无法给出准确时间；先了解情况，再决定是否改用其他线路。","examples":[["どのくらい遅れていますか？","大概晚点多久？","你可以这样说"],["電車が遅れております。到着までしばらくお待ちください。","列车晚点了，请再等一会儿。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:service-end:r","s":"train","t":"r","q":"你晚间问还能不能去目的地，站员回答。 对方说了下面这句话，是什么意思？","j":"その方面(ほうめん)の最終(さいしゅう)電車(でんしゃ)は、もう出ました。","o":["那个方向的末班车已经开走了。","那趟车从3号站台发车。","可以在那边的机器充值。"],"a":0,"e":"「終電」是末班车，「もう出ました」是已经发车。各方向末班时间不同，别只记“这条线很晚还有车”；问清目的地和乘车方向。","d":["这个选项对应另一种意思；本题说的是“那个方向的末班车已经开走了。”。","这个选项对应另一种意思；本题说的是“那个方向的末班车已经开走了。”。"],"explain":{"text":"「終電」是末班车，「もう出ました」是已经发车。各方向末班时间不同，别只记“这条线很晚还有车”；问清目的地和乘车方向。","examples":[["この方面の終電は何時ですか？","这个方向的末班车是几点？","你可以这样说"],["その方面の最終電車は、もう出ました。","那个方向的末班车已经开走了。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:service-end:s","s":"train","t":"s","q":"你准备夜间返程，想先查末班车时间，怎么问？","o":["この方面(ほうめん)の終電(しゅうでん)は何時ですか？","この電車(でんしゃ)は何番線ですか？","ICカードはどこでチャージできますか？"],"a":0,"e":"「終電」是末班车，「もう出ました」是已经发车。各方向末班时间不同，别只记“这条线很晚还有车”；问清目的地和乘车方向。","d":["这句话是“这趟车在几号站台？”。","这句话是“交通IC卡在哪里可以充值？”。"],"explain":{"text":"「終電」是末班车，「もう出ました」是已经发车。各方向末班时间不同，别只记“这条线很晚还有车”；问清目的地和乘车方向。","examples":[["この方面の終電は何時ですか？","这个方向的末班车是几点？","你可以这样说"],["その方面の最終電車は、もう出ました。","那个方向的末班车已经开走了。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:missed-stop:r","s":"train","t":"r","q":"你发现坐过了站，站员给出下一步指引。 对方说了下面这句话，是什么意思？","j":"次の駅で降りて、反対方向(はんたいほうこう)の電車(でんしゃ)に乗ってください。","o":["在下一站下车，再乘反方向的车。","这里是相反方向。","余额不足，需要补足车费。"],"a":0,"e":"「乗り過ごす」是坐过要下车的站。不要急着在关门时下车，到了可下车的站再向工作人员确认返程路线；票务处理也按站员说明来。","d":["这个选项对应另一种意思；本题说的是“在下一站下车，再乘反方向的车。”。","这个选项对应另一种意思；本题说的是“在下一站下车，再乘反方向的车。”。"],"explain":{"text":"「乗り過ごす」是坐过要下车的站。不要急着在关门时下车，到了可下车的站再向工作人员确认返程路线；票务处理也按站员说明来。","examples":[["乗り過ごしてしまいました。どうすればいいですか？","我坐过站了，该怎么办？","你可以这样说"],["次の駅で降りて、反対方向の電車に乗ってください。","在下一站下车，再乘反方向的车。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:missed-stop:s","s":"train","t":"s","q":"你想说明自己坐过站了，请站员帮忙，怎么说？","o":["乗り過ごしてしまいました。どうすればいいですか？","渋谷(しぶや)へ行くのはこちらで合っていますか？","すみません、改札(かいさつ)を出られません。"],"a":0,"e":"「乗り過ごす」是坐过要下车的站。不要急着在关门时下车，到了可下车的站再向工作人员确认返程路线；票务处理也按站员说明来。","d":["这句话是“去涩谷走这边对吗？”。","这句话是“不好意思，我出不了检票口。”。"],"explain":{"text":"「乗り過ごす」是坐过要下车的站。不要急着在关门时下车，到了可下车的站再向工作人员确认返程路线；票务处理也按站员说明来。","examples":[["乗り過ごしてしまいました。どうすればいいですか？","我坐过站了，该怎么办？","你可以这样说"],["次の駅で降りて、反対方向の電車に乗ってください。","在下一站下车，再乘反方向的车。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:local-terminal:r","s":"train","t":"r","q":"你还没到目的地，车内广播响起。 对方说了下面这句话，是什么意思？","j":"この電車(でんしゃ)は当駅(とうえき)止まりです。","o":["这趟车到本站就终到。","这趟快速列车不在那个站停。","如果还没使用，我帮您确认能否更改。"],"a":0,"e":"「当駅止まり」是本站终到，不是普通的短暂停车。需要继续走的乘客要换乘后续列车。听见不熟悉的广播，可以向站员确认是否要下车。","d":["这个选项对应另一种意思；本题说的是“这趟车到本站就终到。”。","这个选项对应另一种意思；本题说的是“这趟车到本站就终到。”。"],"explain":{"text":"「当駅止まり」是本站终到，不是普通的短暂停车。需要继续走的乘客要换乘后续列车。听见不熟悉的广播，可以向站员确认是否要下车。","examples":[["ここで降りないといけませんか？","必须在这里下车吗？","你可以这样说"],["この電車は当駅止まりです。","这趟车到本站就终到。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:local-terminal:s","s":"train","t":"s","q":"你不确定是否必须在这里下车，怎么问？","o":["ここで降りないといけませんか？","この電車(でんしゃ)は、この駅に止まりますか？","切符(きっぷ)を買い間違えました。変更(へんこう)できますか？"],"a":0,"e":"「当駅止まり」是本站终到，不是普通的短暂停车。需要继续走的乘客要换乘后续列车。听见不熟悉的广播，可以向站员确认是否要下车。","d":["这句话是“这趟车在这个站停吗？”。","这句话是“我买错车票了，可以更改吗？”。"],"explain":{"text":"「当駅止まり」是本站终到，不是普通的短暂停车。需要继续走的乘客要换乘后续列车。听见不熟悉的广播，可以向站员确认是否要下车。","examples":[["ここで降りないといけませんか？","必须在这里下车吗？","你可以这样说"],["この電車は当駅止まりです。","这趟车到本站就终到。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:luggage-elevator:r","s":"train","t":"r","q":"你提着大箱子问有没有不用爬楼梯的路。 对方说了下面这句话，是什么意思？","j":"エレベーターはホームの端にあります。","o":["电梯在站台尽头。","请在下一站换乘。","这里是指定席，请确认你持有的车票。"],"a":0,"e":"「エレベーター」是升降电梯，「エスカレーター」是自动扶梯。带大行李或行动不便时，把需要的设施说清楚，比只问出口更有帮助。","d":["这个选项对应另一种意思；本题说的是“电梯在站台尽头。”。","这个选项对应另一种意思；本题说的是“电梯在站台尽头。”。"],"explain":{"text":"「エレベーター」是升降电梯，「エスカレーター」是自动扶梯。带大行李或行动不便时，把需要的设施说清楚，比只问出口更有帮助。","examples":[["エレベーターはどこですか？","电梯在哪里？","你可以这样说"],["エレベーターはホームの端にあります。","电梯在站台尽头。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:luggage-elevator:s","s":"train","t":"s","q":"你想找电梯，怎么向站员问路？","o":["エレベーターはどこですか？","乗り換え(のりかえ)なしで行けますか？","この切符(きっぷ)は指定席(していせき)ですか？"],"a":0,"e":"「エレベーター」是升降电梯，「エスカレーター」是自动扶梯。带大行李或行动不便时，把需要的设施说清楚，比只问出口更有帮助。","d":["这句话是“不用换乘能到吗？”。","这句话是“这张票是指定席吗？”。"],"explain":{"text":"「エレベーター」是升降电梯，「エスカレーター」是自动扶梯。带大行李或行动不便时，把需要的设施说清楚，比只问出口更有帮助。","examples":[["エレベーターはどこですか？","电梯在哪里？","你可以这样说"],["エレベーターはホームの端にあります。","电梯在站台尽头。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:locker:r","s":"train","t":"r","q":"你询问能放大行李的寄存柜，工作人员说。 对方说了下面这句话，是什么意思？","j":"大きいロッカーは、今すべて使用中(しようちゅう)です。","o":["大的寄存柜现在都在使用中。","这次换乘请先出一次检票口。","5号车厢还要往前一点。"],"a":0,"e":"「使用中」是正在使用，意思是目前没有空柜，不代表柜子坏了。可以询问其他区域或有人服务的寄存处，是否有空位和收费需另确认。","d":["这个选项对应另一种意思；本题说的是“大的寄存柜现在都在使用中。”。","这个选项对应另一种意思；本题说的是“大的寄存柜现在都在使用中。”。"],"explain":{"text":"「使用中」是正在使用，意思是目前没有空柜，不代表柜子坏了。可以询问其他区域或有人服务的寄存处，是否有空位和收费需另确认。","examples":[["ほかに荷物を預けられる場所はありますか？","还有其他可以寄存行李的地方吗？","你可以这样说"],["大きいロッカーは、今すべて使用中です。","大的寄存柜现在都在使用中。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:locker:s","s":"train","t":"s","q":"你找不到空的行李柜，想问有没有别处可以寄存，怎么说？","o":["ほかに荷物(にもつ)を預けられる場所(ばしょ)はありますか？","乗り換え(のりかえ)るとき、改札(かいさつ)を出ますか？","五号車(ごごうしゃ)はどの辺りですか？"],"a":0,"e":"「使用中」是正在使用，意思是目前没有空柜，不代表柜子坏了。可以询问其他区域或有人服务的寄存处，是否有空位和收费需另确认。","d":["这句话是“换乘时需要出检票口吗？”。","这句话是“5号车厢大概在什么位置？”。"],"explain":{"text":"「使用中」是正在使用，意思是目前没有空柜，不代表柜子坏了。可以询问其他区域或有人服务的寄存处，是否有空位和收费需另确认。","examples":[["ほかに荷物を預けられる場所はありますか？","还有其他可以寄存行李的地方吗？","你可以这样说"],["大きいロッカーは、今すべて使用中です。","大的寄存柜现在都在使用中。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:lost-platform:r","s":"train","t":"r","q":"你把东西落在站台，站员指向一个窗口。 对方说了下面这句话，是什么意思？","j":"忘れ物(わすれもの)のお問い合わせは、こちらの窓口です。","o":["遗失物品的询问在这个窗口。","去酒店的话，东口比较近。","列车晚点了，请再等一会儿。"],"a":0,"e":"「かもしれません」表示可能，还不确定。尽量补充乘车时间、方向、车厢和包的样子；能记住多少说多少，不需要先确定一定是在哪里丢的。","d":["这个选项对应另一种意思；本题说的是“遗失物品的询问在这个窗口。”。","这个选项对应另一种意思；本题说的是“遗失物品的询问在这个窗口。”。"],"explain":{"text":"「かもしれません」表示可能，还不确定。尽量补充乘车时间、方向、车厢和包的样子；能记住多少说多少，不需要先确定一定是在哪里丢的。","examples":[["電車にかばんを忘れたかもしれません。","我可能把包忘在电车上了。","你可以这样说"],["忘れ物のお問い合わせは、こちらの窓口です。","遗失物品的询问在这个窗口。","也可能听到对方这样说"]]}},{"uid":"series-v1:train:lost-platform:s","s":"train","t":"s","q":"你想告诉站员，包可能忘在电车上，怎么说？","o":["電車(でんしゃ)にかばんを忘れたかもしれません。","この住所(じゅうしょ)へ行くには、どの出口(でぐち)が近いですか？","どのくらい遅れていますか？"],"a":0,"e":"「かもしれません」表示可能，还不确定。尽量补充乘车时间、方向、车厢和包的样子；能记住多少说多少，不需要先确定一定是在哪里丢的。","d":["这句话是“去这个地址哪个出口比较近？”。","这句话是“大概晚点多久？”。"],"explain":{"text":"「かもしれません」表示可能，还不确定。尽量补充乘车时间、方向、车厢和包的样子；能记住多少说多少，不需要先确定一定是在哪里丢的。","examples":[["電車にかばんを忘れたかもしれません。","我可能把包忘在电车上了。","你可以这样说"],["忘れ物のお問い合わせは、こちらの窓口です。","遗失物品的询问在这个窗口。","也可能听到对方这样说"]]}}],"quiz/word-explanations":{"鮪":{"what":"金枪鱼，寿司菜单里常再区分瘦肉、中腹和大腹。","why":"寿司店按部位提供不同口感的金枪鱼；只看「鮪」还不能判断是不是肥腹肉。","examples":[["まぐろの赤身をお願いします。","请来一份金枪鱼赤身。","想吃瘦肉"],["まぐろを二貫お願いします。","请来两贯金枪鱼寿司。","点寿司"],["赤身と中トロは、どう違いますか？","赤身和中腹有什么区别？","比较部位"]]},"大トロ":{"what":"金枪鱼腹部脂肪较丰富的部位，中文常叫大腹。","why":"店里会把它与赤身、中トロ分开标价，让客人选择不同肥瘦程度。","examples":[["大トロをお願いします。","请来一份金枪鱼大腹。"]]},"中トロ":{"what":"金枪鱼脂肪含量介于赤身和大腹之间的部位。","why":"它既有瘦肉也有油脂，是寿司菜单用来区分部位的名称。","examples":[["中トロをお願いします。","请来一份金枪鱼中腹。"]]},"鮭":{"what":"鲑鱼，中文菜单常称三文鱼；这个字读「さけ」。","why":"饭团、烤鱼和套餐都可能出现「鮭」；寿司菜单也常写「サーモン」，具体做法看菜名。","examples":[["鮭をお願いします。","请来一份三文鱼。"]]},"鯛":{"what":"鲷鱼，日料菜单常见的白身鱼。","why":"它可以做寿司、刺身或烤鱼；这个词说的是鱼种，不是固定烹饪方法。","examples":[["鯛をお願いします。","请来一份鲷鱼。"]]},"鰤":{"what":"鰤鱼，肉质带油脂的鱼类。","why":"会出现在刺身、寿司和照烧鱼菜单；看「刺身」「照り焼き」可判断做法。","examples":[["鰤をお願いします。","请来一份鰤鱼。"]]},"鯵":{"what":"竹荚鱼，是一种食用鱼。","why":"既能做刺身和寿司，也会做炸鱼；菜单上的「アジフライ」就是炸竹荚鱼。","examples":[["鯵をお願いします。","请来一份竹荚鱼。"]]},"鯖":{"what":"青花鱼，也叫鲭鱼。","why":"菜单可能写盐烤或醋渍；「しめ鯖」是醋渍青花鱼，不是笼统的生鱼片。","examples":[["鯖をお願いします。","请来一份青花鱼。"]]},"鰹":{"what":"鲣鱼，是一种食用鱼，也用来制作鲣鱼干。","why":"在菜品栏常见「かつおのたたき」，鱼表面炙烤后切片；与调味用的鲣鱼片不同。","examples":[["鰹をお願いします。","请来一份鲣鱼。"]]},"鰻":{"what":"鳗鱼，菜单中常以烤制后淋酱的形式出现。","why":"饭店会把烤鳗鱼搭配米饭，做成うな丼或うな重。","examples":[["鰻をお願いします。","请来一份鳗鱼。"]]},"穴子":{"what":"日料里的星鳗一类食用海鱼，中文菜单常写海鳗。","why":"寿司店常提供煮穴子，也可能做天妇罗；它与「うなぎ」是不同食材。","examples":[["穴子をお願いします。","请来一份海鳗。"]]},"海老":{"what":"虾的统称，没有单凭这个词指定品种。","why":"寿司、天妇罗和炸虾都用得到，具体是否生食要看完整菜名。","examples":[["海老をお願いします。","请来一份虾。"]]},"甘海老":{"what":"甜虾，是寿司和刺身中常见的虾类食材。","why":"菜单会把它与普通「海老」分别列出，方便客人辨认食材。","examples":[["甘海老をお願いします。","请来一份甜虾。"]]},"帆立":{"what":"扇贝，菜单可能使用贝柱或整只扇贝。","why":"寿司、刺身、黄油烤贝都可能用到它，点单时可确认做法。","examples":[["この帆立は、焼いたものですか？","这个扇贝是烤的吗？","问做法"],["帆立のバター焼きをお願いします。","请来一份黄油烤扇贝。","点一道菜"],["帆立の刺身はありますか？","有扇贝刺身吗？","想吃刺身"]],"text":"帆立（ほたて）就是扇贝。寿司上常见的是贝柱，也有带壳烤的做法。在居酒屋看到它，可以看看菜单写的是刺身还是黄油烤；不确定就直接问店员。"},"雲丹":{"what":"海胆；食用的是壳内可食用的部分，菜单也常写「うに」。","why":"寿司店会把它放在军舰卷上，也可作为海鲜盖饭的配料。","examples":[["雲丹をお願いします。","请来一份海胆。"]]},"いくら":{"what":"经过处理或调味的鲑鱼卵，外观是橙红色小颗粒。","why":"颗粒状食材便于放在军舰寿司或盖饭上，是海鲜菜单中的常见配料。","examples":[["いくらをお願いします。","请来一份鲑鱼子。"]]},"蛸":{"what":"章鱼；这个词本身不表示生的或熟的。","why":"寿司、刺身、拌菜都可能用章鱼，不能只凭「蛸」判断做法。","examples":[["蛸をお願いします。","请来一份章鱼。"]]},"烏賊":{"what":"鱿鱼、乌贼一类食材的日语统称「いか」。","why":"可做寿司、刺身、烤物或炸物，因此不同菜单栏都可能出现。","examples":[["烏賊をお願いします。","请来一份乌贼。"]]},"蟹":{"what":"螃蟹的统称，菜单还可能进一步写品种。","why":"海鲜店会用蟹肉做寿司，也可能整只蒸煮；点单应看份量和做法。","examples":[["蟹をお願いします。","请来一份螃蟹。"]]},"納豆巻き":{"what":"用海苔和寿司饭卷起纳豆的细卷。","why":"寿司不全是海鲜；这是一种以发酵大豆为馅的卷寿司。","examples":[["納豆巻きをお願いします。","请来一份纳豆卷。"]]},"牛タン":{"what":"牛的舌头，烤肉菜单中按部位列出的食材。","why":"切片后适合烤制，店里常与其他牛肉部位分开点单。","examples":[["牛タンを一人前お願いします。","请来一人份牛舌。","点一人份"],["塩でお願いします。","麻烦做成盐味。","选盐味"]]},"カルビ":{"what":"烤肉菜单里常指牛肋腹附近、油脂较多的肉，具体部位依店家而异。","why":"菜单用它与ロース、ハラミ等区分，帮助客人选择口感。","examples":[["カルビをお願いします。","请来一份牛五花。"]]},"ロース":{"what":"靠近背部的肉类部位名称；牛、猪都可能使用这个词。","why":"烤肉店用它区分部位，若菜单未写动物种类，可以再问。","examples":[["このロースは牛肉ですか？","这个里脊是牛肉吗？"]]},"ハラミ":{"what":"横膈膜肉，烤肉菜单上常指牛横膈膜。","why":"虽然看起来像普通瘦肉，店里仍会按独立部位出售。","examples":[["ハラミをお願いします。","请来一份横膈膜肉。"]]},"ホルモン":{"what":"烤肉或炖菜里的内脏类食材统称，不是某一个固定部位。","why":"店里可能混合或分开供应不同内脏，不熟悉时适合先问是什么部位。","examples":[["このホルモンは何の部位ですか？","这份内脏是什么部位？","不熟悉部位"],["牛ですか、豚ですか？","是牛的还是猪的？","确认是哪种肉"]]},"豚バラ":{"what":"猪腹部的五花肉，肥瘦层次相间。","why":"既适合烤串，也可用于炒菜和炖菜；烤串栏看到它就是猪肉类选择。","examples":[["豚バラをお願いします。","请来一份猪五花。"]]},"鶏もも":{"what":"鸡腿肉，不是只指带骨的整只鸡腿。","why":"烤鸡串和炸鸡常使用切块的鸡腿肉，所以菜单会标出这一部位。","examples":[["鶏ももをお願いします。","请来一份鸡腿肉。"]]},"鶏むね":{"what":"鸡胸肉，位于鸡的胸部。","why":"店里用它区分鸡腿等部位，方便客人按肉质偏好点单。","examples":[["鶏むねをお願いします。","请来一份鸡胸肉。"]]},"手羽先":{"what":"鸡翅尖一侧的部位，菜单上常以带骨鸡翅菜肴出现。","why":"烤物和炸物栏都可能有它，不一定是串起来的鸡肉。","examples":[["手羽先をお願いします。","请来一份鸡翅。"]]},"つくね":{"what":"把肉剁碎、调味后成形的肉丸；烤鸡店里通常是鸡肉丸。","why":"它常被串起来烤，与整块鸡肉串形成不同口感。","examples":[["つくねをお願いします。","请来一份鸡肉丸串。"]]},"ねぎま":{"what":"在烤鸡串语境中，通常是鸡肉与葱段交替穿成的串。","why":"这是按食材组合命名的烤串，点单后店员还可能问盐味或酱味。","examples":[["ねぎまをお願いします。","请来一份葱段鸡肉串。"]]},"砂肝":{"what":"鸡的肌胃，也就是鸡胗。","why":"它是烤鸡店按部位出售的食材，特点是较有嚼劲。","examples":[["砂肝をお願いします。","请来一份鸡胗。"]]},"霜降り":{"what":"肉中分布着细密脂肪纹路的状态，中文常叫雪花肉。","why":"这个词用于描述肉质，不是一个单独部位；菜单还会配上具体肉名。","examples":[["霜降りのお肉はありますか？","有雪花肉吗？"]]},"和牛":{"what":"日本特定牛品种及相应杂交范围的牛肉名称，不等于所有日本产牛肉。","why":"烤肉店用它说明牛肉类别，具体部位和等级通常另行标注。","examples":[["和牛はどの部位がありますか？","和牛有哪些部位可以选？"]]},"醤油":{"what":"酱油；在拉面口味栏中指以酱油调味的口味。","why":"它标示调味方向，不代表所有酱油拉面的汤底都一样。","examples":[["醤油ラーメンをお願いします。","请来一份酱油拉面。"]]},"味噌":{"what":"由发酵原料制成的味噌；在拉面栏中表示味噌调味。","why":"拉面店用它区别酱油、盐味等口味，味噌也可用于汤和其他菜。","examples":[["味噌ラーメンをお願いします。","请来一份味噌拉面。"]]},"塩":{"what":"盐；菜单上常表示以盐调味的口味。","why":"烤串会与「タレ」酱味对照，拉面也会用「塩」标示口味。","examples":[["塩でお願いします。","麻烦做成盐味。","烤串选口味"],["塩は少なめにできますか？","可以少放点盐吗？","想少放盐"],["塩ラーメンをお願いします。","请来一份盐味拉面。","在拉面店点餐"]],"text":"「塩（しお）」是盐。烤串店问「塩とタレ、どちらにしますか？」时，是让你选盐味还是酱汁味；回答「塩でお願いします」就行。在拉面店看到「塩ラーメン」，则是在说盐味拉面。"},"豚骨":{"what":"猪骨；「豚骨ラーメン」指使用猪骨熬汤的拉面。","why":"这是汤底原料的说明，可以再与酱油等调味结合。","examples":[["豚骨ラーメンをお願いします。","请来一份猪骨拉面。"]]},"つけ麺":{"what":"面和蘸汁分开盛放，夹起面蘸汁吃的面食。","why":"它和直接泡在汤里的拉面吃法不同；用餐后有的店提供稀释蘸汁的汤。","examples":[["つけ麺をお願いします。","请来一份蘸面。","点一份"],["スープ割りをお願いします。","麻烦加汤稀释蘸汁。","吃完想喝汤"]]},"担々麺":{"what":"带芝麻、辣味等调味的担担面，配料和辣度因店而异。","why":"拉面店把它作为一种口味列出，不能只看名字推定辣度。","examples":[["担々麺をお願いします。","请来一份担担面。"]]},"うどん":{"what":"乌冬面，通常是较粗的日本小麦面条。","why":"菜单会再写热汤、冷面或配料，单说乌冬没有指定吃法。","examples":[["うどんをお願いします。","请来一份乌冬面。"]]},"そば":{"what":"荞麦面，配方中也可能含小麦粉。","why":"荞麦面店常分冷吃和热吃；「ざるそば」和「かけそば」是不同菜单项。","examples":[["そばをお願いします。","请来一份荞麦面。"]]},"焼きそば":{"what":"日式炒面，名字虽带「そば」，通常不是荞麦面。","why":"铁板店和小吃摊把它作为炒制的主食出售。","examples":[["焼きそばをお願いします。","请来一份炒面。"]]},"チャーシュー":{"what":"日式叉烧，拉面里常见的调味猪肉。","why":"可作为默认配料，也可能在加料栏单独收费。","examples":[["チャーシューを追加できますか？","能加一份叉烧吗？"]]},"味玉":{"what":"经过调味入味的鸡蛋，常见于拉面中；熟度依店家而异。","why":"菜单用它说明蛋类配料，喜欢的话可询问能否加一颗。","examples":[["味玉を一つ追加してください。","请加一颗味玉。"]]},"メンマ":{"what":"经处理和调味的笋类配料。","why":"它经常放在拉面里，主要用来增加口感，也可能单独作为小菜。","examples":[["メンマ抜きにできますか？","能不放笋干吗？"]]},"大盛り":{"what":"在通常份量上加大的份量。","why":"面饭店用它区分大小份，是否加价需要看店铺标示。","examples":[["大盛りでお願いします。","麻烦来大份。","要大份"],["大盛りはいくら追加ですか？","加大份要多付多少钱？","先问加价"],["やっぱり普通でお願いします。","还是麻烦来普通份吧。","改回普通份"]],"text":"觉得普通份不够吃，可以选「大盛り（おおもり）」——也就是加大份。这个词说的是份量，不是味道浓一点。是否加价、要加多少，点之前问清楚就好。"},"牛丼":{"what":"把调味牛肉等配料盖在米饭上的盖饭。","why":"快餐店把主菜和饭合成一碗，点单时常再选择大小份。","examples":[["牛丼をお願いします。","请来一份牛肉盖饭。"]]},"親子丼":{"what":"通常由鸡肉和鸡蛋一起做成的盖饭。","why":"「親子」在这里对应鸡和蛋，是菜名，不是亲子套餐。","examples":[["親子丼をお願いします。","请来一份鸡肉鸡蛋盖饭。"]]},"カツ丼":{"what":"通常把炸猪排搭配鸡蛋等放在饭上的盖饭，也有其他做法。","why":"「カツ」提示炸排类主料，「丼」提示盖饭形式。","examples":[["カツ丼をお願いします。","请来一份炸猪排盖饭。"]]},"天丼":{"what":"把天妇罗放在米饭上、配酱汁的盖饭。","why":"与单点天妇罗不同，它已经包含米饭，适合当一餐主食。","examples":[["天丼をお願いします。","请来一份天妇罗盖饭。"]]},"海鮮丼":{"what":"用多种海鲜搭配米饭的盖饭。","why":"店里用它集合当日海鲜，具体配料应看菜单或询问。","examples":[["海鮮丼をお願いします。","请来一份海鲜盖饭。"]]},"うな重":{"what":"用重箱盛装的鳗鱼饭。","why":"「重」说明盛装形式，和碗装的「うな丼」名称不同。","examples":[["うな重をお願いします。","请来一份鳗鱼饭。"]]},"オムライス":{"what":"用蛋包裹或覆盖炒饭的蛋包饭。","why":"它属于常见日式洋食，酱汁和蛋的做法各店不同。","examples":[["オムライスをお願いします。","请来一份蛋包饭。"]]},"定食":{"what":"主菜搭配米饭、汤等组成的套餐。","why":"它与单点主菜不同，点之前可确认包含哪些内容。","examples":[["この定食には何がつきますか？","这个套餐附带什么？","问套餐内容"],["ご飯、少なめでお願いします。","麻烦米饭少一点。","调整米饭"],["ご飯のおかわりはできますか？","可以续饭吗？","想续饭"]],"text":"「定食（ていしょく）」是一套搭配好的饭，通常有主菜、米饭和汤等。比起单点一道菜，它更像完整的一餐。饭量能否调整、能否续饭，各家店不同，可以顺口问一下。"},"おにぎり":{"what":"把米饭捏成形状的饭团，可能有馅料或海苔。","why":"便利店和餐厅都把它作为方便食用的主食，菜单通常再写口味。","examples":[["おにぎりをお願いします。","请来一份饭团。"]]},"唐揚げ":{"what":"食材调味、裹粉后炸制的做法；居酒屋单写此词时常指炸鸡。","why":"适合分着吃，常出现在小菜栏，也能搭配米饭成为定食。","examples":[["唐揚げを一つお願いします。","请来一份炸鸡。","点一份"],["これ、何個入りですか？","这一份有几块？","问份量"],["すみません、唐揚げ、まだですか？","不好意思，炸鸡还没好吗？","等了很久"]],"text":"居酒屋菜单上单写「唐揚げ（からあげ）」时，常指炸鸡块。不过这个词本身是一种炸制做法，也可以用在其他食材上。多人分着吃时，可以先问一份有几块。"},"天ぷら":{"what":"食材裹薄面糊后炸成的天妇罗。","why":"虾、鱼和蔬菜都可以做天妇罗，所以还要看具体食材。","examples":[["天ぷらをお願いします。","请来一份天妇罗。"]]},"とんかつ":{"what":"猪肉裹面包糠后炸成的猪排。","why":"它可以单点，也可以配成定食，和天妇罗的裹衣不同。","examples":[["とんかつをお願いします。","请来一份炸猪排。"]]},"串カツ":{"what":"把食材穿串、裹衣后炸成的炸串。","why":"与直接烤制的串烧不同，这个名称说明用油炸的做法。","examples":[["串カツをお願いします。","请来一份炸串。"]]},"たこ焼き":{"what":"面糊内放章鱼等配料，烤成球状的章鱼烧。","why":"小吃店和部分居酒屋会供应，它不是整只烤章鱼。","examples":[["たこ焼きをお願いします。","请来一份章鱼烧。"]]},"お好み焼き":{"what":"以面糊、卷心菜和其他配料在铁板上煎制的料理。","why":"常用于朋友聚餐和分食，配料及地域做法会有差异。","examples":[["お好み焼きをお願いします。","请来一份大阪烧。"]]},"餃子":{"what":"饺子；日式餐厅中常见的是煎饺。","why":"拉面店把它作为配菜或套餐搭配，若想要水饺需另看菜单。","examples":[["餃子をお願いします。","请来一份煎饺。"]]},"枝豆":{"what":"未完全成熟时采收的青大豆，常带荚煮熟。","why":"居酒屋常把它作为容易分享的下酒小菜；吃豆粒，豆荚不食用。","examples":[["枝豆をお願いします。","请来一份毛豆。"]]},"冷奴":{"what":"冷着食用、配葱姜等调味的豆腐料理。","why":"这是一道凉小菜，适合与烤串、炸物等热菜搭配。","examples":[["冷奴をお願いします。","请来一份冷豆腐。"]]},"焼き鳥":{"what":"日式烤鸡肉串，也常泛指烤鸡店的串烧菜单。","why":"同一店铺还可能供应内脏或蔬菜串，需要继续看具体品项。","examples":[["焼き鳥の盛り合わせをお願いします。","请来一份烤鸡串拼盘。","想尝几种"],["塩でお願いします。","麻烦做成盐味。","选盐味"],["一本から注文できますか？","可以从一串开始点吗？","确认数量"]],"text":"「焼き鳥（やきとり）」是日式烤鸡串。菜单常按部位分开写：鸡腿、鸡皮、鸡心等都能单独点。店员还可能问要「塩」盐味还是「タレ」酱汁味。不知道怎么选，先点拼盘也可以。"},"出汁巻き玉子":{"what":"把高汤加入蛋液，再卷成形的蛋卷。","why":"居酒屋把它作为蛋料理供应，与单纯强调甜味的蛋烧不完全相同。","examples":[["出汁巻き玉子をお願いします。","请来一份高汤蛋卷。"]]},"揚げ出し豆腐":{"what":"豆腐裹薄粉炸制后，搭配汤汁的料理。","why":"它兼有炸制外层和软豆腐口感，是居酒屋常见的温热小菜。","examples":[["揚げ出し豆腐をお願いします。","请来一份炸豆腐。"]]},"もつ鍋":{"what":"以牛或猪的内脏为主要食材、搭配蔬菜的锅物。","why":"多人可以一起煮着吃，点单时常按人数份量确认。","examples":[["もつ鍋をお願いします。","请来一份内脏锅。"]]},"しゃぶしゃぶ":{"what":"把薄肉片等在热汤中涮熟，再蘸汁吃的锅物。","why":"菜单通常提供肉类选择和套餐，是需要自己涮煮的用餐形式。","examples":[["しゃぶしゃぶをお願いします。","请来一份涮涮锅。"]]},"すき焼き":{"what":"用甜咸调味汁烹煮牛肉、蔬菜等的寿喜烧。","why":"它与涮锅的汤汁和吃法不同，因此会被单独列为锅物种类。","examples":[["すき焼きをお願いします。","请来一份寿喜烧。"]]},"刺身盛り合わせ":{"what":"把几种刺身组合在一起的拼盘。","why":"适合想尝不同海鲜的人，点单时可问几人份及包含哪些鱼。","examples":[["刺身盛り合わせをお願いします。","请来一份刺身拼盘。"]]},"抹茶":{"what":"研磨成细粉的茶，在饮品或甜点中使用。","why":"菜单可能是茶本身，也可能是抹茶拿铁、冰淇淋等，要看完整名称。","examples":[["抹茶をお願いします。","请来一份抹茶。"]]},"ほうじ茶":{"what":"经过焙炒、带烘焙香的日本茶。","why":"它既可作为饮品，也用于甜点风味，与抹茶不是同一种加工方式。","examples":[["ほうじ茶をお願いします。","请来一份焙茶。"]]},"ウーロン茶":{"what":"乌龙茶，餐厅里常见的无酒精饮品。","why":"不喝酒时可以单点；它与加烧酒的「ウーロンハイ」不同。","examples":[["ウーロン茶を一つお願いします。","请来一杯乌龙茶。","不想喝酒时"],["氷なしでお願いします。","麻烦不要加冰。","不想加冰"],["温かいウーロン茶はありますか？","有热乌龙茶吗？","想喝热的"]]},"大福":{"what":"以软糯外皮包住馅料的日式点心，常见红豆馅。","why":"甜品店可能再标草莓等口味，「大福」说的是点心类型。","examples":[["大福をお願いします。","请来一份大福。"]]},"どら焼き":{"what":"用两片类似小松饼的外皮夹馅的铜锣烧。","why":"通常出现在日式点心店或甜点菜单，常见夹红豆馅。","examples":[["どら焼きをお願いします。","请来一份铜锣烧。"]]},"たい焼き":{"what":"烤成鲷鱼形状、里面有馅的点心。","why":"名字和外形像鱼，但并不表示含有鲷鱼肉。","examples":[["たい焼きをお願いします。","请来一份鲷鱼烧。"]]},"みたらし団子":{"what":"表面淋甜咸酱汁的串团子。","why":"团子有多种口味，「みたらし」标示这种酱汁口味。","examples":[["みたらし団子をお願いします。","请来一份御手洗团子。"]]},"かき氷":{"what":"把冰刨碎后加糖浆等配料的刨冰。","why":"甜品店用不同糖浆和配料区分口味，点单时常需选择。","examples":[["かき氷をお願いします。","请来一份刨冰。"]]},"ソフトクリーム":{"what":"从机器挤出、质地柔软的冰淇淋。","why":"常装在蛋筒或杯里，菜单可能需要同时选择口味与容器。","examples":[["ソフトクリームをお願いします。","请来一份软冰淇淋。"]]},"プリン":{"what":"日式菜单里常指布丁，常见蛋奶和焦糖风味。","why":"它属于甜点，不是饮品，餐后可以单点。","examples":[["プリンをお願いします。","请来一份布丁。"]]},"日本酒":{"what":"以米、米曲和水等酿造的清酒。","why":"居酒屋酒单会按品牌、风格或温度区分，点单时可说明偏好。","examples":[["おすすめの日本酒はありますか？","有推荐的日本酒吗？","请店员推荐"],["辛口のものがいいです。","我想要偏干、不甜的。","说明口味"],["冷酒を一合お願いします。","请来一合冰镇日本酒。","指定温度和数量"]],"source":["日本酒温度参考：神奈川县酒造组合","https://www.kanagawa-jizake.or.jp/guide/"],"text":"日本酒是以米、米曲和水等酿造的清酒。酒单上名字很多，不必全看懂，可以先请店员推荐，再说自己想要偏干还是偏甜、热的还是冰的。想喝冰镇的可说「冷酒」；「冷や」在清酒语境通常指常温。"},"焼酎":{"what":"日本的一类蒸馏酒，可用薯、麦等不同原料制作。","why":"居酒屋常同时提供加冰、兑水、兑热水等喝法，需要分别选择。","examples":[["麦焼酎を水割りでお願いします。","请来一杯兑水的麦烧酒。"]]},"ハイボール":{"what":"居酒屋里通常指威士忌加苏打水的饮品。","why":"它属于含酒精饮品，和普通苏打水不是同一项。","examples":[["ハイボールを一つお願いします。","请来一杯威士忌苏打。","点一杯"],["薄めにできますか？","可以调淡一点吗？","想调淡一点"],["同じものをもう一杯お願いします。","麻烦再来一杯一样的。","再点一样的"]]},"梅酒":{"what":"以梅子浸渍制作的酒类饮品。","why":"点单时店员可能继续问加冰还是兑苏打水等喝法。","examples":[["梅酒をロックでお願いします。","梅酒请加冰。","加冰喝"],["梅酒をソーダ割りでお願いします。","梅酒请兑苏打水。","兑苏打喝"]]},"生ビール":{"what":"生啤酒，日常点单常简称「生（なま）」。","why":"居酒屋会按杯型或容量供应，所以可补充中杯、大杯或数量。","examples":[["とりあえず、生を二つお願いします。","先来两杯生啤。","先点饮料"],["生、もう一杯お願いします。","麻烦再来一杯生啤。","再来一杯"],["小さいサイズはありますか？","有小杯的吗？","选小杯"]],"text":"居酒屋里的「生ビール」就是生啤，点单时常简称「生（なま）」。刚坐下想先喝点东西，可以说「とりあえず、生を二つ」。想再来一杯，就加上「もう一杯」。"},"大根おろし":{"what":"把白萝卜磨成的萝卜泥。","why":"常作为烤鱼、炸物等的配菜或调味搭配，不是整块萝卜。","examples":[["大根おろしをお願いします。","请来一份萝卜泥。"]]},"わさび":{"what":"山葵调味料，中文菜单常称日式芥末。","why":"寿司和刺身常搭配它；不想放时可在点单时提出。","examples":[["わさび抜きでお願いします。","麻烦不要放山葵。","不要山葵"],["わさびは少なめでお願いします。","麻烦少放一点山葵。","想少放一点"],["わさびは別にしてください。","山葵请分开放。","想自己加"]],"text":"「わさび」是寿司和刺身旁常见的山葵调味料，中文菜单也常叫日式芥末。不想放可以说「わさび抜き」，只想少一点就说「少なめ」。希望自己决定用量，也可以让店员分开放。"},"生姜":{"what":"姜，可以切丝、磨泥或腌制后使用。","why":"菜单或配料说明出现它，是在说明增香食材，具体形式由菜品决定。","examples":[["生姜は入っていますか？","里面有姜吗？"]]},"山椒":{"what":"山椒植物的果实等制成的香辛料。","why":"鳗鱼等料理旁可能放有山椒粉，用来增添香气与麻感。","examples":[["山椒は別にできますか？","山椒可以分开放吗？"]]},"ポン酢":{"what":"在餐桌调味语境中常指带柑橘酸味的调味汁，常与酱油搭配。","why":"涮锅、豆腐等可能用它作蘸汁，与芝麻酱是不同选择。","examples":[["ポン酢をもらえますか？","能给我一点柑橘调味汁吗？"]]},"柚子":{"what":"一种具有明显香气的柑橘类水果。","why":"日料用果皮或果汁为汤、酱汁和饮品增香，不一定是整颗水果上桌。","examples":[["これ、柚子が入っていますか？","这个里面有柚子吗？"]]},"七味":{"what":"由辣椒等多种香辛料混合的调味粉。","why":"乌冬、荞麦面或烤串旁可能放有它，按喜好少量添加。","examples":[["七味はありますか？","有七味粉吗？"]]},"梅干し":{"what":"盐渍等加工制成的梅子，通常有酸咸风味。","why":"常放进饭团、茶泡饭或作为配菜，不是甜味梅干零食的同义词。","examples":[["梅干しのおにぎりをお願いします。","请来一个梅子饭团。"]]},"納豆":{"what":"发酵大豆，常带黏丝和特有气味。","why":"既可配米饭，也会做成卷寿司；菜单出现时说明用到了这种发酵食材。","examples":[["納豆をお願いします。","请来一份纳豆。"]]},"豆腐":{"what":"豆浆凝固后制成的豆腐。","why":"日料会冷食、炖煮或油炸，具体做法要看「冷奴」「揚げ出し」等完整菜名。","examples":[["この料理には豆腐が入っていますか？","这道菜里有豆腐吗？"]]},"昆布":{"what":"可食用的海藻，常用来熬高汤或加工成配菜。","why":"它能出现在汤底、饭团馅和小菜里，不能一律理解成干海带直接吃。","examples":[["このだしは昆布ですか？","这个高汤是用昆布做的吗？"]]},"海苔":{"what":"紫菜类海藻加工成的食材，常见薄片状。","why":"寿司用它包裹，拉面也用它作配料；「海苔増し」表示增加海苔。","examples":[["海苔を追加できますか？","能加一份海苔吗？"]]},"味噌汁":{"what":"用高汤、味噌和配料做成的汤。","why":"定食常附带它，若想再来一碗应先确认是否能续、是否收费。","examples":[["味噌汁をお願いします。","请来一份味噌汤。"]]},"漬物":{"what":"用盐、糠、醋等方式腌制的菜类统称。","why":"常作为米饭旁的小菜出现，不专指某一种腌黄瓜或萝卜。","examples":[["漬物をお願いします。","请来一份腌菜。"]]},"食べ放題":{"what":"在规定条件内可以多次取餐或点餐的畅吃形式。","why":"店里用它说明套餐规则，需要留意时间、菜品范围和追加费用。","examples":[["食べ放題は何分ですか？","畅吃限时多少分钟？","问套餐时长"],["このメニューも食べ放題に入っていますか？","这道菜也在畅吃范围内吗？","确认可点范围"]]},"お会計":{"what":"结账、买单时使用的说法。","why":"吃完后要通知店员准备账单；它和点餐用的「注文」不同。","examples":[["すみません、お会計お願いします。","不好意思，麻烦买单。","准备买单"],["別々に払えますか？","可以分开付款吗？","想分开付"],["カードは使えますか？","可以刷卡吗？","确认付款方式"]],"text":"吃完想买单，叫住店员说「お会計お願いします」就很自然。「お会計」是结账，别和点菜用的「注文」混淆。如果想各付各的，或想刷卡，可以接着把需求说清楚。"},"相席":{"what":"让不同组客人共用一张桌子的拼桌安排。","why":"店里座位紧张时可能询问是否接受，不表示你必须和陌生人一起点菜。","examples":[["相席でも大丈夫です。","可以拼桌。"]]},"持ち帰り":{"what":"把食物带离店铺的外带。","why":"店员需要确认包装和用餐方式，通常会与「店内」堂食区分。","examples":[["持ち帰りでお願いします。","麻烦打包带走。","点单时说外带"],["これ、持ち帰りできますか？","这个能外带吗？","先问能否外带"],["残った分を持ち帰れますか？","剩下的可以打包带走吗？","饭后问能否打包"]],"text":"「持ち帰り（もちかえり）」就是外带，也会看到「テイクアウト」。点单时说「持ち帰りでお願いします」即可。已经上桌、吃剩的菜能不能打包，则要另外询问店员。"},"取り皿":{"what":"把共享菜分到自己面前用的小碟子。","why":"居酒屋大盘菜常供多人分食，需要分餐碟，而不是再点一份菜。","examples":[["取り皿を二枚お願いします。","麻烦给两个分餐碟。","分着吃一道菜"],["取り皿をもう一枚もらえますか？","能再给我一个分餐碟吗？","再要一个"]],"text":"几个人分着吃一盘菜时，各自面前的小碟子就叫「取り皿（とりざら）」。不够用就向店员要，盘子用「枚（まい）」计数，两只说「二枚（にまい）」。"},"おしぼり":{"what":"用来擦手的湿毛巾或湿巾。","why":"餐厅会在用餐前提供，若没有拿到可以向店员要。","examples":[["すみません、おしぼりをもらえますか？","不好意思，能给我一条湿毛巾吗？","还没拿到"],["おしぼりをもう一つお願いします。","麻烦再给一条湿毛巾。","想再要一条"]]},"割り箸":{"what":"使用前通常需要掰开的筷子，常为一次性筷子。","why":"外带或用餐时可用来询问餐具，不是要点一道菜。","examples":[["割り箸をつけてもらえますか？","能附上一双一次性筷子吗？"]]},"予約":{"what":"提前预约座位、时间或服务。","why":"餐厅需要按人数和时间安排座位，预约时还应说明具体日期。","examples":[["明日の七時に、二人で予約できますか？","能预约明天七点两位吗？","提前订位"],["七時に予約した田中です。","我是预约了七点的田中。","到店报预约"],["予約してないんですが、二人入れますか？","我们没预约，两个人能坐吗？","没有预约"]],"text":"「予約（よやく）」是预约。订餐厅时，把日期、时间和人数一起说出来更方便。到了店里，再报预约时间和姓名；如果没有预约，也可以问现在能不能坐。"},"禁煙席":{"what":"不允许吸烟的座位。","why":"不同店铺的吸烟规定不同；这个词用于说明座位需求。","examples":[["禁煙席でお願いします。","麻烦安排禁烟座位。","选择座位"],["ここは禁煙ですか？","这里禁烟吗？","不确定店内规则"]]},"アレルギー":{"what":"过敏。食物过敏时要明确告诉店员是哪种食材。","why":"店员需要了解食材限制；“不喜欢”和“过敏”含义不同，不能互相替代。","examples":[["卵アレルギーがあります。","我对鸡蛋过敏。","明确告知"],["この料理に卵は入っていますか？","这道菜里有鸡蛋吗？","确认食材"],["厨房に確認してもらえますか？","能帮我向厨房确认一下吗？","请店员核实"]]},"家系":{"what":"以横滨家系风格命名的拉面，典型搭配为猪骨酱油汤。","why":"店铺用它标明风格，有的店还会询问面硬度、味道浓淡和油量。","examples":[["家系ラーメンは初めてなんですが、おすすめはありますか？","我第一次吃家系拉面，有推荐的吗？"]]},"二郎系":{"what":"受拉面二郎风格影响的一类拉面，常见较大份量与蒜等配料。","why":"不同店的点法与份量不同，不熟悉时可以先问普通份有多大。","examples":[["普通のサイズで、麺はどのくらいありますか？","普通份大概有多少面？"]]},"煮干し":{"what":"经过煮制、干燥的小鱼干。","why":"拉面店用它熬汤，菜单写这个词是在强调汤底原料。","examples":[["煮干しのラーメンをお願いします。","请来一份小鱼干汤底的拉面。"]]},"鶏白湯":{"what":"以鸡为主要原料熬成的乳白浓汤。","why":"拉面菜单用它区别猪骨或清汤；「白湯」说的是汤的状态，不是白开水。","examples":[["鶏白湯ラーメンをお願いします。","请来一份鸡白汤拉面。"]]},"魚介":{"what":"鱼、贝等水产食材的统称。","why":"拉面里的「魚介」通常说明汤底或风味使用了海鲜类原料。","examples":[["このスープは魚介系ですか？","这个汤是海鲜类汤底吗？"]]},"背脂":{"what":"猪背部的脂肪。","why":"拉面里可作为增加油脂口感的配料，有的店允许调整用量。","examples":[["背脂を少なめにできますか？","能少放些猪背脂吗？"]]},"台湾まぜそば":{"what":"一种常配肉末、葱蒜等的日式拌面。","why":"名字带台湾，但点到的是拌面类别，通常要把面和配料拌匀再吃。","examples":[["台湾まぜそばをお願いします。","请来一份台湾拌面(无汤)。"]]},"油そば":{"what":"用酱汁、油和配料拌着吃、没有普通拉面汤量的面食。","why":"菜单将它与汤面区分，名字不是单纯“油很多的荞麦面”。","examples":[["油そばをお願いします。","请来一份油拌面。"]]},"汁なし担々麺":{"what":"没有普通汤面那样汤量的担担拌面。","why":"「汁なし」明确提示拌面形式，点单时仍可询问辣度。","examples":[["汁なし担々麺をお願いします。","请来一份无汤担担面。"]]},"辛味噌":{"what":"带辣味的味噌调味料或口味。","why":"拉面店用它说明汤味或配料有辣味，具体辣度要另问。","examples":[["辛味噌は別にできますか？","辣味噌能分开放吗？"]]},"白湯":{"what":"拉面语境读「ぱいたん」，指乳白、浑浊的汤底。","why":"用来区别清汤，可以是鸡或猪骨等原料；不要与读「さゆ」的白开水混淆。","examples":[["これは白湯スープですか？","这是白汤吗？"]]},"清湯":{"what":"拉面语境读「ちんたん」，指相对清澈的汤底。","why":"它与白湯是汤的类别差异，并不直接说明盐味还是酱油味。","examples":[["清湯のラーメンはありますか？","有清汤拉面吗？"]]},"煮卵":{"what":"煮制、常经过调味的鸡蛋。","why":"拉面店把它作为配料出售，具体是否溏心以店家做法为准。","examples":[["煮卵を一つ追加してください。","请加一颗卤蛋。"]]},"海苔増し":{"what":"在原份量上增加海苔。","why":"「増し」是加量的点单词，可能需要加钱，并不等于更换整碗面。","examples":[["海苔増しでお願いします。","麻烦多加海苔。"]]},"青ねぎ":{"what":"主要使用绿色部分的葱。","why":"拉面常用它作配料，若不想加可在下单时提出。","examples":[["青ねぎ抜きでお願いします。","麻烦不要放青葱。"]]},"白ねぎ":{"what":"长葱的白色部分。","why":"拉面店可能把它切丝或切段使用，与青葱的名称有所区分。","examples":[["白ねぎを多めにできますか？","能多放些白葱吗？"]]},"もやし":{"what":"豆芽，日式拉面常见配料。","why":"可以增加蔬菜份量和口感，有的店能调整用量。","examples":[["もやしを少なめにできますか？","能少放些豆芽吗？"]]},"コーン":{"what":"玉米粒。","why":"有些拉面用它作配料，特别是与黄油等搭配的口味。","examples":[["コーンを追加してください。","请加一份玉米粒。"]]},"バター":{"what":"黄油。","why":"拉面或料理用它增添乳香；菜单出现时表示含有这种配料。","examples":[["バターを追加できますか？","能加一份黄油吗？"]]},"ニンニク":{"what":"蒜。","why":"部分拉面店会问是否加入，不需要时可回答「なしで」。","examples":[["ニンニクなしでお願いします。","麻烦不要放蒜。","不要蒜"],["ニンニクは少なめでお願いします。","麻烦少放一点蒜。","少放一些"],["これ、ニンニク入ってますか？","这个里面有蒜吗？","先确认配料"]]},"刻みニンニク":{"what":"切碎的蒜末。","why":"这个词说明蒜的处理形式，与整瓣蒜或蒜油不同。","examples":[["刻みニンニクを少しください。","请给我一点蒜末。"]]},"辛子高菜":{"what":"以高菜等制作的辣味腌菜。","why":"一些拉面店把它作配菜或调味配料，添加前可先确认辣度。","examples":[["この高菜は辛いですか？","这个高菜辣吗？"]]},"紅生姜":{"what":"红色的腌姜，常切成细丝。","why":"拉面、牛丼或炒面旁可能出现，用来增加酸味与香气。","examples":[["紅生姜抜きでお願いします。","麻烦不要放红姜丝。"]]},"白ごま":{"what":"白芝麻。","why":"可撒在面、饭或小菜上，菜单中是配料说明。","examples":[["白ごまは入っていますか？","里面有白芝麻吗？"]]},"豚バラチャーシュー":{"what":"用猪五花肉制作的日式叉烧。","why":"它比只写「チャーシュー」多说明了肉的部位，方便按肥瘦偏好选择。","examples":[["豚バラチャーシューを追加できますか？","能加一份五花叉烧吗？"]]},"肩ロース":{"what":"靠近肩背的肉类部位；这里指用来制作叉烧的肩里脊。","why":"拉面店可能列出不同叉烧部位，客人可以比较选择。","examples":[["このチャーシューは肩ロースですか？","这个叉烧是肩里脊做的吗？"]]},"トッピング":{"what":"在基础菜品上另加的配料。","why":"拉面菜单把蛋、肉、海苔等加料单独列出来，常需额外付费。","examples":[["トッピングは何がありますか？","有哪些配料可以加？"]]},"追加":{"what":"在已有点单上再增加。","why":"服务员会用它描述加菜、加面或加料，而不是重新取消原订单。","examples":[["追加で餃子をお願いします。","麻烦再加一份饺子。"]]},"麺かため":{"what":"要求面条煮得偏硬一些。","why":"允许调面硬度的店会在点单时确认，需在烹煮前提出。","examples":[["麺はかためでお願いします。","麻烦面条煮硬一点。","偏硬"],["麺は普通でお願いします。","面条普通硬度就好。","普通硬度"],["麺はやわらかめでお願いします。","麻烦面条煮软一点。","偏软"]]},"薄め":{"what":"味道偏淡一点；拉面里常说调味淡一些。","why":"它是浓淡要求，不是小份或少面，要和份量区分。","examples":[["味は薄めでお願いします。","麻烦味道淡一点。"]]},"濃いめ":{"what":"味道偏浓一点。","why":"拉面店可用它记录口味要求，不等于增加面量。","examples":[["味は濃いめでお願いします。","麻烦味道浓一点。"]]},"油少なめ":{"what":"要求油放少一些。","why":"支持口味调整的店可据此处理，是否能完全不放需另问。","examples":[["油少なめでお願いします。","麻烦少油。"]]},"油多め":{"what":"要求油放多一些。","why":"它调整的是油量，不是汤量或面量。","examples":[["油多めでお願いします。","麻烦多放一点油。"]]},"替え玉無料":{"what":"追加一份面免费，但次数与条件以店铺说明为准。","why":"菜单用它吸引想续面的人；通常不是整碗面连汤一起重做。","examples":[["替え玉は何回まで無料ですか？","可以免费加几次面？"]]},"小ライス":{"what":"一小碗米饭。","why":"拉面店会把它作为主食配搭单列，份量比普通ライス小。","examples":[["小ライスをお願いします。","请来一份小碗米饭。"]]},"半チャーハン":{"what":"小份或半份炒饭。","why":"常搭配拉面做套餐，让客人能同时吃面和饭。","examples":[["半チャーハンをお願いします。","请来一份半份炒饭。"]]},"餃子セット":{"what":"包含饺子的组合套餐。","why":"它说明有套餐搭配，具体是否含饭、面要看菜单内容。","examples":[["餃子セットをお願いします。","请来一份饺子套餐。"]]},"食券":{"what":"购买餐食后获得的餐券或订单凭证。","why":"先付款的餐厅会用它把所点菜品传给店员或厨房。","examples":[["食券はどこで買えますか？","哪里可以买餐券？","问购买位置"],["食券はどこに出せばいいですか？","餐券应该交到哪里？","不知道交给谁"]]},"券売機":{"what":"卖票的机器；餐厅里通常用来买餐券。","why":"客人先选菜付款，再按店里流程领取或递交餐券。","examples":[["券売機はどこですか？","餐券机在哪里？","寻找机器"],["すみません、使い方を教えてもらえますか？","不好意思，能教我怎么用吗？","不会操作"],["この券売機はカードが使えますか？","这台机器可以刷卡吗？","确认能否刷卡"]]},"現金のみ":{"what":"只接受现金付款。","why":"店里用这个标识说明支付方式，不能当成“现金有优惠”。","examples":[["支払いは現金だけですか？","只能用现金付款吗？"]]},"カウンター席":{"what":"面对吧台或厨房的一排座位。","why":"拉面店、居酒屋常这样安排座位，与独立餐桌不同。","examples":[["カウンター席で大丈夫です。","吧台座位可以。"]]},"焼き物":{"what":"用烤制方式制作的菜品类别。","why":"日料菜单按烹饪法分栏时会出现，栏内可能是鱼、肉或蔬菜。","examples":[["おすすめの焼き物は何ですか？","有什么推荐的烤物？"]]},"揚げ物":{"what":"油炸菜品的总称。","why":"菜单以它统称天妇罗、炸鸡等，不是某一道固定菜。","examples":[["揚げ物は何がありますか？","有哪些炸物？"]]},"煮物":{"what":"把食材放在汤汁或调味液中煮制的菜品。","why":"日料用它区分烤、炸、蒸等做法，食材可以多样。","examples":[["今日の煮物は何ですか？","今天的炖菜是什么？"]]},"蒸し物":{"what":"用蒸汽加热制作的菜品。","why":"套餐或菜单中它标示烹饪方式，不是具体某种蒸鱼。","examples":[["この蒸し物には何が入っていますか？","这道蒸菜里面有什么？"]]},"和え物":{"what":"把食材与调味料拌合的菜品。","why":"日料小菜栏常见；它不一定是完全未经加热的生菜。","examples":[["この和え物は何で味付けしていますか？","这道拌菜用什么调味？"]]},"酢の物":{"what":"以醋味调味汁拌制的菜品。","why":"可以作为套餐中的小菜，主要帮助你识别酸味调味方向。","examples":[["酢の物を一つお願いします。","请来一份醋拌菜。"]]},"刺身":{"what":"切片后供食用的生鲜食材，常见为鱼贝类生鱼片。","why":"海鲜店和居酒屋会单点或拼盘供应，具体鱼种要看标注。","examples":[["刺身の盛り合わせをお願いします。","请来一份刺身拼盘。","点拼盘"],["これは何の魚ですか？","这是什么鱼？","不认识鱼种"],["今日のおすすめの刺身は何ですか？","今天有什么推荐的刺身？","问当日推荐"]]},"汁物":{"what":"汤类料理的总称。","why":"套餐流程用它说明这一道是汤，而非固定某一种味噌汤。","examples":[["このセットに汁物はつきますか？","这个套餐附带汤吗？"]]},"鍋物":{"what":"在锅中烹煮并食用的料理总称。","why":"菜单用它归类火锅、寿喜烧等，需要再看汤底和食材。","examples":[["鍋物は二人前からですか？","锅物是两人份起点吗？"]]},"茶碗蒸し":{"what":"用高汤与蛋液蒸成、常有配料的咸味蛋羹。","why":"它常作为套餐的一道菜，名字虽有茶碗，却不是茶饮。","examples":[["茶碗蒸しをお願いします。","请来一份蒸蛋羹。"]]},"先付":{"what":"一餐或套餐开始时上的前菜、小菜。","why":"日料菜单用它标示上菜顺序；不应只凭这个词推断另收座位费。","examples":[["この先付は何ですか？","这道前菜是什么？"]],"source":["献立名称参考：日本食育综合研究所","https://www.educe-shokuiku.jp/news/shokuiku/nihonryouri/"]},"八寸":{"what":"日料中的一组小菜，常体现季节食材和搭配。","why":"它是套餐流程或料理组合的名称，不表示一定有八道菜。","examples":[["この八寸には何が入っていますか？","这份季节小菜里有什么？"]],"source":["献立名称参考：日本食育综合研究所","https://www.educe-shokuiku.jp/news/shokuiku/nihonryouri/"]},"お椀":{"what":"原意是碗，在日料献立中常指碗盛的汤料理。","why":"店员报菜名时用容器代指这一道汤，不是在销售空碗。","examples":[["このお椀には何が入っていますか？","这道汤里有什么？"]]},"造り":{"what":"日料菜单里的刺身类料理，也常写「お造り」。","why":"套餐会把刺身这一道称为造り，不是“制作过程”的意思。","examples":[["お造りの盛り合わせをお願いします。","请来一份刺身拼盘。"]],"source":["献立名称参考：日本食育综合研究所","https://www.educe-shokuiku.jp/news/shokuiku/nihonryouri/"]},"強肴":{"what":"套餐中另外添上的一道料理，内容由店家安排。","why":"它是献立名称，不等于客人主动加点或一定另收费。","examples":[["今日の強肴は何ですか？","今天的强肴是什么菜？"]]},"止め椀":{"what":"接近一餐结束、通常随饭上的汤，常见味噌汤。","why":"它标示套餐后段的汤，与前面上的椀物位置不同。","examples":[["止め椀は味噌汁ですか？","收尾的汤是味噌汤吗？"]]},"水菓子":{"what":"传统日料献立中通常指水果。","why":"一般出现在餐后阶段，不能按字面理解成水做的糖果。","examples":[["今日の水菓子は何ですか？","今天的餐后水果是什么？"]],"source":["献立名称参考：日本食育综合研究所","https://www.educe-shokuiku.jp/news/shokuiku/nihonryouri/"]},"懐石":{"what":"源于茶事餐食的日式料理形式，现代餐厅用法可能更广。","why":"菜单用它说明一套按顺序供应的料理，具体内容和道数应确认。","examples":[["懐石のコースを予約したいです。","我想预约怀石套餐。"]]},"会席":{"what":"以宴饮场合发展出的日式多道菜料理。","why":"常用于聚餐套餐；与「懐石」同音，但历史含义不同。","examples":[["会席のコースは何品ですか？","会席套餐有几道菜？"]]},"御膳":{"what":"正式用餐的称呼，现代菜单中常指摆在托盘等上的套餐。","why":"点一份通常会有多种搭配，是否一次上齐和具体内容依店家而定。","examples":[["この御膳には何がつきますか？","这份御膳套餐附带什么？"]]},"徳利":{"what":"装日本酒等用的酒壶。","why":"点温酒时可能用它盛装，它说的是器皿，不是酒的品牌。","examples":[["徳利で一合お願いします。","请用酒壶来一合酒。"]]},"お猪口":{"what":"饮用日本酒的小酒杯。","why":"多人分饮一壶酒时可能需要多要几个，并不是多点几份酒。","examples":[["お猪口をもう一つください。","请再给一个小酒杯。"]]},"熱燗":{"what":"把日本酒加热后的喝法。","why":"店员用它确认饮用温度，与冰镇的冷酒不同。","examples":[["日本酒を熱燗でお願いします。","麻烦把日本酒温热后上。"]],"source":["日本酒温度参考：神奈川县酒造组合","https://www.kanagawa-jizake.or.jp/guide/"]},"冷酒":{"what":"冷却、冰镇后饮用的日本酒。","why":"想喝冰的可以用这个词；「冷や」在清酒语境通常指常温，要区分。","examples":[["冷酒を一合お願いします。","请来一合冰镇日本酒。"]],"source":["日本酒温度参考：神奈川县酒造组合","https://www.kanagawa-jizake.or.jp/guide/"]},"純米":{"what":"纯米酒类别，以米、米曲和水为原料，不添加酿造酒精。","why":"酒单用它说明酿造类别，并不直接等于一定甜、一定干或最高级。","examples":[["おすすめの純米酒はありますか？","有推荐的纯米酒吗？"]]},"吟醸":{"what":"采用吟酿工艺的一类日本酒名称。","why":"酒单用它区别酒的类别与风格；香气和口味还需看具体酒款。","examples":[["吟醸酒はありますか？","有吟酿酒吗？"]]},"辛口":{"what":"清酒里通常指偏干、不甜的口感描述。","why":"在咖喱里可能指辣，酒单里的含义不能直接套用到食物。","examples":[["辛口の日本酒をお願いします。","请来偏干的日本酒。"]]},"甘口":{"what":"清酒里通常表示偏甜的口感。","why":"用于按喜好挑酒，与「辛口」形成对照，但实际味道仍因酒款而异。","examples":[["甘口のお酒はありますか？","有偏甜的酒吗？"]]},"箸置き":{"what":"搁放筷子前端的小器具，即筷架。","why":"日式餐桌用它让筷子不直接接触桌面，不是可食用的配菜。","examples":[["箸置きをもらえますか？","能给我一个筷架吗？"]]},"湯呑み":{"what":"喝茶用的杯子，通常没有把手。","why":"需要茶杯时会用到这个词，它不是茶本身的名称。","examples":[["湯呑みをもう一つください。","请再给一个茶杯。"]]},"個室":{"what":"与其他客人座位分隔开的包间，具体私密程度依店铺而异。","why":"居酒屋用它区分座位类型，想要安静聚餐时可以询问是否有空位。","examples":[["個室はありますか？","有包间吗？","先问有没有"],["今、個室は空いてますか？","现在有空包间吗？","问是否空着"],["四人で、個室を予約できますか？","四个人可以预约包间吗？","预订时提要求"]],"text":"「個室（こしつ）」就是包间。想和朋友坐得独立一点，可以先问店里有没有；有包间不代表现在有空位，所以还可以接着问「空いてますか？」。"},"座敷":{"what":"铺榻榻米等、需要坐在地面附近的日式座席。","why":"和桌椅席坐法不同，入座前店员可能会询问是否接受。","examples":[["座敷でも大丈夫です。","日式座敷也可以。"]]},"掘りごたつ":{"what":"桌下留有凹槽、可以把脚放下去的日式座位。","why":"外观看似座敷，但不一定需要盘腿坐，店里会单独标明。","examples":[["掘りごたつの席はありますか？","有能把脚放下去的日式座位吗？"]]},"テーブル席":{"what":"使用餐桌和椅子的桌席。","why":"店员用它与吧台席、座敷等区分，便于安排座位。","examples":[["テーブル席でお願いします。","麻烦安排桌席。","说明座位需求"],["テーブル席に移れますか？","可以换到桌席吗？","问能否换座"]]},"席料":{"what":"使用座位收取的费用，指收费项目，不是端上桌的小菜。","why":"有些居酒屋会在餐饮费之外收取席料。「お通し」则指入座小菜；小菜收费与席料如何安排因店而异，不能把两个词当作同义词。","examples":[["席料はかかりますか？","要收座位费吗？","入座前确认"],["席料は一人いくらですか？","座位费每人多少钱？","问金额"],["これは席料ですか？","这一项是座位费吗？","核对账单"]],"text":"「席料（せきりょう）」就是使用座位收取的费用。有些居酒屋会把它另列在账单上。它和「お通し」不是同一个词：前者是费用，后者是入座后提供的小菜。是否都收、怎样计算，要看店铺的说明。"},"お通し":{"what":"入座后提供、通常收费的小菜，指的是一道食物，不是“座位费”的日语名称。","why":"一些居酒屋会在客人入座后提供这种小菜，并按店铺规则收费。它在收费安排上可能与座位有关，但词义仍是小菜；「席料」才是使用座位收取的费用。是否另收或合并计费，应看店铺说明。","examples":[["このお通しは何ですか？","这份入座小菜是什么？","不知道端来的是什么"],["お通しはいくらですか？","入座小菜多少钱？","先问费用"],["お通しはなしにできますか？","可以不要入座小菜吗？","询问能否不要"]],"text":"刚坐下，还没点菜，店员就端来一小碟——这往往就是「お通し」。它通常会收费，但这个词指的是小菜本身；账单上的座位费叫「席料」。小菜和座位费如何收费，各家店不一样，不清楚时可以先问。"},"予約席":{"what":"已经为预约客人保留的座位。","why":"桌上的标牌用于提示该座位已有安排，不宜直接入座。","examples":[["ここは予約席ですか？","这里是预约席吗？"]]},"注文":{"what":"点单、订购；在餐厅就是告诉店员想吃喝什么。","why":"入座后叫店员过来点菜会用这个词，与结账不同。","examples":[["すみません、注文いいですか？","不好意思，可以点菜吗？","叫店员点菜"],["もう少し待ってもらえますか？","能再等我们一下吗？","还没选好"],["追加で唐揚げをお願いします。","麻烦再加一份炸鸡。","再加一道"]],"text":"「注文（ちゅうもん）」就是点单。看好菜单后，先用「すみません」叫店员，再说「注文いいですか？」就可以了。还没决定好时，也可以请对方再等一下。"},"おすすめ":{"what":"店家或对方推荐的选择。","why":"不熟悉菜单时，可让店员根据当日食材或人气介绍菜品。","examples":[["おすすめは何ですか？","有什么推荐的吗？","不知道点什么"],["この辺りの名物はありますか？","有这一带的特色菜吗？","想吃当地菜"],["じゃあ、それをお願いします。","那就来这个吧。","选好后下单"]],"text":"菜单看得眼花，不知道选什么，就问「おすすめは何ですか？」。「おすすめ」是推荐的东西，可以是菜，也可以是酒。听完介绍，想选那一道，接一句「じゃあ、それをお願いします」就能下单。"},"人気メニュー":{"what":"比较受欢迎的菜品或饮品。","why":"店家用它帮助客人选菜，不代表所有人都会喜欢同一口味。","examples":[["人気のメニューはどれですか？","哪道菜比较受欢迎？"]]},"季節限定":{"what":"只在特定季节供应的品项。","why":"食材和菜单会随季节变化，不代表全年都能点到。","examples":[["季節限定のメニューはありますか？","有季节限定的菜吗？"]]},"ラストオーダー":{"what":"最后接受点单的时间。","why":"店里需为厨房收尾留出时间，所以通常与正式打烊时间有区别。","examples":[["ラストオーダーは何時ですか？","最后点单是几点？","提前确认"],["まだ注文できますか？","现在还能点单吗？","快截止时加点"],["最後に、生をもう一杯お願いします。","最后麻烦再来一杯生啤。","最后再点一杯"]],"text":"「ラストオーダー」常缩写成 L.O.，是最后接受点单的时间，并不一定是打烊时间。看到这个提醒，如果还想吃点什么、再来一杯，就要在截止前点好。"},"コース":{"what":"按安排供应多道菜的套餐。","why":"聚餐时不用每道单点，但内容、价格及是否含饮料应先确认。","examples":[["このコースには何がつきますか？","这个套餐包含什么？","问包含什么"],["飲み放題はついていますか？","包含畅饮吗？","确认是否含畅饮"],["二人でも注文できますか？","两个人也可以点吗？","确认人数限制"]]},"宴会":{"what":"多人聚餐、宴饮的场合。","why":"居酒屋会提供适合团体的座位或套餐，预约通常需报人数和时间。","examples":[["十人で宴会の予約をしたいです。","我想预约十人的聚餐。"]]},"飲み放題":{"what":"规定条件和时间内可以多次点饮品的畅饮方案。","why":"不是所有酒款一定包含在内，菜单范围与最后点单时间要看套餐说明。","examples":[["飲み放題のメニューを見せてもらえますか？","能给我看看畅饮菜单吗？","先看可选饮品"],["飲み放題は何分ですか？","畅饮限时多少分钟？","确认时间"],["生ビールも入っていますか？","也包含生啤吗？","问是否包含"]],"text":"「飲み放題（のみほうだい）」就是在规定时间和范围内畅饮。不过并非酒单上每一款都包含在内，先看看畅饮菜单，再确认时长和最后点单时间就好。"},"サービス料":{"what":"店家另列的服务费。","why":"它与消费税、客人自愿给的小费是不同概念，费用是否收取看店铺规定。","examples":[["サービス料は別ですか？","服务费另算吗？"]]},"一人前":{"what":"按一人份标准准备的份量。","why":"烤肉、锅物等常这样标份量，不表示一份只能由一个人吃。","examples":[["一人前でお願いします。","麻烦来一人份。","点一份"],["これ、何人前ですか？","这道菜是几人份？","问够几个人吃"]],"text":"「一人前（いちにんまえ）」是一人份，是店家用来标示份量的说法。它并不表示只能一个人吃。大家一起点菜时，问一句「これ、何人前ですか？」会更容易把握数量。"},"追加注文":{"what":"在原来点单之外再加点。","why":"菜上桌后还想吃喝更多，可以用这个词叫店员处理新需求。","examples":[["追加注文してもいいですか？","可以再加点吗？"]]},"キャンセル":{"what":"取消已经提出的预约或点单等。","why":"厨房可能已开始制作，所以需要询问能否取消，而不能自行认定成功。","examples":[["すみません、これをキャンセルできますか？","不好意思，这个能取消吗？","请求取消"],["注文を間違えました。変更できますか？","我点错了，可以更改吗？","发现点错了"]]},"乾杯":{"what":"举杯时说的“干杯”。","why":"聚餐开始常用来一起举杯，不要求一定把整杯喝完。","examples":[["乾杯！","干杯！"]]},"とりあえず生":{"what":"“先来杯生啤”的口语省略表达。","why":"居酒屋常先点饮料再慢慢看菜，正式点单可补数量和「お願いします」。","examples":[["とりあえず、生を二つお願いします。","先来两杯生啤。"]]},"中ジョッキ":{"what":"中号啤酒杯，点单时常代指一杯中杯生啤。","why":"店里会以杯型区分容量，实际毫升数并非各店统一。","examples":[["生ビールを中ジョッキでお願いします。","请来一杯中杯生啤。"]]},"大ジョッキ":{"what":"大号啤酒杯，点单时常代指一杯大杯生啤。","why":"它与中杯区分份量和价格，具体容量要看店家。","examples":[["生ビールを大ジョッキでお願いします。","请来一杯大杯生啤。"]]},"レモンサワー":{"what":"柠檬风味、通常含酒精的碳酸调酒。","why":"居酒屋常把它列在サワー类，不是普通柠檬汽水。","examples":[["レモンサワーをお願いします。","请来一份柠檬沙瓦。"]]},"ウーロンハイ":{"what":"以乌龙茶与烧酒等调成的酒精饮品。","why":"名字虽然有乌龙茶，仍属于酒类；不喝酒应点ウーロン茶。","examples":[["ウーロンハイをお願いします。","请来一份乌龙茶烧酒。"]]},"カシスオレンジ":{"what":"以黑加仑利口酒和橙汁调制的鸡尾酒。","why":"它是水果风味的酒精饮品，不是单纯橙汁。","examples":[["カシスオレンジをお願いします。","请来一份黑加仑橙汁鸡尾酒。"]]},"ノンアルコール":{"what":"表示无酒精的饮品类别或标识。","why":"不想饮酒时可据此寻找饮品，具体产品说明以菜单或瓶身为准。","examples":[["ノンアルコールは何がありますか？","有哪些无酒精饮品？","问有哪些选择"],["これ、アルコールは入っていませんか？","这个不含酒精吗？","确认一款饮料"],["ノンアルコールビールをお願いします。","请来一杯无酒精啤酒。","点无酒精啤酒"]],"text":"不想喝酒，可以问「ノンアルコールは何がありますか？」。这个词表示无酒精饮品；看起来像果汁的鸡尾酒也可能含酒精，所以遇到不熟悉的名字，直接确认更清楚。"},"ロック":{"what":"加冰块、不另兑水等的喝法，常说「オン・ザ・ロック」。","why":"点烧酒、威士忌或梅酒时，店员可能问你选择哪种喝法。","examples":[["梅酒をロックでお願いします。","梅酒请加冰。"]]},"水割り":{"what":"把酒兑水的喝法。","why":"与纯加冰或兑苏打不同，点酒时需要说明这项要求。","examples":[["焼酎を水割りでお願いします。","烧酒请兑水。"]]},"お湯割り":{"what":"把酒兑热水的喝法。","why":"烧酒等可能这样供应，用它表达想要温热的调饮方式。","examples":[["焼酎をお湯割りでお願いします。","烧酒请兑热水。"]]},"ソーダ割り":{"what":"把酒兑苏打水的喝法。","why":"梅酒、烧酒等都可能提供这种选择，与兑普通水不同。","examples":[["梅酒をソーダ割りでお願いします。","梅酒请兑苏打水。"]]},"ボトルキープ":{"what":"买下一瓶酒后，由店家暂存未喝完部分、以后再饮用的服务。","why":"部分居酒屋提供这项服务，保管期限和费用应先问清。","examples":[["ボトルキープはできますか？","可以寄存酒瓶吗？"]]},"たこわさ":{"what":"通常用章鱼和山葵风味调味制作的小菜。","why":"小份、带山葵味，适合作为居酒屋点酒时搭配的小菜。","examples":[["たこわさをお願いします。","请来一份芥末章鱼。"]]},"塩辛":{"what":"用鱼贝肉或内脏等盐渍、熟成制作的咸味食品。","why":"居酒屋常以小份下酒菜提供；原料不只一种，可询问是哪种塩辛。","examples":[["これは何の塩辛ですか？","这是什么原料做的盐渍小菜？"]]},"ししゃも":{"what":"菜单中的多春鱼一类小鱼，店里也可能使用近似鱼种。","why":"常整条烤制作为下酒菜，具体品种应看店家标示。","examples":[["ししゃもをお願いします。","请来一份多春鱼。"]]},"ホッケ":{"what":"日本菜单常见的食用鱼，中文常译花鲫鱼。","why":"居酒屋常供应剖开后的烤鱼「ホッケの開き」，可多人分食。","examples":[["ホッケの開きをお願いします。","请来一份剖开烤的花鲫鱼。"]]},"牛すじ煮込み":{"what":"把牛筋等炖煮成的小菜。","why":"较适合慢炖的食材被做成温热下酒菜，不是烤牛排。","examples":[["牛すじ煮込みをお願いします。","请来一份炖牛筋。"]]},"厚揚げ":{"what":"外层油炸、内部保留豆腐质地的厚炸豆腐。","why":"居酒屋可烤制或炖煮后供应，与薄的油豆腐皮不同。","examples":[["厚揚げをお願いします。","请来一份厚炸豆腐。"]]},"肉じゃが":{"what":"以土豆、肉、洋葱等炖煮的家常菜。","why":"属于日式炖菜，菜单里的肉种可能是牛肉或猪肉。","examples":[["肉じゃがをお願いします。","请来一份土豆炖肉。"]]},"軟骨唐揚げ":{"what":"把软骨裹粉炸成的小菜，常使用鸡软骨。","why":"它强调脆韧口感，与普通炸鸡肉块是不同菜单项。","examples":[["軟骨唐揚げをお願いします。","请来一份炸软骨。"]]},"フライドポテト":{"what":"炸薯条。","why":"居酒屋也供应便于分享的常见小吃，不只卖传统日料。","examples":[["フライドポテトをお願いします。","请来一份炸薯条。"]]},"シーザーサラダ":{"what":"凯撒沙拉风格的沙拉，常配相应沙拉酱。","why":"聚餐点单时可搭配烤物、炸物，具体配料由店铺决定。","examples":[["シーザーサラダをお願いします。","请来一份凯撒沙拉。"]]},"きゅうりの浅漬け":{"what":"经过较短时间腌渍的黄瓜。","why":"作为清爽的小菜出现，「浅漬け」说明腌渍方式，而非完全生的黄瓜。","examples":[["きゅうりの浅漬けをお願いします。","请来一份浅渍黄瓜。"]]},"ピリ辛":{"what":"带一点刺激感的微辣口味描述。","why":"它修饰菜品味道，不是一个固定食材；实际辣度仍因店而异。","examples":[["これ、ピリ辛ですか？","这个是微辣的吗？"]]},"焼きおにぎり":{"what":"把饭团表面烤制的烤饭团。","why":"居酒屋会把它作为主食或收尾食物，调味可因店铺不同。","examples":[["焼きおにぎりをお願いします。","请来一份烤饭团。"]]},"タレ":{"what":"这里指烤串用的调味酱汁。","why":"店员常问「塩かタレか」，让你在盐味和酱味之间选择。","examples":[["タレでお願いします。","麻烦做成酱汁味。","选酱味"],["タレは別にできますか？","酱汁可以分开放吗？","想另放酱汁"]]},"皮":{"what":"烤鸡串菜单里通常指鸡皮。","why":"这是按鸡的部位命名的串，并不是要点一张包装皮。","examples":[["皮を塩で二本お願いします。","请来两串盐味鸡皮。"]]},"レバー":{"what":"肝脏；烤鸡店里通常指鸡肝。","why":"内脏也可以做串烧，若在其他烤肉店应确认是什么动物的肝。","examples":[["レバーを一本お願いします。","请来一串鸡肝。"]],"source":["烤串部位参考：炭火焼鳥 樫","https://yakitori-kashi.com/menu/"]},"ハツ":{"what":"心脏；烤鸡店里通常指鸡心。","why":"烤串菜单用部位名区分口感，与鸡胸肉或鸡肝不同。","examples":[["ハツを二本お願いします。","请来两串鸡心。"]],"source":["烤串部位参考：炭火焼鳥 樫","https://yakitori-kashi.com/menu/"]},"ぼんじり":{"what":"鸡尾部附近的肉。","why":"脂肪较丰富，烤鸡店会把它作为独立部位串烧出售。","examples":[["ぼんじりを二本お願いします。","请来两串鸡尾肉。"]],"source":["烤串部位参考：炭火焼鳥 樫","https://yakitori-kashi.com/menu/"]},"せせり":{"what":"鸡颈部的肉。","why":"烤鸡店按部位分别出售，看到这个词就知道不是鸡腿或鸡胸。","examples":[["せせりを塩でお願いします。","鸡颈肉串请做成盐味。"]],"source":["烤串部位参考：炭火焼鳥 樫","https://yakitori-kashi.com/menu/"]},"ささみ":{"what":"鸡胸内侧的里脊肉。","why":"烤鸡店会与其他鸡肉部位分开点单，也可能搭配不同调味。","examples":[["ささみを一本お願いします。","请来一串鸡里脊。"]]},"ししとう":{"what":"一种小型青椒，通常辣味不强，但个别可能较辣。","why":"它可以整只串烤，是烤串菜单中的蔬菜选择。","examples":[["ししとうを一本お願いします。","请来一串小青椒。"]]},"銀杏":{"what":"白果，也就是银杏种子去掉外层和硬壳后用于料理的种仁；不是树叶。","why":"居酒屋也卖蔬菜和其他食材的串烧，白果可串起来烤成下酒小菜，有些店季节限定供应。","examples":[["銀杏を一本お願いします。","请来一串烤银杏。","在串烧栏点单"],["銀杏って、どんな食べ物ですか？","银杏是什么食物？","不认识这道菜"],["これは銀杏の串焼きですか？","这是烤银杏串吗？","问是不是烤的"]],"source":["实际菜单：炭火串焼き もん","https://www.mon2006.com/food"],"text":"銀杏（ぎんなん）是白果，也就是做菜用的银杏种仁。在居酒屋里，它也会像蔬菜一样串起来烤，作为下酒小菜。有些店只在当季供应，所以看到串烧栏里的「銀杏」，通常就是在说烤银杏串。"},"アスパラ巻き":{"what":"用肉片等包裹芦笋制作的卷，常见培根或猪肉版本。","why":"烤串店把蔬菜和肉组合起来供应；具体包裹材料应看店里说明。","examples":[["このアスパラ巻きは豚肉ですか？","这个芦笋卷外面包的是猪肉吗？"]]},"〆":{"what":"一餐或一轮饮酒的收尾，读「しめ」。","why":"居酒屋会在这个栏目列饭、面等食物，不表示店铺已经打烊。","examples":[["〆に何かおすすめはありますか？","有什么推荐的收尾主食吗？"]]},"お茶漬け":{"what":"在米饭上加入茶或高汤等、搭配配料的料理。","why":"居酒屋常把它作为收尾主食，口味可按梅子、鲑鱼等区分。","examples":[["〆にお茶漬けをお願いします。","最后请来一份茶泡饭。","收尾点主食"],["お茶漬けは何がありますか？","茶泡饭有哪些口味？","问口味"]]},"雑炊":{"what":"把米饭放进汤中与蛋、蔬菜等煮制的料理。","why":"锅物吃到最后可用剩余汤底制作，也有单独点的版本。","examples":[["最後に雑炊はできますか？","最后可以用汤做杂炊吗？"]]},"締めのラーメン":{"what":"在饮酒或用餐末尾吃的一份拉面。","why":"「締め」标明食用阶段，不是另一种固定的拉面汤底。","examples":[["〆にラーメンをお願いします。","最后请来一份拉面。"]]},"アイス":{"what":"餐厅甜点语境中通常是冰淇淋的简称。","why":"在收尾栏目里说的是甜点；「アイスコーヒー」中的アイス则表示冰的。","examples":[["アイスをお願いします。","请来一份冰淇淋。"]]}},"scenes/scene-dialogues-more":[{"scene":"ramen","kind":"reply","context":"你第一次来这家拉面店，站在门口，不确定要先买餐券还是先排队。","jp":"先に食券を買えばいいですか？","zh":"我先买餐券就可以吗？","options":["先に食券を買えばいいですか？","先に席に座ってもいいですか？","食券を返してもらえますか？"],"note":"「〜すればいいですか？」用来确认该怎么做。","why":"把不确定的步骤直接问出来，比照搬别家店的流程更实用。","variants":[],"reading":"さきに しょっけんを かえば いいですか。"},{"scene":"ramen","kind":"reply","context":"你还没点餐，想问这款拉面辣不辣。","jp":"これ、辛いですか？","zh":"这个辣吗？","options":["これ、辛いですか？","これ、大盛りですか？","これ、冷たいですか？"],"note":"指着菜单说「これ」就可以，不必先读出完整菜名。","why":"在下单前确认辣度，店员才能介绍或推荐适合的口味。","variants":[],"reading":"これ、からいですか。"},{"scene":"ramen","kind":"reply","context":"你想在当前订单里再加一份叉烧。","jp":"チャーシューを追加できますか？","zh":"可以再加一份叉烧吗？","options":["チャーシューを追加できますか？","チャーシューを抜いてもらえますか？","チャーシューは別皿にできますか？"],"note":"「追加」是增加；「抜く」是不放；「別皿」是另外装盘。","why":"加料、去掉配料和分开放是三种不同需求，这里要明确说增加。","variants":[],"reading":"チャーシューを ついかできますか。"},{"scene":"ramen","kind":"reply","context":"你吃面时想拿纸围裙挡一下汤汁，桌边没有。","jp":"すみません、紙エプロンはありますか？","zh":"不好意思，有纸围裙吗？","options":["すみません、紙エプロンはありますか？","すみません、紙袋はありますか？","すみません、レシートをもらえますか？"],"note":"「紙エプロン」是一次性纸围裙，读「かみエプロン」。","why":"不同店铺提供的用品不同，先问有没有，再表达需要即可。","variants":[],"reading":"すみません、かみエプロンは ありますか。"},{"scene":"ramen","kind":"listen","context":"你把餐券交给店员，他接着确认点单偏好。","jp":"麺のかたさは、どうしますか？","zh":"面条硬度要怎样的？","options":["他在问面条硬度","他在问面量大小","他在问是否要加辣"],"note":"「かたさ」是硬度，可以回答「普通で」或「かためで」。","why":"店员需要在煮面前确认硬度，这是支持自选硬度的店会有的对话。","variants":[],"reading":"めんの かたさは、どうしますか。"},{"scene":"ramen","kind":"listen","context":"你买好两张餐券，准备与朋友一起坐。店员说：","jp":"二名様、こちらの席へどうぞ。","zh":"两位，请坐这边。","options":["他在安排你们两个人入座","他让你们再买两张餐券","他让你们再等两分钟"],"note":"「二名様」是对两位客人的称呼，「こちら」指这边。","why":"店员指了座位时，按引导过去即可，不必再自己找位。","variants":[],"reading":"にめいさま、こちらの せきへ どうぞ。"},{"scene":"ramen","kind":"listen","context":"你准备加面，店员提醒了份量选择。","jp":"半替え玉もできますよ。","zh":"也可以加半份面。","options":["可以只加半份面","加面现在半价","现在只剩半碗汤"],"note":"「半替え玉」说的是面量，不表示价格一定减半。","why":"如果还想吃一点但吃不下一整份，就可以询问这种小份选择。","variants":[],"reading":"はんかえだまも できますよ。"},{"scene":"ramen","kind":"listen","context":"你点的是拌面，上桌时店员说：","jp":"よく混ぜてからお召し上がりください。","zh":"请充分拌匀后再吃。","options":["先拌匀再吃","先把汤喝完再吃","先加一份面再吃"],"note":"「混ぜてから」表示拌过之后再做下一步；具体按店员对这道面的说明来。","why":"店员在说明吃法，先后顺序比逐字翻译敬语更重要。","variants":[],"reading":"よく まぜてから おめしあがりください。"},{"scene":"ramen","kind":"dialogue","context":"店员：「麺のかたさはどうしますか？」\n你没有特别偏好，想要普通硬度。","jp":"普通でお願いします。","zh":"普通硬度就好。","options":["普通でお願いします。","大盛りでお願いします。","辛めでお願いします。"],"note":"在当前对话里，「普通」对应的是硬度，不是面量。","why":"直接接着店员的问题回答即可，不用再完整重复“面条的硬度”。","variants":[],"reading":"ふつうで おねがいします。"},{"scene":"ramen","kind":"dialogue","context":"你：「にんにくは入っていますか？」\n店员：「入っています。抜くこともできますよ。」\n你想完全不放蒜。","jp":"じゃあ、にんにく抜きでお願いします。","zh":"那麻烦不要放蒜。","options":["じゃあ、にんにく抜きでお願いします。","じゃあ、にんにく多めでお願いします。","じゃあ、にんにくはそのままでお願いします。"],"note":"「抜き」是不放，「そのまま」是保持原样。","why":"店员已经确认可以去掉蒜，接着明确选择即可。","variants":[],"reading":"じゃあ、にんにくぬきで おねがいします。"},{"scene":"ramen","kind":"dialogue","context":"你：「このラーメンは大盛りにできますか？」\n店员：「はい、百円追加になります。」\n你接受加价，想要大份。","jp":"じゃあ、大盛りでお願いします。","zh":"那麻烦来大份。","options":["じゃあ、大盛りでお願いします。","じゃあ、普通でお願いします。","じゃあ、麺少なめでお願いします。"],"note":"这是题中这家店的加价示例，不代表所有店都收同样金额。","why":"先问能否加大份，听清费用后再确认，可以避免误以为免费。","variants":[],"reading":"じゃあ、おおもりで おねがいします。"},{"scene":"ramen","kind":"dialogue","context":"店员：「お席は別々でもよろしいですか？」\n店里只剩分开的空位，你和朋友接受分开坐。","jp":"はい、大丈夫です。","zh":"可以，没问题。","options":["はい、大丈夫です。","できれば隣同士がいいです。","一緒に座れるまで待ちます。"],"note":"「大丈夫です」在这里表示接受安排；不是所有场景都表示拒绝。","why":"店员在确认座位能否分开，你同意就直接肯定回答。","variants":[],"reading":"はい、だいじょうぶです。"},{"scene":"ramen","kind":"speak","context":"你第一次用这台餐券机，不知道怎么操作。请向店员求助。","jp":"すみません、使い方を教えてもらえますか？","zh":"不好意思，能教我怎么用吗？","options":[],"note":"指着机器问就很清楚。「使い方」读「つかいかた」。","why":"请求具体帮助比只说“我不懂日语”更容易让对方知道要做什么。","variants":["すみません、これ、どう使うんですか？"],"reading":"すみません、つかいかたを おしえてもらえますか。"},{"scene":"ramen","kind":"speak","context":"你面吃完了，但还留着汤，想再加一份面。请向店员表达。","jp":"すみません、替え玉をお願いします。","zh":"不好意思，请加一份面。","options":[],"note":"「替え玉」读「かえだま」。是否先买券或按按钮，依店铺流程。","why":"在提供续面的店可以用这句话，续面通常不含新的汤。","variants":["替え玉を一つください。"],"reading":"すみません、かえだまを おねがいします。"},{"scene":"ramen","kind":"speak","context":"你指着菜单上的拉面，想问里面有没有猪肉。请开口确认。","jp":"これ、豚肉は入っていますか？","zh":"这个里面有猪肉吗？","options":[],"note":"「入っていますか」用来确认食材。若连汤底也在意，可以再问「スープにも豚を使っていますか？」。","why":"只看表面的配料不一定知道汤底原料，按自己的需求继续确认。","variants":["これには豚肉を使っていますか？"],"reading":"これ、ぶたにくは はいっていますか。"},{"scene":"ramen","kind":"speak","context":"你吃完蘸面，希望稀释剩下的蘸汁喝一点，先问店员能不能提供。","jp":"スープ割りはできますか？","zh":"可以加汤稀释蘸汁吗？","options":[],"note":"「スープ割り」读「スープわり」。可能由店员加，也可能自行取用。","why":"先确认店里提供这项服务，再按店员指引操作。","variants":["スープ割りはありますか？"],"reading":"スープわりは できますか。"}],"scenes/scene-dialogues":[{"scene":"restaurant","kind":"reply","context":"你刚在餐厅坐下，想请服务员拿一杯冰水。","jp":"すみません、お冷お願いします。","zh":"不好意思，麻烦给杯冰水。","options":["すみません、お冷お願いします。","すみません、お会計お願いします。","すみません、取り皿お願いします。"],"note":"「お冷（おひや）」就是冰水。也可以说「お水お願いします」，简短而且足够礼貌。","variants":[],"why":"餐厅里要水时，店员已经知道你是在请求饮品，直接说名称加「お願いします」就能表达需求。"},{"scene":"restaurant","kind":"reply","context":"你指着菜单上的一款拉面，想问里面有没有葱。","jp":"これ、ねぎ入ってますか？","zh":"这个里面有葱吗？","options":["これ、ねぎ入ってますか？","ねぎ、多めでお願いします。","ねぎ、別にできますか？"],"note":"问有没有某种食材，用「〜入ってますか？」很常见。这里只是在确认食材；如果涉及过敏，应另外明确告知店员。","variants":[],"why":"点餐前确认配料，可以避免点到不想吃的食材。这里问的是有没有葱，并没有要求多放或分开放。"},{"scene":"restaurant","kind":"reply","context":"两个人一起吃一份菜，想多要两个分餐小碟。","jp":"すみません、取り皿を二枚お願いします。","zh":"不好意思，麻烦给两个分餐碟。","options":["すみません、取り皿を二枚お願いします。","すみません、メニューを二つお願いします。","すみません、お水を二つお願いします。"],"note":"「取り皿（とりざら）」是分餐碟。盘子用「枚（まい）」计数。","variants":[],"why":"多人分享一道菜时，店员需要知道你要的是分餐碟以及数量，而不是再点菜。"},{"scene":"restaurant","kind":"listen","context":"拉面端上来后，你问能不能再加一份面。听听店员怎么回答。","jp":"替え玉は、あちらの券売機で食券を買ってください。","zh":"加面的话，请去那边的机器买餐券。","options":["去餐券机购买加面的餐券","直接把碗拿到厨房","等店员免费加面"],"note":"「替え玉（かえだま）」是另加一份面；「券売機（けんばいき）」是售票机，在这里售卖餐券。","variants":[],"why":"这家店先用餐券处理加面订单，店员是在告诉你下一步先去买券。"},{"scene":"restaurant","kind":"listen","context":"你点好便当，店员接着确认了一件事。","jp":"お持ち帰りですか？","zh":"您是要外带吗？","options":["确认是否外带","确认是否分开付款","确认是否需要加热"],"note":"「持ち帰り（もちかえり）」是外带。可以回答「はい、持ち帰りで」。","variants":[],"why":"店员要根据堂食还是外带决定包装，因此会在点单时确认。"},{"scene":"restaurant","kind":"listen","context":"你在门口等位，听听店员的安排。","jp":"今、満席なので、十分ほどお待ちいただけますか？","zh":"现在满座，大概要等十分钟，可以吗？","options":["现在满座，需要等约十分钟","十分钟后就要打烊","用餐只能坐十分钟"],"note":"「満席（まんせき）」是满座；「十分ほど」是大约十分钟。可以说「はい、待ちます」。","variants":[],"why":"店内没有空位，店员需要确认你是否愿意等，而不是通知即将打烊。"},{"scene":"restaurant","kind":"dialogue","context":"店员：「麺の硬さはどうしますか？」\n你想要偏硬的面，怎么接话？","jp":"かためでお願いします。","zh":"麻烦面煮硬一点。","options":["かためでお願いします。","大盛りでお願いします。","薄めでお願いします。"],"note":"「かため」说面条硬度；「大盛り」说份量；「薄め」说味道浓淡。","variants":[],"why":"拉面店在煮面前确认硬度，你只需回答偏好，不必重新报一遍整碗面的名称。"},{"scene":"restaurant","kind":"dialogue","context":"店员：「こちらでお召し上がりですか？」\n你想打包带走，怎么回答？","jp":"持ち帰りでお願いします。","zh":"麻烦打包带走。","options":["持ち帰りでお願いします。","ここで食べます。","もう一つお願いします。"],"note":"店员在问是否堂食。外带直接说「持ち帰りで」即可，不需要逐字复述问题。","variants":[],"why":"店员在问是否店内用餐，你需要用外带来纠正或说明自己的需求。"},{"scene":"restaurant","kind":"dialogue","context":"你：「すみません、お会計お願いします。」\n店员：「ご一緒でよろしいですか？」\n你们想各付各的。","jp":"別々でお願いします。","zh":"麻烦分开结账。","options":["別々でお願いします。","一緒でお願いします。","現金でお願いします。"],"note":"「ご一緒で」在这里指一起结账。「別々（べつべつ）」表示分开；是否支持分开付款要看店铺。","variants":[],"why":"店员在确认账单是否一起付。回答「別々」才能明确表达分开结账，而非付款方式。"},{"scene":"restaurant","kind":"speak","context":"桌上没有筷子。请开口向店员要一双。","jp":"すみません、お箸お願いします。","zh":"不好意思，麻烦给双筷子。","options":[],"note":"「お箸（おはし）」是筷子。先说「すみません」引起注意，再说需求即可。","variants":["お箸を一膳ください。","お箸、もらえますか？"],"why":"餐具没有拿到时，用「すみません」引起注意，再说需要的物品就够了。"},{"scene":"restaurant","kind":"speak","context":"你第一次来这家餐厅，不知道点什么。请问店员有什么推荐。","jp":"おすすめは何ですか？","zh":"有什么推荐的吗？","options":[],"note":"「おすすめ」就是推荐的东西。在餐厅里不必再加“料理”，对方也能理解。","variants":["何かおすすめありますか？","おすすめ、教えてもらえますか？"],"why":"第一次来、不熟悉菜单时，可以请店员根据店内菜品给你推荐。"},{"scene":"restaurant","kind":"speak","context":"你想点菜单上的咖喱，但希望米饭少一点。请表达这个要求。","jp":"ご飯、少なめでお願いします。","zh":"麻烦米饭少一点。","options":[],"note":"「少なめ（すくなめ）」表示偏少一点。可以先指着菜单点餐，再补这句要求。","variants":["ご飯を少なめにできますか？","ライス少なめでお願いします。"],"why":"点饭类餐食时可以先询问能否减少饭量，是否能调整以店家回复为准。"},{"scene":"izakaya","kind":"reply","context":"你们三个人到居酒屋，店员问「何名様ですか？」。","jp":"三人です。","zh":"我们三位。","options":["三人です。","三つお願いします。","三時です。"],"note":"问人数时用「人」。三个人是「さんにん」，不是用于东西数量的「三つ」。","variants":[],"why":"店员根据人数安排座位，所以要用表示人数的「三人」，而不是数量「三つ」。"},{"scene":"izakaya","kind":"reply","context":"你想先来一杯生啤，稍后再点菜。","jp":"とりあえず、生一つお願いします。","zh":"先来一杯生啤。","options":["とりあえず、生一つお願いします。","とりあえず、お会計お願いします。","とりあえず、お水三つお願いします。"],"note":"居酒屋里「生（なま）」通常指生啤。「とりあえず」是先、暂且的意思。","variants":[],"why":"居酒屋常先点饮品再看菜，「とりあえず」表达的是先做这一步，稍后还会继续点单。"},{"scene":"izakaya","kind":"reply","context":"你不想喝含酒精的饮料，想问店里有没有无酒精饮品。","jp":"ノンアルコールはありますか？","zh":"有无酒精饮品吗？","options":["ノンアルコールはありますか？","飲み放題はありますか？","おかわりできますか？"],"note":"「ノンアルコール」是无酒精；「飲み放題」是畅饮，两者不能混用。","variants":[],"why":"酒单里有很多不同饮品，直接说明无酒精需求，能让店员推荐相应选择。"},{"scene":"izakaya","kind":"listen","context":"你想再点几道菜，店员先提醒了一个时间。","jp":"ラストオーダーは十時半です。","zh":"最后点单时间是十点半。","options":["十点半最后点单","十点半开始营业","十点半必须离店"],"note":"「ラストオーダー」指最后接受点单的时间，不一定等于打烊时间。","variants":[],"why":"厨房和吧台需要收尾时间，最后点单时间并不直接等于客人离店时间。"},{"scene":"izakaya","kind":"listen","context":"你刚坐下，还没看菜单，店员说了这句话。","jp":"まず、お飲み物はいかがですか？","zh":"先来点什么饮料呢？","options":["先问你想喝什么","先问你怎么付款","先问你是否有预约"],"note":"「まず」是首先，「お飲み物」是饮品。可以直接报饮品名称，再加「お願いします」。","variants":[],"why":"入座后店员先确认饮料，回答饮品名称和数量即可，不必同时把所有菜都点好。"},{"scene":"izakaya","kind":"listen","context":"你点了一道菜，店员提醒它的份量。","jp":"こちらは二人前になります。","zh":"这道是两人份。","options":["这道菜是两人份","这道菜还要两分钟","这道菜只剩两份"],"note":"「二人前（ににんまえ）」表示两人份，是份量，和等待时间没有关系。","variants":[],"why":"店员在提醒菜的份量，帮助你判断是否够吃；「人前」不是等待几分钟的时间单位。"},{"scene":"izakaya","kind":"dialogue","context":"店员：「焼き鳥は、塩とタレ、どちらにしますか？」\n你想要盐味。","jp":"塩でお願いします。","zh":"麻烦做成盐味。","options":["塩でお願いします。","タレでお願いします。","二本お願いします。"],"note":"烤串常问「塩（しお）」还是「タレ」（酱汁）。数量可以另说「二本お願いします」。","variants":[],"why":"同一种烤串可以用盐或酱汁调味，厨房需要你先选好口味。"},{"scene":"izakaya","kind":"dialogue","context":"你：「この料理、どのくらいかかりますか？」\n店员：「二十分ほどかかります。」\n你愿意等，想继续点这道菜。","jp":"じゃあ、それでお願いします。","zh":"那就要这个吧。","options":["じゃあ、それでお願いします。","じゃあ、やめておきます。","じゃあ、お会計お願いします。"],"note":"「それでお願いします」是确认选择。「やめておきます」则是这次不要了。","variants":[],"why":"店员已经告知等待时间，你愿意继续点这道菜，用「それでお願いします」确认选择。"},{"scene":"izakaya","kind":"dialogue","context":"店员：「お飲み物、おかわりはいかがですか？」\n你想再来一杯刚才点的饮料。","jp":"同じものをもう一杯お願いします。","zh":"麻烦再来一杯一样的。","options":["同じものをもう一杯お願いします。","お水だけで大丈夫です。","もう大丈夫です。"],"note":"「おかわり」是再来一份或续杯。「同じもの」就是一样的东西。","variants":[],"why":"店员在问是否续杯，指明「同じもの」能让对方知道要重复上一杯的饮品。"},{"scene":"izakaya","kind":"speak","context":"你想叫店员过来点菜。请先引起注意，再说明你想点单。","jp":"すみません、注文お願いします。","zh":"不好意思，我想点菜。","options":[],"note":"「注文（ちゅうもん）」是点单；「会計（かいけい）」是结账。","variants":["すみません、注文いいですか？","すみません、注文してもいいですか？"],"why":"看好菜单之后，需要叫店员来接单；点餐用「注文」，结账才用「会計」。"},{"scene":"izakaya","kind":"speak","context":"你之前点的炸鸡一直没上。请礼貌地问问是否还没做好。","jp":"すみません、唐揚げ、まだですか？","zh":"不好意思，炸鸡还没好吗？","options":[],"note":"在对方知道是哪份订单时，可以省略完整句子。语气放柔和一些即可。","variants":["すみません、注文した唐揚げ、まだですか？","唐揚げ、あとどのくらいかかりますか？"],"why":"等候的菜还没来时，告诉店员菜名可以帮助查询订单和上菜进度。"},{"scene":"izakaya","kind":"speak","context":"你想确认这家居酒屋有没有包间。请问一下店员。","jp":"個室はありますか？","zh":"有包间吗？","options":[],"note":"「個室（こしつ）」是包间。「〜はありますか？」可以用来问店里是否有某种设施。","variants":["すみません、個室はありますか？","個室ってありますか？"],"why":"需要较独立的座位时，先确认有没有包间；是否有空位或可预约，还要进一步问。"}],"visitor/life-cards":[{"cat":"交通出行","id":"escalator","title":"扶梯：别只记“东京左、大阪右”","label":"安全提示","body":"你可能看到东京常靠左、大阪常靠右站的习惯，但这不是“另一侧必须留给走路”的规则。铁路运营方倡导站稳、扶住扶手，不在扶梯上行走或奔跑。","tip":"按现场标识站稳，不催促别人让道。赶时间可以使用楼梯；到出口后继续向前走，不停在梯口整理东西。","source":["JR北海道：扶梯安全说明","https://www.jrhokkaido.co.jp/faq/qa0169.html"]},{"cat":"交通出行","id":"boarding","title":"上下车：先下后上","label":"乘车礼仪","body":"你提到的上下车顺序，应是“先下后上”。在站台按地面排队标记等候，车门打开后让下车的人先通过，再依次上车。","tip":"别站在门正中挡住出口，也别在关门时冲上车。已经上车时向车厢内移动一些，让后面的人能进来。","source":["东京地铁：乘车礼仪","https://www.tokyometro.jp/en/tips/considerations/index.html"]},{"cat":"交通出行","id":"calls","title":"电车里避免通话，也别外放声音","label":"乘车礼仪","body":"市内电车一般要求手机静音、避免通话，视频通话也一样；看视频、听音乐用耳机。长途列车有时会指示在车厢连接处通话，应按该列车说明。","tip":"收到电话可以先发消息，下一站下车后再回拨；同行聊天也控制音量。紧急需要求助时及时联系工作人员。","source":["东京地铁：乘车礼仪","https://www.tokyometro.jp/en/tips/considerations/index.html"]},{"cat":"交通出行","id":"eating","title":"电车不是一律禁食，但要分场合","label":"习惯差异","body":"拥挤的地铁和通勤电车里不适合吃便当、气味明显或容易洒出的食物。东京地铁说明并非全面禁止饮食，而是不要影响他人；带桌板的长途列车上吃便当则较常见。","tip":"先看车内标识。想吃正餐时，选择合适的场所；少量喝水与在拥挤车厢里展开一餐，不是同一种情况。","source":["东京地铁：车内饮食说明","https://ssl.tokyometro.jp/support/faq_answer?faqno=OpenFAQ-000176&lang=ja"]},{"cat":"交通出行","id":"seats","title":"优先席与行李：给需要的人留空间","label":"乘车礼仪","body":"优先席是为了方便老人、孕妇、带幼儿者及身体不便等乘客；有些需求从外表看不出来。不要用包占旁边的座位或堵住通道。","tip":"背包可放在不影响他人的位置，行李箱要扶稳。不要仅凭外表质问坐在优先席的人。","source":["东京地铁：乘车礼仪","https://www.tokyometro.jp/en/tips/considerations/index.html"]},{"cat":"交通出行","id":"walking","title":"车站、街道并非全国统一靠一边","label":"现场为准","body":"扶梯站位、楼梯上下行和街道人流不能混成一条“日本统一靠左”的规则。车站可能用箭头或栏杆分流，同一城市的不同通道也可能不同。","tip":"优先看地面箭头和工作人员引导。查看手机地图时先走到不挡路的位置，再停下来。","source":["日本观光厅：旅行礼仪","https://www.mlit.go.jp/kankocho/responsible-traveler/"]},{"cat":"公共空间","id":"smoking","title":"抽烟先找指定吸烟区","label":"当地规则","body":"室外不等于可以随意吸烟。日本不少地区限制路上吸烟或边走边抽，具体范围和规定因地区而异；店内也有自己的禁烟或分区要求。","tip":"找标有“喫煙所”的指定区域，确认是否开放、允许哪类烟。携带烟灰缸不能让禁烟地点变成可吸烟区。","source":["东京都：吸烟规则","https://www.hokeniryo1.metro.tokyo.lg.jp/kensui/kitsuen/rule_eng/"]},{"cat":"公共空间","id":"trash","title":"街边垃圾桶较少，先准备小垃圾袋","label":"旅行习惯","body":"不是完全没有垃圾桶，但不能期待每条街都有。找不到合适的垃圾桶时，先收好垃圾，带到可处理的地方。","tip":"按桶上的分类投放。自动售货机旁回收瓶罐的箱子不要塞便当盒；店铺垃圾桶也应遵守用途说明。","source":["日本观光厅：旅行礼仪","https://www.mlit.go.jp/kankocho/responsible-traveler/"]},{"cat":"公共空间","id":"toilets","title":"找厕所：先看车站、商场与公厕标识","label":"实用提示","body":"可优先查看车站、百货商场、购物中心、公园和旅游咨询地图上的厕所。部分车站厕所位于检票区内；便利店也不保证每家都提供或允许公众使用。","tip":"认“トイレ”、WC或厕所图标。若找不到，可询问工作人员；需要无障碍或母婴设施时，再确认具体设备和开放时间。","source":["台东区：公厕与吸烟区地图","https://www.gotokyo.org/book/en/list/17958/"]},{"cat":"公共空间","id":"flush","title":"卫生纸通常冲入马桶，湿巾不要","label":"设施使用","body":"日本厕所提供的厕纸通常可冲入马桶；湿巾、卫生用品和其他垃圾不要冲下去，应按标识处理。智能坐便器的清洗按钮不是冲水按钮。","tip":"离开前确认冲水并保持干净。若有现场特别说明，以说明为准；带一条小手帕，也方便没有擦手纸时使用。","source":["台东区：公厕与吸烟区地图","https://www.gotokyo.org/book/en/list/17958/"]},{"cat":"公共空间","id":"queue","title":"排队先找队尾，不只盯着空柜台","label":"公共礼仪","body":"收银、巴士站、热门餐厅常有统一队伍。看到一个柜台暂时没人，也可能需要从同一条队伍等候叫号，而不是直接走过去。","tip":"先看排队线和标牌；餐厅可能需要在名单或机器登记人数，再等候叫号。","source":["日本观光厅：旅行礼仪","https://www.mlit.go.jp/kankocho/responsible-traveler/"]},{"cat":"公共空间","id":"photos","title":"拍人、店内、住宅区前先确认","label":"公共礼仪","body":"风景能拍，不等于店内展品、别人面部、住宅入口或演出都能拍。拍照时也不要挡住道路、进入私有地或追着工作人员拍。","tip":"看禁拍标识；以人物为主体拍照前先征求同意。景点、寺院和演出的规则可能分别不同。","source":["日本观光厅：旅行礼仪","https://www.mlit.go.jp/kankocho/responsible-traveler/"]},{"cat":"餐饮习惯","id":"water","title":"默认冷水或冰水很常见，可以提出需求","label":"习惯差异","body":"日本不少餐厅会提供冷水，有时加冰；也可能提供茶或需要自取，并不是所有店都一样。想喝不加冰的水或温水，可以直接问。","tip":"不加冰可说“氷なしのお水をお願いします”；温水可问“お湯はいただけますか”。店铺能否提供，以实际情况为准。","source":["札幌观光：餐厅冷水与结账","https://www.sapporo.travel/info/useful_information/japanese_restaurant/"]},{"cat":"餐饮习惯","id":"seat","title":"进店先等安排，别直接坐空桌","label":"常见流程","body":"有接待的餐厅通常先确认人数再安排座位；有些店才允许自由入座。空桌也可能是预约席或尚未整理好。","tip":"在入口告诉店员人数。自助点单、先买餐券、柜台点单等流程不同，先看看入口和机器旁的说明。","source":["JNTO：日本习惯与礼仪","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"cat":"餐饮习惯","id":"bill","title":"结账位置和付款时机不一定相同","label":"常见流程","body":"很多餐厅吃完后拿账单到收银台付款，也有桌边结账；咖啡店、快餐店和食券店可能先付款再取餐。","tip":"不确定时说“お会計お願いします”。把钱或卡放到收银托盘上即可；不必把付款都理解成离开前在桌上留现金。","source":["札幌观光：餐厅冷水与结账","https://www.sapporo.travel/info/useful_information/japanese_restaurant/"]},{"cat":"餐饮习惯","id":"tip","title":"通常不用另外给小费","label":"习惯差异","body":"日本一般的餐厅、出租车和酒店通常没有必须给小费的习惯。账单上的服务费、座位费不是小费，不要自行从应付金额里扣除。","tip":"按账单付款，想表达满意可以说谢谢。特别服务或明确说明的小费制度另看其安排。","source":["JNTO：小费习惯","https://www.japan.travel/en/plan/tipping-in-japan/"]},{"cat":"餐饮习惯","id":"otoshi","title":"入座小菜可能收费，不一定是赠送","label":"费用提醒","body":"部分居酒屋会提供通常收费的入座小菜“お通し”，即使没有单点也可能计入账单。“席料”是座位费，两者概念不同，店铺可能分别列示。","tip":"入座或点单前确认有没有入座小菜、座位费及金额。是否可以不接受小菜也要先问，不能默认免收。","source":["JNTO：日本习惯与礼仪","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"cat":"餐饮习惯","id":"takeaway","title":"外带、堂食和边走边吃要分开","label":"场所习惯","body":"买了外带食品，不代表可以在任何店内座位吃，也不代表适合边走边吃。拥挤道路、公共交通或有特别标识的景区应注意限制。","tip":"买小吃后找店家指定区域或合适位置吃完，收好垃圾；想用店内座位时先说明堂食。","source":["日本观光厅：旅行礼仪","https://www.mlit.go.jp/kankocho/responsible-traveler/"]},{"cat":"付款购物","id":"payment","title":"别只带一种支付方式","label":"实用提示","body":"日本的非现金支付已广泛使用，不能简单说“多数地方都只收现金”。但小店、部分售票机和地方设施仍可能需要现金，也有只接受部分电子支付方式的店。","tip":"准备适量日元现金和可用银行卡作为备选；大额消费、用餐或买票前，先确认店铺实际接受什么。","source":["日本经济产业省：非现金支付","https://www.meti.go.jp/policy/mono_info_service/cashless/index.html"]},{"cat":"付款购物","id":"mobile","title":"能扫码，不等于能用你的支付软件","label":"支付差异","body":"支持某一种扫码支付，不代表微信支付、支付宝或海外版钱包都能用；有扫码牌也可能只是当地服务。银行卡、交通IC卡和二维码支付是不同类别。","tip":"看收银台的支付标识并询问。不要等消费完才发现自己的支付方式不受支持；手机没电时也要有备用办法。","source":["JNTO：旅行常见问题","https://www.japan.travel/en/faq/"]},{"cat":"付款购物","id":"tax","title":"看清含税价、未税价和追加费用","label":"价格提示","body":"“税込”表示含税，“税別”表示另计税。服务费、座位费、入场饮品费等还可能另有说明；看到一个大字价格不一定就掌握了全部收费条件。","tip":"点单或购票前确认最终支付金额；同一商品的外带与堂食标价也可能不同，按实际用途告知店员。","source":["JNTO：日本习惯与礼仪","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"cat":"付款购物","id":"bags","title":"购物袋和餐具最好主动确认","label":"购物流程","body":"购物袋可能收费，餐具是否提供则看商品和店铺。不要因为柜台没有主动递给你，就认为一定不提供。","tip":"自带袋可说明不要袋子；需要筷子、勺子或购物袋就按数量提出。热食与冷食想分开装，也可以先问。","source":["JNTO：旅行常见问题","https://www.japan.travel/en/faq/"]},{"cat":"住宿礼仪","id":"shoes","title":"看到玄关或提示，先确认是否脱鞋","label":"习惯差异","body":"住宅、部分旅馆、榻榻米房间和某些餐厅会要求脱鞋；并非所有日本室内都要脱鞋。门口的高度差、鞋柜和拖鞋往往是提示。","tip":"按现场说明换鞋。厕所专用拖鞋留在厕所区域；不要穿室外鞋踩到需要脱鞋的地面。","source":["JNTO：日本习惯与礼仪","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"cat":"住宿礼仪","id":"bath","title":"温泉、大浴场：先洗净，再入池","label":"设施礼仪","body":"通常先在洗浴区清洗身体、冲净泡沫，再进入公共浴池。浴池不是搓澡和洗头的地方，毛巾通常不要泡进池水。","tip":"穿着、纹身、儿童使用和拍摄等要求因设施而异；先读说明。不要把某一家旅馆的规则当成全国完全相同。","source":["JNTO：日本习惯与礼仪","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]}],"visitor/life-phrases-more":[{"id":"visitor-rule-extra-0","cat":"交通出行","title":"站台方向","label":"旅行实用提醒","body":"快速、普通及不同车次可能停站不同。先确认方向和目的站是否停靠，再上车。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JR东日本：旅客指南","https://www.jreast.co.jp/sc/downloads/pdf/jr-east_guide_sc.pdf"]},{"id":"visitor-rule-extra-1","cat":"交通出行","title":"指定席","label":"旅行实用提醒","body":"指定席通常有车次、车厢及座位号。空着的座位也可能有人预订，按票面入座。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JR东日本：旅客指南","https://www.jreast.co.jp/sc/downloads/pdf/jr-east_guide_sc.pdf"]},{"id":"visitor-rule-extra-2","cat":"交通出行","title":"自由席","label":"旅行实用提醒","body":"自由席指不指定座位，不是免费，也不保证有空座。是否设自由席要看车次。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JR东日本：旅客指南","https://www.jreast.co.jp/sc/downloads/pdf/jr-east_guide_sc.pdf"]},{"id":"visitor-rule-extra-3","cat":"交通出行","title":"车票有效范围","label":"旅行实用提醒","body":"通票有适用公司、线路、车种和日期范围，部分车次还需预约或另付费用。购买前确认行程是否适用。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JR东日本：旅客指南","https://www.jreast.co.jp/sc/downloads/pdf/jr-east_guide_sc.pdf"]},{"id":"visitor-rule-extra-4","cat":"交通出行","title":"坐过站","label":"旅行实用提醒","body":"不要自行猜测能否直接原路返回或免费出站。告诉站员原计划和实际乘车情况。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JR东日本：旅客指南","https://www.jreast.co.jp/sc/downloads/pdf/jr-east_guide_sc.pdf"]},{"id":"visitor-rule-extra-5","cat":"交通出行","title":"换乘与出站","label":"旅行实用提醒","body":"换乘可能在检票区内，也可能需要出检票口，视线路和车站而定。跟着换乘标识走。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JR东日本：旅客指南","https://www.jreast.co.jp/sc/downloads/pdf/jr-east_guide_sc.pdf"]},{"id":"visitor-rule-extra-6","cat":"交通出行","title":"末班车","label":"旅行实用提醒","body":"末班时间因线路、方向、日期和接续关系不同。查完整回程，不只看第一段车的末班时间。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JR东日本：旅客指南","https://www.jreast.co.jp/sc/downloads/pdf/jr-east_guide_sc.pdf"]},{"id":"visitor-rule-extra-7","cat":"交通出行","title":"同名区域车站","label":"旅行实用提醒","body":"大阪与新大阪是不同站，横滨与新横滨等也不能省略着看。核对票上的完整站名。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JR东日本：旅客指南","https://www.jreast.co.jp/sc/downloads/pdf/jr-east_guide_sc.pdf"]},{"id":"visitor-rule-extra-8","cat":"餐饮习惯","title":"餐券","label":"旅行实用提醒","body":"部分店铺使用食券制，买券后可能还要排队。不要把买到券理解为可以跳过等候队伍。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-9","cat":"餐饮习惯","title":"最后点单","label":"旅行实用提醒","body":"最后点单时间可能早于关门，食品和饮品也可能分别截止。进店较晚时先确认。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-10","cat":"餐饮习惯","title":"加面","label":"旅行实用提醒","body":"替え玉通常指追加一份面，不是再来完整一碗。保留汤汁并按店铺方式点单，是否供应看菜单。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-11","cat":"餐饮习惯","title":"免费续杯","label":"旅行实用提醒","body":"是否能续杯及是否收费看套餐和菜单。おかわり表示再来一份或续杯，本身没有免费的意思。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-12","cat":"餐饮习惯","title":"加热选择","label":"旅行实用提醒","body":"店员可能逐个确认。指着商品说清数量和范围，避免所有商品一起加热。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-13","cat":"餐饮习惯","title":"现制饮品","label":"旅行实用提醒","body":"应按购买的饮品、冷热和尺寸操作。不懂按钮就请店员帮助，按错后也先告知店员。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-14","cat":"餐饮习惯","title":"饮品甜度","label":"旅行实用提醒","body":"固定配方或预装原料的饮品可能无法调整。先问能否去糖浆、调甜度，不要假定每款都能改。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-15","cat":"餐饮习惯","title":"拼桌","label":"旅行实用提醒","body":"相席是拼桌，不是让你和陌生人合并账单。不愿意时可以说明并询问其他座位或等候方式。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-16","cat":"住宿礼仪","title":"提前到店","label":"旅行实用提醒","body":"能否提前入住取决于准备情况和酒店规定，可能需付费。不能入住时可询问能否先寄存行李。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-17","cat":"住宿礼仪","title":"延迟退房","label":"旅行实用提醒","body":"应按约定时间退房。需要延迟时提前询问可否办理、最晚时间和费用。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-18","cat":"住宿礼仪","title":"早餐套餐","label":"旅行实用提醒","body":"是否包含早餐取决于订单套餐。用餐前核对订单或向前台确认，避免额外费用误会。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-19","cat":"住宿礼仪","title":"清洁提示牌","label":"旅行实用提醒","body":"请勿打扰可能影响进房服务。想更换毛巾或补用品，可以联系前台；具体清洁安排由酒店说明。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-20","cat":"住宿礼仪","title":"退房后寄存","label":"旅行实用提醒","body":"寄存空间、费用和服务时间因酒店而异。保留领取凭证，按约定取回。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-21","cat":"住宿礼仪","title":"浴池拍照","label":"旅行实用提醒","body":"公共浴场通常重视隐私，也可能禁止携带或使用拍摄设备。不要因暂时没人就推定获准。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-22","cat":"付款购物","title":"试穿许可","label":"旅行实用提醒","body":"有的店对试穿件数、鞋子或防化妆面罩有要求，跟随店员指引即可。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-23","cat":"付款购物","title":"退换货","label":"旅行实用提醒","body":"退换货条件因店铺、商品和购买方式而异。购买前确认期限与条件，并保留小票。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-24","cat":"付款购物","title":"折扣理解","label":"旅行实用提醒","body":"20%引き是减去原价的20%，通常付原价的80%，也就是八折。留意是否有适用商品限制。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-25","cat":"付款购物","title":"分开装袋","label":"旅行实用提醒","body":"分袋、礼品包装和额外袋子可能有不同收费或限制，最好在店员打包前提出。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-26","cat":"公共空间","title":"寄存柜","label":"旅行实用提醒","body":"柜子有不同尺寸，也可能没有空柜。先看能否装下再付款，必要时问有人服务的寄存处。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-27","cat":"公共空间","title":"厕所标识","label":"旅行实用提醒","body":"设备因设施而异。需要换尿布、护理床或特定无障碍设施时，进一步查看设备图标或询问。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-28","cat":"公共空间","title":"遗失物品","label":"旅行实用提醒","body":"可向站员或遗失物窗口求助。记不清确切位置也可以如实说明可能在哪里丢失。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-29","cat":"公共空间","title":"拍照挡路","label":"旅行实用提醒","body":"拍照也应留出通道。先移到不影响他人的位置，再停下来拍或查看手机。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["JNTO：旅行礼仪与习惯","https://www.japan.travel/en/responsible-travel-guide/japanese-customs-and-etiquette/"]},{"id":"visitor-rule-extra-30","cat":"音乐与夜间娱乐","title":"拍摄许可范围","label":"旅行实用提醒","body":"许可可能只限特定曲目和照片，不包含录像、录音或其他时段。按本场明确许可执行。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["演出场地规则示例","https://shibuya-o.com/faq/"]},{"id":"visitor-rule-extra-31","cat":"音乐与夜间娱乐","title":"饮品费与酒","label":"旅行实用提醒","body":"饮品费不等于酒钱，可以询问能兑换哪些无酒精饮料。应付费用和兑换范围以活动规则为准。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source":["演出场地规则示例","https://shibuya-o.com/faq/"]},{"id":"visitor-rule-extra-32","cat":"音乐与夜间娱乐","title":"开场与开演","label":"旅行实用提醒","body":"提前入场通常用于验票、换饮品或找位置。不要把开场时间与演出开始时间混淆。","tip":"不确定时先向工作人员确认，下面这句话可以直接使用。","source"
