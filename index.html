着一款拉面询问大小份。 对方说了下面这句话，是什么意思？","jp":"並盛り(なみもり)でも麺の量は多めです。","kind":"r","options":["即使普通份，面量也偏多。","需要小票吗？","请在这里等，之后会按号码叫你。"],"answer":0,"why":"「並盛り」是普通份，不等于每家店都有一样的重量。如果店员说面量偏多，可以问大概多少克，再决定是否少面。克数可能按店家的生面或熟面标准标示，需要时再确认。","examples":[["並盛りは麺が何グラムですか？","普通份的面是多少克？","你可以这样说"],["並盛りでも麺の量は多めです。","即使普通份，面量也偏多。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:seasoning:r","cat":"餐厅点餐","prompt":"你想用桌上的调料，但不认识其中一瓶。 对方说了下面这句话，是什么意思？","jp":"こちらは餃子用のお酢です。","kind":"r","options":["这是饺子用的醋。","哪位点的是味噌拉面？","还没有开始做，可以更改。"],"answer":0,"why":"桌上的透明液体不一定是水，也可能是醋等调料。指着瓶子问「これ、お酢ですか？」就很自然。「餃子用」说明用途，不是叫你直接喝。","examples":[["これ、お酢ですか？","这个是醋吗？","你可以这样说"],["こちらは餃子用のお酢です。","这是饺子用的醋。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:spill:r","cat":"餐厅点餐","prompt":"你不小心把水洒在桌上，店员回应。 对方说了下面这句话，是什么意思？","jp":"すぐ拭きますので、そのままで大丈夫(だいじょうぶ)です。","kind":"r","options":["我马上来擦，先放着就可以。","不好意思，今天汤已经卖完，停止营业了。","现在只有分开的单个空位。"],"answer":0,"why":"「すぐ拭きますので、そのままで大丈夫(だいじょうぶ)です。」的意思是“我马上来擦，先放着就可以”。","examples":[["すみません、水をこぼしてしまいました。","不好意思，我把水洒了。","你可以这样说"],["すぐ拭きますので、そのままで大丈夫です。","我马上来擦，先放着就可以。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:wait-number:s","cat":"餐厅点餐","prompt":"你拿到了号码牌，但不知道到哪里等取餐，怎么问？","jp":"","kind":"s","options":["どこで待てばいいですか？","ライスは大丈夫(だいじょうぶ)です。","すみません、水をこぼしてしまいました。"],"answer":0,"why":"有的店会按号码叫客人取餐或入座。「番号でお呼びします」是在说明叫号方式，拿好号码牌，在指定位置等待就行。不知道等在哪里，直接问「どこで待てばいいですか？」。","examples":[["どこで待てばいいですか？","我应该在哪里等？","你可以这样说"],["番号でお呼びしますので、こちらでお待ちください。","请在这里等，之后会按号码叫你。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:order-mistake:r","cat":"餐厅点餐","prompt":"你发现买错了餐券，刚向店员提出更改。 对方说了下面这句话，是什么意思？","jp":"まだ作っていないので、変更(へんこう)できますよ。","kind":"r","options":["还没有开始做，可以更改。","即使普通份，面量也偏多。","需要小票吗？"],"answer":0,"why":"「まだ作っていないので、変更(へんこう)できますよ。」的意思是“还没有开始做，可以更改”。","examples":[["食券を買い間違えたんですが、変更できますか？","我买错餐券了，可以更改吗？","你可以这样说"],["まだ作っていないので、変更できますよ。","还没有开始做，可以更改。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:separate-seat:s","cat":"餐厅点餐","prompt":"你们想坐在一起，也愿意再等一会儿，怎么告诉店员？","jp":"","kind":"s","options":["隣同士で座れるまで待ちます。","これ、お酢ですか？","はい、私です。"],"answer":0,"why":"「一席ずつ」说明空位是分散的，不是两人挨着的座位。「隣同士」就是彼此相邻。愿意等连在一起的座位，可以明确说出来，而不是直接回答不坐。","examples":[["隣同士で座れるまで待ちます。","我们等到能挨着坐的时候。","你可以这样说"],["今は一席ずつしか空いていません。","现在只有分开的单个空位。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:small-rice:r","cat":"餐厅点餐","prompt":"你点完拉面，店员介绍这家店的午间搭配。 对方说了下面这句话，是什么意思？","jp":"ランチタイムは小ライス(こライス)がつきますが、いかがですか？","kind":"r","options":["午餐时段附带小碗米饭，你需要吗？","我马上来擦，先放着就可以。","不好意思，今天汤已经卖完，停止营业了。"],"answer":0,"why":"这里的「つきます」是附带，不是让你再点一份主食。店员在询问你是否需要。「大丈夫です」接在这类服务提议后，可以表示“不用了”；如果想要，就说「お願いします」。","examples":[["ライスは大丈夫です。","米饭就不用了。","你可以这样说"],["ランチタイムは小ライスがつきますが、いかがですか？","午餐时段附带小碗米饭，你需要吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:noodle-amount:s","cat":"餐厅点餐","prompt":"你食量不大，想知道普通份大概有多少面，怎么问？","jp":"","kind":"s","options":["並盛り(なみもり)は麺が何グラムですか？","レシートをお願いします。","どこで待てばいいですか？"],"answer":0,"why":"「並盛り」是普通份，不等于每家店都有一样的重量。如果店员说面量偏多，可以问大概多少克，再决定是否少面。克数可能按店家的生面或熟面标准标示，需要时再确认。","examples":[["並盛りは麺が何グラムですか？","普通份的面是多少克？","你可以这样说"],["並盛りでも麺の量は多めです。","即使普通份，面量也偏多。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:seasoning:s","cat":"餐厅点餐","prompt":"你不确定桌上这瓶是不是醋，怎么指着它问？","jp":"","kind":"s","options":["これ、お酢ですか？","はい、私です。","食券(しょっけん)を買い間違えたんですが、変更(へんこう)できますか？"],"answer":0,"why":"桌上的透明液体不一定是水，也可能是醋等调料。指着瓶子问「これ、お酢ですか？」就很自然。「餃子用」说明用途，不是叫你直接喝。","examples":[["これ、お酢ですか？","这个是醋吗？","你可以这样说"],["こちらは餃子用のお酢です。","这是饺子用的醋。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:spill:s","cat":"餐厅点餐","prompt":"你把水洒了，想向店员说明并道歉，怎么说？","jp":"","kind":"s","options":["すみません、水をこぼしてしまいました。","まだ入れますか？","隣同士で座れるまで待ちます。"],"answer":0,"why":"想表达这个意思,可以说「すみません、水をこぼしてしまいました。」。","examples":[["すみません、水をこぼしてしまいました。","不好意思，我把水洒了。","你可以这样说"],["すぐ拭きますので、そのままで大丈夫です。","我马上来擦，先放着就可以。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:receipt:r","cat":"餐厅点餐","prompt":"你吃完到收银台付款，店员问你是否需要凭证。 对方说了下面这句话，是什么意思？","jp":"レシートはご入用ですか？","kind":"r","options":["需要小票吗？","请在这里等，之后会按号码叫你。","午餐时段附带小碗米饭，你需要吗？"],"answer":0,"why":"「レシート」是收银小票。「ご入用ですか？」是询问是否需要，回答「お願いします」即可。如果要报销用的正式收据，可以另外问「領収書をもらえますか？」。","examples":[["レシートをお願いします。","麻烦给我小票。","你可以这样说"],["レシートはご入用ですか？","需要小票吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:conv:heat-one:r","cat":"便利店购物","prompt":"你买了两份便当，店员确认要加热哪些。 对方说了下面这句话，是什么意思？","jp":"こちらのお弁当(べんとう)も温め(あたため)ますか？","kind":"r","options":["这份便当也要加热吗？","您有积分卡吗？","现在有的只有这一款。"],"answer":0,"why":"买了几份便当时，店员可能逐个确认。「も」是“也”，「これだけ」是“只有这个”。指着要加热的那份说，会比只回答一个「はい」更清楚。","examples":[["これだけ温めてください。","请只加热这一份。","你可以这样说"],["こちらのお弁当も温めますか？","这份便当也要加热吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:conv:cutlery:r","cat":"便利店购物","prompt":"你买了两份饭，店员在准备餐具。 对方说了下面这句话，是什么意思？","jp":"お箸は何膳おつけしますか？","kind":"r","options":["要附几双筷子？","请拿好找零和小票。","折扣会在收银时扣除。"],"answer":0,"why":"筷子的量词是「膳」，两双读「にぜん」。便利店也会问需要几个勺子。只要把餐具和数量说清楚即可，不用说成很长的完整句。","examples":[["お箸を二膳お願いします。","麻烦给两双筷子。","你可以这样说"],["お箸は何膳おつけしますか？","要附几双筷子？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:conv:spoon:r","cat":"便利店购物","prompt":"你买了一杯酸奶，店员问餐具。 对方说了下面这句话，是什么意思？","jp":"スプーンはおつけしますか？","kind":"r","options":["需要附勺子吗？","咖啡请使用那边的机器。","这个不是按个卖，而是按重量计价。"],"answer":0,"why":"「おつけしますか」在收银场景里是在问是否附带某样东西，不是问把东西粘在哪里。没拿到餐具时，付款后也可以礼貌地向店员询问。","examples":[["すみません、スプーンを一つもらえますか？","不好意思，能给我一个勺子吗？","你可以这样说"],["スプーンはおつけしますか？","需要附勺子吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:conv:bag-separate:r","cat":"便利店购物","prompt":"你同时买了热便当和冰淇淋，店员问装袋方式。 对方说了下面这句话，是什么意思？","jp":"温かい(あたたかい)ものと冷たい(つめたい)ものは、袋を分けますか？","kind":"r","options":["热的和冷的要分开装袋吗？","热水在收银台旁边。","请扫描商品条形码。"],"answer":0,"why":"「温かい(あたたかい)ものと冷たい(つめたい)ものは、袋を分けますか？」的意思是“热的和冷的要分开装袋吗？”。","examples":[["袋を分けてもらえますか？","能帮我分开装袋吗？","你可以这样说"],["温かいものと冷たいものは、袋を分けますか？","热的和冷的要分开装袋吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:conv:payment-screen:r","cat":"便利店购物","prompt":"商品扫完后，店员指着你面前的屏幕。 对方说了下面这句话，是什么意思？","jp":"お支払い(しはらい)方法を画面でお選びください。","kind":"r","options":["请在屏幕上选择付款方式。","您是在店里吃吗？","购物篮请放回这里。"],"answer":0,"why":"有的收银台由店员扫码、客人自行在机器上付款。「お選びください」是请你选择，先看屏幕，再按所选方式操作，不一定要把现金交给店员。","examples":[["現金もこちらで払うんですか？","现金也是在这里付吗？","你可以这样说"],["お支払い方法を画面でお選びください。","请在屏幕上选择付款方式。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:conv:ic-pay:r","cat":"便利店购物","prompt":"你准备付款，店员指着感应区。 对方说了下面这句话，是什么意思？","jp":"こちらにカードをタッチしてください。","kind":"r","options":["请把卡贴在这里感应。","牛奶在里面的冷藏区。","不好意思，这里的厕所不能使用。"],"answer":0,"why":"「タッチ」是把卡靠近或贴到感应区，并不是插进机器。支持哪些支付工具因店而异，所以先说卡的种类，别只说一个含义很宽的“卡”。","examples":[["交通系ICカードで払えますか？","可以用交通IC卡付款吗？","你可以这样说"],["こちらにカードをタッチしてください。","请把卡贴在这里感应。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:conv:points:r","cat":"便利店购物","prompt":"结账时店员询问会员信息。 对方说了下面这句话，是什么意思？","jp":"ポイントカードはお持ちですか？","kind":"r","options":["您有积分卡吗？","现在有的只有这一款。","这份便当也要加热吗？"],"answer":0,"why":"「ポイントカード」是积分卡，不是付款用的信用卡。没有就回答「持っていません」即可。若积分在手机应用里，可以先打开相应页面再出示。","examples":[["持っていません。","我没有。","你可以这样说"],["ポイントカードはお持ちですか？","您有积分卡吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:conv:change:r","cat":"便利店购物","prompt":"你付完现金准备走，店员提醒。 对方说了下面这句话，是什么意思？","jp":"お釣り(おつり)とレシートをお取りください。","kind":"r","options":["请拿好找零和小票。","折扣会在收银时扣除。","要附几双筷子？"],"answer":0,"why":"自助或半自助收银机可能把纸币、硬币和小票分开吐出。「お釣り」是找零，不是优惠券。离开前看一下各个出口就好。","examples":[["お釣りはどこから出ますか？","找零从哪里出来？","你可以这样说"],["お釣りとレシートをお取りください。","请拿好找零和小票。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:conv:coffee:r","cat":"便利店购物","prompt":"你在收银台点了咖啡，店员递来杯子。 对方说了下面这句话，是什么意思？","jp":"コーヒーはあちらのマシンをご利用ください。","kind":"r","options":["咖啡请使用那边的机器。","这个不是按个卖，而是按重量计价。","需要附勺子吗？"],"answer":0,"why":"便利店咖啡有些要自己操作机器，热饮、冷饮和杯型可能对应不同按钮。拿着杯子问，比猜一个看起来像咖啡的键更清楚。","examples":[["このカップはどのボタンですか？","这个杯子对应哪个按钮？","你可以这样说"],["コーヒーはあちらのマシンをご利用ください。","咖啡请使用那边的机器。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:conv:hot-water:r","cat":"便利店购物","prompt":"你买了杯面，问有没有热水，店员指路。 对方说了下面这句话，是什么意思？","jp":"お湯(おゆ)はレジの横にあります。","kind":"r","options":["热水在收银台旁边。","请扫描商品条形码。","热的和冷的要分开装袋吗？"],"answer":0,"why":"「お湯」是热水，与「お水」区分。并非每家店都提供杯面用热水，找不到时先问，不要把咖啡机的出水口当成公用热水。","examples":[["お湯はどこにありますか？","热水在哪里？","你可以这样说"],["お湯はレジの横にあります。","热水在收银台旁边。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:conv:dine-in:r","cat":"便利店购物","prompt":"你拿着食品走向店内桌椅，店员问。 对方说了下面这句话，是什么意思？","jp":"店内でお召し上がりですか？","kind":"r","options":["您是在店里吃吗？","购物篮请放回这里。","请在屏幕上选择付款方式。"],"answer":0,"why":"有座位不代表任何时间都能使用。店员问「店内で」是在确认堂食，你可以按实际打算回答。具体使用时间和结账处理听店里的说明。","examples":[["ここで食べてもいいですか？","可以在这里吃吗？","你可以这样说"],["店内でお召し上がりですか？","您是在店里吃吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:conv:product-location:r","cat":"便利店购物","prompt":"你找牛奶，店员告诉你位置。 对方说了下面这句话，是什么意思？","jp":"牛乳(ぎゅうにゅう)は奥の冷蔵(れいぞう)コーナーにあります。","kind":"r","options":["牛奶在里面的冷藏区。","不好意思，这里的厕所不能使用。","请把卡贴在这里感应。"],"answer":0,"why":"「奥」是店里较里面的位置，「冷蔵コーナー」是冷藏区。找商品时用名称加「どこにありますか」，不必记住整间店的分区。","examples":[["牛乳はどこにありますか？","牛奶在哪里？","你可以这样说"],["牛乳は奥の冷蔵コーナーにあります。","牛奶在里面的冷藏区。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:transfer-one:r","cat":"交通出行","prompt":"你问如何到达目的地，站员说明需要换乘。 对方说了下面这句话，是什么意思？","jp":"次の駅で乗り換え(のりかえ)てください。","kind":"r","options":["请在下一站换乘。","这里是指定席，请确认你持有的车票。","电梯在站台尽头。"],"answer":0,"why":"「乗り換えなし」是不用换车。听到「次の駅で」时要留意下一站，而不是一直坐到线路终点。实际换到哪条线，可以继续请站员在地图上指出。","examples":[["乗り換えなしで行けますか？","不用换乘能到吗？","你可以这样说"],["次の駅で乗り換えてください。","请在下一站换乘。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:transfer-gates:r","cat":"交通出行","prompt":"你沿着换乘指示走，工作人员补充一条路线要求。 对方说了下面这句话，是什么意思？","jp":"乗り換え(のりかえ)は、いったん改札(かいさつ)を出てください。","kind":"r","options":["这次换乘请先出一次检票口。","5号车厢还要往前一点。","大的寄存柜现在都在使用中。"],"answer":0,"why":"有的换乘在付费区内完成，有的需要经过指定检票口。「いったん」是暂且、先做一次。不要把这句话理解成所有车站换乘都必须出闸，按当前路线确认。","examples":[["乗り換えるとき、改札を出ますか？","换乘时需要出检票口吗？","你可以这样说"],["乗り換えは、いったん改札を出てください。","这次换乘请先出一次检票口。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:exit-name:r","cat":"交通出行","prompt":"你给站员看酒店位置，他建议一个出口。 对方说了下面这句话，是什么意思？","jp":"ホテルへ行くなら、東口(ひがしぐち)が近いです。","kind":"r","options":["去酒店的话，东口比较近。","列车晚点了，请再等一会儿。","遗失物品的询问在这个窗口。"],"answer":0,"why":"大站不同出口可能相隔很远。「東口」是出口方向，不是站台。给站员看地址或地图再问，可以减少出错出口后绕路的情况。","examples":[["この住所へ行くには、どの出口が近いですか？","去这个地址哪个出口比较近？","你可以这样说"],["ホテルへ行くなら、東口が近いです。","去酒店的话，东口比较近。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:charge-location:r","cat":"交通出行","prompt":"你问在哪里给交通卡充值，站员指路。 对方说了下面这句话，是什么意思？","jp":"チャージはあちらの機械(きかい)でできます。","kind":"r","options":["可以在那边的机器充值。","那个方向的末班车已经开走了。","那趟车从3号站台发车。"],"answer":0,"why":"「チャージ」是向卡里充值，不是买一张新车票。支持现金或其他方式的范围因机器而异，先找到对应机器，再按屏幕提示操作。","examples":[["ICカードはどこでチャージできますか？","交通IC卡在哪里可以充值？","你可以这样说"],["チャージはあちらの機械でできます。","可以在那边的机器充值。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:wrong-ticket:r","cat":"交通出行","prompt":"你发现买到的车票目的地不对，柜台人员答复。 对方说了下面这句话，是什么意思？","jp":"使う前でしたら、変更(へんこう)できるか確認(かくにん)します。","kind":"r","options":["如果还没使用，我帮您确认能否更改。","这趟车到本站就终到。","这趟快速列车不在那个站停。"],"answer":0,"why":"「使う前でしたら、変更(へんこう)できるか確認(かくにん)します。」的意思是“如果还没使用，我帮您确认能否更改”。","examples":[["切符を買い間違えました。変更できますか？","我买错车票了，可以更改吗？","你可以这样说"],["使う前でしたら、変更できるか確認します。","如果还没使用，我帮您确认能否更改。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:reserved:r","cat":"交通出行","prompt":"你在列车上找座位，工作人员看票后说。 对方说了下面这句话，是什么意思？","jp":"こちらは指定席(していせき)です。お持ちの切符(きっぷ)をご確認(かくにん)ください。","kind":"r","options":["这里是指定席，请确认你持有的车票。","电梯在站台尽头。","请在下一站换乘。"],"answer":0,"why":"「指定席」表示按票面安排座位，不能因为看着空就直接坐。自由席和指定席的安排因列车不同，先看票面或请工作人员确认。","examples":[["この切符は指定席ですか？","这张票是指定席吗？","你可以这样说"],["こちらは指定席です。お持ちの切符をご確認ください。","这里是指定席，请确认你持有的车票。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:car-position:r","cat":"交通出行","prompt":"你准备坐指定席列车，站员解释票面信息。 对方说了下面这句话，是什么意思？","jp":"五号車(ごごうしゃ)は、もう少し前です。","kind":"r","options":["5号车厢还要往前一点。","大的寄存柜现在都在使用中。","这次换乘请先出一次检票口。"],"answer":0,"why":"「号車」是车厢编号，不是站台编号。候车时可以对照地面或上方的车厢位置标识。题里的五号车只是练习例子，实际按自己的车票寻找。","examples":[["五号車はどの辺りですか？","5号车厢大概在什么位置？","你可以这样说"],["五号車は、もう少し前です。","5号车厢还要往前一点。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:service-end:r","cat":"交通出行","prompt":"你晚间问还能不能去目的地，站员回答。 对方说了下面这句话，是什么意思？","jp":"その方面(ほうめん)の最終(さいしゅう)電車(でんしゃ)は、もう出ました。","kind":"r","options":["那个方向的末班车已经开走了。","那趟车从3号站台发车。","可以在那边的机器充值。"],"answer":0,"why":"「終電」是末班车，「もう出ました」是已经发车。各方向末班时间不同，别只记“这条线很晚还有车”；问清目的地和乘车方向。","examples":[["この方面の終電は何時ですか？","这个方向的末班车是几点？","你可以这样说"],["その方面の最終電車は、もう出ました。","那个方向的末班车已经开走了。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:missed-stop:r","cat":"交通出行","prompt":"你发现坐过了站，站员给出下一步指引。 对方说了下面这句话，是什么意思？","jp":"次の駅で降りて、反対方向(はんたいほうこう)の電車(でんしゃ)に乗ってください。","kind":"r","options":["在下一站下车，再乘反方向的车。","这里是相反方向。","余额不足，需要补足车费。"],"answer":0,"why":"「次の駅で降りて、反対方向(はんたいほうこう)の電車(でんしゃ)に乗ってください。」的意思是“在下一站下车，再乘反方向的车”。","examples":[["乗り過ごしてしまいました。どうすればいいですか？","我坐过站了，该怎么办？","你可以这样说"],["次の駅で降りて、反対方向の電車に乗ってください。","在下一站下车，再乘反方向的车。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:local-terminal:r","cat":"交通出行","prompt":"你还没到目的地，车内广播响起。 对方说了下面这句话，是什么意思？","jp":"この電車(でんしゃ)は当駅(とうえき)止まりです。","kind":"r","options":["这趟车到本站就终到。","这趟快速列车不在那个站停。","如果还没使用，我帮您确认能否更改。"],"answer":0,"why":"「当駅止まり」是本站终到，不是普通的短暂停车。需要继续走的乘客要换乘后续列车。听见不熟悉的广播，可以向站员确认是否要下车。","examples":[["ここで降りないといけませんか？","必须在这里下车吗？","你可以这样说"],["この電車は当駅止まりです。","这趟车到本站就终到。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:locker:r","cat":"交通出行","prompt":"你询问能放大行李的寄存柜，工作人员说。 对方说了下面这句话，是什么意思？","jp":"大きいロッカーは、今すべて使用中(しようちゅう)です。","kind":"r","options":["大的寄存柜现在都在使用中。","这次换乘请先出一次检票口。","5号车厢还要往前一点。"],"answer":0,"why":"「使用中」是正在使用，意思是目前没有空柜，不代表柜子坏了。可以询问其他区域或有人服务的寄存处，是否有空位和收费需另确认。","examples":[["ほかに荷物を預けられる場所はありますか？","还有其他可以寄存行李的地方吗？","你可以这样说"],["大きいロッカーは、今すべて使用中です。","大的寄存柜现在都在使用中。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:lost-platform:r","cat":"交通出行","prompt":"你把东西落在站台，站员指向一个窗口。 对方说了下面这句话，是什么意思？","jp":"忘れ物(わすれもの)のお問い合わせは、こちらの窓口です。","kind":"r","options":["遗失物品的询问在这个窗口。","去酒店的话，东口比较近。","列车晚点了，请再等一会儿。"],"answer":0,"why":"「忘れ物(わすれもの)のお問い合わせは、こちらの窓口です。」的意思是“遗失物品的询问在这个窗口”。","examples":[["電車にかばんを忘れたかもしれません。","我可能把包忘在电车上了。","你可以这样说"],["忘れ物のお問い合わせは、こちらの窓口です。","遗失物品的询问在这个窗口。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:checkin-form:r","cat":"酒店入住","prompt":"前台递给你入住登记表。 对方说了下面这句话，是什么意思？","jp":"こちらにお名前(なまえ)とご住所(じゅうしょ)をご記入ください。","kind":"r","options":["请在这里填写姓名和地址。","我们会把新毛巾送到房间。","退房最晚到上午十一点。"],"answer":0,"why":"「ご記入ください」是请填写。与其猜表格内容，不如指着具体栏位问。要填写哪种地址或信息，以工作人员对当前表格的说明为准。","examples":[["ここは何を書けばいいですか？","这里应该填什么？","你可以这样说"],["こちらにお名前とご住所をご記入ください。","请在这里填写姓名和地址。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:early-arrival:r","cat":"酒店入住","prompt":"你比入住时间早到，前台说明房间状态。 对方说了下面这句话，是什么意思？","jp":"お部屋(へや)の準備(じゅんび)がまだできておりません。","kind":"r","options":["房间还没有准备好。","今天房间需要打扫吗？","延迟退房需要额外费用。"],"answer":0,"why":"「お部屋(へや)の準備(じゅんび)がまだできておりません。」的意思是“房间还没有准备好”。","examples":[["何時ごろ部屋に入れますか？","大约几点能进房间？","你可以这样说"],["お部屋の準備がまだできておりません。","房间还没有准备好。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:key-card:r","cat":"酒店入住","prompt":"前台把房卡交给你，说明电梯操作。 对方说了下面这句话，是什么意思？","jp":"エレベーターでは、カードキーをかざしてください。","kind":"r","options":["乘电梯时请感应一下房卡。","工作人员会去您的房间。","如果今天内来取，可以寄存行李。"],"answer":0,"why":"「エレベーターでは、カードキーをかざしてください。」的意思是“乘电梯时请感应一下房卡”。","examples":[["ここでカードキーをかざすんですか？","是在这里感应房卡吗？","你可以这样说"],["エレベーターでは、カードキーをかざしてください。","乘电梯时请感应一下房卡。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:breakfast-place:r","cat":"酒店入住","prompt":"你第二天想吃早餐，前台说明位置。 对方说了下面这句话，是什么意思？","jp":"朝食(ちょうしょく)会場は二階(にかい)です。","kind":"r","options":["早餐餐厅在二楼。","我们会确认情况并处理。","请告诉我预约时的姓名。"],"answer":0,"why":"「会場」在这里是供应早餐的场所，不一定叫餐厅。题中的二楼只是这次对话的地点，实际按酒店指引找，不要记成固定楼层。","examples":[["朝食はどこで食べられますか？","早餐在哪里吃？","你可以这样说"],["朝食会場は二階です。","早餐餐厅在二楼。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:breakfast-included:r","cat":"酒店入住","prompt":"你问自己的房价有没有包含早餐。 对方说了下面这句话，是什么意思？","jp":"こちらのプランには朝食(ちょうしょく)は含まれていません。","kind":"r","options":["这个房价方案不包含早餐。","请把房卡拿来，我帮您检查。","能给我看一下预订确认邮件吗？"],"answer":0,"why":"「プラン」是预订方案。同一家酒店可能同时有含早和不含早方案，不能只看酒店设有早餐厅就认为免费提供。如果需要加购，再问价格和方式。","examples":[["この予約に朝食はついていますか？","这份预订包含早餐吗？","你可以这样说"],["こちらのプランには朝食は含まれていません。","这个房价方案不包含早餐。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:cleaning:r","cat":"酒店入住","prompt":"你连续住几晚，工作人员问今天的安排。 对方说了下面这句话，是什么意思？","jp":"本日(ほんじつ)のお部屋(へや)の清掃(せいそう)はいかがなさいますか？","kind":"r","options":["今天房间需要打扫吗？","延迟退房需要额外费用。","房间还没有准备好。"],"answer":0,"why":"「本日(ほんじつ)のお部屋(へや)の清掃(せいそう)はいかがなさいますか？」的意思是“今天房间需要打扫吗？”。","examples":[["今日は掃除しなくて大丈夫です。","今天不用打扫也可以。","你可以这样说"],["本日のお部屋の清掃はいかがなさいますか？","今天房间需要打扫吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:aircon:r","cat":"酒店入住","prompt":"你报告空调问题，前台回应。 对方说了下面这句话，是什么意思？","jp":"係の者がお部屋(へや)に伺います。","kind":"r","options":["工作人员会去您的房间。","如果今天内来取，可以寄存行李。","乘电梯时请感应一下房卡。"],"answer":0,"why":"「係の者がお部屋(へや)に伺います。」的意思是“工作人员会去您的房间”。","examples":[["エアコンが冷えないんですが、見てもらえますか？","空调不制冷，能请人来看一下吗？","你可以这样说"],["係の者がお部屋に伺います。","工作人员会去您的房间。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:water-temperature:r","cat":"酒店入住","prompt":"你向前台反映淋浴问题，对方先核实。 对方说了下面这句话，是什么意思？","jp":"お湯(おゆ)が出ないということでよろしいですか？","kind":"r","options":["您是说没有热水，对吗？","您在哪个房间忘了什么东西？","Wi-Fi密码在房间的说明里。"],"answer":0,"why":"「お湯が出ない」是没有热水，不等于完全没水。工作人员重复情况是在确认理解，听对了就回答「はい、そうです」。","examples":[["シャワーのお湯が出ません。","淋浴没有热水。","你可以这样说"],["お湯が出ないということでよろしいですか？","您是说没有热水，对吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:noise:r","cat":"酒店入住","prompt":"你反映隔壁很吵，前台作出回应。 对方说了下面这句话，是什么意思？","jp":"状況(じょうきょう)を確認(かくにん)して対応(たいおう)いたします。","kind":"r","options":["我们会确认情况并处理。","请告诉我预约时的姓名。","早餐餐厅在二楼。"],"answer":0,"why":"「状況(じょうきょう)を確認(かくにん)して対応(たいおう)いたします。」的意思是“我们会确认情况并处理”。","examples":[["隣の部屋の音が気になるんですが、対応してもらえますか？","隔壁房间的声音有点影响休息，能帮忙处理吗？","你可以这样说"],["状況を確認して対応いたします。","我们会确认情况并处理。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:key-problem:r","cat":"酒店入住","prompt":"你打不开房门，前台让你出示房卡。 对方说了下面这句话，是什么意思？","jp":"カードキーを確認(かくにん)しますので、お持ちください。","kind":"r","options":["请把房卡拿来，我帮您检查。","能给我看一下预订确认邮件吗？","这个房价方案不包含早餐。"],"answer":0,"why":"先说明房卡无法开门，不必自己猜是消磁还是门锁故障。前台可能需要核对房号和入住信息，再处理房卡。","examples":[["カードキーでドアが開きません。","用房卡打不开门。","你可以这样说"],["カードキーを確認しますので、お持ちください。","请把房卡拿来，我帮您检查。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:late-checkout:r","cat":"酒店入住","prompt":"你想晚一点退房，前台说明条件。 对方说了下面这句话，是什么意思？","jp":"延長(えんちょう)には追加(ついか)料金(りょうきん)がかかります。","kind":"r","options":["延迟退房需要额外费用。","房间还没有准备好。","今天房间需要打扫吗？"],"answer":0,"why":"延迟退房是否可行、怎样计费由酒店决定。先问能不能，再确认费用；不能因为问过就默认已经延长成功。","examples":[["チェックアウトを十二時まで延長できますか？","可以把退房延迟到十二点吗？","你可以这样说"],["延長には追加料金がかかります。","延迟退房需要额外费用。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:left-item:r","cat":"酒店入住","prompt":"你退房后发现可能落了东西，前台问详情。 对方说了下面这句话，是什么意思？","jp":"どちらのお部屋(へや)に、何をお忘れになりましたか？","kind":"r","options":["您在哪个房间忘了什么东西？","Wi-Fi密码在房间的说明里。","您是说没有热水，对吗？"],"answer":0,"why":"「何を」问具体物品，「どちらのお部屋」问房号。提供入住日期、姓名、房号和物品外观，会比只说“我丢东西了”更便于查找。","examples":[["部屋に充電器を忘れたかもしれません。","我可能把充电器忘在房间里了。","你可以这样说"],["どちらのお部屋に、何をお忘れになりましたか？","您在哪个房间忘了什么东西？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:find-item:r","cat":"逛街付款","prompt":"你问想买的商品在哪，店员指向楼上。 对方说了下面这句话，是什么意思？","jp":"靴売り場(くつうりば)は二階(にかい)にございます。","kind":"r","options":["鞋区在二楼。","黑色的话有同样的尺码。","一次付清可以吗？"],"answer":0,"why":"「売り場」是卖某类商品的区域。前面换成衣服、童装等名称，也能问其他分区。题中的楼层只对应本次场景。","examples":[["靴売り場はどこですか？","鞋区在哪里？","你可以这样说"],["靴売り場は二階にございます。","鞋区在二楼。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:size-down:r","cat":"逛街付款","prompt":"你拿着一件偏大的上衣，店员确认需求。 对方说了下面这句话，是什么意思？","jp":"こちらより小さいサイズをお探しですか？","kind":"r","options":["您是在找比这件小的尺码吗？","我给您拿一件新的。","商品要分别装进袋子吗？"],"answer":0,"why":"「小さいサイズ」是更小的尺码。试穿后想比较尺寸，直接说想试小一号即可，不等于马上决定买下它。","examples":[["一つ小さいサイズを試してもいいですか？","可以试一下小一号的吗？","你可以这样说"],["こちらより小さいサイズをお探しですか？","您是在找比这件小的尺码吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:face-cover:r","cat":"逛街付款","prompt":"你准备试穿上衣，店员递来一张罩纸。 对方说了下面这句话，是什么意思？","jp":"こちらのフェイスカバーをお使いください。","kind":"r","options":["请使用这个试衣面罩。","这件按价签上标示的金额。","请慢慢考虑。"],"answer":0,"why":"有些服装店试穿时会提供面罩，减少化妆品蹭到衣物。不是让你拿走当口罩用；不懂用法就直接问，避免勉强猜。","examples":[["これ、どうやって使うんですか？","这个怎么用？","你可以这样说"],["こちらのフェイスカバーをお使いください。","请使用这个试衣面罩。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:fit-feedback:r","cat":"逛街付款","prompt":"你试完走出来，店员询问。 对方说了下面这句话，是什么意思？","jp":"サイズはいかがですか？","kind":"r","options":["尺码感觉怎么样？","这件商品不参加促销。","您在找什么吗？"],"answer":0,"why":"「サイズはいかがですか？」的意思是“尺码感觉怎么样？”。","examples":[["肩の辺りが少しきついです。","肩膀这里有点紧。","你可以这样说"],["サイズはいかがですか？","尺码感觉怎么样？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:try-shoes:r","cat":"逛街付款","prompt":"你试穿鞋子，店员给出一个建议。 对方说了下面这句话，是什么意思？","jp":"両足(りょうあし)を履いて、少し歩いてみてください。","kind":"r","options":["两只都穿上，稍微走走试试。","需要按礼物包装吗？","要不要给您拿大一号的？"],"answer":0,"why":"「両足」是双脚，「もう片方」是另一只。鞋子不只看码数，店员是在让你比较实际穿着感受，不是在催你付款。","examples":[["もう片方も履いていいですか？","另一只也可以穿上试试吗？","你可以这样说"],["両足を履いて、少し歩いてみてください。","两只都穿上，稍微走走试试。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:new-stock:r","cat":"逛街付款","prompt":"你想买试穿的这款，店员说明可提供的商品。 对方说了下面这句话，是什么意思？","jp":"新しい(あたらしい)ものをお持ちします。","kind":"r","options":["我给您拿一件新的。","商品要分别装进袋子吗？","您是在找比这件小的尺码吗？"],"answer":0,"why":"「新しいもの」在这里是新的商品，不是新款设计。有些商品可能只有陈列品，所以先问是否有，不能默认一定能换成未展示的。","examples":[["店頭に出ていない新しいものはありますか？","有没摆出来的新货吗？","你可以这样说"],["新しいものをお持ちします。","我给您拿一件新的。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:hold-item:r","cat":"逛街付款","prompt":"你还要逛别的楼层，店员说明保留方式。 对方说了下面这句话，是什么意思？","jp":"本日中(ほんじつちゅう)でしたら、お取り置きできます。","kind":"r","options":["可以为您保留到今天之内。","换货时请带上小票。","试衣间在里面。"],"answer":0,"why":"「取り置き」是暂时留货，不等于已经付款购买。可保留多久、是否要留姓名等，由店铺决定；明确约定时间再离开。","examples":[["夕方まで取り置きしてもらえますか？","能帮我保留到傍晚吗？","你可以这样说"],["本日中でしたら、お取り置きできます。","可以为您保留到今天之内。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:sale-excluded:r","cat":"逛街付款","prompt":"你以为全店都在促销，店员提醒这一件的情况。 对方说了下面这句话，是什么意思？","jp":"こちらの商品(しょうひん)はセール対象外(たいしょうがい)です。","kind":"r","options":["这件商品不参加促销。","您在找什么吗？","尺码感觉怎么样？"],"answer":0,"why":"「対象外」是范围之外，表示这件不在促销适用商品里。看见大海报不代表每件都打折，尤其要留意小字和商品标牌。","examples":[["これもセールになっていますか？","这个也在打折吗？","你可以这样说"],["こちらの商品はセール対象外です。","这件商品不参加促销。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:payment-installments:r","cat":"逛街付款","prompt":"你准备刷卡，店员确认付款方式。 对方说了下面这句话，是什么意思？","jp":"お支払い(しはらい)は一括(いっかつ)でよろしいですか？","kind":"r","options":["一次付清可以吗？","鞋区在二楼。","黑色的话有同样的尺码。"],"answer":0,"why":"「一括」是一次付清，不是“所有人一起结账”。这是刷卡时可能听到的确认；卡片支持哪些方式，以收银系统和发卡方规则为准。","examples":[["一括でお願いします。","麻烦一次付清。","你可以这样说"],["お支払いは一括でよろしいですか？","一次付清可以吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:gift-wrap:r","cat":"逛街付款","prompt":"你买的是礼物，店员询问包装。 对方说了下面这句话，是什么意思？","jp":"贈り物(おくりもの)用にお包みしますか？","kind":"r","options":["需要按礼物包装吗？","要不要给您拿大一号的？","两只都穿上，稍微走走试试。"],"answer":0,"why":"「贈り物用」和「プレゼント用」都表示送礼用途。包装是否收费、有哪些形式可以继续问，不要把“可以包装”理解成任何包装都免费。","examples":[["プレゼント用に包んでもらえますか？","能帮我包装成礼物吗？","你可以这样说"],["贈り物用にお包みしますか？","需要按礼物包装吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:separate-bags:r","cat":"逛街付款","prompt":"你买了送给不同朋友的两件商品，店员问。 对方说了下面这句话，是什么意思？","jp":"お品物は別々(べつべつ)の袋にお入れしますか？","kind":"r","options":["商品要分别装进袋子吗？","您是在找比这件小的尺码吗？","我给您拿一件新的。"],"answer":0,"why":"「お品物は別々(べつべつ)の袋にお入れしますか？」的意思是“商品要分别装进袋子吗？”。","examples":[["一つずつ別の袋に入れてもらえますか？","可以每件分别装袋吗？","你可以这样说"],["お品物は別々の袋にお入れしますか？","商品要分别装进袋子吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:return-policy:r","cat":"逛街付款","prompt":"你买衣服前问退换规则，店员说明需要的东西。 对方说了下面这句话，是什么意思？","jp":"交換(こうかん)の際は、レシートをお持ちください。","kind":"r","options":["换货时请带上小票。","试衣间在里面。","可以为您保留到今天之内。"],"answer":0,"why":"「交換」是换货，「返品」是退货，两者不是同一件事。店员要求小票并不表示所有条件都满足，期限、吊牌和使用状态等要按店铺说明确认。","examples":[["サイズが合わなかったら、交換できますか？","如果尺码不合，可以换吗？","你可以这样说"],["交換の際は、レシートをお持ちください。","换货时请带上小票。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:straight:r","cat":"问路求助","prompt":"你向路人问目的地，对方指着前方。 对方说了下面这句话，是什么意思？","jp":"この道をまっすぐ行ってください。","kind":"r","options":["沿这条路一直往前走。","前面不能通行，请从另一侧绕过去。","要不要我写在纸上？"],"answer":0,"why":"「まっすぐ」是一直往前，不是第一个路口就转弯。把对方的关键方向重复确认一下，在实际问路时很自然，也能减少听错。","examples":[["この道をまっすぐですか？","是沿这条路直走吗？","你可以这样说"],["この道をまっすぐ行ってください。","沿这条路一直往前走。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:turn:r","cat":"问路求助","prompt":"你问如何到达一家店，路人给出转弯提示。 对方说了下面这句话，是什么意思？","jp":"二つ目(ふたつめ)の信号(しんごう)を右に曲がってください。","kind":"r","options":["在第二个红绿灯处右转。","没有台阶的入口在那边。","能在地图上给我看一下想去的地方吗？"],"answer":0,"why":"「二つ目」是第二个，「右」是右边。听方向时先抓住数量和左右，再复述确认，通常比把整段说明都记下来容易。","examples":[["二つ目の信号を右ですね？","第二个红绿灯右转，对吗？","你可以这样说"],["二つ目の信号を右に曲がってください。","在第二个红绿灯处右转。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:walking-time:r","cat":"问路求助","prompt":"你询问目的地远不远，路人估算。 对方说了下面这句话，是什么意思？","jp":"歩いて十分(じゅっぷん)くらいです。","kind":"r","options":["走路大约十分钟。","公共厕所在这个公园里面。","您最后一次使用是在什么地方？"],"answer":0,"why":"「歩いて」是步行，「くらい」表示大约。路人的估计不是保证到达时间，自己的速度、路口等待和找路都可能影响实际用时。","examples":[["ここから歩いてどのくらいですか？","从这里走过去大概要多久？","你可以这样说"],["歩いて十分くらいです。","走路大约十分钟。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:landmark:r","cat":"问路求助","prompt":"你找不到建筑入口，路人给你一个明显参照。 对方说了下面这句话，是什么意思？","jp":"郵便局(ゆうびんきょく)の向かい側(むかいがわ)です。","kind":"r","options":["在邮局对面。","转过这个街角就有便利店。","请告诉我颜色、形状等特征。"],"answer":0,"why":"「向かい側」是对面，「目印」是用来辨认位置的标志。店名、便利店或明显建筑都可以当参照，不一定非得是著名景点。","examples":[["何か目印はありますか？","有什么明显的地标吗？","你可以这样说"],["郵便局の向かい側です。","在邮局对面。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:cross-street:r","cat":"问路求助","prompt":"你准备过马路，路人说明去对面的方式。 对方说了下面这句话，是什么意思？","jp":"あちらの横断歩道(おうだんほどう)を渡ってください。","kind":"r","options":["请从那边的人行横道过马路。","旅游咨询处在车站前面。","出租车乘车点在那边。"],"answer":0,"why":"「あちらの横断歩道(おうだんほどう)を渡ってください。」的意思是“请从那边的人行横道过马路”。","examples":[["向こう側へはどこから渡れますか？","从哪里可以过到对面？","你可以这样说"],["あちらの横断歩道を渡ってください。","请从那边的人行横道过马路。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:entrance:r","cat":"问路求助","prompt":"你到了建筑旁边却没找到门，工作人员说。 对方说了下面这句话，是什么意思？","jp":"入口(いりぐち)は建物(たてもの)の裏側(うらがわ)です。","kind":"r","options":["入口在建筑背面。","要不要我再慢慢说明一遍？","需要我叫救护车吗？"],"answer":0,"why":"「裏側」是背面，与面向道路的一侧可能不同。地图显示到了目的地，并不代表站在能进去的门口，问入口比只问“这是什么地方”更有用。","examples":[["この建物の入口はどこですか？","这栋楼的入口在哪里？","你可以这样说"],["入口は建物の裏側です。","入口在建筑背面。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:blocked:r","cat":"问路求助","prompt":"你看到围挡，工作人员说明路线情况。 对方说了下面这句话，是什么意思？","jp":"この先は通れません。反対側からお回りください。","kind":"r","options":["前面不能通行，请从另一侧绕过去。","要不要我写在纸上？","沿这条路一直往前走。"],"answer":0,"why":"「回る」在这里是绕路，不是原地转圈。「通れません」表示不能通过，先找可走的路线，不必继续沿原导航路线硬走。","examples":[["どちらから回ればいいですか？","应该从哪边绕过去？","你可以这样说"],["この先は通れません。反対側からお回りください。","前面不能通行，请从另一侧绕过去。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:elevator:r","cat":"问路求助","prompt":"你推着行李箱找入口，工作人员指路。 对方说了下面这句话，是什么意思？","jp":"段差のない入口(いりぐち)は、あちらにあります。","kind":"r","options":["没有台阶的入口在那边。","能在地图上给我看一下想去的地方吗？","在第二个红绿灯处右转。"],"answer":0,"why":"「段差」是高低差、台阶。表达“不走楼梯”的需求，比只问最近的路更准确；对方可能会指向电梯、坡道或另一个入口。","examples":[["階段を使わずに行けますか？","可以不走楼梯过去吗？","你可以这样说"],["段差のない入口は、あちらにあります。","没有台阶的入口在那边。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:nearby-store:r","cat":"问路求助","prompt":"你想买水，路人说明附近便利店的位置。 对方说了下面这句话，是什么意思？","jp":"この角を曲がると、コンビニがあります。","kind":"r","options":["转过这个街角就有便利店。","请告诉我颜色、形状等特征。","在邮局对面。"],"answer":0,"why":"「この辺り」是这一带、附近，「角を曲がる」是转过街角。对方不一定知道距离最近的是哪家，但通常能告诉你附近哪里有。","examples":[["この辺りにコンビニはありますか？","这一带有便利店吗？","你可以这样说"],["この角を曲がると、コンビニがあります。","转过这个街角就有便利店。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:information:r","cat":"问路求助","prompt":"你在观光地点找人咨询，工作人员介绍服务。 对方说了下面这句话，是什么意思？","jp":"観光案内所(かんこうあんないじょ)は駅前にあります。","kind":"r","options":["旅游咨询处在车站前面。","出租车乘车点在那边。","请从那边的人行横道过马路。"],"answer":0,"why":"「観光案内所」是旅游咨询处，可能提供地图或路线信息。想要纸地图时说「もらえますか」，不是要求对方把手机借给你。","examples":[["この辺りの地図はもらえますか？","可以给我一张这一带的地图吗？","你可以这样说"],["観光案内所は駅前にあります。","旅游咨询处在车站前面。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:write-down:r","cat":"问路求助","prompt":"你听不懂地址，工作人员提出一种办法。 对方说了下面这句话，是什么意思？","jp":"紙に書きましょうか？","kind":"r","options":["要不要我写在纸上？","沿这条路一直往前走。","前面不能通行，请从另一侧绕过去。"],"answer":0,"why":"「紙に書きましょうか？」的意思是“要不要我写在纸上？”。","examples":[["住所を書いてもらえますか？","能把地址写给我吗？","你可以这样说"],["紙に書きましょうか？","要不要我写在纸上？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:found-property:r","cat":"问路求助","prompt":"你问有没有人捡到自己的东西，服务台让你描述。 对方说了下面这句话，是什么意思？","jp":"色や形など、特徴(とくちょう)を教えてください。","kind":"r","options":["请告诉我颜色、形状等特征。","在邮局对面。","转过这个街角就有便利店。"],"answer":0,"why":"「色や形など、特徴(とくちょう)を教えてください。」的意思是“请告诉我颜色、形状等特征”。","examples":[["黒い財布の落とし物は届いていませんか？","有没有人送来一个黑色钱包？","你可以这样说"],["色や形など、特徴を教えてください。","请告诉我颜色、形状等特征。","也可能听到对方这样说"]],"source":null},{"id":"practical:music-v1:live-today","cat":"音乐与夜间娱乐","prompt":"【Jazz Bar】你路过一家爵士酒吧，想知道今晚有没有现场演奏。","jp":"","kind":"s","options":["今夜(こんや)、生演奏(なまえんそう)はありますか？","ミュージックチャージはいくらですか？","生ビール(なまビール)を一つ(ひとつ)お願いします。"],"answer":0,"why":"「生演奏」是现场演奏。有些ジャズバー主要播放唱片，并非每天都有乐手演出，进店前确认很自然。","examples":[["今夜(こんや)、生演奏(なまえんそう)はありますか？","今晚有现场演奏吗？","现场常用"],["ライブは何時(なんじ)からですか？","演出几点开始？","还可以这样说"]],"source":null},{"id":"practical:music-v1:reserve","cat":"音乐与夜间娱乐","prompt":"【Jazz Bar】你想订今晚两个人的位置。","jp":"","kind":"s","options":["今夜(こんや)、二人(ふたり)で予約(よやく)できますか？","カウンター席(せき)は空いて(あいて)いますか？","ハイボールを一つ(ひとつ)お願いします。"],"answer":0,"why":"先说日期和人数，再确认演出场次、时间和座位。予約是预约，不能只说有两个人就认为订位完成。","examples":[["今夜(こんや)、二人(ふたり)で予約(よやく)できますか？","今晚可以订两个人的位置吗？","现场常用"],["七時(しちじ)ごろに伺い(うかがい)たいんですが。","我想七点左右过去。","还可以这样说"]],"source":["Billboard Live：常见问题","https://www.billboard-live.com/qa"]},{"id":"practical:music-v1:walkin","cat":"音乐与夜间娱乐","prompt":"【Jazz Bar】你没有预约，想问现在能否进去听。","jp":"","kind":"s","options":["予約(よやく)していないんですが、入れます(はいれます)か？","ステージが見える(みえる)席(せき)はありますか？","甘すぎない(あますぎない)カクテルで、おすすめはありますか？"],"answer":0,"why":"「〜んですが」自然地引出自己的情况，再请店员判断是否能接待。没有预约不等于一定不能入场。","examples":[["予約(よやく)していないんですが、入れます(はいれます)か？","我没有预约，现在能进去吗？","现场常用"],["一人(ひとり)です。","我一个人。","还可以这样说"]],"source":null},{"id":"practical:music-v1:name","cat":"音乐与夜间娱乐","prompt":"【Jazz Bar】到店后，接待人员问你。","jp":"ご予約(よやく)のお名前(なまえ)をお願いします。","kind":"r","options":["请告诉我预约姓名。","您要加冰，还是纯饮？","还要另外收取座位费。"],"answer":0,"why":"店员是在核对订位姓名。按预约时填写的名字回答，必要时出示确认邮件。","examples":[["ご予約(よやく)のお名前(なまえ)をお願いします。","请告诉我预约姓名。","现场常用"],["予約(よやく)したリーです。","我姓李，有预约。","还可以这样说"]],"source":null},{"id":"practical:music-v1:musiccharge","cat":"音乐与夜间娱乐","prompt":"【Jazz Bar】菜单上写着ミュージックチャージ，你想问金额。","jp":"","kind":"s","options":["ミュージックチャージはいくらですか？","ハイボールを一つ(ひとつ)お願いします。","すみません、お水(みず)をお願いします。"],"answer":0,"why":"这是与演出相关的费用，不等于饮料价格。有的店另有座位费或服务费，需要看具体说明。","examples":[["ミュージックチャージはいくらですか？","音乐费多少钱？","现场常用"],["飲み物代(のみものだい)は別(べつ)ですか？","饮品费用另算吗？","还可以这样说"]],"source":null},{"id":"practical:music-v1:tablecharge","cat":"音乐与夜间娱乐","prompt":"【Jazz Bar】店员说明收费方式。","jp":"テーブルチャージが別途(べっと)かかります。","kind":"r","options":["还要另外收取座位费。","马上到最后点单时间了。","第一段演出从七点半开始。"],"answer":0,"why":"「別途」表示另外，「テーブルチャージ」是座位相关费用。不能把它理解为给你另外安排一张桌子。","examples":[["テーブルチャージが別途(べっと)かかります。","还要另外收取座位费。","现场常用"],["全部(ぜんぶ)でいくらになりますか？","合计是多少钱？","还可以这样说"]],"source":null}],"visitor/visitor-practical":[{"id":"practical:series-v1:ramen:wait-number:r","cat":"餐厅点餐","prompt":"你在柜台点完面，店员递来一个号码牌。 对方说了下面这句话，是什么意思？","jp":"番号(ばんごう)でお呼びしますので、こちらでお待ちください。","kind":"r","options":["请在这里等，之后会按号码叫你。","午餐时段附带小碗米饭，你需要吗？","我马上来擦，先放着就可以。"],"answer":0,"why":"有的店会按号码叫客人取餐或入座。「番号でお呼びします」是在说明叫号方式，拿好号码牌，在指定位置等待就行。不知道等在哪里，直接问「どこで待てばいいですか？」。","examples":[["どこで待てばいいですか？","我应该在哪里等？","你可以这样说"],["番号でお呼びしますので、こちらでお待ちください。","请在这里等，之后会按号码叫你。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:order-mistake:s","cat":"餐厅点餐","prompt":"刚买完餐券就发现选错了，想先问能不能换，怎么说？","jp":"","kind":"s","options":["食券(しょっけん)を買い間違えたんですが、変更(へんこう)できますか？","並盛り(なみもり)は麺が何グラムですか？","レシートをお願いします。"],"answer":0,"why":"「買い間違えた」是买错了。能不能更改取决于店铺和厨房是否已制作，所以先询问，不要直接把新券当作替换成功。这里店员明确表示尚未制作，可以更改。","examples":[["食券を買い間違えたんですが、変更できますか？","我买错餐券了，可以更改吗？","你可以这样说"],["まだ作っていないので、変更できますよ。","还没有开始做，可以更改。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:small-rice:s","cat":"餐厅点餐","prompt":"这碗拉面已经够吃，你想婉拒附带的小碗饭，怎么说？","jp":"","kind":"s","options":["ライスは大丈夫(だいじょうぶ)です。","すみません、水をこぼしてしまいました。","まだ入れますか？"],"answer":0,"why":"这里的「つきます」是附带，不是让你再点一份主食。店员在询问你是否需要。「大丈夫です」接在这类服务提议后，可以表示“不用了”；如果想要，就说「お願いします」。","examples":[["ライスは大丈夫です。","米饭就不用了。","你可以这样说"],["ランチタイムは小ライスがつきますが、いかがですか？","午餐时段附带小碗米饭，你需要吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:receipt:s","cat":"餐厅点餐","prompt":"你想保留这次用餐的小票，怎么回答或提出请求？","jp":"","kind":"s","options":["レシートをお願いします。","どこで待てばいいですか？","ライスは大丈夫(だいじょうぶ)です。"],"answer":0,"why":"「レシート」是收银小票。「ご入用ですか？」是询问是否需要，回答「お願いします」即可。如果要报销用的正式收据，可以另外问「領収書をもらえますか？」。","examples":[["レシートをお願いします。","麻烦给我小票。","你可以这样说"],["レシートはご入用ですか？","需要小票吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:order-check:r","cat":"餐厅点餐","prompt":"两碗面端来，店员需要确认分别是谁点的。 对方说了下面这句话，是什么意思？","jp":"味噌ラーメンをご注文(ちゅうもん)のお客様(おきゃくさま)は？","kind":"r","options":["哪位点的是味噌拉面？","还没有开始做，可以更改。","即使普通份，面量也偏多。"],"answer":0,"why":"「味噌ラーメンをご注文(ちゅうもん)のお客様(おきゃくさま)は？」的意思是“哪位点的是味噌拉面？”。","examples":[["はい、私です。","是我。","你可以这样说"],["味噌ラーメンをご注文のお客様は？","哪位点的是味噌拉面？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:ramen:closed:r","cat":"餐厅点餐","prompt":"你刚到店门口，店员说明今天的情况。 对方说了下面这句话，是什么意思？","jp":"すみません、今日(きょう)はスープがなくなったので終了です。","kind":"r","options":["不好意思，今天汤已经卖完，停止营业了。","现在只有分开的单个空位。","这是饺子用的醋。"],"answer":0,"why":"有些拉面店会在汤卖完时结束当日供应。「終了です」在这段话里是今天已结束，不是请你稍等下一锅。门开着也不一定还接客，先问「まだ入れますか？」很实用。","examples":[["まだ入れますか？","现在还能进去用餐吗？","你可以这样说"],["すみません、今日はスープがなくなったので終了です。","不好意思，今天汤已经卖完，停止营业了。","也可能听到对方这样说"]],"source":null},{"id":"practical:conv-products-v1:bento","cat":"便利店购物","prompt":"你拿着便当结账，想请店员加热。","jp":"","kind":"s","options":["このお弁当(べんとう)、温め(あたため)てもらえますか？","肉まん(にくまん)、一つ(ひとつ)ください。","このフライドチキンを一つ(ひとつ)お願いします(おねがいします)。"],"answer":0,"why":"「お弁当」就是便当。便利店里拿着商品说「これ、温めてください」也很自然；不是所有食品都适合加热，让店员按包装处理。","examples":[["このお弁当(べんとう)、温め(あたため)てもらえますか？","这个便当可以帮我加热吗？","现场会用到"],["温め(あたため)なくて大丈夫(だいじょうぶ)です。","不用加热。","还可以这样说"],["お箸(はし)を一膳(いちぜん)お願いします(おねがいします)。","请给我一双筷子。","索要餐具"]],"source":null},{"id":"practical:conv-products-v1:nikuman","cat":"便利店购物","prompt":"你在收银台旁看到蒸包柜，想买一个肉包。","jp":"","kind":"s","options":["肉まん(にくまん)、一つ(ひとつ)ください。","唐揚げ(からあげ)はありますか？","大根(だいこん)と卵(たまご)を一つ(ひとつ)ずつお願いします(おねがいします)。"],"answer":0,"why":"「肉まん」指肉馅蒸包，有些商品叫「豚まん（ぶたまん）」。向店员报商品名和数量即可，不需要说得很长。","examples":[["肉まん(にくまん)、一つ(ひとつ)ください。","请给我一个肉包。","现场会用到"],["肉まん(にくまん)を二つ(ふたつ)お願いします(おねがいします)。","请给我两个肉包。","还可以这样说"],["肉まん(にくまん)、まだありますか？","肉包还有吗？","确认有货"]],"source":null},{"id":"practical:conv-products-v1:hotcoffee","cat":"便利店购物","prompt":"柜台菜单有S号热咖啡，你想买一杯。","jp":"","kind":"s","options":["ホットコーヒーのS(エス)を一つ(ひとつ)お願いします(おねがいします)。","レモンティーを一つ(ひとつ)ください。","これは自分(じぶん)で作る(つくる)んですか？"],"answer":0,"why":"「ホット」是热饮。便利店柜台用「一つ」点一杯饮料很自然；不同品牌的尺寸可能写S、M、L或R，按菜单说。","examples":[["ホットコーヒーのS(エス)を一つ(ひとつ)お願いします(おねがいします)。","请给我一杯S号热咖啡。","现场会用到"],["小さい(ちいさい)サイズでお願いします(おねがいします)。","请给我小杯。","还可以这样说"],["ホットコーヒーを二つ(ふたつ)お願いします(おねがいします)。","请给我两杯热咖啡。","帮同伴一起买"]],"source":null},{"id":"practical:conv-products-v1:hotcold","cat":"便利店购物","prompt":"你只说要一杯咖啡，店员继续问。这句话是什么意思？","jp":"ホットとアイス、どちらになさいますか？","kind":"r","options":["您要热的还是冰的？","请用这台机器接饮品。","您要什么尺寸？"],"answer":0,"why":"这是在确认冷热，并不是在问杯型。回答「ホットで」或「アイスで」就足够，加お願いします更礼貌。","examples":[["ホットとアイス、どちらになさいますか？","您要热的还是冰的？","现场会用到"],["アイスでお願いします(おねがいします)。","请给我冰的。","还可以这样说"]],"source":null},{"id":"practical:conv-products-v1:machine","cat":"便利店购物","prompt":"付款后店员把杯子交给你并说明。这句话是什么意思？","jp":"こちらのマシンでお入れ(いれ)ください。","kind":"r","options":["请用这台机器接饮品。","请扫描条形码。","结账后先打开杯盖，再把杯子放进机器。"],"answer":0,"why":"「マシン」指机器，「入れる」在这里是把饮品注入杯中。按购买的饮品、冷热和尺寸操作，不熟悉时可以求助。","examples":[["こちらのマシンでお入れ(いれ)ください。","请用这台机器接饮品。","现场会用到"],["使い方(つかいかた)を教えて(おしえて)もらえますか？","可以教我怎么用吗？","还可以这样说"]],"source":["全家：咖啡购买与制作说明","https://www.family.co.jp/campaign/spot/famimacafe_make.html"]},{"id":"practical:conv-products-v1:soldout","cat":"便利店购物","prompt":"你想买柜台的炸鸡，店员回答。这句话是什么意思？","jp":"すみません、ただいま売り切れ(うりきれ)です。","kind":"r","options":["不好意思，现在卖完了。","这是金枪鱼蛋黄酱口味。","这是辣味的。"],"answer":0,"why":"「売り切れ」是售罄，不是停售或还没开始卖。「ただいま」在这里表示目前。","examples":[["すみません、ただいま売り切れ(うりきれ)です。","不好意思，现在卖完了。","现场会用到"],["次(つぎ)はいつ頃(ごろ)できますか？","下一批大概什么时候做好？","还可以这样说"]],"source":null},{"id":"practical:series-v1:train:platform:s","cat":"交通出行","prompt":"你知道目的地，但不知道去哪个站台，怎么问？","jp":"","kind":"s","options":["この電車(でんしゃ)は何番線ですか？","ICカードはどこでチャージできますか？","この方面(ほうめん)の終電(しゅうでん)は何時ですか？"],"answer":0,"why":"「番線」是在站内找车时常见的说法。它与车厢编号、出口编号不同。题里的三番线只是这次对话中的站台，实际出行要看当天的显示屏和站员指引。","examples":[["この電車は何番線ですか？","这趟车在几号站台？","你可以这样说"],["その電車は三番線から出ます。","那趟车从3号站台发车。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:direction:r","cat":"交通出行","prompt":"你在站台上确认是不是坐反了方向。 对方说了下面这句话，是什么意思？","jp":"こちらは反対方面(はんたいほうめん)です。","kind":"r","options":["这里是相反方向。","余额不足，需要补足车费。","在下一站下车，再乘反方向的车。"],"answer":0,"why":"同一条线路往往有两个方向。「反対方面」说明当前这边方向不对，不一定是整条线路错了。问方向时给出目的地，比只问“对不对”更清楚。","examples":[["渋谷へ行くのはこちらで合っていますか？","去涩谷走这边对吗？","你可以这样说"],["こちらは反対方面です。","这里是相反方向。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:stops:s","cat":"交通出行","prompt":"你不确定列车是否停靠目的地，怎么问？","jp":"","kind":"s","options":["この電車(でんしゃ)は、この駅に止まりますか？","切符(きっぷ)を買い間違えました。変更(へんこう)できますか？","ここで降りないといけませんか？"],"answer":0,"why":"想表达这个意思,可以说「この電車(でんしゃ)は、この駅に止まりますか？」。","examples":[["この電車は、この駅に止まりますか？","这趟车在这个站停吗？","你可以这样说"],["この快速は、その駅には止まりません。","这趟快速列车不在那个站停。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:insufficient:r","cat":"交通出行","prompt":"出站时闸机没打开，站员看卡后说明原因。 对方说了下面这句话，是什么意思？","jp":"残高(ざんだか)が足りないので、精算(せいさん)してください。","kind":"r","options":["余额不足，需要补足车费。","在下一站下车，再乘反方向的车。","这里是相反方向。"],"answer":0,"why":"「残高」是卡里剩余金额，「精算」是结清应付车费。余额不足只是闸机不开的一种原因，先请站员检查，不要直接跟在别人后面出站。按指引充值或补足差额即可。","examples":[["すみません、改札を出られません。","不好意思，我出不了检票口。","你可以这样说"],["残高が足りないので、精算してください。","余额不足，需要补足车费。","也可能听到对方这样说"]],"source":["交通卡余额不足时的处理参考：JR东日本","https://jreastfaq.jreast.co.jp/faq/show/1057?category_id=28&site_domain=default"]},{"id":"practical:series-v1:train:luggage-elevator:s","cat":"交通出行","prompt":"你想找电梯，怎么向站员问路？","jp":"","kind":"s","options":["エレベーターはどこですか？","乗り換え(のりかえ)なしで行けますか？","この切符(きっぷ)は指定席(していせき)ですか？"],"answer":0,"why":"「エレベーター」是升降电梯，「エスカレーター」是自动扶梯。带大行李或行动不便时，把需要的设施说清楚，比只问出口更有帮助。","examples":[["エレベーターはどこですか？","电梯在哪里？","你可以这样说"],["エレベーターはホームの端にあります。","电梯在站台尽头。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:train:delay:r","cat":"交通出行","prompt":"你等的车还没来，广播说明情况。 对方说了下面这句话，是什么意思？","jp":"電車(でんしゃ)が遅れております。到着(とうちゃく)までしばらくお待ちください。","kind":"r","options":["列车晚点了，请再等一会儿。","遗失物品的询问在这个窗口。","去酒店的话，东口比较近。"],"answer":0,"why":"「遅れております」是晚点，不等于取消。站员也可能暂时无法给出准确时间；先了解情况，再决定是否改用其他线路。","examples":[["どのくらい遅れていますか？","大概晚点多久？","你可以这样说"],["電車が遅れております。到着までしばらくお待ちください。","列车晚点了，请再等一会儿。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:booking-name:r","cat":"酒店入住","prompt":"你到前台办理入住，工作人员开始查预约。 对方说了下面这句话，是什么意思？","jp":"ご予約(よやく)のお名前(なまえ)をお願いします。","kind":"r","options":["请告诉我预约时的姓名。","早餐餐厅在二楼。","我们会确认情况并处理。"],"answer":0,"why":"「ご予約のお名前」是订房记录上的姓名，不一定是当前站在前台的人。使用与订单一致的姓名更方便查找；也可以把预订确认页面给工作人员看。","examples":[["田中の名前で予約しています。","我是以田中的名字预约的。","你可以这样说"],["ご予約のお名前をお願いします。","请告诉我预约时的姓名。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:confirmation:s","cat":"酒店入住","prompt":"你想把手机里的订房确认页面出示给前台，怎么说？","jp":"","kind":"s","options":["こちらが予約(よやく)の確認(かくにん)画面です。","この予約(よやく)に朝食(ちょうしょく)はついていますか？","カードキーでドアが開きません。"],"answer":0,"why":"「確認メール」是预订确认邮件，「確認画面」是手机或网页上的确认页面。工作人员是在核对订单，不是在让你重新订一间房。","examples":[["こちらが予約の確認画面です。","这是预订确认页面。","你可以这样说"],["予約の確認メールを見せていただけますか？","能给我看一下预订确认邮件吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:wifi:s","cat":"酒店入住","prompt":"你已经进房却找不到网络密码，怎么打给前台问？","jp":"","kind":"s","options":["Wi-Fiのパスワードを教えてもらえますか？","シャワーのお湯(おゆ)が出ません。","部屋(へや)に充電器(じゅうでんき)を忘れたかもしれません。"],"answer":0,"why":"想表达这个意思,可以说「Wi-Fiのパスワードを教えてもらえますか？」。","examples":[["Wi-Fiのパスワードを教えてもらえますか？","能告诉我Wi-Fi密码吗？","你可以这样说"],["Wi-Fiのパスワードは、お部屋の案内に載っています。","Wi-Fi密码在房间的说明里。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:towel:s","cat":"酒店入住","prompt":"你想再要一条浴巾，怎么说？","jp":"","kind":"s","options":["バスタオルをもう一枚もらえますか？","チェックアウトは何時までですか？","ここは何を書けばいいですか？"],"answer":0,"why":"「バスタオル」是浴巾，较小的擦手脸毛巾通常另称「フェイスタオル」。说清是哪一种和要几条，工作人员更容易准备。","examples":[["バスタオルをもう一枚もらえますか？","能再给我一条浴巾吗？","你可以这样说"],["新しいタオルをお部屋までお持ちします。","我们会把新毛巾送到房间。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:check-out:r","cat":"酒店入住","prompt":"你打算明天离店，前台说明时间。 对方说了下面这句话，是什么意思？","jp":"チェックアウトは午前(ごぜん)十一時(じゅういちじ)までです。","kind":"r","options":["退房最晚到上午十一点。","请在这里填写姓名和地址。","我们会把新毛巾送到房间。"],"answer":0,"why":"「チェックアウトは午前(ごぜん)十一時(じゅういちじ)までです。」的意思是“退房最晚到上午十一点”。","examples":[["チェックアウトは何時までですか？","最晚几点退房？","你可以这样说"],["チェックアウトは午前十一時までです。","退房最晚到上午十一点。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:hotel:storage-after:s","cat":"酒店入住","prompt":"退房后想把箱子放到傍晚再取，怎么问？","jp":"","kind":"s","options":["チェックアウト後、夕方(ゆうがた)まで荷物(にもつ)を預かってもらえますか？","ここでカードキーをかざすんですか？","エアコンが冷えないんですが、見てもらえますか？"],"answer":0,"why":"想表达这个意思,可以说「チェックアウト後、夕方(ゆうがた)まで荷物(にもつ)を預かってもらえますか？」。","examples":[["チェックアウト後、夕方まで荷物を預かってもらえますか？","退房后能帮我寄存行李到傍晚吗？","你可以这样说"],["本日中でしたら、お荷物をお預かりできます。","如果今天内来取，可以寄存行李。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:browse:s","cat":"逛街付款","prompt":"你只是想自己先看看，暂时不用店员介绍，怎么自然回答？","jp":"","kind":"s","options":["少し見ているだけです。ありがとうございます。","肩の辺りが少しきついです。","これもセールになっていますか？"],"answer":0,"why":"想表达这个意思,可以说「少し見ているだけです。ありがとうございます。」。","examples":[["少し見ているだけです。ありがとうございます。","我先随便看看，谢谢。","你可以这样说"],["何かお探しですか？","您在找什么吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:size-up:s","cat":"逛街付款","prompt":"你想试试大一号，怎么向店员提出？","jp":"","kind":"s","options":["一つ大きいサイズはありますか？","もう片方(かたほう)も履いていいですか？","プレゼント用に包んでもらえますか？"],"answer":0,"why":"想表达这个意思,可以说「一つ大きいサイズはありますか？」。","examples":[["一つ大きいサイズはありますか？","有大一号的吗？","你可以这样说"],["一つ上のサイズもお持ちしましょうか？","要不要给您拿大一号的？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:fitting-room:r","cat":"逛街付款","prompt":"店员允许你试穿，并指向店内。 对方说了下面这句话，是什么意思？","jp":"試着室(しちゃくしつ)は奥にございます。","kind":"r","options":["试衣间在里面。","可以为您保留到今天之内。","换货时请带上小票。"],"answer":0,"why":"「試着室」是试衣间，不是厕所。店里可能还有带入件数或需要先交给店员的规则，按现场说明使用。","examples":[["試着室はどこですか？","试衣间在哪里？","你可以这样说"],["試着室は奥にございます。","试衣间在里面。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:price:s","cat":"逛街付款","prompt":"你找不到价格标，怎么直接询问这件多少钱？","jp":"","kind":"s","options":["すみません、これはいくらですか？","少し考えます。ありがとうございます。","これ、どうやって使うんですか？"],"answer":0,"why":"「値札」是价格标签。指着商品问「いくらですか」已经足够自然，不需要每次都用很书面的价格表达。","examples":[["すみません、これはいくらですか？","不好意思，这个多少钱？","你可以这样说"],["こちらは値札に表示されている金額です。","这件按价签上标示的金额。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:other-color:s","cat":"逛街付款","prompt":"你喜欢这件衣服，想问同尺码有没有黑色，怎么说？","jp":"","kind":"s","options":["同じサイズで黒はありますか？","一括(いっかつ)でお願いします。","靴売り場(くつうりば)はどこですか？"],"answer":0,"why":"想表达这个意思,可以说「同じサイズで黒はありますか？」。","examples":[["同じサイズで黒はありますか？","同样尺码有黑色吗？","你可以这样说"],["黒でしたら、同じサイズがございます。","黑色的话有同样的尺码。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:shop:leave-without-buy:s","cat":"逛街付款","prompt":"你想礼貌地表示再考虑一下，不马上买，怎么说？","jp":"","kind":"s","options":["少し考えます。ありがとうございます。","これ、どうやって使うんですか？","すみません、これはいくらですか？"],"answer":0,"why":"试穿后不合适或还没决定，可以直接说「少し考えます」。不用编理由，也不必为了礼貌而说已经决定购买。","examples":[["少し考えます。ありがとうございます。","我再考虑一下，谢谢。","你可以这样说"],["どうぞごゆっくりご検討ください。","请慢慢考虑。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:public-toilet:s","cat":"问路求助","prompt":"你不想借用店内厕所，想找附近的公共厕所，怎么问？","jp":"","kind":"s","options":["この近くに公衆トイレ(こうしゅうトイレ)はありますか？","携帯電話(けいたいでんわ)が見当たりません。","ここから歩いてどのくらいですか？"],"answer":0,"why":"「公衆トイレ」是公共厕所，与店铺是否允许借用厕所是两回事。问到位置后也要留意现场开放时间和指示。","examples":[["この近くに公衆トイレはありますか？","这附近有公共厕所吗？","你可以这样说"],["公衆トイレは、この公園の中にあります。","公共厕所在这个公园里面。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:repeat:s","cat":"问路求助","prompt":"你觉得对方说得太快，怎么礼貌请求重复？","jp":"","kind":"s","options":["すみません、もう一度ゆっくりお願いします。","連れ(つれ)が倒れました。救急車(きゅうきゅうしゃ)を呼んでください。","この建物(たてもの)の入口(いりぐち)はどこですか？"],"answer":0,"why":"「もう一度」是再一次，「ゆっくり」是慢一点。这句比只说“听不懂”更具体，对方能知道你需要放慢并重复。","examples":[["すみません、もう一度ゆっくりお願いします。","不好意思，请再慢一点说一遍。","你可以这样说"],["もう一度、ゆっくり説明しましょうか？","要不要我再慢慢说明一遍？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:map-point:s","cat":"问路求助","prompt":"你想请对方在你的地图上指出当前位置，怎么说？","jp":"","kind":"s","options":["今いる場所(ばしょ)を、この地図(ちず)で教えてもらえますか？","二つ目(ふたつめ)の信号(しんごう)を右ですね？","階段(かいだん)を使わずに行けますか？"],"answer":0,"why":"「今いる場所」是现在所在的位置，与目的地不同。地图转了方向时很容易混淆，先确认当前位置，再问下一步往哪走。","examples":[["今いる場所を、この地図で教えてもらえますか？","能在这张地图上告诉我现在的位置吗？","你可以这样说"],["行きたい場所を地図で見せてもらえますか？","能在地图上给我看一下想去的地方吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:lost-phone:s","cat":"问路求助","prompt":"你发现手机不见了，不确定是不是丢了，怎么说明？","jp":"","kind":"s","options":["携帯電話(けいたいでんわ)が見当たりません。","ここから歩いてどのくらいですか？","この近くに公衆トイレ(こうしゅうトイレ)はありますか？"],"answer":0,"why":"「見当たりません」是找不到，比直接断言被偷更准确。工作人员问最后使用地点，是在缩小查找范围，按记得的情况说明即可。","examples":[["携帯電話が見当たりません。","我找不到手机了。","你可以这样说"],["最後に使ったのは、どちらですか？","您最后一次使用是在什么地方？","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:taxi:s","cat":"问路求助","prompt":"你不确定去哪排队坐出租车，怎么问？","jp":"","kind":"s","options":["タクシー乗り場(のりば)はどこですか？","向こう側(むこうがわ)へはどこから渡れますか？","この辺りの地図(ちず)はもらえますか？"],"answer":0,"why":"「乗り場」是上车的地方，不是停车场的统称。在车站等地点，出租车可能有专门排队区域，按现场安排候车即可。","examples":[["タクシー乗り場はどこですか？","出租车乘车点在哪里？","你可以这样说"],["タクシー乗り場は、あちらです。","出租车乘车点在那边。","也可能听到对方这样说"]],"source":null},{"id":"practical:series-v1:help:unwell:s","cat":"问路求助","prompt":"假设同行的人突然倒下，你需要请人立即叫救护车，怎么说？","jp":"","kind":"s","options":["連れ(つれ)が倒れました。救急車(きゅうきゅうしゃ)を呼んでください。","この建物(たてもの)の入口(いりぐち)はどこですか？","すみません、もう一度ゆっくりお願いします。"],"answer":0,"why":"紧急求助时，把发生的情况和需要的帮助直接说出来。「連れ」是同行者，「呼んでください」是请帮忙叫来。这个练习是在表达求助需求，不是在判断病因或提供处置方案。","examples":[["連れが倒れました。救急車を呼んでください。","我的同伴倒下了，请叫救护车。","你可以这样说"],["救急車を呼びましょうか？","需要我叫救护车吗？","也可能听到对方这样说"]],"source":null},{"id":"practical:basic:0","cat":"基础开口","kind":"s","prompt":"想礼貌地叫住店员，先说哪句？","jp":"","options":["すみません。","ごちそうさまでした。","おやすみなさい。"],"answer":0,"why":"すみません既能引起注意，也能道歉，语气温和即可。","examples":[["すみません。","不好意思。","直接这样说"]]},{"id":"practical:basic:1","cat":"基础开口","kind":"s","prompt":"店员帮你找到东西，你想道谢。","jp":"","options":["ありがとうございます。","いただきます。","失礼しました。"],"answer":0,"why":"普通道谢直接说ありがとうございます，简单自然。","examples":[["ありがとうございます。","谢谢您。","直接这样说"]]},{"id":"practical:basic:2","cat":"基础开口","kind":"s","prompt":"你听得太快，想请对方说慢一点。","jp":"","options":["もう少し(すこし)ゆっくりお願いします。","もう一つ(ひとつ)お願いします。","もう大丈夫(だいじょうぶ)です。"],"answer":0,"why":"ゆっくり是慢一点；听不懂时可以请对方放慢，不必勉强点头。","examples":[["もう少し(すこし)ゆっくりお願いします。","请再慢一点说。","直接这样说"]]},{"id":"practical:basic:3","cat":"基础开口","kind":"s","prompt":"你指着菜单，想点一份这个。","jp":"","options":["これを一つ(ひとつ)お願いします。","これはどこですか？","これはいくらですか？"],"answer":0,"why":"指着菜单加これ就能点单，不一定需要念出复杂的菜名。","examples":[["これを一つ(ひとつ)お願いします。","请给我一份这个。","直接这样说"]]},{"id":"practical:basic:4","cat":"基础开口","kind":"s","prompt":"你想问是否可以用英语沟通。","jp":"","options":["英語(えいご)でも大丈夫(だいじょうぶ)ですか？","英語(えいご)の本(ほん)はありますか？","日本語(にほんご)でお願いします。"],"answer":0,"why":"先确认对方能否使用英语；也可以展示手机上的翻译文字。","examples":[["英語(えいご)でも大丈夫(だいじょうぶ)ですか？","用英语也可以吗？","直接这样说"]]},{"id":"practical:basic:5","cat":"基础开口","kind":"s","prompt":"店员问你是否需要额外的袋子，你想婉拒。","jp":"","options":["大丈夫(だいじょうぶ)です。ありがとうございます。","はい、お願いします。","二つ(ふたつ)ください。"],"answer":0,"why":"大丈夫です在这个情境中表示不用了；如果怕误会，也可以说袋はいりません。","examples":[["大丈夫(だいじょうぶ)です。ありがとうございます。","不用了，谢谢。","直接这样说"]]}],"visitor/visitor-questions-more":[{"id":"visitor-rule-extra-0","prompt":"同一条线路的所有列车都停相同车站，所以不用看车种。","answer":1,"why":"快速、普通及不同车次可能停站不同。先确认方向和目的站是否停靠，再上车。"},{"id":"visitor-rule-extra-1","prompt":"买了指定席票，就可以随便坐同一车厢的任何空位。","answer":1,"why":"指定席通常有车次、车厢及座位号。空着的座位也可能有人预订，按票面入座。"},{"id":"visitor-rule-extra-2","prompt":"自由席表示车票免费。","answer":1,"why":"自由席指不指定座位，不是免费，也不保证有空座。是否设自由席要看车次。"},{"id":"visitor-rule-extra-3","prompt":"买了某家铁路的优惠通票，就能乘坐日本所有公司的列车。","answer":1,"why":"通票有适用公司、线路、车种和日期范围，部分车次还需预约或另付费用。购买前确认行程是否适用。"},{"id":"visitor-rule-extra-4","prompt":"坐过站或坐错车时，可以向站员说明情况后确认怎么处理。","answer":0,"why":"不要自行猜测能否直接原路返回或免费出站。告诉站员原计划和实际乘车情况。"},{"id":"visitor-rule-extra-5","prompt":"“换乘”就一定要先通过检票口出站。","answer":1,"why":"换乘可能在检票区内，也可能需要出检票口，视线路和车站而定。跟着换乘标识走。"},{"id":"visitor-rule-extra-6","prompt":"同一城市所有线路的末班车都在同一个时间。","answer":1,"why":"末班时间因线路、方向、日期和接续关系不同。查完整回程，不只看第一段车的末班时间。"},{"id":"visitor-rule-extra-7","prompt":"大阪站与新大阪站只是两种叫法，是同一个车站。","answer":1,"why":"大阪与新大阪是不同站，横滨与新横滨等也不能省略着看。核对票上的完整站名。"},{"id":"visitor-rule-extra-8","prompt":"看到“先买食券”的说明时，应先按店内流程买券，再等候或入座。","answer":0,"why":"部分店铺使用食券制，买券后可能还要排队。不要把买到券理解为可以跳过等候队伍。"},{"id":"visitor-rule-extra-9","prompt":"菜单写营业到22点，就保证21点59分还能点任何菜。","answer":1,"why":"最后点单时间可能早于关门，食品和饮品也可能分别截止。进店较晚时先确认。"},{"id":"visitor-rule-extra-10","prompt":"拉面里的替え玉，就是再送一整碗新汤和面。","answer":1,"why":"替え玉通常指追加一份面，不是再来完整一碗。保留汤汁并按店铺方式点单，是否供应看菜单。"},{"id":"visitor-rule-extra-11","prompt":"喝完一杯饮料，只要把杯子递给店员就一定能免费续杯。","answer":1,"why":"是否能续杯及是否收费看套餐和菜单。おかわり表示再来一份或续杯，本身没有免费的意思。"},{"id":"visitor-rule-extra-12","prompt":"买两份便当，只想热其中一份，可以指着它明确说只热这一份。","answer":0,"why":"店员可能逐个确认。指着商品说清数量和范围，避免所有商品一起加热。"},{"id":"visitor-rule-extra-13","prompt":"买了普通咖啡，就可以在机器上按任意饮品和任意杯型。","answer":1,"why":"应按购买的饮品、冷热和尺寸操作。不懂按钮就请店员帮助，按错后也先告知店员。"},{"id":"visitor-rule-extra-14","prompt":"所有便利店现制果茶都能像定制茶饮一样任意调整糖和冰。","answer":1,"why":"固定配方或预装原料的饮品可能无法调整。先问能否去糖浆、调甜度，不要假定每款都能改。"},{"id":"visitor-rule-extra-15","prompt":"店员询问是否愿意相席，是在问能否和其他客人共用一桌。","answer":0,"why":"相席是拼桌，不是让你和陌生人合并账单。不愿意时可以说明并询问其他座位或等候方式。"},{"id":"visitor-rule-extra-16","prompt":"上午到酒店，就一定能免费提前进房。","answer":1,"why":"能否提前入住取决于准备情况和酒店规定，可能需付费。不能入住时可询问能否先寄存行李。"},{"id":"visitor-rule-extra-17","prompt":"只要还没收到电话催促，就可以超过退房时间继续住。","answer":1,"why":"应按约定时间退房。需要延迟时提前询问可否办理、最晚时间和费用。"},{"id":"visitor-rule-extra-18","prompt":"酒店有早餐餐厅，就说明每一间房的房费都包含早餐。","answer":1,"why":"是否包含早餐取决于订单套餐。用餐前核对订单或向前台确认，避免额外费用误会。"},{"id":"visitor-rule-extra-19","prompt":"门外挂着请勿打扰，仍能保证工作人员按原时间进房打扫。","answer":1,"why":"请勿打扰可能影响进房服务。想更换毛巾或补用品，可以联系前台；具体清洁安排由酒店说明。"},{"id":"visitor-rule-extra-20","prompt":"退房后想把行李暂存到下午，应先确认能否寄存及取回时间。","answer":0,"why":"寄存空间、费用和服务时间因酒店而异。保留领取凭证，按约定取回。"},{"id":"visitor-rule-extra-21","prompt":"大浴场暂时没人，就一定可以拿手机拍照。","answer":1,"why":"公共浴场通常重视隐私，也可能禁止携带或使用拍摄设备。不要因暂时没人就推定获准。"},{"id":"visitor-rule-extra-22","prompt":"试衣前确认能否试穿、在哪里试，是合适的做法。","answer":0,"why":"有的店对试穿件数、鞋子或防化妆面罩有要求，跟随店员指引即可。"},{"id":"visitor-rule-extra-23","prompt":"在日本店内买了商品，因不喜欢就一定可以无条件退货。","answer":1,"why":"退换货条件因店铺、商品和购买方式而异。购买前确认期限与条件，并保留小票。"},{"id":"visitor-rule-extra-24","prompt":"标签写20%引き，就是只需付原价的20%。","answer":1,"why":"20%引き是减去原价的20%，通常付原价的80%，也就是八折。留意是否有适用商品限制。"},{"id":"visitor-rule-extra-25","prompt":"想把礼物和自己买的东西分开装，可以结账时提前说明。","answer":0,"why":"分袋、礼品包装和额外袋子可能有不同收费或限制，最好在店员打包前提出。"},{"id":"visitor-rule-extra-26","prompt":"大型行李一定能放进任何一个投币寄存柜。","answer":1,"why":"柜子有不同尺寸，也可能没有空柜。先看能否装下再付款，必要时问有人服务的寄存处。"},{"id":"visitor-rule-extra-27","prompt":"带无障碍标识的厕所一定同时有婴儿护理和所有辅助设备。","answer":1,"why":"设备因设施而异。需要换尿布、护理床或特定无障碍设施时，进一步查看设备图标或询问。"},{"id":"visitor-rule-extra-28","prompt":"东西遗失在车站时，说明时间、地点、物品特征有助于查询。","answer":0,"why":"可向站员或遗失物窗口求助。记不清确切位置也可以如实说明可能在哪里丢失。"},{"id":"visitor-rule-extra-29","prompt":"为了拍照，可以暂时站在车站出口正中或商店门口挡住人流。","answer":1,"why":"拍照也应留出通道。先移到不影响他人的位置，再停下来拍或查看手机。"},{"id":"visitor-rule-extra-30","prompt":"演出只允许某一首歌拍照，就代表之后全场也能录像。","answer":1,"why":"许可可能只限特定曲目和照片，不包含录像、录音或其他时段。按本场明确许可执行。"},{"id":"visitor-rule-extra-31","prompt":"演出票注明另付一杯饮品费，就表示必须喝一杯酒。","answer":1,"why":"饮品费不等于酒钱，可以询问能兑换哪些无酒精饮料。应付费用和兑换范围以活动规则为准。"},{"id":"visitor-rule-extra-32","prompt":"OPEN是开始入场，START才是演出开始，两个时间可能不同。","answer":0,"why":"提前入场通常用于验票、换饮品或找位置。不要把开场时间与演出开始时间混淆。"},{"id":"visitor-rule-extra-33","prompt":"只要手上戴着腕带，所有演出都可以随便出去再回来。","answer":1,"why":"有些演出禁止再入场，即使有腕带也不例外。允许时还可能要求其他凭证，外出前先确认。"},{"id":"visitor-rule-extra-34","prompt":"卡拉OK的フリータイム表示免费使用包间。","answer":1,"why":"它是规定时间范围内的套餐，不是免费。截止时间、饮品要求和繁忙时限制要确认。"},{"id":"visitor-rule-extra-35","prompt":"想继续唱时，先问能否延长以及费用，比直接超时更合适。","answer":0,"why":"后面可能有其他预约，不能保证可以延长。前台确认后再按约定时间使用。"}],"world/regions":{"groups":[{"name":"品川・机场","stations":["haneda","narita","shinagawa","osaki","oimachi","gotanda","tamachi","meguro"]},{"name":"东京站・银座・台场","stations":["shimbashi","yurakucho","tokyo","ginza","nihombashi","tokyoteleport","kokusaitenjijo"],"when":{"dayMin":2},"hint":"第二天起开放"},{"name":"新宿・涩谷","stations":["shinjuku","shibuya","ebisu","harajuku","yoyogi","omotesando","meijijingumae","shinjukusanchome","akasakamitsuke","nakano","takadanobaba"],"when":{"chapterMin":2},"hint":"完成第一章后开放"},{"name":"秋叶原・上野・浅草・池袋","stations":["akihabara","ochanomizu","asakusabashi","ueno","asakusa","nippori","tabata","ikebukuro"],"when":{"chapterMin":3},"hint":"进入第三章后开放"},{"name":"舞浜","stations":["disney"],"when":{"chapterMin":3},"hint":"进入第三章后开放"}]}},"story":{"mainChapters":[{"title":"第一章｜不存在的住客","place":"shinagawa","placeName":"品川 · 你入住的商务酒店","min":2,"scene":"隔壁的207号室明明是「空房」，门把手上却挂了好几天「请勿打扰」。前台、经理、清扫员和保安的说法各不相同——好像有一位住客，从来没有存在过。","steps":[{"ask":"前台说「ご遺族には連絡済みです」。你听懂了吗？","opts":["已经联系过遗属","遗属不需要联络","还没有确认入住"],"a":0,"clue":"老人遗物：五位老友的通讯录。田中正雄（68岁）一栏写着「夜勤、次回に」。"},{"ask":"柜台说「個人情報なので、お答えできかねます」。你该如何理解？","opts":["涉及个人信息，无法答复","可以随意查看所有住客档案","已经确认房间空着"],"a":0,"clue":"酒店没有公开事故详情。寻访遗物应尊重家属意愿，而不是泄露隐私。"},{"ask":"老人故乡寄来的信写着「路線バス廃止のお知らせ」。是什么意思？","opts":["公交线路将被取消","公交已经免费","线路增班通知"],"a":0,"clue":"故乡线索：故乡的最后一条公交线即将停驶；老人原本还想回去看一眼。"}]},{"title":"第二章｜她不想回家","place":"shinjuku","placeName":"新宿 · 歌舞伎町与学校","min":3,"scene":"遭受同伴排斥、家里也没有安全感的16岁美咲出现在歌舞伎町。23岁的莉奈照顾她，却因男公关赊账与控制性关系陷入困境。玩家必须区分善意、依赖和剥削。","steps":[{"ask":"学校方面解释「いじめとは認識していません」。这是说什么？","opts":["学校尚未认定这是霸凌","学校已经报警","学生全部被停课"],"a":0,"clue":"学校记录与美咲的求助信息之间存在明显分歧；沉默不能证明没有霸凌。"},{"ask":"美咲说「家には帰りたくない」。恰当的理解是？","opts":["她不想回家，需要先确认安全风险","她只是想买东西","应当立即不问原因地送她回家"],"a":0,"clue":"美咲不愿回家的原因不能靠一句劝告解决；可靠的未成年人援助渠道成为下一步线索。"},{"ask":"莉奈提到「売掛金が払えない」。指的是？","opts":["无法偿还赊欠的账款","酒店没有空房","学校收取学费"],"a":0,"clue":"莉奈的债务与对方的情感控制相互强化；不能把困境简单归结为虚荣。"}]},{"title":"第三章｜你不是日本人吧","place":"akihabara","placeName":"秋叶原 · 工厂宿舍与租房中介","min":4,"scene":"你认识的外国劳工因工资扣减和恶劣条件试图离职，继而面临收入、住宿与在留手续压力。一段被剪辑的视频引发排外言论，你也开始被房东拒绝。","steps":[{"ask":"租房中介说「外国籍の方はお断りしています」。这是什么意思？","opts":["拒绝外国籍申请者","只接受现金","租金包含水电"],"a":0,"clue":"公寓申请记录：即使有固定收入和合法在留资格，也可能遇到国籍限制。"},{"ask":"同事想确认「未払い賃金」。这是？","opts":["尚未支付的工资","明年的奖金","交通补助"],"a":0,"clue":"外籍劳动者留存了工资单、出勤记录与短信；寻求劳动咨询需要这些资料。"},{"ask":"网络开始扩散「外国人が悪い」。最可靠的下一步是？","opts":["核对原始记录，避免把个案归咎整个群体","直接转发剪辑并加入骂战","公开当事人住址"],"a":0,"clue":"流传视频被截掉前半段。个体争执与针对外国人的排斥不是一回事。"}]},{"title":"第四章｜自己都说是自愿的","place":"shinagawa","placeName":"品川 · 设施管理公司夜班","min":5,"scene":"68岁的田中正雄，就是第一章孤独死老人的旧友。他退休后仍因生活费不足做非正规夜班保安。主管以「本人自愿」为由要求他加班；26岁的同事又被高薪闇バイト招募者套取个人资料。","steps":[{"ask":"主管说「本人が希望してやっていることですから」。其含义是？","opts":["主管声称是员工本人自愿做的","公司已经支付所有加班费","公司宣布强制休假"],"a":0,"clue":"田中担心拒绝顶班就不再续约；口头自愿与实际选择空间并不相同。"},{"ask":"田中短信里写「今日も夜勤になった。また今度な」。正确理解是？","opts":["今天又排夜班了，下次再见吧","我今天已经退休，马上见面","请来机场接我"],"a":0,"clue":"回收第一章伏笔：这正是老人最后没能赴约的那位好友。老人已经没有下一次。"},{"ask":"年轻同事收到「高収入・即日払い／身分証を送って」。你最应警惕什么？","opts":["可能是闇バイト诱骗，保留信息并寻求警方等正规援助","高薪所以先提交所有资料","把招聘转发给未成年朋友"],"a":0,"clue":"年轻同事的身份信息可能已被滥用。保留证据、尽快咨询是安全的脱离方向。"},{"ask":"为了保留可核查的劳动记录，你应选择？","opts":["保存工作指示、考勤及工资资料，咨询劳动窗口","只靠与主管争吵解决问题","删除所有工时记录"],"a":0,"clue":"田中开始收集劳动时间和工资记录；他是否能停止夜班，仍取决于生活保障与后续支持。"}]},{"title":"第五章｜最后一班公交车","place":"ueno","placeName":"上野出发 · 老人的故乡","min":6,"scene":"你沿第一章笔记本中的故乡地址离开东京。这里正是那位上京老人出生和生活多年的小镇：学校停办，医院迁走，连接车站和村落的最后一条公交也将停运。田中寄来一封迟到的回信。","steps":[{"ask":"乡公所告示「路線バスは来月末をもって廃止します」。代表？","opts":["公交线路在下月底终止运营","下个月开始免费坐车","将增加夜间巴士"],"a":0,"clue":"老人故乡的公交废止日期，恰好写在他东京笔记本的最后一页。"},{"ask":"一位居民说「免許を返納したら病院に通えない」。问题是？","opts":["交回驾照后将难以前往医院","驾照会自动续期","医院有免费接送所有人"],"a":0,"clue":"人口减少、老龄驾驶风险与医疗交通的矛盾，不是简单要求老人搬家就能解决。"},{"ask":"田中在回信中写「会えるうちに会えばよかった」。他想表达？","opts":["真希望能趁还能见面时见一面","下次一定去参加考试","他已经搬进老人故乡"],"a":0,"clue":"三章闭环：老人为了见好友来到东京，田中因工作错过相见，故乡的公交则带走了他回家的最后一条日常路线。"},{"ask":"最后一班车前，村民正在讨论替代交通。你会先采取哪种态度？","opts":["记录居民实际需求，了解预约交通、社区接送等可行方案","宣布所有老人必须立即搬走","认为公交关停与任何居民无关"],"a":0,"clue":"故乡档案封存：无论是否能保留原有公交，真正需要被听见的是留下的人。"}]},{"title":"终章｜东京不曾记住你","place":"tokyo","placeName":"东京站 · 深海之眼","min":7,"scene":"五份调查档案里，被忘记的人名开始从纸上淡去。第31站不是一处车站，而是东京从未为他们留下的位置。深海之眼并不制造贫困或歧视；它只是吞噬那些已经被遗忘的名字。","steps":[{"ask":"列车广播「最終電車がまいります」。是什么意思？","opts":["末班电车即将进站","首班车取消","所有线路停驶一周"],"a":0,"clue":"终章：你可以离开东京，或者留下守住被抹去的名字。"}]}],"firstDay":{"haneda":[{"scene":"羽田空港・到着ロビー","title":"任务 1：寻找前往酒店的铁路","text":"你的酒店位于品川站附近。羽田机场应该寻找哪条线路？","options":["京急線（京急空港線）","京成スカイライナー","つくばエクスプレス"],"correct":0,"success":"你找到了京急的指示牌。","jp":"京急線はどこですか。"},{"scene":"羽田空港・券売機","title":"任务 2：购买车票","text":"售票机显示「品川まで」；这是什么意思？","options":["到品川站","从品川站出发","品川站不停靠"],"correct":0,"success":"你取得了前往品川的乘车凭证。","jp":"品川までの切符をください。"},{"scene":"京急線・ホーム","title":"任务 3：搭乘正确的列车","text":"怎样向站务员确认这趟电车是否去品川？","options":["この電車は品川に行きますか。","この電車を品川にしてください。","品川は何を食べますか。"],"correct":0,"success":"站务员点了点头。你成功乘车并抵达品川。","jp":"この電車は品川に行きますか。"},{"scene":"品川・ホテルフロント","title":"任务 4：办理入住","text":"在酒店前台，最自然的入住表达是？","options":["チェックインをお願いします。","チェックアウトをお願いします。","予約を食べました。"],"correct":0,"success":"酒店前台找到了你的预订。房门终于打开了。","jp":"チェックインをお願いします。"}],"narita":[{"scene":"成田空港・到着ロビー","title":"任务 1：寻找进城路线","text":"酒店在品川站附近，以下哪种列车可由成田机场直达品川（请确认实际班次）？","options":["JR 成田エクスプレス（N’EX）","京急空港線","多摩モノレール"],"correct":0,"success":"你找到成田特快 N’EX 的乘车指示。","jp":"成田エクスプレスの乗り場はどこですか。"},{"scene":"成田空港・きっぷ売り場","title":"任务 2：准备乘车","text":"成田特快的「指定席」是什么意思？","options":["指定座位","自由站立区","仅供工作人员乘坐"],"correct":0,"success":"你确认了车次与座席，拿好了车票。","jp":"指定席は何号車ですか。"},{"scene":"成田エクスプレス・ホーム","title":"任务 3：确认目的地","text":"你需要确认列车是否停靠品川，应该怎么问？","options":["この電車は品川に止まりますか。","この電車は品川を食べますか。","品川を買ってください。"],"correct":0,"success":"你顺利搭乘了停靠品川的班次。","jp":"この電車は品川に止まりますか。"},{"scene":"品川・ホテルフロント","title":"任务 4：办理入住","text":"到达酒店后，前台说「ご予約のお名前をお願いします」。对方要什么？","options":["预订时使用的姓名","行李的重量","你的出发机场"],"correct":0,"success":"前台查到了预订，你终于领到房卡。","jp":"予約した名前は〇〇です。"}]},"taunts":{"taunts":[{"id":"t01","type":"路过的上班族","scenes":["station","street","shop","restaurant"],"jp":"日本語も分からないの？","zh":"连日语都听不懂？","malice":1,"tone":"hostile"},{"id":"t02","type":"排队的大叔","scenes":["station","restaurant","shop","street"],"jp":"だから外国人は……","zh":"所以说外国人就是……","malice":1,"tone":"hostile"},{"id":"t03","type":"皱眉的老人","scenes":["station","street","restaurant","hotel"],"jp":"ここ、日本なんだけど。","zh":"这里可是日本啊。","malice":1,"tone":"hostile"},{"id":"t04","type":"通勤族","scenes":["station","airport"],"jp":"日本語、勉強してから来たら？","zh":"学好了日语再来吧？","malice":1,"tone":"hostile"},{"id":"t05","type":"皱眉的老人","scenes":["station","street","shop"],"jp":"日本のルールくらい覚えろよ。","zh":"好歹记住日本的规矩啊。","malice":1,"tone":"hostile"},{"id":"t06","type":"放学的高中生","scenes":["station","shop","street","restaurant"],"jp":"そんなことも知らないの？","zh":"连这种事都不知道？","malice":1,"tone":"hostile"},{"id":"t07","type":"店里的客人","scenes":["shop","restaurant","hotel"],"jp":"外国人には難しいか。","zh":"对外国人来说太难了吧。","malice":2,"tone":"hostile"},{"id":"t08","type":"隔壁的客人","scenes":["restaurant","izakaya","hotel","shop"],"jp":"日本語、大丈夫ですか？","zh":"你的日语真的没问题吗？","malice":2,"tone":"hostile"},{"id":"t09","type":"附近的主妇","scenes":["shop","street","station"],"jp":"日本に住むなら、それくらい知っておかないと。","zh":"住日本连这都不知道可不行。","malice":2,"tone":"hostile"},{"id":"t10","type":"不耐烦的上班族","scenes":["station","restaurant","izakaya"," :{"chapter":{"id":"chapter1","title":"不存在的住客","subtitle":"品川 · 夜之酒店","introNode":"intro","footnote":"本章为虚构故事，人物与酒店均为虚构；涉及孤独死的内容不做画面描写。日语理解错误只扣 HP；只有违反超自然规则才扣 SAN。","decideMinClues":3,"decideText":"你手里有 {clueCount} 件证据、{testimonyCount} 条证词。\n天亮以后，207号室就会重新开放。你要怎样对待这位「不存在的住客」？","dawnText":{"ready":"夜班结束了。森经理说，207号室今天上午就要重新开放。你可以现在做出决定，也可以先结束这一夜。","notReady":"夜班结束，员工们开始交接。今晚只能调查到这里。（进度已保存，之后的夜晚还可以回来继续。）","last":"天亮了。这是最后一夜。\n森经理说，207号室今天上午就要重新开放。你手里有 {clueCount} 件证据——如果现在不做决定，就再也没有机会了。"},"objectives":[{"text":"期限：207 将在第 {reopenDay} 天上午重新开放（第 {nightNo}/{nightsTotal} 夜）","done":{"flag":"truth"}},{"text":"看懂大厅告示板上手写的规则","done":{"flag":"readRules"}},{"text":"和前台的佐藤说说话","done":{"any":[{"mem":{"sato":"greet"}},{"testimony":"t_sato"}]}},{"text":"弄清楚：207号室真的是空房吗？","done":{"anyClue":["dnd","register"]}},{"text":"听听员工们的说法（{testimonyCount}/5）","done":{"testimonyCount":3}},{"text":"想办法进入207号室调查","when":{"anyClue":["dnd","register"]},"done":{"visited":"room207"}},{"text":"找到那位住客留下的东西","when":{"any":[{"flag":"heardSuitcase"},{"testimony":"t_mori"}]},"done":{"clue":"notebook"}},{"text":"用证据让森经理说出真相（或者自己推理出来）","when":{"clueCount":3},"done":{"flag":"truth"}},{"text":"天亮前做出你的决定（调查手帐 → 做出最终决定）","when":{"any":[{"flag":"truth"},{"clueCount":5}]}}],"rules":[{"id":"knock","trigger":"enter:corridor","when":{"phase":"late","clockMax":540},"delay":1400,"node":"rule-knock"},{"id":"phone","trigger":"scene:room207","when":{"phase":"late","clockMin":480,"clockMax":600},"delay":1600,"glitch":"clock","node":"rule-phone"}],"deduce":{"when":{"all":[{"clue":"ambulance"},{"anyClue":["notebook","report","register"]},{"clueCount":4}]},"node":"deduce"},"decisions":[{"ending":"protect","text":"把真相交给森经理和家属：让「片山茂」回到住客名单上","need":{"flag":"truth"},"needText":"需要先弄清楚真相","when":{"notFlag":"offerTaken"}},{"ending":"publish","text":"把照片、证词和登记簿发到网上"},{"ending":"silence","text":"收下的信封就当作「住宿费退款」，什么也不说","when":{"flag":"offerTaken"}},{"ending":"leave","text":"把抄下的记录封进信封，不再介入","when":{"notFlag":"offerTaken"}}],"endings":{"protect":{"hotelEnding":"protect","tanakaTrust":3,"title":"谨慎的记录者","text":"你和森经理一起，把五位老友的名字、未寄出的明信片和登记簿上被涂掉的那一行，交给了通过正式渠道联系上的侄女。「已退房」被改回了「片山茂，于本酒店去世」。没有新闻，也没有热搜——只有几封被重新寄出的信。","effects":{"trust":{"mori":2,"sato":1,"inoue":1},"npcStress":{"sato":-2,"inoue":-2},"item":{"notebookOriginal":-1}},"upgrade":{"when":{"all":[{"clue":["notebook","tanaka","hometown","lastdays","versions"]},{"trust":{"mori":2}}]},"to":"protect_full"}},"protect_full":{"hotelEnding":"protect","tanakaTrust":4,"title":"五封信寄出了","text":"侄女读完笔记本，请你转达一件事：五个名字里，还活着、还能被找到的，是田中正雄——他就在品川做夜班保安。片山茂没能赴的约，也许还有人可以替他说一句「お疲れさま」。","effects":{"trust":{"mori":2,"sato":1,"inoue":1},"npcStress":{"sato":-2,"inoue":-2},"item":{"notebookOriginal":-1}}},"publish":{"hotelEnding":"publish","tanakaTrust":0,"title":"被传播的名字","text":"你把照片和证词发到网上：「品川某酒店隐瞒住客死亡」。讨论确实发生了：孤独死、酒店的规定、老龄化……但评论区也挖出了佐藤的社交账号和井上的排班表。三天后，田中正雄是在手机推送里才得知老友的死讯。","effects":{"npcStress":{"sato":5,"inoue":4,"mori":3},"trust":{"mori":-5,"inoue":-5},"stress":8}},"silence":{"hotelEnding":"leave","tanakaTrust":1,"title":"不存在的住客","text":"你把信封放进了行李箱。207号室当天上午重新开放，登记簿上那一行仍然印着「空室」。没有人问起片山茂——他在这家酒店里，从来没有住过。只是此后每个深夜，你都会听见二楼走廊里，有人在很轻地敲门。","effects":{"stress":4}},"leave":{"hotelEnding":"leave","tanakaTrust":1,"title":"无人回应的信封","text":"你把抄录的名字放进信封，压在行李箱最底层。207号室当天就重新开放了。没人追问，你也没有——只是每次路过二楼，都会想起那块「起こさないでください」。","effects":{"stress":2}},"late":{"hotelEnding":"leave","tanakaTrust":1,"title":"重新开放的207","text":"207号室重新开放了。床单、门锁、浴室都换了新的，你知道的那些事没有来得及告诉任何人。几天后你在车站看到一则很小的消息：品川某酒店「住客急病，已妥善处理」。没有名字。","effects":{"stress":3}}},"epilogue":[{"name":"佐藤","cases":[{"when":{"ending":"publish"},"text":"她请了长假。社交账号已注销。"},{"when":{"ending":"late"},"text":"新客人入住207时，她的手停在键盘上，过了很久才按下确认。"},{"when":{"ending":"silence"},"text":"她仍然在前台，每次有人问起207，都回答「空室です」。"},{"when":{"trust":{"sato":2}},"text":"她向总部提交了一份关于「请勿打扰」规定的改善建议：挂牌超过 24 小时，必须敲门确认。"},{"text":"她仍在前台，接每一通电话时都会停顿一秒。"}]},{"name":"森经理","cases":[{"when":{"ending":"publish"},"text":"他被总部叫去说明情况，再也没有和你说过话。"},{"when":{"ending":"late"},"text":"207号室按时重新开放。他在报告书的「处理经过」一栏写了「无特别事项」。"},{"when":{"ending":"silence"},"text":"报告书按时提交了。里面没有207号室。"},{"when":{"trust":{"mori":3}},"text":"他给每位员工写了一张感谢卡，也给侄女写了一封很长的道歉信。"},{"text":"他按时提交了更正后的报告书。"}]},{"name":"井上","cases":[{"when":{"ending":"publish"},"text":"她被要求「暂时不用来上班」。"},{"when":{"flag":"phoneHanded"},"text":"交出那部手机之后，她终于睡了一个好觉。"},{"text":"她依旧在走廊里一间间检查门牌，在207门口会多站一会儿。"}]},{"name":"小林","cases":[{"when":{"tanaka":true},"text":"他说会把你的话带给田中——「至少别再说下次了」。"},{"text":"他还是站在正门旁，看着空荡荡的街道。"}]}],"lateText":"你回到酒店的时候，207号室已经重新开放了。\n门把手上的「请勿打扰」被摘掉，新的客人拖着行李箱走了进去。登记簿上那一行仍然印着「空室」。","lateEnding":"late","hints":[{"when":{"notFlag":"readRules"},"text":"大厅的告示板上有两行手写的日语规则。面向告示板按 A 调查——看懂它们，夜里能救你一命。"},{"when":{"notTestimony":"t_sato"},"text":"前台的佐藤也许知道隔壁的事。走到柜台正前方，面向柜台调查。"},{"when":{"notClue":["dnd","register"]},"text":"上二楼看看隔壁的207号室——门口好像挂着什么。"},{"when":{"notItem":"key207","notVisited":"room207","trustMax":{"sato":1}},"text":"佐藤对你还很戒备。先打个招呼、体谅一下她的辛苦，她也许会愿意帮忙。"},{"when":{"item":{"key207":1},"notVisited":"room207"},"text":"你手里有207的钥匙卡。去二楼走进207号室调查吧。"},{"when":{"notTestimony":"t_kobayashi"},"text":"夜班保安小林傍晚在后巷、深夜在大厅巡逻。值夜班的人看到的最多——大厅的自动售货机里有热咖啡。"},{"when":{"notTestimony":"t_inoue"},"text":"清扫员井上傍晚在二楼走廊，深夜会在207里铺床。她是最先察觉不对的人。"},{"when":{"notTestimony":"t_mori"},"text":"森经理傍晚在保管室，深夜在大厅。问问他207之前住的是谁。"},{"when":{"notFlag":"heardSuitcase"},"text":"一个人「退房」时，会把行李带走吗？问问井上，或者看看207的行李架。"},{"when":{"notClue":"notebook","notFlag":"storageOpen","notItem":"storageKey"},"text":"保管室锁着。森经理信任你（♥♥）就会开门；凌晨时，小林手上也有备用钥匙。"},{"when":{"notClue":"notebook"},"text":"保管室里有一只没人认领的旧旅行箱。"},{"when":{"testimony":"t_mori","notFlag":["moriCracked","truth"]},"text":"森经理说片山先生「自己退了房」。可是有人深夜看到了救护车、207凌晨打过电话……用证据反驳他。"},{"when":{"flag":"moriCracked","notFlag":"truth"},"text":"森经理还在等你拿出更多证据：证明片山先生根本没有离开过酒店——行李、被涂改的登记、凌晨两点四十分的「退房」。"},{"when":{"flag":"truth","notFlag":["offer","selfDeduced"]},"text":"真相已经清楚了。和森经理谈谈接下来怎么办，或者在调查手帐里做出最终决定。"},{"when":{"clueCount":3},"text":"你已经有足够的证据了。可以在调查手帐里做出最终决定——也可以继续调查，争取更好的结局。"},{"text":"多和人聊聊，注意大家的说法哪里对不上。不同时间去 ,"who":"浴室","text":{"default":"浴室被彻底清扫过，瓷砖白得刺眼。\n浴室门上的锁是新的——螺丝还闪着光，门框周围的木头有被撬过的痕迹。\n扶手旁有一个小小的凹痕，像是有人曾经用尽力气握住它。","truth":"你站在浴室门口。新锁、撬痕、扶手旁的凹痕。\n你没有再往里走。"},"effects":{"flag":"sawNewLock"}},{"id":"r207-bath-late","who":"浴室","text":"镜子上蒙着一层雾气。浴室里没有热水，雾气却越来越浓。\n有人用手指在雾上写了几个字：「また今度」。\n你身后没有人。","effects":{"flag":["mirror","sawNewLock"],"stress":2,"glitch":"static","log":"207浴室的镜子上出现了「また今度」"},"sfx":"glitch"},{"id":"r207-bed","who":"床铺","text":"床单换成了新的，枕头被拍得很平整。\n你弯腰看了看床底——滚出来一粒白色的小药片。降压药。","effects":{"flag":"pill"}},{"id":"r207-phone","type":"listen","who":"床头电话","gate":{"when":{"clue":"phonelog"},"node":"r207-phone-done"},"lines":[{"who":"床头电话","text":"床头的客房电话。你按下「再拨」键（显示这台电话最后打出去的号码），小屏幕亮了起来："}],"jp":"フロント　3日目 02:13","question":"屏幕上显示的是？","options":["第三天凌晨 2:13，从这里打给了前台","前台第三天 2:13 打来过电话","第三天下午 2:13 设的闹钟"],"answer":0,"zh":"第三天凌晨两点十三分，有人从207打给了前台。","explain":"「フロント」= 前台；「3日目」= 第三天。「再拨」显示的是打出去的记录。","hint":"「フロント」是哪里？「再拨」显示的是打出去还是打进来？","effects":{"clue":"phonelog"}},{"id":"r207-phone-done","who":"床头电话","text":"屏幕上仍然是那一行：「フロント　3日目 02:13」。"},{"id":"r207-desk","gate":{"when":{"clue":"lastdays"},"node":"r207-desk-done"},"lines":[{"who":"书桌","text":"抽屉是空的。你把它整个拉出来——背面用胶带贴着几样东西。"},{"who":"抽屉背面","text":"五张便条，每张写着一个名字和日期，其中四张被划掉：\n「小川 ✕」「佐藤 ✕」「渡辺 ✕（施設）」「木村 ✕（息子が…）」「田中 ……また今度」\n还有一张没贴邮票的明信片，和一张品川站的入场券。"}],"effects":{"clue":"lastdays"}},{"id":"r207-desk-done","who":"书桌","text":"抽屉背面还留着胶带的痕迹。"},{"id":"r207-luggage","who":"行李架","text":"行李架是空的，但布面上压着一只箱子的形状，压了好几天。\n架子背后夹着一张撕下来的行李牌：「カタヤマ」。\n——行李去了哪里？","effects":{"flag":["luggageTag","heardSuitcase"]}},{"id":"r207-trash","who":"垃圾桶","text":"垃圾桶已经清空了，只有桶底粘着一张被揉皱的公交时刻表。\n最后一行被红笔圈了起来：「最終　6:10」。","effects":{"flag":"timetable"}},{"id":"r207-wardrobe","who":"衣柜","text":"衣柜是空的，只剩一个衣架在轻轻摇晃——明明没有风。"},{"id":"r207-window","who":"窗户","text":{"default":"窗外是品川站的灯光。从这里，可以看见去上野方向的列车。","late":"窗玻璃上，映出一个坐在床边的人影。你回头——床上只有新床单。"}},{"id":"rule-phone","lines":[{"who":"207号室 · 02:13","text":"床头的电话突然响了。\n铃声在空房间里格外刺耳。"}],"next":"rule-phone-2","sfx":"phone"},{"id 指车厢里「通話はご遠慮ください」的贴纸。周围有人轻轻点头。他涨红了脸，挂掉了电话。","effects":{"stress":-3,"time":1}}},{"id":"e-zairyu","kind":"prejudice","scenes":["street"],"who":"巡逻的警察","jp":"すみません、ちょっといいですか。パスポート、見せてもらえますか。","zh":"「打扰一下。能看看你的护照吗？」","text":"雨里，一位警察拦住了你。他刚刚没有拦任何一个日本人。","fight":[{"kind":"good","jp":"はい、どうぞ。何か問題がありますか。","zh":"好的，给您。有什么问题吗？"},{"kind":"rude","jp":"どうして私だけですか。差別です。","zh":"为什么只查我？这是歧视。"},{"kind":"wrong","jp":"パスポートは食べました。","zh":"（离谱的错误）护照我吃掉了。"}],"good":{"text":"他翻看了很久，又还给你：「ご協力ありがとうございました」（谢谢配合）。你在雨里多站了十分钟。","effects":{"time":10,"stress":2}},"rude":{"text":"他的表情变了。你被带到屋檐下，被问了二十分钟：住哪里、来做什么、带了多少现金。","effects":{"time":20,"stress":6}},"ignore":{"text":"你想直接走开——他挡在你面前，重复了一遍。你只好交出护照，还被多问了几句。","effects":{"time":15,"stress":5}},"help":{"text":"你环顾四周，没有人停下来。最后你还是交出了护照。","effects":{"time":12,"stress":3}}},{"id":"e-kuruna","kind":"prejudice","scenes":["street","station"],"who":"骑自行车的老人","jp":"邪魔だ！外人は道の真ん中を歩くな！","zh":"「碍事！外国佬别走在路中间！」","text":"一辆自行车擦着你的行李箱冲过去。","fight":[{"kind":"good","jp":"危ないですよ！気をつけてください。","zh":"很危险！请小心。"},{"kind":"rude","jp":"このじじい！","zh":"这个老头子！"},{"kind":"wrong","jp":"ありがとうございます！","zh":"（不对）谢谢您！"}]},{"id":"e-hotel","kind":"prejudice","scenes":["hotel"],"who":"大厅里的住客","jp":"最近はどこのホテルも外国人ばっかりね。","zh":"「最近哪家酒店都是外国人。」","text":"沙发上的女人对同伴说，声音刚好让你听见。","fight":[{"kind":"good","jp":"こんばんは。いいホテルですね。","zh":"晚上好。这家酒店不错呢。"},{"kind":"rude","jp":"あなたは日本人ばっかりですね。","zh":"（不通顺的讽刺）你才全是日本人。"},{"kind":"wrong","jp":"ホテルをください。","zh":"（不对）请给我酒店。"}],"good":{"text":"她没想到你会打招呼，尴尬地点了点头：「え、ええ……」","effects":{"stress":-2}}},{"id":"e-tsk","kind":"cold","scenes":["airport","station","street"],"who":"拖着行李箱的上班族","jp":"チッ……。","zh":"「啧……」","text":"他撞到了你的行李箱，没有道歉，只是咂了一下嘴。","fight":[{"kind":"good","jp":"すみません、ぶつかりましたよ。","zh":"不好意思，您撞到我了。"},{"kind":"rude","jp":"おい、謝れ！","zh":"喂，道歉！"},{"kind":"wrong","jp":"すみません、私が悪いです。ごめんなさい。","zh":"（意思反了）对不起，是我的错。"}],"good":{"text":"他停下脚步，小声说了句「あ、すみません」，又匆匆走了。在东京，这已经算是道歉了。","effects":{"stress":-1}},"wrong":{"text":"你下意识地道了歉。他点点头，好像本来就该如此。","effects":{"stress":3}}},{"id":"e-eigo","kind":"cold","scenes":["station","airport"],"who":"忙碌的站务员","jp":"英語はちょっと……。あちらで聞いてください。","zh":"「英语的话有点……请去那边问。」","text":"你还什么都没说，他就指了指远处的窗口，转身走了。","fight":[{"kind":"good","jp":"日本語で大丈夫です。京急線はどのホームですか。","zh":"用日语就可以。京急线在哪个站台？"},{"kind":"rude","jp":"仕事してください。","zh":"请好好工作。"},{"kind":"wrong","jp":"英語をください。","zh":"（不对）请给我英语。"}],"good":{"text":"他回过头，有点意外：「あ、京急線なら地下です。一番線ですよ」（京急线在地下，一号站台）。","effects":{"stress":-2,"time":1}}},{"id":"e-isogi","kind":"cold","scenes":["street","train"],"who":"撑伞的路人","jp":"……（無言）","zh":"（沉默）","text":"你想问路，对方的目光从你脸上滑过去，像是看见了一块广告牌。伞沿的水滴到你肩膀上。","fight":[{"kind":"good","jp":"すみません、ちょっと道を聞いてもいいですか。","zh":"不好意思，可以问一下路吗？"},{"kind":"rude","jp":"無視しないで！","zh":"别无视我！"},{"kind":"wrong","jp":"道をください。","zh":"（不对）请给我路。"}],"good":{"text":"对方停了半秒，指了指北边：「北品川なら、あっちです」（北品川的话，在那边）。","effects":{"time":2,"flag":"streetTip"}}}],"fatal":{"kaerazu":{"title":"未抵达的乘客","text":"你走下了电车。站台上没有站名，只有一盏一直在闪的灯。\n身后的车门关上了。电车开走以后，你才发现铁轨的另一头也没有尽头。\n\n第二天，品川的那家酒店把你的预订标记成了「No Show」（未入住）。"},"alley":{"title":"迷路的人","text":"歌声一直在前面。你转过一个弯，又一个弯。\n雨停了。巷子的尽头是一扇老旧的木门，门牌上写着你的名字。\n\n你没有再出来。"}},"finale":{"black":["まだ、チェックアウトしていません。","我还没有退房。"],"title":"第一章　不存在的住客","sub":"── 第一夜　終 ──","text":"你还要在这家酒店住几天。\n而207号室，就在你的隔壁。","next":"","morningNode":"mo-enter"},"nodes":[{"id":"imm-enter","lines":[{"who":"DAY 01 · {time} · 羽田空港","text":"航班晚点了将近两个小时。\n你订的是一家叫「ミナトヤホテル」的老旧商务酒店。手机里的预订邮件上，地址只有一行假名："},{"who":"预订邮件 · 酒店地址","jp":"しながわ　ミナトヤホテル","text":"「しながわ」是车站的名字。可它写成汉字是哪一站？到车站买票的时候，你得自己判断。"},{"who":"预订邮件","jp":"チェックインは24時までにお願いいたします。","text":"「请在24点之前办理入住。」"},{"who":"操作说明","text":"点画面上的人和物品可以调查、交谈；画面下方也有同样的按钮。\n每次行动都会花时间，左上角的时钟一直在走。\n📓 手帐：查看目标、提示、找到的线索。\n\n⚠ 日语答错只扣 HP。只有违反超自然规则、接触异常、或者主动去危险的地方，才会扣 SAN。\n📝 今天有 {mustTotal} 道「必答题」，答对才能继续往前走。"},{"who":"目标","text":"通过入境审查。"}],"effects":{"item":{"hotelAddress":1}}},{"id":"imm-sign","lines":["天花板上挂着两块牌子：「日本人 JAPANESE」「外国人 FOREIGN PASSPORTS」。\n日本人那一列只剩三个人。外国人这一列排到了柱子后面。","一位工作人员拿着扩音器，用英语反复喊：「Please wait behind the line.」（请在线后等候）。\n她转向日本人那一列时，换成了日语，声音也柔和了：「お待たせいたしました」（让您久等了）。"]},{"id":"imm-queue","lines":["日本人的通道已经空了。工作人员把隔离带拉过来，挡在你面前——好像你会偷偷溜过去。","你前面的人小声抱怨：「已经排了四十分钟了。」"]},{"id":"imm-phone","lines":[{"who":"手机 · 酒店预订邮件","jp":"チェックイン：15:00〜24:00　※24時以降のご到着は、事前にご連絡ください。","text":"「入住时间：15:00〜24:00　※24点以后到达，请事先联系。」"},"除了这封邮件，手机里没有别的新消息。漫游信号只有一格。"]},{"id":"imm-officer","gate":{"when":{"flag":"passedImm"},"node":"imm-officer-done"},"who":"入国審査官","text":"终于轮到你。审查官接过护照，看了一眼照片，又抬头看了看你的脸。\n他开口了——没有说「你好」。","next":"imm-q1"},{"id":"imm-q1","type":"listen","must":"imm","who":"入国審査官","jp":"入国の目的は何ですか。","question":"审查官在问什么？","options":["入境的目的是什么","你从哪个国家来","你带了多少现金","你打算在日本住几天"],"answer":0,"zh":"「入境的目的是什么？」\n你回答：「観光です」（观光）。","explain":"「入国」= 入境；「目的」= 目的；「何ですか」= 是什么？","hint":"「目的」「何ですか」","failText":"审查官面无表情地又说了一遍，语速一点也没有放慢。","failNext":"imm-q1","next":"imm-q2"},{"id":"imm-q2","type":"jp","who":"入国審査官","jp":"どちらにお泊まりですか。","text":"「您住在哪里？」——你应该怎么回答？","options":["ミナトヤホテルです。","ホテルを食べます。","三日間です。"],"answer":0,"explain":"「〜に泊まる」= 住在～。回答住处：「ミナトヤホテルです」（港屋酒店）。\n「三日間です」回答的是停留几天。","next":"imm-q3"},{"id":"imm-q3","who":"入国審査官","jp":"{originJp}の方ですね。……帰りの航空券はお持ちですか。","text":"（他的手指在国籍那一栏停了很久。）\n「是{origin}来的啊……有回程机票吗？」\n\n排在你前面的那个人，什么都没被问。","choices":[{"text":"拿出手机，给他看回程机票","effects":{"time":3},"next":"imm-q4"},{"text":"「どうして私だけですか」（为什么只问我？）","effects":{"time":12,"stress":4},"next":"imm-q3b"}]},{"id":"imm-q3b","who":"入国審査官","jp":"規則ですので。","text":"「这是规定。」\n他把护照一页一页地翻了一遍，又在电脑上敲了很久。你身后的队伍开始骚动。","next":"imm-q4"},{"id":"imm-q4","lines":[{"who":"入国審査官","jp":"両手の人差し指を、ここに置いてください。","text":"「请把两只手的食指放在这里。」\n指纹机亮起绿灯。相机对着你闪了一下。"},{"who":"入国審査官","jp":"ようこそ日本へ。","text":"「欢迎来到日本。」\n他盖了章，把护照推回来。说这句话的语气，像是在念一张注意事项。"}],"effects":{"flag":"passedImm","time":5},"sfx":"ok"},{"id":"imm-officer-done","who":"入国審査官","text":"审查官已经在叫下一个人了。你该去到达大厅了。"},{"id":"arr-enter","lines":[{"who":"{time} · 到达大厅","text":"行李转盘早就停了。玻璃门外，雨下起来了。\n要去市区，得先找到京急线的车站。"},{"who":"目标","text":"找到京急线的车站。可以先在大厅里看看，但别忘了时间——酒店前台 24 点关门。"}]},{"id":"arr-signs","lines":["天花板上的案内板：「東京モノレール →」「バス →」「タクシー →」。 ticket"},"node":"st-machine-done"},"who":"券売機","text":"售票机的屏幕亮着。英文界面的按钮上贴着一张纸：「調整中」（调整中）。\n你只好选了日文。机器用温柔的女声说：","next":"st-machine-ok"},{"id":"st-machine-ok","gate":{"when":{"flag":"machineOk"},"node":"st-dest"},"goto":"st-machine-q"},{"id":"st-machine-q","type":"listen","must":"ticket","who":"券売機の音声","jp":"ご希望の人数ボタンを押してください。　おとな　・　こども","question":"你要买一张成人票，应该按哪个？","options":["おとな","こども","とりけし","チャージ"],"answer":0,"zh":"「请按您需要的人数按钮。　成人 · 儿童」\n你按下「おとな」。屏幕跳到了下一页：「行き先を選んでください」（请选择目的地）。","explain":"「おとな」= 大人（成人）；「こども」= 小孩；「とりけし」= 取消；「チャージ」= 给交通卡充值。「押してください」= 请按。","hint":"「おとな」「こども」","effects":{"flag":"machineOk","time":3},"failNext":"st-machine-again","next":"st-dest"},{"id":"st-dest","text":"售票机上排着一列站名，全是汉字。\n邮件上的地址是：「しながわ　ミナトヤホテル」。","call":"guess","callText":"选择目的地"},{"id":"st-machine-again","text":"（你按错了。售票机「ピンポーン」地响了一声，屏幕回到了第一页。\n后面排队的人叹了一口气。）","effects":{"time":2,"stress":1},"next":"st-machine-q"},{"id":"st-machine-done","who":"券売機","text":"车票已经买好了：「{dest}」。"},{"id":"st-board","who":"発車標","lines":[{"who":"発車標","jp":"快特　品川行　まもなく到着","text":"「快特　开往品川　即将进站」"},{"who":"発車標","jp":"エアポート急行　品川方面　次発","text":"「机场急行　开往品川方向　下一班」\n\n快特人多，只能站着，但最快。急行要多停几站，晚十来分钟，但能坐下。"}],"choices":[{"text":"坐快特（快，但很挤）","effects":{"flag":"routeFast","clearFlag":"routeLocal"}},{"text":"坐机场急行（慢一些，有座位，压力 -3）","effects":{"flag":"routeLocal","clearFlag":"routeFast","stress":-3}}]},{"id":"st-staff","who":"駅員","text":"闸机旁，站务员正在往告示板上贴一张新的通知。","choices":[{"text":"看他贴的通知","next":"st-staff-notice"},{"text":"「すみません……」（叫住他）","when":{"notFlag":"calledStaff"},"effects":{"flag":"calledStaff","encounter":"#e-eigo"}},{"text":"离开"}]},{"id":"st-staff-notice","gate":{"when":{"flag":"knowsLastTrain"},"node":"st-staff-notice-done"},"type":"listen","who":"駅のお知らせ","jp":"本日、品川方面の最終電車は{lastTrain}発です。お乗り遅れのないよう、ご注意ください。","question":"通知上说什么？","options":["今天开往品川的末班车 {lastTrain} 发车，请注意不要错过","今天开往品川的电车 {lastTrain} 以后免费","今天品川方向的电车 {lastTrain} 开始运行"],"answer":0,"zh":"「今天开往品川方向的末班车于 {lastTrain} 发车。请注意不要误车。」","explain":"「最終電車」= 末班车；「〜
